const SLIDES = [

// 1. TITLE
{cls:'slide-title',html:`
<div class="slide-label">Topic 42 &middot; Infectious Disease / Hospital Medicine / Stewardship</div>
<h1>Urinary Tract<br>Infections</h1>
<p class="tagline">Treat the patient, not the urine. Asymptomatic bacteriuria is not a UTI. Nitrofurantoin does not reach the kidney. The most common antibiotic error in internal medicine starts with reflexively ordering a UA on every elderly patient who seems "off."</p>
<div class="badge-row">
  <span class="badge badge-red">Stewardship</span>
  <span class="badge badge-blue">Pyelonephritis</span>
  <span class="badge badge-yellow">CAUTI</span>
  <span class="badge badge-green">Recurrent UTI</span>
  <span class="badge badge-orange">IDSA 2025</span>
</div>
<div style="margin-top:26px;font-size:14px;color:var(--muted);">Morning Report &middot; Internal Medicine &middot; David Comstock, MD</div>
`},

// 2. CASE
{cls:'slide-content',html:`
<h2>Case Presentation</h2>
<div class="slide-body">
<ul class="tl">
  <li><div class="tl-label">Consult request</div>77F with dementia, chronic Foley catheter, admitted for fall. Nursing calls: "UA is positive &mdash; can we start antibiotics?" Urine appears cloudy. Vital signs: T 37.1&deg;C, HR 84, BP 128/76.</li>
  <li><div class="tl-label">Urinalysis</div>Leukocyte esterase 3+, nitrites positive, WBC 40&ndash;50/hpf, bacteria many. Odor noted in nursing documentation.</div></li>
  <li><div class="tl-label">Review of systems</div>Patient cannot reliably report urinary symptoms due to dementia. No fever, no rigors, no tachycardia, no flank tenderness, no suprapubic pain. Baseline mental status per family. Fall is explained by new hypnotic medication started 3 days ago.</li>
  <li><div class="tl-label">Urine culture (sent simultaneously)</div>Pending. Prior culture from 2 months ago: <em>E. coli</em> susceptible to everything. No prior UTI diagnosed this admission.</li>
</ul>
<div class="callout c-red">
  <span class="callout-label">The Teaching Frame</span>
  This patient has asymptomatic bacteriuria in the context of chronic catheterization. Pyuria is expected. Odor and cloudiness are not symptoms. Treating this urine culture drives resistance, C. diff risk, drug adverse events, and no clinical benefit. The fall has an explanation. The urine does not need treatment.
</div>
</div>
`},

// 3. SYNDROME CLASSIFICATION
{cls:'slide-accent',html:`
<h2>Six Syndromes &mdash; Getting the Label Right Changes Everything</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <div class="card-green" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--green);">Uncomplicated Cystitis</div>
      Dysuria + frequency + urgency &plusmn; suprapubic pain. No fever. No upper-tract signs. Infection confined to the bladder on initial evaluation. Short-course oral therapy. No culture required in low-risk women.
    </div>
    <div class="card-blue" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--blue);">Pyelonephritis</div>
      Fever + CVA tenderness + nausea/vomiting &plusmn; lower urinary symptoms. Upper-tract involvement. Culture always. Duration 5&ndash;7 days (vs. 3 days for cystitis).
    </div>
    <div class="card-yellow">
      <div class="card-title" style="color:var(--yellow);">Complicated UTI (2025 IDSA)</div>
      Fever, bacteremia, systemic illness, obstruction, abscess, hardware, prostatic involvement. <em>Not</em> automatically defined by diabetes, immunocompromise, or male sex alone &mdash; defined by illness extent and management implications.
    </div>
  </div>
  <div>
    <div class="card-orange" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--orange);">Asymptomatic Bacteriuria (ASB)</div>
      Bacteriuria without urinary symptoms. Very common in older adults and catheterized patients. <strong>Do not treat</strong> in most adults. Exceptions: pregnancy, before invasive urologic procedures with mucosal trauma.
    </div>
    <div class="card-accent" style="margin-bottom:8px;">
      <div class="card-title">Catheter-Associated UTI (CAUTI)</div>
      Bacteriuria + symptoms (fever, suprapubic pain, CVA tenderness, rigors, or new delirium without other explanation) in a catheterized patient. Pyuria alone is insufficient. Catheter management is co-equal with antibiotics.
    </div>
    <div class="card-accent">
      <div class="card-title">Acute Bacterial Prostatitis</div>
      Fever + pelvic/perineal pain + dysuria + obstructive voiding + tender boggy prostate. Requires agents with prostatic penetration. Duration weeks. Avoid prostatic massage.
    </div>
  </div>
</div>
</div>
`},

// 4. SYMPTOMS FIRST — DO NOT TREAT THE UA
{cls:'slide-danger',html:`
<h2>Diagnose by Symptoms, Not the Urinalysis</h2>
<div class="slide-body">
<div class="callout c-red">
  <span class="callout-label">The Core Stewardship Principle</span>
  Pyuria + bacteriuria = inflammation and colonization, <em>not necessarily infection</em>. The urinalysis does not make a UTI diagnosis. Symptoms do. Start with the history.
</div>
<div class="grid-2">
  <div>
    <h3>What Diagnoses Uncomplicated Cystitis</h3>
    <ul>
      <li><strong>Dysuria, frequency, urgency</strong> &mdash; new or worsening</li>
      <li>Suprapubic pain or pressure</li>
      <li><strong>No vaginal discharge or irritation</strong> (vaginitis is a key mimic in women)</li>
      <li>No fever, flank pain, systemic signs</li>
    </ul>
    <div class="callout c-green" style="margin-top:10px;">
      <span class="callout-label">Classic Symptoms, Low-Risk Woman</span>
      Pretest probability is high enough that empiric short-course treatment is appropriate without culture or even UA (Ann Arbor Guide, JAMA Netw Open 2026).
    </div>
    <h3 style="margin-top:12px;">What Does NOT Diagnose UTI</h3>
    <ul>
      <li>Cloudy or malodorous urine alone</li>
      <li>Pyuria without urinary symptoms</li>
      <li>A positive culture without symptoms</li>
      <li>Nonspecific confusion, falls, or "not acting right" without urinary complaints</li>
    </ul>
  </div>
  <div>
    <h3>When Urine Culture Is Indicated</h3>
    <ul>
      <li>Suspected pyelonephritis (always)</li>
      <li>Men (always)</li>
      <li>Recurrent UTI or treatment failure</li>
      <li>Known resistant organisms</li>
      <li>Catheter-associated infection</li>
      <li>Atypical presentation or diagnostic uncertainty</li>
      <li>Complicated infection</li>
      <li>Older adults when diagnosis is genuinely uncertain</li>
    </ul>
    <div class="callout c-yellow" style="margin-top:10px;">
      <span class="callout-label">Dipstick Pearls</span>
      Nitrites: helpful when positive, insensitive (gram-positive organisms don't produce nitrites). Leukocyte esterase + pyuria: support inflammation, not infection. Negative UA does not exclude UTI if classic symptoms are present.
    </div>
  </div>
</div>
</div>
`},

// 5. ASYMPTOMATIC BACTERIURIA
{cls:'slide-content',html:`
<h2>Asymptomatic Bacteriuria &mdash; The Stewardship Imperative</h2>
<div class="slide-body">
<div class="callout c-red">
  <span class="callout-label">Do Not Treat ASB in Most Adults</span>
  Treatment does not reduce UTI frequency, hospitalizations, or mortality. It drives antibiotic resistance, C. difficile infection, adverse drug reactions, and selection for more resistant organisms on subsequent cultures. (WikiGuidelines 2024; IDSA 2019 ASB Guidelines)
</div>
<div class="grid-2">
  <div>
    <h3>Populations With Very High ASB Prevalence</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Population</th><th>ASB Prevalence</th></tr></thead>
      <tbody>
        <tr><td>Young healthy women</td><td>1&ndash;5%</td></tr>
        <tr><td>Postmenopausal women</td><td>6&ndash;16%</td></tr>
        <tr><td>Diabetic women</td><td>8&ndash;14%</td></tr>
        <tr><td>Older adult men</td><td>5&ndash;10%</td></tr>
        <tr><td>Long-term care residents</td><td>25&ndash;50%</td></tr>
        <tr><td>Catheterized patients (short-term)</td><td>Up to 25% per day</td></tr>
        <tr><td>Catheterized patients (long-term)</td><td>100% eventually</td></tr>
      </tbody>
    </table>
    </div>
  </div>
  <div>
    <h3>Treat ASB Only In These Situations</h3>
    <div class="card-green" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--green);">Pregnancy</div>
      Untreated ASB in pregnancy increases risk of pyelonephritis and preterm birth. Screen at 12&ndash;16 weeks. Treat with 3&ndash;7 days of appropriate antibiotic (avoid TMP-SMX in first trimester and near term; avoid nitrofurantoin at term).
    </div>
    <div class="card-green">
      <div class="card-title" style="color:var(--green);">Before Invasive Urologic Procedures With Mucosal Trauma</div>
      Transurethral resection, cystoscopy with biopsy. Screen and treat to prevent post-procedural bacteremia. Not needed before simple cystoscopy without trauma.
    </div>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Do Not Screen or Treat ASB In</span>
      Diabetic patients &middot; catheterized patients (unless pre-procedure) &middot; elderly &middot; renal transplant recipients beyond the first month &middot; patients with spinal cord injury
    </div>
  </div>
</div>
</div>
`},

// 6. PYELONEPHRITIS + COMPLICATED UTI
{cls:'slide-accent',html:`
<h2>Pyelonephritis &amp; Complicated UTI</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Pyelonephritis: Recognition</h3>
    <ul>
      <li><strong>Fever &ge;38&deg;C</strong> + flank pain or CVA tenderness</li>
      <li>Nausea, vomiting, rigors</li>
      <li>Pyuria and bacteriuria (may have lower urinary symptoms too)</li>
      <li>Clinical diagnosis &mdash; urine culture is essential</li>
      <li>Blood cultures: obtain when septic, immunocompromised, or toxic-appearing</li>
    </ul>
    <h3 style="margin-top:12px;">When to Image</h3>
    <ul>
      <li><strong>CT abdomen/pelvis with contrast</strong> &mdash; modality of choice for complicated pyelonephritis</li>
      <li>Image at presentation when: sepsis or shock, suspected stone or obstruction, new rise in creatinine, urine pH &ge;7.0 (urease-producing organism), high-risk host</li>
      <li>Image later (48&ndash;72h) when: inadequate clinical response to appropriate antibiotics, concern for abscess or emphysematous infection</li>
      <li>Do NOT image routine, improving outpatient pyelonephritis</li>
    </ul>
  </div>
  <div>
    <h3>Features That Define Complicated UTI (2025 IDSA)</h3>
    <div class="callout c-yellow">
      <span class="callout-label">Classified by Illness Extent, Not Demographic Category</span>
      Diabetes, immunocompromise, and male sex alone do not automatically make a bladder infection "complicated." The following features do:
    </div>
    <ul style="margin-top:6px;">
      <li>Fever or systemic inflammatory response</li>
      <li>Bacteremia</li>
      <li>Suspected or confirmed obstruction or nephrolithiasis</li>
      <li>Renal or perinephric abscess</li>
      <li>Urinary instrumentation or recent procedure</li>
      <li>Known structural or functional urologic abnormality</li>
      <li>Prostatitis or prostatic involvement</li>
      <li>Failure to improve on appropriate therapy</li>
      <li>Catheter-associated infection with systemic signs</li>
    </ul>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">Obstruction Is the Can't-Miss Complication</span>
      Septic patient + UTI + no improvement = image urgently. Obstructed infected kidney (pyonephrosis) requires urgent drainage (IR nephrostomy or urologic stent) &mdash; antibiotics alone will not clear the infection.
    </div>
  </div>
</div>
</div>
`},

// 8. CYSTITIS TREATMENT
{cls:'slide-content',html:`
<h2>Uncomplicated Cystitis: Drug Selection</h2>
<div class="slide-body">
<div class="callout c-blue">
  <span class="callout-label">The Governing Principle</span>
  Use the narrowest effective agent for the shortest proven duration. Fluoroquinolones are not first-line for cystitis &mdash; they should be reserved for complicated/upper-tract infection and resistance situations.
</div>
<div class="table-wrap">
<table>
  <thead><tr><th>Agent</th><th>Regimen</th><th>Notes</th></tr></thead>
  <tbody>
    <tr>
      <td><strong style="color:var(--green);">Nitrofurantoin</strong></td>
      <td>100 mg monohydrate/macrocrystals BID &times; 5 days</td>
      <td>Preferred first-line. Excellent bladder concentrations; low resistance rates. <strong>Do not use for pyelonephritis or systemic infection</strong> &mdash; inadequate tissue levels. Avoid if CrCl &lt;30.</td>
    </tr>
    <tr>
      <td><strong style="color:var(--blue);">TMP-SMX</strong></td>
      <td>160/800 mg BID &times; 3 days</td>
      <td>Highly effective when local resistance &lt;20%. Avoid if prior resistant isolate, recent antibiotic use, or sulfa allergy. Avoid in first trimester (folate antagonist) and near term.</td>
    </tr>
    <tr>
      <td><strong>Fosfomycin</strong></td>
      <td>3 g PO single dose</td>
      <td>Convenient. SCOUT trial (Lancet 2026): single-dose fosfomycin had lower day-7 clinical effectiveness than nitrofurantoin, pivmecillinam, or two-dose fosfomycin. Still guideline-listed; use when other options are limited.</td>
    </tr>
    <tr>
      <td><strong>Pivmecillinam</strong></td>
      <td>400 mg TID &times; 3 days</td>
      <td>FDA-approved (2024) for uncomplicated UTI in adult women in the US. SCOUT trial: effective, comparable to nitrofurantoin. Limited formulary availability currently.</td>
    </tr>
    <tr>
      <td><strong style="color:var(--red);">Fluoroquinolones</strong></td>
      <td>Avoid as first-line for cystitis</td>
      <td>Reserve for complicated UTI, pyelonephritis when beta-lactams unavailable or resistance-guided, or when other first-line agents are contraindicated. FDA black box: tendinopathy, neuropathy, aortic aneurysm risk.</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-red">
  <span class="callout-label">The Nitrofurantoin Rule</span>
  Nitrofurantoin concentrates in urine and bladder tissue. It does not achieve therapeutic levels in renal parenchyma, blood, or most other tissues. Using it for pyelonephritis, complicated UTI, or any patient with systemic signs = treatment failure.
</div>
</div>
`},

// 9. PYELONEPHRITIS + COMPLICATED UTI TREATMENT
{cls:'slide-accent',html:`
<h2>Pyelonephritis &amp; Complicated UTI: Treatment</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Outpatient Pyelonephritis (Stable, Tolerating PO)</h3>
    <ul>
      <li><strong>Obtain urine culture first</strong> &mdash; always</li>
      <li>If local fluoroquinolone <em>E. coli</em> resistance &lt;10%: <strong>ciprofloxacin 500 mg BID &times; 7 days</strong> or <strong>levofloxacin 750 mg daily &times; 5 days</strong></li>
      <li>If resistance is a concern: give one dose of <strong>ceftriaxone 1g IV</strong> or <strong>gentamicin IM</strong>, then tailor oral therapy to culture</li>
      <li><strong>TMP-SMX</strong> DS BID &times; 14 days (only when susceptibility is confirmed or highly likely)</li>
      <li>Amoxicillin-clavulanate or oral cephalosporin: less preferred (lower cure rates); use when susceptibility confirmed</li>
    </ul>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Do Not Use Nitrofurantoin for Pyelonephritis</span>
      Inadequate renal parenchymal concentration. This error appears repeatedly on boards.
    </div>
  </div>
  <div>
    <h3>Inpatient / Complicated UTI (IV Therapy)</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Clinical Setting</th><th>Empiric Agent</th></tr></thead>
      <tbody>
        <tr><td>Most hospitalized adults</td><td><strong>Ceftriaxone</strong> 1&ndash;2g IV daily</td></tr>
        <tr><td>ESBL risk (prior ESBL, healthcare exposure, failed beta-lactam)</td><td><strong>Ertapenem</strong> or meropenem</td></tr>
        <tr><td>Pseudomonas risk (prior Pseudomonas, recurrent UTI, structural urologic disease, recent healthcare exposure)</td><td><strong>Cefepime</strong>, <strong>piperacillin-tazobactam</strong>, or <strong>ceftazidime</strong></td></tr>
        <tr><td>Septic shock / unstable</td><td>Broaden to carbapenem; obtain cultures and narrow rapidly</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-green" style="margin-top:8px;">
      <span class="callout-label">Duration &mdash; Shorter Is Often Enough</span>
      Gram-negative bacteremia from a urinary source in a clinically improving patient with source controlled: <strong>7 days total</strong> is well-supported (WikiGuidelines 2024). Pyelonephritis with beta-lactam: 7 days when optimized. Do not default to 14 days without a specific reason.
    </div>
  </div>
</div>
</div>
`},

// 10. DURATION TABLE
{cls:'slide-content',html:`
<h2>Treatment Duration at a Glance</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Syndrome</th><th>First-Line Agent(s)</th><th>Duration</th><th>Notes</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>Uncomplicated cystitis</strong></td>
      <td>Nitrofurantoin, TMP-SMX, fosfomycin, pivmecillinam</td>
      <td>3&ndash;5 days (agent-specific)</td>
      <td>No culture needed in low-risk women with classic presentation</td>
    </tr>
    <tr>
      <td><strong>Outpatient pyelonephritis</strong></td>
      <td>Fluoroquinolone (if susceptible); TMP-SMX (if susceptible)</td>
      <td>5&ndash;7 days</td>
      <td>Culture always; consider empiric parenteral dose if resistance risk</td>
    </tr>
    <tr>
      <td><strong>Inpatient pyelonephritis / complicated UTI</strong></td>
      <td>Ceftriaxone; broader if ESBL/Pseudomonas risk</td>
      <td>7 days (improving patient)</td>
      <td>Narrow based on culture; reassess at 48h</td>
    </tr>
    <tr>
      <td><strong>GN bacteremia, urinary source</strong></td>
      <td>Narrow per susceptibility</td>
      <td>7 days</td>
      <td>If clinically improving and source controlled (WikiGuidelines 2024)</td>
    </tr>
    <tr>
      <td><strong>CAUTI</strong></td>
      <td>Per culture; ceftriaxone empirically for most</td>
      <td>7 days (5 days for ciprofloxacin in mild/mod disease)</td>
      <td>Remove or replace catheter; do not prolong for pyuria alone</td>
    </tr>
    <tr>
      <td><strong>Acute bacterial prostatitis</strong></td>
      <td>Fluoroquinolone (preferred); TMP-SMX alternative</td>
      <td>4&ndash;6 weeks</td>
      <td>Requires prostatic-penetrating agents; culture urine before antibiotics</td>
    </tr>
    <tr>
      <td><strong>Uncomplicated cystitis in pregnancy</strong></td>
      <td>Nitrofurantoin, cephalexin, amoxicillin-clavulanate</td>
      <td>5&ndash;7 days</td>
      <td>Culture-guided; test of cure at 1&ndash;2 weeks</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-blue" style="margin-top:8px;">
  <span class="callout-label">Step Down Early</span>
  Once a patient is afebrile, tolerating oral intake, and improving, transition from IV to oral therapy and arrange outpatient follow-up. Do not complete IV courses in patients who meet oral step-down criteria.
</div>
</div>
`},

// 12. CAUTI
{cls:'slide-content',html:`
<h2>Catheter-Associated UTI</h2>
<div class="slide-body">
<div class="callout c-red">
  <span class="callout-label">The Governing Rule</span>
  Bacteriuria is expected and universal with prolonged catheterization. Do not treat bacteriuria in a catheterized patient unless there are symptoms or signs suggesting systemic infection. Pyuria alone is insufficient to diagnose CAUTI.
</div>
<div class="grid-2">
  <div>
    <h3>When to Suspect CAUTI</h3>
    <p style="font-size:15px;">Catheterized patient with bacteriuria PLUS one or more of:</p>
    <ul>
      <li>Fever &ge;38&deg;C</li>
      <li>Suprapubic tenderness or CVA tenderness</li>
      <li>Pelvic discomfort</li>
      <li>Rigors</li>
      <li>New-onset confusion or delirium <em>with no other explanation</em></li>
    </ul>
    <div class="callout c-yellow" style="margin-top:10px;">
      <span class="callout-label">Not Enough Alone</span>
      Pyuria &middot; cloudy urine &middot; odor &middot; leukocyte esterase positive &middot; vague weakness &middot; "not herself"
    </div>
  </div>
  <div>
    <h3>Management of CAUTI</h3>
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-body"><span class="step-title">Remove the catheter if no longer needed.</span><span class="step-sub">Strongest intervention. Biofilm on catheter surface persists. Antibiotics alone often fail without catheter removal.</span></div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-body"><span class="step-title">Replace the catheter if still needed.</span><span class="step-sub">New catheter and urine culture. The culture from the old catheter reflects biofilm colonization &mdash; less reliable.</span></div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-body"><span class="step-title">Start empiric antibiotics.</span><span class="step-sub">Ceftriaxone for most; broaden for prior resistant organisms, sepsis, or healthcare-associated presentation. 7 days total (5 days with ciprofloxacin for mild/moderate disease).</span></div>
    </div>
    <div class="step">
      <div class="step-num">4</div>
      <div class="step-body"><span class="step-title">Narrow based on culture.</span><span class="step-sub">Do not prolong antibiotics for persistent pyuria after catheter change. Resolution of systemic signs is the endpoint, not sterilization of the urine.</span></div>
    </div>
  </div>
</div>
</div>
`},

// 13. PROSTATITIS + RECURRENT UTI
{cls:'slide-accent',html:`
<h2>Prostatitis &amp; Recurrent UTI</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Acute Bacterial Prostatitis</h3>
    <div class="callout c-orange">
      <span class="callout-label">Think Prostatitis in Any Febrile Man With Pyuria</span>
      Not every febrile man with a positive UA has pyelonephritis. Prostatitis is the correct diagnosis in men with pelvic or perineal pain, obstructive voiding symptoms, or a tender boggy prostate.
    </div>
    <ul style="margin-top:6px;">
      <li>Obtain urine culture before antibiotics</li>
      <li>Blood cultures if toxic-appearing</li>
      <li>Avoid prostatic massage &mdash; bacteremia risk</li>
      <li>Agents with prostatic penetration: <strong>fluoroquinolones</strong> (preferred) or <strong>TMP-SMX</strong></li>
      <li>Duration: <strong>4&ndash;6 weeks</strong> (shorter = high relapse rate)</li>
      <li>Urinary retention: place suprapubic catheter rather than urethral catheter if needed</li>
      <li>Prostate abscess: consider if not improving at 48&ndash;72h; image with CT or transrectal US; drainage required</li>
    </ul>
  </div>
  <div>
    <h3>Recurrent UTI: Confirmed, Then Prevented</h3>
    <div class="callout c-blue">
      <span class="callout-label">Step 1: Confirm True Recurrence</span>
      Many "recurrent UTIs" are repeated treatment of colonization, vaginitis, or interstitial cystitis. Review prior cultures. Confirm each episode with symptoms AND positive culture.
    </div>
    <h3 style="margin-top:10px;">Nonantibiotic Prevention (First-Line)</h3>
    <ul>
      <li><strong>Increased fluid intake</strong> &mdash; dilutes inoculum, promotes voiding</li>
      <li><strong>Vaginal estrogen</strong> &mdash; postmenopausal women: restores Lactobacillus-dominant flora, reduces E. coli adherence. Systemic estrogen does not have the same benefit.</li>
      <li><strong>Methenamine hippurate</strong> &mdash; urinary acidification; generates formaldehyde in bladder. Effective prophylaxis in patients with intact bladder function. Contraindicated in renal failure.</li>
      <li><strong>Cranberry products</strong> &mdash; modest benefit in some studies; acceptable adjunct</li>
    </ul>
    <h3 style="margin-top:10px;">Antibiotic Prophylaxis</h3>
    <ul>
      <li>After nonantibiotic strategies fail or in high-burden cases</li>
      <li>Daily low-dose (nitrofurantoin, TMP-SMX, cephalexin) or postcoital prophylaxis when sex-associated</li>
      <li>AUA/CUA/SUFU 2022 Guideline: shared decision-making required</li>
    </ul>
  </div>
</div>
</div>
`},

// 14. OLDER ADULTS
{cls:'slide-content',html:`
<h2>Older Adults &mdash; The Highest-Stakes Stewardship Opportunity</h2>
<div class="slide-body">
<div class="callout c-red">
  <span class="callout-label">Most Important Single Teaching Point</span>
  Confusion, falls, or "not acting right" are not reliable indicators of UTI in older adults. These nonspecific symptoms prompt urine testing, which finds bacteriuria in 25&ndash;50% of residents, leading to inappropriate treatment. This cycle drives resistance, C. diff, polypharmacy harm, and delayed identification of the true cause.
</div>
<div class="grid-2">
  <div>
    <h3>Why Older Adults Are Overtreated</h3>
    <ul>
      <li>High baseline prevalence of ASB &mdash; a positive culture is almost expected</li>
      <li>Atypical symptom reporting due to dementia, baseline functional changes</li>
      <li>Cultural pressure to "do something" when a patient declines</li>
      <li>Urine is easy to test; result arrives quickly; antibiotic is easy to prescribe</li>
      <li>Pyuria is nearly universal in catheterized patients</li>
    </ul>
    <div class="callout c-yellow" style="margin-top:10px;">
      <span class="callout-label">The Correct Sequence</span>
      1. Identify plausible urinary symptoms (dysuria, frequency, suprapubic pain, CVA tenderness, new fever)<br>
      2. If no urinary symptoms: look for another cause of decline before ordering UA<br>
      3. If UA ordered and positive: does the clinical picture warrant treatment?
    </div>
  </div>
  <div>
    <h3>When Delirium Can Trigger UTI Evaluation</h3>
    <ul>
      <li>New onset delirium with fever AND no other explanation after appropriate workup</li>
      <li>Flank pain or suprapubic tenderness reported or elicited on exam</li>
      <li>New-onset urinary incontinence in a previously continent patient <em>combined with</em> other signs</li>
    </ul>
    <h3 style="margin-top:12px;">Geriatric Prescribing Cautions</h3>
    <ul>
      <li><strong>Nitrofurantoin</strong>: avoid if CrCl &lt;30; Beers list caution in frail elderly due to pulmonary/hepatic toxicity risk with long-term use</li>
      <li><strong>Fluoroquinolones</strong>: tendinopathy, CNS effects, QT prolongation &mdash; use cautiously</li>
      <li><strong>TMP-SMX</strong>: hyperkalemia risk with ACE inhibitors/ARBs/potassium-sparing diuretics; nephrotoxicity with trimethoprim-mediated Cr rise (not true AKI)</li>
    </ul>
  </div>
</div>
</div>
`},

// 15. CLINICAL PEARLS
{cls:'slide-accent',html:`
<h2>Clinical Pearls</h2>
<div class="slide-body">
<div class="pearl"><strong>Treat the patient, not the urine.</strong> A positive UA or urine culture in a catheterized or elderly patient without localizing urinary symptoms or fever is asymptomatic bacteriuria. Do not prescribe antibiotics. Identify the actual cause of clinical deterioration.</div>
<div class="pearl"><strong>Nitrofurantoin treats the bladder; it does not treat the kidney.</strong> Inadequate tissue penetration makes it ineffective for pyelonephritis. Using nitrofurantoin for upper-tract or systemic infection is a common, consequential error on boards and at the bedside.</div>
<div class="pearl"><strong>Fluoroquinolones are not first-line for uncomplicated cystitis.</strong> FDA black box warnings, rising resistance, collateral damage to the microbiome, and tendinopathy risk make them an inappropriate first choice when nitrofurantoin, TMP-SMX, fosfomycin, or pivmecillinam are available.</div>
<div class="pearl"><strong>Obstructed infected kidney = emergency.</strong> A septic patient with UTI who does not improve on antibiotics needs imaging urgently. Pyonephrosis requires drainage (IR nephrostomy or urologic stent) &mdash; antibiotics alone cannot clear an obstructed system.</div>
<div class="pearl"><strong>CAUTI: if the catheter is the problem, antibiotics alone are not the solution.</strong> Remove the catheter if no longer needed. Replace it if still needed. The biofilm on the existing catheter harbors organisms antibiotics cannot eradicate.</div>
<div class="pearl"><strong>Prostatitis needs 4&ndash;6 weeks of a prostatic-penetrating agent.</strong> Short courses fail. Fluoroquinolones and TMP-SMX achieve therapeutic prostatic concentrations; most beta-lactams do not. Missing this diagnosis in a febrile man with pyuria leads to undertreated infection and abscess.</div>
<div class="pearl"><strong>Vaginal estrogen and methenamine prevent recurrent UTI without antibiotics.</strong> Postmenopausal women with recurrent UTI should be offered vaginal estrogen before chronic antibiotic prophylaxis is initiated. Methenamine hippurate is a well-supported nonantibiotic alternative with a favorable safety profile.</div>
</div>
`},

const deck=document.getElementById('deck'),counter=document.getElementById('slide-counter'),
  btnPrev=document.getElementById('btn-prev'),btnNext=document.getElementById('btn-next'),
  bar=document.getElementById('progress-bar');
let cur=0;
SLIDES.forEach((s,i)=>{
  const el=document.createElement('div');
  el.className='slide '+s.cls; el.innerHTML=s.html;
  if(i===0)el.classList.add('active');
  deck.appendChild(el);
});
const slides=deck.querySelectorAll('.slide');
function goTo(n){
  if(n<0||n>=slides.length)return;
  slides[cur].classList.remove('active'); cur=n;
  slides[cur].classList.add('active');
  const b=slides[cur].querySelector('.slide-body'); if(b)b.scrollTop=0;
  counter.textContent=(cur+1)+' / '+slides.length;
  btnPrev.disabled=cur===0; btnNext.disabled=cur===slides.length-1;
  bar.style.width=((cur+1)/slides.length*100)+'%';
}
btnPrev.addEventListener('click',()=>goTo(cur-1));
btnNext.addEventListener('click',()=>goTo(cur+1));
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();goTo(cur+1);}
  if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();goTo(cur-1);}
});
let tx=0;
deck.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
deck.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50)dx<0?goTo(cur+1):goTo(cur-1);
},{passive:true});
goTo(0);
</script>
