<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Topic 43 — Tuberculosis | Morning Report</title>
<style>
  :root {
    --bg:#ffffff;--bg2:#f6f8fa;--bg3:#eaeef2;--border:#d0d7de;--text:#1f2328;--muted:#656d76;
    --blue:#0969da;--blue-bg:#ddf4ff;--blue-border:#54aeff;
    --green:#1a7f37;--green-bg:#dafbe1;--green-border:#4ac26b;
    --yellow:#9a6700;--yellow-bg:#fff8c5;--yellow-border:#d4a72c;
    --red:#cf222e;--red-bg:#ffebe9;--red-border:#ff8182;
    --purple:#8250df;--purple-bg:#fbefff;--purple-border:#c297ff;
    --orange:#bc4c00;--orange-bg:#fff1e5;--orange-border:#fb8f44;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:18px;line-height:1.5;}
  #deck{width:100%;height:100%;position:relative;overflow:hidden;}
  .slide{position:absolute;top:0;left:0;width:100%;height:100%;
    display:flex;flex-direction:column;padding:34px 52px 54px;
    opacity:0;pointer-events:none;transition:opacity 0.2s;overflow:hidden;}
  .slide.active{opacity:1;pointer-events:all;}
  .slide-content{background:var(--bg);}
  .slide-accent{background:var(--bg2);}
  .slide-title{background:var(--bg);justify-content:center;}
  .slide-danger{background:#fff5f5;}

  .slide-body{flex:1;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;padding-right:4px;}
  .slide-body::-webkit-scrollbar{width:3px;}
  .slide-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

  .slide-label{font-size:13px;font-weight:600;text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted);margin-bottom:10px;}
  .slide h1{font-size:38px;font-weight:700;line-height:1.1;margin-bottom:14px;}
  .slide h2{font-size:26px;font-weight:700;padding-bottom:9px;
    border-bottom:2px solid var(--border);margin-bottom:14px;}
  .slide h3{font-size:19px;font-weight:600;margin:12px 0 6px;}
  .slide p{font-size:16px;margin-bottom:8px;}
  .slide ul,.slide ol{padding-left:20px;margin-bottom:8px;}
  .slide li{font-size:17px;margin-bottom:5px;line-height:1.4;}
  .slide strong{font-weight:600;}
  .tagline{font-size:19px;color:var(--muted);max-width:620px;line-height:1.5;margin-bottom:20px;}

  .badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .badge{font-size:13px;font-weight:600;padding:3px 11px;border-radius:99px;border:1px solid;}
  .badge-blue  {background:var(--blue-bg);  color:var(--blue);  border-color:var(--blue-border);}
  .badge-green {background:var(--green-bg); color:var(--green); border-color:var(--green-border);}
  .badge-red   {background:var(--red-bg);   color:var(--red);   border-color:var(--red-border);}
  .badge-yellow{background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow-border);}
  .badge-purple{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-border);}
  .badge-orange{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-border);}

  .callout{border-radius:8px;padding:11px 15px;margin:9px 0;border-left:4px solid;font-size:15px;line-height:1.5;}
  .callout-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:3px;}
  .c-blue  {background:var(--blue-bg);  border-color:var(--blue);  color:#0550ae;} .c-blue   .callout-label{color:var(--blue);}
  .c-yellow{background:var(--yellow-bg);border-color:var(--yellow-border);color:var(--yellow);} .c-yellow .callout-label{color:var(--yellow);}
  .c-red   {background:var(--red-bg);   border-color:var(--red);   color:#82071e;} .c-red    .callout-label{color:var(--red);}
  .c-green {background:var(--green-bg); border-color:var(--green); color:#116329;} .c-green  .callout-label{color:var(--green);}
  .c-orange{background:var(--orange-bg);border-color:var(--orange-border);color:var(--orange);} .c-orange .callout-label{color:var(--orange);}
  .c-purple{background:var(--purple-bg);border-color:var(--purple);color:#5a32a3;} .c-purple .callout-label{color:var(--purple);}

  .table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border);margin:9px 0;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{background:var(--bg3);color:var(--muted);font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);}
  td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top;font-size:15px;}
  tr:last-child td{border-bottom:none;}
  tr:nth-child(even) td{background:var(--bg2);}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:9px 0;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:9px 0;}
  .card      {background:var(--bg);        border:1px solid var(--border);       border-radius:10px;padding:13px 15px;}
  .card-red  {background:var(--red-bg);    border:1px solid var(--red-border);   border-radius:10px;padding:13px 15px;}
  .card-green{background:var(--green-bg);  border:1px solid var(--green-border); border-radius:10px;padding:13px 15px;}
  .card-blue {background:var(--blue-bg);   border:1px solid var(--blue-border);  border-radius:10px;padding:13px 15px;}
  .card-yellow{background:var(--yellow-bg);border:1px solid var(--yellow-border);border-radius:10px;padding:13px 15px;}
  .card-orange{background:var(--orange-bg);border:1px solid var(--orange-border);border-radius:10px;padding:13px 15px;}
  .card-accent{background:var(--bg2);      border:1px solid var(--border);       border-radius:10px;padding:13px 15px;}
  .card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;}

  .step{display:flex;gap:12px;align-items:flex-start;margin-bottom:9px;}
  .step-num{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;
    font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
  .step-body{flex:1;}
  .step-title{font-size:17px;font-weight:600;display:block;margin-bottom:1px;}
  .step-sub{font-size:14px;color:var(--muted);}

  .tl{list-style:none;padding:0;position:relative;}
  .tl::before{content:'';position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--border);}
  .tl li{padding:0 0 12px 34px;position:relative;}
  .tl li::before{content:'';position:absolute;left:7px;top:5px;width:12px;height:12px;
    border-radius:50%;background:var(--bg);border:2px solid var(--blue);}
  .tl-label{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}

  .pearl{background:var(--bg2);border:1px solid var(--border);border-radius:10px;
    padding:12px 15px;margin:8px 0;font-size:16px;line-height:1.5;}

  .ch{display:flex;flex-direction:column;justify-content:center;height:100%;}
  .ch-num{font-size:72px;font-weight:800;color:var(--bg3);line-height:1;margin-bottom:8px;}
  .ch-title{font-size:30px;font-weight:700;margin-bottom:8px;}
  .ch-sub{font-size:18px;color:var(--muted);max-width:540px;line-height:1.4;}

  .refs{font-size:13px;color:var(--muted);line-height:1.7;}
  .refs li{margin-bottom:7px;}

  /* Spectrum bar for LTBI vs active disease */
  .spectrum{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--border);margin:10px 0;}
  .spec-cell{flex:1;padding:14px 16px;}
  .spec-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  .spec-exp{background:var(--bg2);} .spec-exp .spec-label{color:var(--muted);}
  .spec-ltbi{background:var(--yellow-bg);} .spec-ltbi .spec-label{color:var(--yellow);}
  .spec-act{background:var(--red-bg);} .spec-act .spec-label{color:var(--red);}

  #nav{position:fixed;bottom:0;left:0;right:0;height:44px;background:var(--bg);
    border-top:1px solid var(--border);display:flex;align-items:center;
    justify-content:space-between;padding:0 16px;z-index:200;user-select:none;}
  .nav-btn{background:none;border:1px solid var(--border);border-radius:6px;
    padding:5px 14px;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;}
  .nav-btn:hover{background:var(--bg2);}
  .nav-btn:disabled{opacity:.3;cursor:default;}
  #slide-counter{font-size:14px;color:var(--muted);font-weight:500;}
  #progress-bar{position:fixed;top:0;left:0;height:3px;background:var(--blue);transition:width .2s;z-index:300;}

  @media(max-width:720px){
    .slide{padding:18px 14px 54px;}
    .slide h1{font-size:26px;} .slide h2{font-size:20px;}
    .grid-2,.grid-3{grid-template-columns:1fr;}
    .spectrum{flex-direction:column;}
  }
</style>
</head>
<body>

  <button class="nav-btn" id="btn-prev">&#8592; Prev</button>
  <span id="slide-counter">1 / 1</span>
  <button class="nav-btn" id="btn-next">Next &#8594;</button>
</div>
<script>
const SLIDES = [

// 1. TITLE
{cls:'slide-title',html:`
<div class="slide-label">Topic 43 &middot; Infectious Disease / Public Health / Hospital Medicine</div>
<h1>Tuberculosis</h1>
<p class="tagline">The positive IGRA is not the diagnosis. Airborne isolation is a bedside action, not a paperwork formality. And RIPE is only the beginning of a conversation about multidrug resistance.</p>
<div class="badge-row">
  <span class="badge badge-red">Airborne Isolation</span>
  <span class="badge badge-blue">LTBI vs Active</span>
  <span class="badge badge-yellow">RIPE</span>
  <span class="badge badge-green">3HP / 4R Preferred</span>
  <span class="badge badge-orange">MKSAP 20</span>
</div>
<div style="margin-top:26px;font-size:14px;color:var(--muted);">Morning Report &middot; Internal Medicine &middot; David Comstock, MD</div>
`},

// 2. CASE
{cls:'slide-content',html:`
<h2>Case Presentation</h2>
<div class="slide-body">
<ul class="tl">
  <li><div class="tl-label">History</div>47M, born in South Asia, relocated to US 14 months ago. Presents to his primary care physician with 10-week history of productive cough, night sweats, 14 lb weight loss. One episode of blood-tinged sputum last week. Works as a taxi driver.</div></li>
  <li><div class="tl-label">Vitals &amp; Exam</div>T 38.2&deg;C, HR 96, BP 118/74, SpO2 97% RA. Thin-appearing. Crackles at right apex. No lymphadenopathy. No hepatosplenomegaly.</li>
  <li><div class="tl-label">Chest Radiograph</div>Right upper lobe cavitary infiltrate with surrounding airspace disease. Left upper lobe fibronodular changes.</li>
  <li><div class="tl-label">Immediate Actions</div>Patient sent immediately to clinic isolation room. Surgical mask placed on patient. Infection control notified. Sputum AFB smear, NAAT, and culture ordered (3 serial specimens &ge;8h apart). State public health reported. HIV test ordered.</li>
</ul>
<div class="callout c-red">
  <span class="callout-label">The Teaching Frame</span>
  Classic reactivation tuberculosis: foreign-born, upper lobe cavitary disease, constitutional symptoms, hemoptysis. Before any test result: <strong>airborne isolation, sputum collection, public health reporting</strong>. The most dangerous error is admitting this patient to a regular room while waiting for culture results.
</div>
</div>
`},

// 3. THREE CONCEPTS — THE SPECTRUM
{cls:'slide-accent',html:`
<h2>Three Concepts Residents Must Keep Separate</h2>
<div class="slide-body">
<div class="callout c-red">
  <span class="callout-label">The Most Consequential Error</span>
  Treating a positive IGRA as a diagnosis of LTBI without first excluding active disease. Starting preventive therapy in a patient with unrecognized active TB delays appropriate treatment, misses the infection control response, and harms public health.
</div>
<div class="spectrum">
  <div class="spec-cell spec-exp">
    <div class="spec-label">Exposure</div>
    <ul style="font-size:15px;">
      <li>Contact with a person with infectious TB</li>
      <li>No immune sensitization confirmed yet</li>
      <li>IGRA / TST may be negative initially; repeat in 8&ndash;10 weeks</li>
      <li>Asymptomatic, no clinical or radiographic findings</li>
      <li>Not infectious</li>
    </ul>
  </div>
  <div class="spec-cell spec-ltbi">
    <div class="spec-label">Latent TB Infection (LTBI)</div>
    <ul style="font-size:15px;">
      <li>Positive IGRA or TST</li>
      <li>No symptoms, no active disease on imaging</li>
      <li>Not infectious</li>
      <li>Lifetime risk of progression: <strong>5&ndash;10%</strong> in immunocompetent adults (highest in first 2 years)</li>
      <li>Risk dramatically higher with HIV, TNF inhibitors, transplant</li>
      <li>Treatment prevents future active disease</li>
    </ul>
  </div>
  <div class="spec-cell spec-act">
    <div class="spec-label">Active TB Disease</div>
    <ul style="font-size:15px;">
      <li>Symptoms: cough &gt;2&ndash;3 weeks, night sweats, weight loss, hemoptysis, fever</li>
      <li>Radiographic findings: upper lobe infiltrates, cavities, miliary pattern</li>
      <li>Positive AFB smear, NAAT, or culture</li>
      <li>Pulmonary / laryngeal: infectious (airborne precautions required)</li>
      <li>Multidrug treatment required; public health notification mandatory</li>
    </ul>
  </div>
</div>
<div class="callout c-blue" style="margin-top:6px;">
  <span class="callout-label">IGRA and TST Detect Infection, Not Disease</span>
  Both tests are indirect immunologic assays for prior sensitization to M. tuberculosis antigens. Neither can distinguish LTBI from active TB. A positive test must always be followed by symptom evaluation and chest imaging before LTBI treatment is started.
</div>
</div>
`},

// 4. IGRA vs TST
{cls:'slide-content',html:`
<h2>IGRA vs. TST: Choosing and Interpreting the Right Test</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>IGRA (Preferred in Most Adults)</h3>
    <div class="card-blue" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--blue);">QuantiFERON-TB Gold Plus / T-SPOT.TB</div>
      <ul style="font-size:15px;">
        <li>Single blood draw &mdash; no return visit required</li>
        <li>Not affected by prior BCG vaccination (preferred in BCG-vaccinated persons)</li>
        <li>Fewer false positives from nontuberculous mycobacteria than TST</li>
        <li>Preferred for those unlikely to return for TST reading</li>
        <li>Preferred in persons with low/intermediate risk of disease progression</li>
        <li>Cannot monitor response to treatment &mdash; do not repeat to assess treatment efficacy</li>
      </ul>
    </div>
    <h3>TST (Tuberculin Skin Test)</h3>
    <ul style="font-size:15px;">
      <li>Intradermal PPD injection; read induration (not erythema) at 48&ndash;72h</li>
      <li>Widely available; acceptable when IGRA unavailable</li>
      <li>False positives: prior BCG, NTM infection</li>
      <li>False negatives: recent infection (&lt;4&ndash;10 weeks), overwhelming active TB, severe immunosuppression, anergy</li>
      <li>Two-step testing for healthcare workers (booster effect): 7&ndash;21 days after initial test, opposite forearm</li>
    </ul>
  </div>
  <div>
    <h3>TST Interpretation &mdash; 5 / 10 / 15 mm Thresholds</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Threshold</th><th>Populations</th></tr></thead>
      <tbody>
        <tr>
          <td><strong style="color:var(--red);">&ge;5 mm</strong></td>
          <td>HIV infection &middot; Close contacts of infectious TB &middot; Organ transplant / immunosuppressed (&ge;15 mg/d prednisone &times;&ge;4 weeks) &middot; Fibrotic CXR changes suggesting old TB</td>
        </tr>
        <tr>
          <td><strong style="color:var(--yellow);">&ge;10 mm</strong></td>
          <td>Non-US-born from high-prevalence countries (within 5 years) &middot; Substance use disorder &middot; Residents/employees of congregate settings (prisons, shelters, nursing homes, hospitals) &middot; Diabetes, silicosis, CKD, hematologic malignancy &middot; Low body weight (&lt;90% IBW) &middot; Mycobacteriology lab personnel</td>
        </tr>
        <tr>
          <td><strong style="color:var(--green);">&ge;15 mm</strong></td>
          <td>All others with no risk factors for TB</td>
        </tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Who NOT to Test</span>
      Avoid routine testing in very low-risk persons. False positives in low-prevalence populations create downstream harm: unnecessary workup, inappropriate preventive treatment, and patient anxiety with no benefit.
    </div>
    <div class="callout c-blue" style="margin-top:6px;">
      <span class="callout-label">Healthcare Personnel (NTCA/CDC 2019)</span>
      Baseline risk assessment + IGRA or TST. <strong>No routine serial annual testing</strong> unless known exposure or ongoing transmission. Annual TB education is still recommended.
    </div>
  </div>
</div>
</div>
`},

// 5. POSITIVE TEST — WHAT TO DO
{cls:'slide-danger',html:`
<h2>Positive IGRA or TST &mdash; The Mandatory Next Steps</h2>
<div class="slide-body">
<div class="callout c-red">
  <span class="callout-label">Never Start LTBI Treatment Without This Sequence</span>
  Every positive screening test must be followed by exclusion of active disease before initiating preventive therapy.
</div>
<div class="step">
  <div class="step-num">1</div>
  <div class="step-body">
    <span class="step-title">Take a full symptom history</span>
    <span class="step-sub">Cough (&gt;2&ndash;3 weeks) &middot; Fever &middot; Night sweats &middot; Weight loss &middot; Hemoptysis &middot; Fatigue &middot; Chest pain. Any of these symptoms in a TST/IGRA-positive patient = evaluate for active TB before LTBI treatment.</span>
  </div>
</div>
<div class="step">
  <div class="step-num">2</div>
  <div class="step-body">
    <span class="step-title">Obtain a chest radiograph</span>
    <span class="step-sub">Look for upper lobe infiltrates, cavities, fibronodular changes, pleural effusion, miliary pattern, or lymphadenopathy. A normal radiograph is reassuring but does not completely exclude TB in severely immunocompromised patients.</span>
  </div>
</div>
<div class="step">
  <div class="step-num">3</div>
  <div class="step-body">
    <span class="step-title">If symptoms OR imaging suggest active disease &mdash; STOP and escalate</span>
    <span class="step-sub">Do not start LTBI therapy. Place in airborne isolation. Obtain 3 sputum specimens for AFB smear, mycobacterial culture, and NAAT. Notify infection control and public health. HIV test.</span>
  </div>
</div>
<div class="step">
  <div class="step-num">4</div>
  <div class="step-body">
    <span class="step-title">If asymptomatic AND normal imaging &mdash; diagnose LTBI and offer treatment</span>
    <span class="step-sub">Screen for HIV. Review medications (rifamycin drug interactions). Select a preferred short-course regimen. Counsel on adverse effects. Provide pyridoxine if isoniazid is used and neuropathy risk is present.</span>
  </div>
</div>
<div class="step">
  <div class="step-num">5</div>
  <div class="step-body">
    <span class="step-title">Before starting a biologic agent or JAK inhibitor &mdash; always screen first</span>
    <span class="step-sub">TNF inhibitors, other biologics, and JAK inhibitors substantially increase reactivation risk. IGRA (preferred) or TST + chest radiograph before initiation. Treat LTBI before starting the immunosuppressant unless timing is urgent.</span>
  </div>
</div>
</div>
`},

// 6. ACTIVE TB — PRESENTATION + IMAGING
{cls:'slide-content',html:`
<h2>Active Pulmonary TB: Recognition</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Classic Presentation</h3>
    <ul>
      <li>Subacute/chronic cough (&gt;2&ndash;3 weeks) &mdash; often productive</li>
      <li>Constitutional: night sweats, weight loss, fatigue, fever</li>
      <li>Hemoptysis in 10&ndash;20% of smear-positive cases</li>
      <li>Pleuritic chest pain</li>
      <li>Symptoms often insidious &mdash; weeks before presentation</li>
    </ul>
    <h3 style="margin-top:12px;">Imaging Patterns</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Pattern</th><th>Context</th></tr></thead>
      <tbody>
        <tr><td><strong>Upper lobe cavitary infiltrates</strong></td><td>Classic reactivation; high-burden disease</td></tr>
        <tr><td><strong>Fibronodular upper lobe changes</strong></td><td>Partially treated or chronic disease</td></tr>
        <tr><td><strong>Miliary (millet-seed nodules)</strong></td><td>Hematogenous dissemination; immunosuppressed</td></tr>
        <tr><td><strong>Lower lobe or diffuse infiltrates</strong></td><td>HIV/advanced immunosuppression; primary TB</td></tr>
        <tr><td><strong>Pleural effusion</strong></td><td>Primary or reactivation; exudative, lymphocyte-predominant</td></tr>
        <tr><td><strong>Normal chest radiograph</strong></td><td>Advanced HIV (CD4 &lt;200), early primary infection</td></tr>
      </tbody>
    </table>
    </div>
  </div>
  <div>
    <h3>High-Risk Groups for Active TB</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Category</th><th>Key Examples</th></tr></thead>
      <tbody>
        <tr><td><strong>Recent infection</strong></td><td>Contact within 2 years; highest reactivation risk window</td></tr>
        <tr><td><strong>Immunosuppression</strong></td><td>HIV (especially CD4 &lt;200) &middot; TNF inhibitors &middot; JAK inhibitors &middot; Transplant &middot; Glucocorticoids &ge;15 mg/d prednisone &times;&ge;4 weeks</td></tr>
        <tr><td><strong>Comorbidities</strong></td><td>Silicosis &middot; DM &middot; CKD &middot; Low body weight &middot; Hematologic malignancy &middot; Head/neck cancer</td></tr>
        <tr><td><strong>Substance use</strong></td><td>Alcohol use disorder &middot; Injection drug use &middot; Smoking</td></tr>
        <tr><td><strong>Social risk</strong></td><td>Foreign-born from high-prevalence country &middot; Persons without housing &middot; Incarceration &middot; Long-term care facilities</td></tr>
      </tbody>
    </table>
    </div>

// 7. MICROBIOLOGIC WORKUP
{cls:'slide-accent',html:`
<h2>Microbiologic Workup for Suspected Active TB</h2>
<div class="slide-body">
<div class="callout c-blue">
  <span class="callout-label">The Framework: Smear &rarr; NAAT &rarr; Culture &rarr; Susceptibility</span>
  All four are complementary. No single test replaces the others. Speed drives smear and NAAT; accuracy and susceptibility data require culture.
</div>
<div class="table-wrap">
<table>
  <thead><tr><th>Test</th><th>Specimen</th><th>Turnaround</th><th>Role &amp; Limitations</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>AFB Smear Microscopy</strong></td>
      <td>3 sputum specimens &ge;8h apart (one early morning, &ge;3 mL each). If unable to produce sputum: induced sputum or bronchoscopy.</td>
      <td>Hours</td>
      <td>Rapid, cheap. Sensitivity 50&ndash;80% in pulmonary TB. Positive result does not confirm M. tuberculosis (NTM can cause false positives). Requires culture confirmation regardless of result.</td>
    </tr>
    <tr>
      <td><strong>NAAT (e.g., Xpert MTB/RIF)</strong></td>
      <td>Initial respiratory specimen (first sputum)</td>
      <td>Hours&ndash;1 day</td>
      <td>Positive predictive value 95% on smear-positive specimens. Sensitivity 50&ndash;80% on smear-negative. Simultaneously detects rifampin resistance. A negative NAAT does not exclude TB. Does not replace culture for susceptibility data.</td>
    </tr>
    <tr>
      <td><strong>Mycobacterial Culture</strong></td>
      <td>All specimens (liquid + solid media)</td>
      <td>2&ndash;6 weeks (liquid: 2&ndash;4 weeks)</td>
      <td>Gold standard. Required for definitive diagnosis and susceptibility testing. Liquid culture faster; solid culture confirms. Required for every specimen regardless of smear/NAAT result.</td>
    </tr>
    <tr>
      <td><strong>Drug Susceptibility Testing (DST)</strong></td>
      <td>From culture isolate; rapid molecular DST from specimen</td>
      <td>Days (molecular) to weeks (phenotypic)</td>
      <td>Essential to guide therapy. NAAT detects rifampin resistance rapidly. Full phenotypic DST includes isoniazid, rifampin, pyrazinamide, ethambutol. If rifampin-resistant on NAAT: expand to second-line DST immediately.</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-yellow" style="margin-top:6px;">
  <span class="callout-label">Blood Cultures in Disseminated TB</span>
  In suspected miliary or disseminated TB, mycobacterial blood cultures using lysis-centrifugation (isolator) methodology improve yield. Also send LFTs, CBC &mdash; pancytopenia and hepatitis can occur with disseminated disease.
</div>
</div>
`},

// 8. CHAPTER — ISOLATION + INFECTION CONTROL
{cls:'slide-title',html:`
<div class="ch">
  <div class="ch-num">01</div>
  <div class="ch-title">Infection Control</div>
  <div class="ch-sub">Airborne isolation is a bedside action. Noncontagious criteria. HCW screening. Public health reporting. This is not paperwork &mdash; it protects patients, staff, and the community.</div>
  <div class="badge-row" style="margin-top:16px;">
    <span class="badge badge-red">Airborne Precautions</span>
    <span class="badge badge-blue">N95 Respirator</span>
    <span class="badge badge-yellow">Negative-Pressure Room</span>
    <span class="badge badge-green">3 Negative Smears</span>
  </div>
</div>
`},

// 9. ISOLATION + HCW + PUBLIC HEALTH
{cls:'slide-content',html:`
<h2>Airborne Isolation, Release Criteria &amp; Public Health</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Airborne Precautions &mdash; Required for Suspected Pulmonary / Laryngeal TB</h3>
    <div class="card-red" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--red);">Implement Immediately When TB Is Suspected</div>
      <ul style="font-size:15px;">
        <li><strong>Airborne infection isolation room (AIIR)</strong> &mdash; negative-pressure, &ge;12 air changes/hour, exhaust to outside</li>
        <li><strong>HCW respiratory protection:</strong> fit-tested N95 respirator (not a surgical mask)</li>
        <li><strong>Patient</strong> wears surgical mask when leaving the room to contain respiratory secretions</li>
        <li><strong>Notify infection prevention</strong> immediately</li>
        <li>Discontinue airborne precautions only after approval by infection prevention program</li>
      </ul>
    </div>
    <h3 style="margin-top:10px;">Criteria: When Is a Patient No Longer Contagious?</h3>
    <p style="font-size:15px;">All three must be met:</p>
    <ul>
      <li>Appropriate antimicrobial therapy for <strong>&ge;2 weeks</strong></li>
      <li>Clinical improvement in signs and symptoms</li>
      <li><strong>Three negative AFB smears</strong> collected &ge;8 hours apart (one early-morning)</li>
    </ul>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Smear-Negative &ne; Not Contagious</span>
      Smear-negative patients are <em>less</em> contagious but may still have active TB. Infection prevention determines when precautions can safely be removed.
    </div>
  </div>
  <div>
    <h3>Public Health Reporting</h3>
    <ul>
      <li>Suspected or confirmed active TB is reportable in all US states</li>
      <li>Report to local/state health department as soon as suspected</li>
      <li>Contact investigation identifies exposed close contacts who need screening</li>
      <li>Directly Observed Therapy (DOT) coordination through public health for active TB</li>
    </ul>
    <h3 style="margin-top:12px;">Healthcare Personnel (HCW) Screening &mdash; NTCA/CDC 2019</h3>
    <div class="card-accent">
      <div class="card-title">Current Recommendations</div>
      <ul style="font-size:15px;">
        <li>Baseline: risk assessment + symptom screen + IGRA or TST (if no prior documented LTBI/TB)</li>
        <li><strong>No routine serial annual testing</strong> for HCW without known exposure or ongoing transmission</li>
        <li>Post-exposure evaluation when exposure is identified</li>
        <li>Annual TB education remains recommended</li>
        <li>Two-step TST for initial baseline testing (7&ndash;21 days later, opposite forearm) to identify booster effect; not needed if IGRA is used</li>
      </ul>
    </div>
  </div>
</div>
</div>
`},

{cls:'slide-title',html:`
<div class="ch">
  <div class="ch-num">02</div>
  <div class="ch-title">Treatment</div>
  <div class="ch-sub">Short-course LTBI regimens. The standard RIPE framework for active disease. Toxicity and drug interactions every resident must know. Drug-resistant TB as a specialist and public health problem.</div>
  <div class="badge-row" style="margin-top:16px;">
    <span class="badge badge-green">3HP / 4R / 3HR</span>
    <span class="badge badge-yellow">RIPE 2+4</span>

  </div>
</div>

// 11. LTBI TREATMENT
{cls:'slide-content',html:`
<h2>LTBI Treatment: Preferred Regimens</h2>
<div class="slide-body">
<div class="callout c-blue">
  <span class="callout-label">Goal of LTBI Treatment</span>
  Prevent future progression to active disease. Especially important in persons with immunosuppression, recent infection, or prior to initiation of biologic or immunosuppressive therapy.
</div>
<div class="table-wrap">
<table>
  <thead><tr><th>Regimen</th><th>Frequency</th><th>Duration</th><th>Priority</th><th>Key Notes</th></tr></thead>
  <tbody>
    <tr>
      <td><strong style="color:var(--green);">Isoniazid + Rifapentine (3HP)</strong></td>
      <td>Once weekly</td>
      <td>3 months (12 doses)</td>
      <td>Preferred</td>
      <td>Best completion rates. Can be self-administered or DOT. Rifapentine dose by weight (750 mg if 32.1&ndash;49.9 kg; 900 mg if &ge;50 kg). Major drug interactions (see below). NOT for use in pregnancy (rifamycins).</td>
    </tr>
    <tr>
      <td><strong style="color:var(--green);">Rifampin (4R)</strong></td>
      <td>Daily</td>
      <td>4 months (120 doses)</td>
      <td>Preferred</td>
      <td>Good option when isoniazid is not tolerated or when source case is isoniazid-resistant. Major drug interactions. Not in pregnancy.</td>
    </tr>
    <tr>
      <td><strong style="color:var(--green);">Isoniazid + Rifampin (3HR)</strong></td>
      <td>Daily</td>
      <td>3 months (90 doses)</td>
      <td>Preferred</td>
      <td>Useful when either 3HP or 4R cannot be used. Drug interactions apply for rifampin component.</td>
    </tr>
    <tr>
      <td><strong>Isoniazid (6H or 9H)</strong></td>
      <td>Daily</td>
      <td>6 or 9 months</td>
      <td>Alternative</td>
      <td>Longer courses; lower completion rates; more hepatotoxicity than rifamycin-based regimens. Use when rifamycins are contraindicated or not tolerated. 9H preferred over 6H in HIV and other high-risk populations.</td>
    </tr>
  </tbody>
</table>
</div>
<div class="grid-2">
  <div class="callout c-yellow" style="margin:0;">
    <span class="callout-label">Pyridoxine (Vitamin B6)</span>
    Give with isoniazid when neuropathy risk factors are present: diabetes mellitus &middot; CKD &middot; malnutrition &middot; HIV &middot; alcohol use disorder &middot; pregnancy &middot; older adults. Dose: 25&ndash;50 mg daily (100 mg/d if active peripheral neuropathy).
  </div>
  <div class="callout c-red" style="margin:0;">
    <span class="callout-label">Rifamycin Drug Interactions &mdash; Always Check</span>
    Major interactions: anticoagulants (warfarin &mdash; dramatically reduces INR) &middot; hormonal contraceptives &middot; methadone &middot; many antiretrovirals (PIs, NNRTIs) &middot; corticosteroids &middot; antifungals &middot; anticonvulsants. Orange discoloration of urine, saliva, tears &mdash; counsel patients before prescribing.
  </div>
</div>
</div>
`},

// 12. ACTIVE TB TREATMENT — RIPE
{cls:'slide-accent',html:`
<h2>Active Drug-Susceptible TB: Treatment Framework</h2>
<div class="slide-body">
<div class="callout c-red">
  <span class="callout-label">Fundamental Rule</span>
  Never use monotherapy. Never use a single new drug to a failing regimen. Resistance emerges from single-drug treatment. Multidrug therapy is mandatory.
</div>
<div class="grid-2">
  <div>
    <h3>Standard Option 1 &mdash; 6-Month Regimen (RIPE)</h3>
    <div class="card-yellow" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--yellow);">Intensive Phase &mdash; 8 weeks (56 doses)</div>
      <strong>R</strong>ifampin + <strong>I</strong>soniazid + <strong>P</strong>yrazinamide + <strong>E</strong>thambutol daily
    </div>
    <div class="card-green">
      <div class="card-title" style="color:var(--green);">Continuation Phase &mdash; 18 weeks (126 doses)</div>
      Isoniazid + Rifampin daily (ethambutol can be stopped once susceptibility confirms no INH or RIF resistance)
    </div>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">Why Ethambutol Is Included Up Front</span>
      Protects the regimen if isoniazid resistance is present until susceptibility data return. Can be discontinued once susceptibility confirms full first-line susceptibility. A classic board question.
    </div>
    <div class="callout c-yellow" style="margin-top:6px;">
      <span class="callout-label">Extending Continuation Phase</span>
      7 months (31 weeks) instead of 4 months when: cavitation on initial CXR AND positive culture at 2 months of therapy. Expert guidance recommended.
    </div>
  </div>
  <div>
    <h3>Standard Option 2 &mdash; 4-Month Regimen (Select Patients)</h3>
    <div class="card-blue" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--blue);">Intensive Phase &mdash; 8 weeks</div>
      Rifapentine + Moxifloxacin + Isoniazid + Pyrazinamide daily (at least 5/7 doses under DOT)
    </div>
    <div class="card-blue">
      <div class="card-title" style="color:var(--blue);">Continuation Phase &mdash; 9 weeks</div>
      Rifapentine + Moxifloxacin + Isoniazid daily (at least 5/7 doses under DOT)
    </div>
    <p style="font-size:15px;margin-top:8px;">ATS/CDC/ERS/IDSA 2025 guideline: equally effective in select patients. Cannot miss doses &mdash; strict timing required. Not yet for all populations including HIV on complex ART.</p>
    <h3 style="margin-top:10px;">General Principles</h3>
    <ul style="font-size:15px;">
      <li>HIV test every patient with active TB</li>
      <li>Pyridoxine with all isoniazid-containing regimens when neuropathy risk present</li>
      <li>Sputum evaluation at 1 and 2 months to assess clearance</li>
      <li>Directly Observed Therapy (DOT) preferred &mdash; coordinate with public health</li>
      <li>Culture conversion at 2 months is a key prognostic marker</li>
    </ul>
  </div>
</div>
</div>
`},

// 13. DRUG TOXICITY TABLE
{cls:'slide-content',html:`
<h2>First-Line Drug Toxicity &mdash; What Residents Must Know</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Drug</th><th>Key Adverse Effects</th><th>Monitoring / Pearls</th></tr></thead>
  <tbody>
    <tr>
      <td><strong style="color:var(--red);">Isoniazid (INH)</strong></td>
      <td>Hepatotoxicity (hepatitis, elevated LFTs) &middot; Peripheral neuropathy &middot; Lupus-like syndrome &middot; Rash</td>
      <td>Hepatitis risk increases with age and alcohol use. Give pyridoxine to neuropathy-risk patients. Routine LFT monitoring not required unless hepatotoxicity risk factors present (HIV, chronic hepatitis, alcohol use, pregnancy, underlying liver disease, concurrent hepatotoxic drugs).</td>
    </tr>
    <tr>
      <td><strong style="color:var(--blue);">Rifampin / Rifapentine</strong></td>
      <td>Hepatotoxicity &middot; Rash &middot; GI upset &middot; Orange discoloration of body fluids &middot; Thrombocytopenia (rifabutin more common) &middot; Cytopenias</td>
      <td>Major drug interactions (anticoagulants, OCPs, methadone, antiretrovirals &mdash; see prior slide). Contraindicated in pregnancy. Rifapentine broadly contraindicated in HIV (unacceptable failure/relapse rate per MKSAP 20 drug table; note: some 2025 guideline nuance for select HIV regimens &mdash; defer to ID/HIV specialist).</td>
    </tr>
    <tr>
      <td><strong style="color:var(--green);">Pyrazinamide (PZA)</strong></td>
      <td>Hepatotoxicity &middot; Hyperuricemia (may precipitate gout) &middot; GI upset &middot; Rash &middot; Arthralgia</td>
      <td>Dose-adjust for renal impairment. May worsen glucose control in DM. Baseline uric acid helpful.</td>
    </tr>
    <tr>
      <td><strong style="color:var(--orange);">Ethambutol (EMB)</strong></td>
      <td>Optic neuritis (decreased acuity, color vision loss) &middot; Rash</td>
      <td>Baseline visual acuity and color vision before starting. Periodic testing during therapy. Instruct patients to report visual changes immediately. Dose-adjust for renal impairment. Discontinue if visual symptoms develop.</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-red" style="margin-top:8px;">
  <span class="callout-label">Hypersensitivity Reaction During RIPE</span>
  If a hypersensitivity reaction develops, stop all four drugs. Sequential rechallenge one at a time to identify the culprit. Do not rechallenge with multiple agents simultaneously.
</div>
<div class="callout c-yellow" style="margin-top:6px;">
  <span class="callout-label">Before Starting Any Anti-TB Regimen</span>
  CBC &middot; LFTs &middot; creatinine &middot; visual acuity/color vision (EMB) &middot; uric acid (PZA) &middot; HIV test &middot; hepatitis B and C serology. Review full medication list for rifamycin interactions.
</div>
</div>
`},

// 14. DRUG-RESISTANT TB
{cls:'slide-accent',html:`
<h2>Drug-Resistant TB &mdash; Framework for Residents</h2>
<div class="slide-body">
<div class="callout c-red">
  <span class="callout-label">Never Manage Drug-Resistant TB Without Expert Consultation</span>
  MDR-TB and XDR-TB are specialist and public health emergencies. The resident's role is recognition, rapid molecular testing, airborne isolation, and urgent escalation &mdash; not regimen selection.
</div>
<div class="grid-2">
  <div>
    <h3>Definitions</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Term</th><th>Definition</th></tr></thead>
      <tbody>
        <tr><td><strong>MDR-TB</strong></td><td>Resistant to <em>at least</em> isoniazid + rifampin</td></tr>
        <tr><td><strong>Pre-XDR-TB</strong></td><td>MDR-TB + resistance to any fluoroquinolone</td></tr>
        <tr><td><strong>XDR-TB</strong></td><td>MDR-TB + resistance to any fluoroquinolone + &ge;1 additional Group A drug (bedaquiline or linezolid)</td></tr>
        <tr><td><strong>Isoniazid-resistant TB</strong></td><td>Susceptible to rifampin; treat with RIF + EMB + PZA &times;6 months + fluoroquinolone</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">When to Suspect Drug Resistance</span>
      Prior TB treatment &middot; Exposure to a known drug-resistant case &middot; Born in/resided in high MDR-TB prevalence country &middot; Rifampin resistance detected on initial NAAT &middot; Failure to culture-convert at 2 months
    </div>
  </div>
  <div>
    <h3>Conventional MDR-TB (Still Used)</h3>
    <ul>
      <li><strong>Intensive phase:</strong> 5 drugs, 5&ndash;7 months after culture conversion</li>
      <li><strong>Continuation phase:</strong> 4 drugs, total treatment 15&ndash;21 months after culture conversion (MKSAP 20; ATS/IDSA 2019)</li>
      <li>Regimen must use drugs with documented or high-likelihood susceptibility</li>
    </ul>
    <h3 style="margin-top:10px;">Modern DR-TB &mdash; The Bedaquiline Era</h3>
    <ul>
      <li>Paradigm shift: away from injectable-heavy regimens toward all-oral regimens</li>
      <li><strong>Bedaquiline</strong> (FDA-approved): inhibits mycobacterial ATP synthase; novel mechanism; central to MDR-TB regimens. QT prolongation &mdash; monitor ECG.</li>
      <li><strong>Pretomanid</strong> (FDA-approved): nitroimidazole; used with bedaquiline + linezolid (BPaL) for XDR-TB or nonresponsive MDR-TB</li>
      <li><strong>BPaLM</strong> (Bed + pretomanid + linezolid + moxifloxacin): 6-month all-oral regimen; non-inferior to 15&ndash;24 month regimens for rifampin-resistant TB (WHO 2022, ATS/CDC/ERS/IDSA 2025)</li>
      <li>Linezolid: effective but peripheral neuropathy, anemia, thrombocytopenia with prolonged use</li>
    </ul>
    <div class="callout c-purple" style="margin-top:8px;">
      <span class="callout-label">Rapid Molecular DST Is Critical</span>
      NAAT (Xpert MTB/RIF) provides rifampin resistance data within hours. If rifampin-resistant: immediately expand susceptibility testing to second-line drugs and contact TB expert and public health. Do not wait for phenotypic DST to escalate.
    </div>
  </div>
</div>
</div>
`},

// 15. SPECIAL POPULATIONS
{cls:'slide-content',html:`
<h2>Special Populations</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <div class="card-red" style="margin-bottom:10px;">
      <div class="card-title" style="color:var(--red);">HIV and TB &mdash; A High-Stakes Interaction</div>
      <ul style="font-size:15px;">
        <li>TB can occur at <em>any</em> CD4 count; risk is markedly elevated throughout HIV infection</li>
        <li>At CD4 &lt;200: imaging is atypical &mdash; lower/diffuse infiltrates, normal CXR possible, extrapulmonary disease more common</li>
        <li>At CD4 &lt;100: miliary disease, disseminated TB, bacteremia possible</li>
        <li>Test every TB patient for HIV and every HIV patient for LTBI</li>
        <li>Rifamycin drug interactions with antiretrovirals are major &mdash; rifabutin often substituted for rifampin (dose adjustment required with PIs/NNRTIs); rifapentine broadly contraindicated in HIV (unacceptable failure/relapse rate)</li>
        <li>ART timing: start ART 2&ndash;8 weeks after TB therapy in most HIV/TB (CD4 &lt;50: start ART within 2 weeks, except CNS TB)</li>
        <li>IRIS (immune reconstitution inflammatory syndrome): paradoxical worsening after ART initiation despite effective TB therapy &mdash; diagnose by exclusion; glucocorticoids for severe cases</li>
      </ul>
    </div>
  </div>
  <div>
    <div class="card-yellow" style="margin-bottom:10px;">
      <div class="card-title" style="color:var(--yellow);">TNF Inhibitors, Biologics, and JAK Inhibitors</div>
      <ul style="font-size:15px;">
        <li>TNF inhibitors substantially increase reactivation risk &mdash; estimated 5&ndash;25&times; increase</li>
        <li>Screen before initiation: IGRA (preferred) or TST + symptom review + chest radiograph</li>
        <li>Treat LTBI before starting the biologic whenever timing allows</li>
        <li>Preferred LTBI regimen when starting biologic: 3HP or 4R (shorter, better completion)</li>
        <li>LTBI treatment does not completely eliminate reactivation risk once biologic is started &mdash; continued vigilance required</li>
        <li>Same screening principle applies for JAK inhibitors, transplant workup, and initiation of long-term corticosteroids</li>
      </ul>
    </div>
    <div class="card-accent">
      <div class="card-title">Pregnancy and TB</div>
      <ul style="font-size:15px;">
        <li>Active TB in pregnancy requires immediate treatment &mdash; untreated TB poses greater risk to mother and fetus than drug therapy</li>
        <li>RIPE safe in pregnancy except: pyrazinamide (avoid in first trimester per some guidelines) and streptomycin (ototoxicity)</li>
        <li>LTBI treatment in pregnancy: rifamycins contraindicated. Options: 6H or 9H isoniazid + pyridoxine; some experts defer until after delivery unless immunocompromised</li>
      </ul>
    </div>
  </div>
</div>
</div>
`},

// 16. CLINICAL PEARLS
{cls:'slide-accent',html:`
<h2>Clinical Pearls</h2>
<div class="slide-body">
<div class="pearl"><strong>IGRA and TST detect infection, not disease.</strong> A positive screening test is the beginning of the evaluation, not the end. Every positive test requires symptom review, chest imaging, and active disease exclusion before LTBI treatment is started. Skipping this step is the most dangerous error in TB management.</div>
<div class="pearl"><strong>Airborne isolation is a bedside action, not a documentation task.</strong> Suspected pulmonary or laryngeal TB requires a negative-pressure room and N95 respirator use by staff immediately &mdash; before sputum results return. Once TB is suspected clinically, delay in isolation exposes other patients and staff.</div>
<div class="pearl"><strong>A normal chest radiograph does not exclude active TB.</strong> Advanced HIV (CD4 &lt;200), miliary disease, and primary TB in immunocompromised patients can present with normal or atypical imaging. TB must remain in the differential regardless of CXR findings when clinical suspicion is present.</div>
<div class="pearl"><strong>Ethambutol is included in RIPE to protect the regimen, not because it is the most potent drug.</strong> It guards against isoniazid monotherapy in the setting of unrecognized INH resistance. It can be stopped once susceptibility confirms full first-line sensitivity. Board favorite.</div>
<div class="pearl"><strong>Check the full medication list before prescribing rifamycins.</strong> Rifampin is a potent inducer of CYP450 enzymes. It dramatically lowers warfarin INR, reduces hormonal contraceptive levels, reduces antiretroviral exposure, and interacts with methadone, antifungals, and corticosteroids. A rifamycin-naive prescriber can cause serious harm by ignoring these interactions.</div>
<div class="pearl"><strong>Screen for TB before starting a biologic agent or JAK inhibitor.</strong> TNF inhibitors increase TB reactivation risk 5&ndash;25-fold. IGRA (preferred) or TST + chest radiograph must be done before initiation. LTBI should be treated before the biologic is started whenever timing permits. This is now standard pre-biologic practice.</div>
<div class="pearl"><strong>MDR-TB is a specialist and public health emergency &mdash; not a ward management decision.</strong> If rifampin resistance appears on NAAT, immediately expand susceptibility testing, notify infection control and public health, and involve TB experts. Do not select a new empiric regimen without guidance. Adding one drug to a failing regimen selects for further resistance.</div>
</div>
`},

];

const deck=document.getElementById('deck'),counter=document.getElementById('slide-counter'),
  btnPrev=document.getElementById('btn-prev'),btnNext=document.getElementById('btn-next'),
  bar=document.getElementById('progress-bar');
let cur=0;
SLIDES.forEach((s,i)=>{
  const el=document.createElement('div');
  el.className='slide '+s.cls; el.innerHTML=s.html;
  if(i===0)el.classList.add('active');
  deck.appendChild(el);
});
const slides=deck.querySelectorAll('.slide');
function goTo(n){
  if(n<0||n>=slides.length)return;
  slides[cur].classList.remove('active'); cur=n;
  slides[cur].classList.add('active');
  const b=slides[cur].querySelector('.slide-body'); if(b)b.scrollTop=0;
  counter.textContent=(cur+1)+' / '+slides.length;
  btnPrev.disabled=cur===0; btnNext.disabled=cur===slides.length-1;
  bar.style.width=((cur+1)/slides.length*100)+'%';
}
btnPrev.addEventListener('click',()=>goTo(cur-1));
btnNext.addEventListener('click',()=>goTo(cur+1));
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();goTo(cur+1);}
  if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();goTo(cur-1);}
});
let tx=0;
deck.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
deck.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50)dx<0?goTo(cur+1):goTo(cur-1);
},{passive:true});
goTo(0);
</script>
</body>
