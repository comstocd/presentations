// 2. HAI EPIDEMIOLOGY AND PRECAUTIONS
{html:`
<h2>HAI Epidemiology and Isolation Precautions</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>The "Big Five" HAIs</h3>
    <ul>
      <li><strong>CAUTI</strong> — most common device-related HAI</li>
      <li><strong>CLABSI</strong> — central line–associated bloodstream infection</li>
      <li><strong>VAP</strong> — ventilator-associated pneumonia</li>
      <li><strong>SSI</strong> — surgical site infection</li>
      <li><strong>CDI</strong> — C. difficile infection; most common pathogen-specific HAI in hospitals</li>
    </ul>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">WHO 5 Moments of Hand Hygiene (MKSAP 20)</span>
      1. Before touching a patient<br>
      2. Before clean or aseptic procedures<br>
      3. After body fluid exposure risk<br>
      4. After touching a patient<br>
      5. After touching patient surroundings<br>
      <strong>Hand hygiene is the foundation of infection prevention.</strong>
    </div>
  </div>
  <div>
    <h3>Transmission-Based Precautions</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Type</th><th>Mechanism</th><th>PPE</th><th>Room</th><th>Examples</th></tr></thead>
      <tbody>
        <tr><td><strong>Contact</strong></td><td>Direct/indirect touch</td><td>Gown + gloves</td><td>Private preferred</td><td>MRSA, VRE, C. difficile, ESBL, scabies</td></tr>
        <tr><td><strong>Droplet</strong></td><td>Large droplets (&gt;5 &micro;m)</td><td>Surgical mask within 6 feet</td><td>Private preferred</td><td>Influenza, pertussis, meningococcal disease, mumps</td></tr>
        <tr><td><strong>Airborne</strong></td><td>Small droplet nuclei (&le;5 &micro;m)</td><td>N95 + AIIR</td><td>Negative-pressure room (AIIR) required</td><td>TB, measles, varicella, disseminated zoster</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-red" style="margin-top:8px;">
      <span class="callout-label">Board Pearls — Precautions</span>
      <em>C. difficile</em> spores are NOT killed by alcohol-based hand rubs — <strong>soap and water required</strong>.<br>
      Alcohol-based hand rubs are preferred for all other situations (faster and more effective).<br>
      Measles, varicella, TB: airborne (N95 + negative-pressure room). Influenza: droplet only.
    </div>
  </div>
</div>
</div>
`},

// 3. NEEDLESTICK AND OCCUPATIONAL EXPOSURE
{html:`
<h2>Needlestick Injury and Occupational Exposure</h2>
<div class="slide-body">
<p>After any needlestick or sharp injury, assess the source patient and the exposed health care personnel (HCP) immediately. Time-sensitive decisions determine outcome.</p>
<div class="grid-2">
  <div>
    <h3>Immediate Steps</h3>
    <ol>
      <li>Wash the wound with soap and water (or flush mucous membranes with water)</li>
      <li>Report to occupational health immediately</li>
      <li>Assess the <strong>source patient</strong>: HIV status (rapid test), HBV (HBsAg), HCV (anti-HCV)</li>
      <li>Assess the <strong>exposed HCP</strong>: HIV status, HBV immunity (anti-HBs titer), HCV status</li>
    </ol>
    <div class="callout c-red" style="margin-top:8px;">
      <span class="callout-label">HIV Post-Exposure Prophylaxis (PEP)</span>
      Start <strong>within 72 hours</strong> (ideally within 2 hours) for significant exposures from HIV-positive or unknown-status sources.<br>
      Regimen: tenofovir/emtricitabine + raltegravir (or dolutegravir) &times; 28 days.<br>
      MKSAP 20: baseline HIV testing of exposed HCP; initiate PEP based on source status and HCP immune status.
    </div>
  </div>
  <div>
    <h3>Pathogen-Specific Actions</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Pathogen</th><th>Source Assessment</th><th>HCP Action</th></tr></thead>
      <tbody>
        <tr>
          <td><strong>HIV</strong></td>
          <td>Rapid HIV test; viral load if known positive</td>
          <td>Baseline HIV test; PEP within 72 h (ideally 2 h); 28-day course; follow-up testing at 6 weeks, 3 months</td>
        </tr>
        <tr>
          <td><strong>HBV</strong></td>
          <td>HBsAg</td>
          <td>If HCP unvaccinated or non-immune (&lt;10 mIU/mL anti-HBs): HBIG + HBV vaccine series. If immune: no treatment.</td>
        </tr>
        <tr>
          <td><strong>HCV</strong></td>
          <td>Anti-HCV &plusmn; HCV RNA</td>
          <td>No PEP available. Baseline anti-HCV; HCV RNA at 3–6 weeks (for early detection); anti-HCV at 4–6 months. If HCV RNA positive at follow-up: refer for treatment.</td>
        </tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Transmission Risk</span>
      Percutaneous HBV: 6%–30% (if source HBeAg+). HCV: ~1.8% per needlestick. HIV: ~0.3% per needlestick (0.09% mucous membrane). Risk varies by viral load, hollow-bore needle, depth of injury, and glove use.
    </div>
  </div>
</div>
</div>
`},

// 4. CLABSI PREVENTION AND MANAGEMENT
{html:`
<h2>CLABSI — Prevention Bundle and Management</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Prevention Bundle (SHEA/IDSA 2022)</h3>
    <p style="font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px;">AT INSERTION:</p>
    <ul>
      <li>Hand hygiene</li>
      <li>Maximum sterile barrier precautions (cap, mask, sterile gown + gloves, full-body drape)</li>
      <li>Chlorhexidine (CHG) skin antisepsis (&gt;0.5% CHG in alcohol)</li>
      <li><strong>Subclavian site preferred</strong> in ICU (lowest infection risk); avoid femoral</li>
      <li>Ultrasound guidance for insertion</li>
      <li>Checklist-based approach — empower any team member to stop for sterile technique breaks</li>
    </ul>
    <p style="font-size:14px;font-weight:600;color:var(--muted);margin:8px 0 4px;">AFTER INSERTION:</p>
    <ul>
      <li>CHG-impregnated dressings</li>
      <li>"Scrub the hub" before every line access</li>
      <li>Transparent dressings changed every 7 days; gauze every 2 days</li>
      <li>Daily CHG bathing in ICU patients</li>
      <li><strong>Daily reassessment of need</strong> — remove nonessential catheters promptly</li>
    </ul>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Site Selection Hierarchy</span>
      Subclavian &gt; internal jugular &gt; femoral (infection risk, lowest to highest). However, subclavian carries higher pneumothorax risk — avoid in patients with CKD to preserve vessels for dialysis access.
    </div>
  </div>
  <div>
    <h3>Management of Suspected CLABSI (MKSAP 20)</h3>
    <ul>
      <li>Draw paired blood cultures (one from line, one peripheral) <strong>before antibiotics</strong></li>
      <li><strong>Remove the infected catheter</strong> — guidewire exchange should be avoided</li>
      <li>Empiric: vancomycin (MRSA/CoNS) + gram-negative coverage (cefepime, pip-tazo, or meropenem per local resistance)</li>
    </ul>
    <div class="table-wrap" style="margin-top:8px;">
    <table>
      <thead><tr><th>Pathogen</th><th>Remove Line?</th><th>Duration</th></tr></thead>
      <tbody>
        <tr><td><strong>S. aureus</strong></td><td><strong>Always remove</strong></td><td>&ge;4 weeks IV; obtain echocardiogram to rule out endocarditis</td></tr>
        <tr><td><strong>Candida</strong></td><td>Always remove</td><td>&ge;14 days after last positive culture + clinical improvement</td></tr>
        <tr><td><strong>P. aeruginosa</strong></td><td>Always remove</td><td>14 days (minimum)</td></tr>
        <tr><td><strong>CoNS</strong></td><td>Remove if feasible; antibiotic lock therapy if line essential</td><td>5–7 days systemic</td></tr>
        <tr><td><strong>Non-S. aureus gram-negative or enterococci</strong></td><td>Remove if feasible</td><td>7–14 days per MKSAP 20</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-red" style="margin-top:6px;">
      <span class="callout-label">S. aureus CLABSI — Board Pearl</span>
      Always obtain echocardiogram (TTE first; TEE if TTE non-diagnostic or high clinical suspicion) to exclude endocarditis. Minimum 14 days IV antibiotics for uncomplicated; 4–6 weeks if endocarditis or metastatic infection. Shorter course (14 days) may be considered in select patients without endovascular infection, implantable device, or immunocompromise.
    </div>
    <div class="callout c-blue">
      <span class="callout-label">Contemporary Evidence — O'Grady, NEJM 2023</span>
      CLABSI rates increased by <strong>47%</strong> during the first months of the COVID-19 pandemic, exposing the fragility of provider-dependent prevention strategies. O'Grady advocates building <strong>redundancy</strong> into prevention programs by layering technology-based interventions — antiseptic-impregnated catheters, CHG-impregnated dressings, alcohol-bathed protective caps — that do not depend on individual provider behavior. This increases system resilience against future disruptions when staffing or compliance deteriorates.
    </div>
    <div class="callout c-green">
      <span class="callout-label">Skin Antisepsis — Drugeon et al., JAMA Netw Open 2026</span>
      Network meta-analysis of CHG vs. povidone-iodine (PVI) for CVC skin antisepsis — key results with important nuance:
      <ul style="margin-top:6px;margin-bottom:6px;">
        <li><strong>Alcoholic CHG vs. aqueous PVI:</strong> RR 0.23 (95% CI 0.16–0.33) for CRBSI — large, significant reduction. This is the headline finding.</li>
        <li><strong>Alcoholic CHG vs. alcoholic PVI:</strong> RR 0.70 (95% CI 0.45–1.08) — CI crosses 1; <strong>not statistically significant</strong>. Superiority of CHG is primarily over <em>aqueous</em> PVI.</li>
        <li><strong>Local adverse effects:</strong> Alcoholic CHG vs. aqueous PVI: RR 36.63 (95% CI 11.73–114.36) — significantly more local skin reactions with alcoholic CHG. Tradeoff to consider.</li>
        <li><strong>Mortality:</strong> No significant difference for any comparison (all CIs cross 1).</li>
      </ul>
      <strong>Teaching point:</strong> The alcohol vehicle matters as much as the antiseptic agent. SHEA/IDSA 2022 specifies <em>alcoholic</em> CHG — this analysis explains why, but also highlights that comparing alcoholic CHG to alcoholic PVI narrows the advantage.
    </div>

// 5. CAUTI PREVENTION AND MANAGEMENT
{html:`
<h2>CAUTI — Prevention and Management</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Appropriate Indications for Urinary Catheter (MKSAP 20)</h3>
    <div class="card-green" style="margin-bottom:6px;">
      <div class="card-title">Appropriate</div>
      <ul>
        <li>Acute urinary retention or bladder outlet obstruction</li>
        <li>Accurate I&amp;O monitoring in critically ill patients</li>
        <li>Perioperative use for selected surgical procedures</li>
        <li>Open sacral/perineal wounds in incontinent patients</li>
        <li>Comfort care at end of life (patient preference)</li>
        <li>Prolonged immobilization (unstable spine, pelvic fractures)</li>
      </ul>
    </div>
    <div class="card-red">
      <div class="card-title">NOT Appropriate</div>
      <ul>
        <li>Nursing convenience or routine monitoring</li>
        <li>Urine specimen collection (use straight catheterization instead)</li>
        <li>Management of incontinence alone</li>
      </ul>
    </div>
  </div>
  <div>
    <h3>CAUTI Diagnosis (MKSAP 20)</h3>
    <p style="font-size:15px;">Requires <strong>both</strong>:</p>
    <ul>
      <li>Signs/symptoms compatible with UTI (fever, suprapubic pain, CVA tenderness, altered mental status in elderly)</li>
      <li>Positive urine culture: <strong>&ge;10<sup>3</sup> CFU/mL</strong> from catheterized patient (catheter in place or removed within 48 hours)</li>
      <li>No other identifiable infection source</li>
    </ul>
    <div class="callout c-red" style="margin-top:8px;">
      <span class="callout-label">Board Pearls — Do NOT</span>
      Do NOT screen for or treat <strong>asymptomatic bacteriuria</strong> in catheterized patients (exceptions: pregnant women, patients undergoing urologic procedures with mucosal trauma).<br>
      <strong>Pyuria alone is NOT diagnostic</strong> — nearly universal in catheterized patients.<br>
      Do NOT use antimicrobial-impregnated catheters routinely.<br>
      Do NOT irrigate catheters or change on a fixed schedule.
    </div>
    <div class="callout c-blue" style="margin-top:6px;">
      <span class="callout-label">Candiduria Pearl (MKSAP 20)</span>
      Candiduria in a catheterized patient <strong>frequently represents colonization and rarely requires treatment</strong>. Remove or change the catheter. Treat only if: neutropenic patient, urologic procedure planned, or renal transplant recipient.
    </div>
    <div class="callout c-green" style="margin-top:6px;">
      <span class="callout-label">Most Effective Prevention</span>
      Remove catheter as soon as possible. Nurse-driven removal protocols reduce CAUTI rates significantly. Consider alternatives: condom catheters (men), intermittent straight catheterization.
    </div>
  </div>
</div>
</div>
`},

// 6. VAP PREVENTION AND MANAGEMENT
{html:`
<h2>VAP — Prevention Bundle and Treatment</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>VAP Prevention Bundle (SHEA/IDSA 2022)</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Intervention</th><th>Status</th><th>Key Detail</th></tr></thead>
      <tbody>
        <tr><td>Minimize ventilator duration</td><td>Essential</td><td>Daily spontaneous awakening trials (SAT) + spontaneous breathing trials (SBT)</td></tr>
        <tr><td><strong>Head-of-bed elevation 30&ndash;45&deg;</strong></td><td>Essential (MKSAP 20)</td><td>Supine position increases VAP risk, especially with enteral nutrition</td></tr>
        <tr><td>Avoid unplanned extubation/reintubation</td><td>Essential</td><td>Reintubation is a strong independent risk factor for VAP</td></tr>
        <tr><td>Peptic ulcer prophylaxis</td><td>Essential</td><td>PPI or H2RA in high-risk ventilated patients; balance CDI risk</td></tr>
        <tr><td>DVT prophylaxis</td><td>Essential</td><td>Reduces overall ICU morbidity</td></tr>
        <tr><td>Subglottic secretion drainage</td><td>Additional</td><td>ET tubes with subglottic suction ports; reduces early-onset VAP</td></tr>
        <tr><td><strong>Oral chlorhexidine</strong></td><td><strong>Downgraded (2022)</strong></td><td>Previously essential; now "additional approach" — mortality signal in some meta-analyses in non-cardiac surgery ICU patients</td></tr>
        <tr><td>Early mobilization</td><td>Additional</td><td>Shortens ventilator days and ICU LOS</td></tr>
      </tbody>
    </table>
    </div>
  </div>
  <div>
    <h3>VAP Diagnosis</h3>
    <p style="font-size:15px;">MKSAP 20: New lung infiltrate on imaging <strong>plus</strong> &ge;2 of:</p>
    <ul>
      <li>New-onset fever</li>
      <li>Leukocytosis or leukopenia</li>
      <li>Purulent sputum</li>
      <li>Decline in oxygenation</li>
    </ul>
    <p style="font-size:15px;margin-top:6px;">Obtain lower respiratory cultures (endotracheal aspirate or BAL) <strong>before antibiotics</strong>.</p>
    <h3 style="margin-top:10px;">Empiric Treatment (IDSA/ATS 2016)</h3>
    <div class="card-yellow" style="margin-bottom:6px;">
      <div class="card-title">Low MDR Risk</div>
      Monotherapy: piperacillin-tazobactam, cefepime, levofloxacin, or meropenem
    </div>
    <div class="card-red">
      <div class="card-title">High MDR Risk (prior IV abx within 90 d; &gt;90 d hospitalization; septic shock; ARDS; local resistance &gt;10–20%)</div>
      Dual gram-negative coverage + MRSA coverage (vancomycin or linezolid)
    </div>
    <div class="callout c-green" style="margin-top:8px;">
      <span class="callout-label">Duration and De-escalation</span>
      7 days for most patients (shorter course non-inferior per IDSA/ATS 2016). De-escalate at 48–72 hours based on cultures. Procalcitonin can guide discontinuation but should NOT be used to diagnose VAP.
    </div>
    <div class="callout c-yellow">
      <span class="callout-label">MRSA Nasal Swab — MKSAP 20 Key Point</span>
      Include MRSA coverage when MRSA risk factors are present or institutional MRSA prevalence exceeds 10% (or is unknown). <strong>A negative MRSA nasal swab can be used to withhold or discontinue MRSA coverage</strong> — high negative predictive value for MRSA VAP/HAP. This is an important antimicrobial stewardship de-escalation tool explicitly endorsed in MKSAP 20 key points.
    </div>
  </div>
</div>
</div>
`},

// 7. SSI PREVENTION
{html:`
<h2>Surgical Site Infections — Prevention</h2>
<div class="slide-body">
<p>Most SSIs occur within <strong>30 days after surgery</strong>, or within <strong>90 days for procedures with implants</strong> (MKSAP 20).</p>
<div class="grid-3">
  <div class="card-blue">
    <div class="card-title">Preoperative</div>
    <ul>
      <li>S. aureus nasal screening + mupirocin decolonization &plusmn; CHG bathing for high-risk procedures (cardiac, orthopedic with hardware)</li>
      <li>Hair removal with <strong>clippers</strong>, not razors</li>
      <li>Glucose control (target &lt;200 mg/dL perioperatively)</li>
      <li>Tobacco cessation (&ge;30 days before surgery)</li>
      <li>Weight optimization; reduce immunosuppression if possible</li>
    </ul>
  </div>
  <div class="card-yellow">
    <div class="card-title">Intraoperative</div>
    <ul>
      <li>Antibiotic prophylaxis <strong>within 60 minutes of incision</strong> (120 minutes for vancomycin/fluoroquinolones due to infusion time)</li>
      <li>Cefazolin first-line for most clean procedures</li>
      <li>Add vancomycin only if MRSA-colonized or high institutional MRSA rates</li>
      <li>Maintain normothermia</li>
      <li>Antimicrobial sutures for high-risk wound closures</li>
    </ul>
  </div>
  <div class="card-green">
    <div class="card-title">Postoperative</div>
    <ul>
      <li>Discontinue prophylactic antibiotics within <strong>24 hours</strong> (48 hours for cardiac surgery)</li>
      <li>Continuing prophylaxis beyond 24 hours does NOT reduce SSI and increases CDI risk</li>
      <li>Glucose control continues</li>
      <li>Early mobilization</li>
    </ul>
  </div>
</div>
<div class="callout c-yellow" style="margin-top:10px;">
  <span class="callout-label">SSI Culture Guidance (MKSAP 20)</span>
  Deep-tissue or operative cultures are preferred over superficial wound swabs — superficial swabs likely reflect skin/wound colonization rather than the causative pathogen. SSI treatment requires debridement of necrotic tissue, drainage of abscesses, and antimicrobial therapy for deep infections. Superficial incisional SSIs can usually be managed with oral antibiotics without tissue debridement.
</div>
<div class="callout c-red" style="margin-top:6px;">
  <span class="callout-label">SSI Risk Factors (MKSAP 20)</span>
  Modifiable: hyperglycemia, obesity, smoking, immunosuppression — optimizing these before surgery reduces SSI risk. Non-modifiable: contaminated/dirty wounds, prolonged operative time.
</div>
</div>

// 9. CDI — CROSS-CUTTING HAI
{html:`
<h2>C. difficile Infection — The Cross-Cutting HAI</h2>
<div class="slide-body">
<p>CDI is the most common pathogen-specific hospital-acquired infection. It intersects with every other HAI prevention strategy through antibiotic use.</p>
<div class="grid-2">
  <div>
    <h3>Risk Factors (Board Hierarchy)</h3>
    <ol>
      <li><strong>Antibiotic exposure</strong> — most important modifiable risk factor<br>
        Highest risk: fluoroquinolones, clindamycin, 3rd/4th-gen cephalosporins, carbapenems</li>
      <li>Hospitalization and healthcare exposure</li>
      <li>Age &ge;65 years</li>
      <li>PPI use (association reported; causality debated)</li>
      <li>Immunosuppression, IBD, chemotherapy</li>
    </ol>
    <div class="callout c-red" style="margin-top:8px;">
      <span class="callout-label">Diagnostic Stewardship Rules</span>
      Test ONLY unformed stool from patients with &ge;3 unexplained loose stools in 24 hours (not on laxatives).<br>
      The "3-day rule": do NOT send routine stool pathogen testing (other than C. difficile) for patients hospitalized &gt;3 days — community-acquired pathogens are unlikely.<br>
      Never test as "test of cure."
    </div>
  </div>
  <div>
    <h3>CDI Prevention (SHEA/IDSA 2022)</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Intervention</th><th>Key Detail</th></tr></thead>
      <tbody>
        <tr><td><strong>Antibiotic stewardship</strong></td><td>Most effective intervention; reduces CDI by approximately 50%–77% per SHEA/IDSA 2022. More effective than any isolation or cleaning strategy alone.</td></tr>
        <tr><td>Contact precautions</td><td>Gown + gloves for known/suspected CDI</td></tr>
        <tr><td>Soap and water hand hygiene</td><td>Alcohol does NOT kill C. difficile spores</td></tr>
        <tr><td>Sporicidal environmental cleaning</td><td>Bleach-based or EPA-registered sporicidal agents; UV disinfection has emerging evidence</td></tr>
        <tr><td>Diagnostic stewardship</td><td>Reduces inappropriate testing and treatment of colonization vs. true infection</td></tr>
        <tr><td>Private room/cohorting</td><td>For infected patients</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-green" style="margin-top:8px;">
      <span class="callout-label">Antibiotic Stewardship Impact</span>
      The single most effective CDI prevention strategy. Reducing high-risk antibiotic use (particularly fluoroquinolones and cephalosporins) has a direct, measurable impact on CDI incidence at the institutional level.
    </div>
  </div>
</div>
</div>
`},

// 10. MDROs
{html:`
<h2>Multidrug-Resistant Organisms — Prevention and Treatment</h2>
<div class="slide-body">
<p>MDROs are most prevalent in health care settings, with highest incidence in long-term acute care hospitals (MKSAP 20).</p>
<div class="table-wrap">
<table>
  <thead><tr><th>Organism</th><th>Key Features</th><th>Prevention</th><th>Treatment Options</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>MRSA</strong></td>
      <td>Most common MDRO in US hospitals; skin/wound infections, bacteremia, pneumonia, endocarditis</td>
      <td>Universal CHG bathing + nasal mupirocin in ICU (REDUCE MRSA Trial); contact precautions; preoperative decolonization for high-risk procedures</td>
      <td>Vancomycin (first-line for most); daptomycin (bacteremia, right-sided endocarditis); linezolid (pneumonia, soft tissue); ceftaroline</td>
    </tr>
    <tr>
      <td><strong>VRE</strong></td>
      <td>Primarily E. faecium; common in ICU, oncology, transplant settings; no reliable decolonization strategy</td>
      <td>Contact precautions; CHG bathing; antibiotic stewardship (reduce vancomycin use)</td>
      <td>Linezolid; daptomycin; tigecycline (site-dependent)</td>
    </tr>
    <tr>
      <td><strong>ESBL-producing Enterobacteriaceae</strong></td>
      <td>Extended-spectrum &beta;-lactamases; typically E. coli, Klebsiella; resistant to most cephalosporins and penicillins</td>
      <td>Contact precautions; hand hygiene; antibiotic stewardship; limits on 3rd-gen cephalosporins</td>
      <td>Carbapenems (first-line for serious infections); ceftolozane-tazobactam NOT reliable for ESBL; newer agents under study</td>
    </tr>
    <tr>
      <td><strong>CRE</strong></td>
      <td>Carbapenem-resistant Enterobacteriaceae; limited treatment options; resistance mechanism determines therapy</td>
      <td>Contact precautions; enhanced environmental cleaning; active surveillance in outbreaks; antibiotic stewardship</td>
      <td>
        KPC-producing: ceftazidime-avibactam (first-line)<br>
        MBL-producing (NDM, VIM, IMP): <strong>NOT responsive to ceftazidime-avibactam</strong>; use cefiderocol or aztreonam-avibactam<br>
        OXA-48: ceftazidime-avibactam may work
      </td>
    </tr>
    <tr>
      <td><strong>Candida auris</strong></td>
      <td>Emerging multidrug-resistant yeast; often misidentified by standard methods (MALDI-TOF required)</td>
      <td>Contact precautions; enhanced environmental cleaning (resistant to many disinfectants)</td>
      <td>Echinocandins (anidulafungin, micafungin, caspofungin) are first-line; amphotericin B for resistant strains</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-red">
  <span class="callout-label">CRE Treatment — Resistance Mechanism Matters</span>
  KPC (Klebsiella pneumoniae carbapenemase) &rarr; ceftazidime-avibactam. MBL producers (NDM, VIM, IMP) &rarr; NOT responsive to ceftazidime-avibactam; use cefiderocol or aztreonam-avibactam combinations. MKSAP 20: MDROs highest in long-term acute care hospitals; control requires hand hygiene, contact precautions, environmental cleaning, and antimicrobial stewardship.
</div>
</div>
`},

// 11. ANTIMICROBIAL STEWARDSHIP
{html:`
<h2>Antimicrobial Stewardship — Core Elements and Interventions</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>CDC Core Elements of Hospital Stewardship</h3>
    <ol>
      <li><strong>Leadership commitment</strong> — administrative and financial support</li>
      <li><strong>Accountability</strong> — physician leader (ideally ID-trained)</li>
      <li><strong>Drug expertise</strong> — ID-trained clinical pharmacist as co-leader</li>
      <li><strong>Action</strong> — implement at least one proactive intervention:<br>
        &bull; <em>Prospective audit and feedback</em> (preferred) — real-time review and recommendations<br>
        &bull; <em>Formulary restriction and preauthorization</em> — requires approval for restricted antibiotics</li>
      <li><strong>Tracking</strong> — monitor antibiotic use (days of therapy/1,000 patient-days) and resistance patterns</li>
      <li><strong>Reporting</strong> — regular feedback to prescribers</li>
      <li><strong>Education</strong> — ongoing prescriber education</li>
    </ol>
  </div>
  <div>
    <h3>Key Stewardship Interventions</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Intervention</th><th>Key Detail</th></tr></thead>
      <tbody>
        <tr><td><strong>Antibiotic time-out at 48–72 h</strong></td><td>Reassess empiric therapy based on culture results; narrow or discontinue</td></tr>
        <tr><td><strong>IV-to-oral conversion</strong></td><td>Switch to oral when clinically appropriate (reduces line days, cost, LOS)</td></tr>
        <tr><td><strong>De-escalation</strong></td><td>Narrow spectrum based on culture and susceptibility data</td></tr>
        <tr><td><strong>Duration optimization</strong></td><td>Shorter courses non-inferior for many infections: pneumonia 5–7 d; UTI 3–5 d; intra-abdominal (with source control) 4 d</td></tr>
        <tr><td><strong>Diagnostic stewardship</strong></td><td>Avoid inappropriate cultures (formed stool, urine in asymptomatic catheterized patients, blood cultures without clinical indication)</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-green" style="margin-top:8px;">
      <span class="callout-label">Stewardship Impact</span>
      Antimicrobial stewardship programs reduce CDI rates by approximately 50%–77%, decrease antibiotic resistance, improve clinical outcomes, and save approximately $200,000–$900,000 annually per institution per published estimates — verify current figures with primary literature.
    </div>
    <div class="callout c-yellow" style="margin-top:6px;">
      <span class="callout-label">Local Antibiograms</span>
      Empiric therapy should be guided by local institutional resistance patterns, not national averages. Know your hospital's antibiogram.
    </div>
  </div>
</div>
</div>
`},

let cur = 0;
function render() {
  document.getElementById('deck').innerHTML = '';
  SLIDES.forEach((s,i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i===cur?' active':'');
    div.innerHTML = s.html;
    document.getElementById('deck').appendChild(div);
  });
  document.getElementById('slide-counter').textContent = (cur+1)+' / '+SLIDES.length;
  document.getElementById('btn-prev').disabled = cur===0;
  document.getElementById('btn-next').disabled = cur===SLIDES.length-1;
  document.getElementById('progress-bar').style.width = ((cur+1)/SLIDES.length*100)+'%';
}
document.getElementById('btn-prev').addEventListener('click',()=>{if(cur>0){cur--;render();}});
document.getElementById('btn-next').addEventListener('click',()=>{if(cur<SLIDES.length-1){cur++;render();}});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){if(cur<SLIDES.length-1){cur++;render();}}
  else if(e.key==='ArrowLeft'){if(cur>0){cur--;render();}}
});
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>40){if(dx<0&&cur<SLIDES.length-1){cur++;render();}else if(dx>0&&cur>0){cur--;render();}}
});
render();
</script>
</body>
