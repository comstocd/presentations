<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Topic 41 — Tick-Borne Illnesses | Morning Report</title>
<style>
  :root{
    --bg:#ffffff;--bg2:#f6f8fa;--bg3:#eaeef2;--border:#d0d7de;--text:#1f2328;--muted:#656d76;
    --blue:#0969da;--blue-bg:#ddf4ff;--blue-border:#54aeff;
    --green:#1a7f37;--green-bg:#dafbe1;--green-border:#4ac26b;
    --yellow:#9a6700;--yellow-bg:#fff8c5;--yellow-border:#d4a72c;
    --red:#cf222e;--red-bg:#ffebe9;--red-border:#ff8182;
    --purple:#8250df;--purple-bg:#fbefff;--purple-border:#c297ff;
    --orange:#bc4c00;--orange-bg:#fff1e5;--orange-border:#fb8f44;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:18px;line-height:1.5;}
  #deck{width:100%;height:100%;position:relative;overflow:hidden;}
  .slide{position:absolute;top:0;left:0;width:100%;height:100%;
    display:flex;flex-direction:column;padding:34px 52px 54px;
    opacity:0;pointer-events:none;transition:opacity .2s;overflow:hidden;}
  .slide.active{opacity:1;pointer-events:all;}
  .slide-content{background:var(--bg);}
  .slide-accent{background:var(--bg2);}
  .slide-title{background:var(--bg);justify-content:center;}
  .slide-body{flex:1;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;padding-right:4px;}
  .slide-body::-webkit-scrollbar{width:3px;}
  .slide-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  .slide-label{font-size:13px;font-weight:600;text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted);margin-bottom:10px;}
  .slide h1{font-size:38px;font-weight:700;line-height:1.1;margin-bottom:14px;}
  .slide h2{font-size:26px;font-weight:700;padding-bottom:9px;
    border-bottom:2px solid var(--border);margin-bottom:14px;}
  .slide h3{font-size:19px;font-weight:600;margin:12px 0 6px;}
  .slide p{font-size:16px;margin-bottom:8px;}
  .slide ul,.slide ol{padding-left:20px;margin-bottom:8px;}
  .slide li{font-size:17px;margin-bottom:5px;line-height:1.4;}
  .slide strong{font-weight:600;}
  .tagline{font-size:19px;color:var(--muted);max-width:620px;line-height:1.5;margin-bottom:20px;}
  .badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .badge{font-size:13px;font-weight:600;padding:3px 11px;border-radius:99px;border:1px solid;}
  .badge-blue  {background:var(--blue-bg);  color:var(--blue);  border-color:var(--blue-border);}
  .badge-green {background:var(--green-bg); color:var(--green); border-color:var(--green-border);}
  .badge-red   {background:var(--red-bg);   color:var(--red);   border-color:var(--red-border);}
  .badge-yellow{background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow-border);}
  .badge-purple{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-border);}
  .badge-orange{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-border);}
  .callout{border-radius:8px;padding:11px 15px;margin:9px 0;border-left:4px solid;font-size:15px;line-height:1.5;}
  .callout-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:3px;}
  .c-blue  {background:var(--blue-bg);  border-color:var(--blue);  color:#0550ae;} .c-blue   .callout-label{color:var(--blue);}
  .c-yellow{background:var(--yellow-bg);border-color:var(--yellow-border);color:var(--yellow);} .c-yellow .callout-label{color:var(--yellow);}
  .c-red   {background:var(--red-bg);   border-color:var(--red);   color:#82071e;} .c-red    .callout-label{color:var(--red);}
  .c-green {background:var(--green-bg); border-color:var(--green); color:#116329;} .c-green  .callout-label{color:var(--green);}
  .c-orange{background:var(--orange-bg);border-color:var(--orange-border);color:var(--orange);} .c-orange .callout-label{color:var(--orange);}
  .c-purple{background:var(--purple-bg);border-color:var(--purple);color:#5a32a3;} .c-purple .callout-label{color:var(--purple);}
  .table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border);margin:9px 0;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{background:var(--bg3);color:var(--muted);font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);}
  td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top;font-size:15px;}
  tr:last-child td{border-bottom:none;}
  tr:nth-child(even) td{background:var(--bg2);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:9px 0;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:9px 0;}
  .card      {background:var(--bg);        border:1px solid var(--border);       border-radius:10px;padding:13px 15px;}
  .card-red  {background:var(--red-bg);    border:1px solid var(--red-border);   border-radius:10px;padding:13px 15px;}
  .card-green{background:var(--green-bg);  border:1px solid var(--green-border); border-radius:10px;padding:13px 15px;}
  .card-blue {background:var(--blue-bg);   border:1px solid var(--blue-border);  border-radius:10px;padding:13px 15px;}
  .card-yellow{background:var(--yellow-bg);border:1px solid var(--yellow-border);border-radius:10px;padding:13px 15px;}
  .card-orange{background:var(--orange-bg);border:1px solid var(--orange-border);border-radius:10px;padding:13px 15px;}
  .card-purple{background:var(--purple-bg);border:1px solid var(--purple-border);border-radius:10px;padding:13px 15px;}
  .card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;}
  .tl{list-style:none;padding:0;position:relative;}
  .tl::before{content:'';position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--border);}
  .tl li{padding:0 0 12px 34px;position:relative;}
  .tl li::before{content:'';position:absolute;left:7px;top:5px;width:12px;height:12px;
    border-radius:50%;background:var(--bg);border:2px solid var(--blue);}
  .tl-label{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}
  .pearl{background:var(--bg2);border:1px solid var(--border);border-radius:10px;
    padding:12px 15px;margin:8px 0;font-size:16px;line-height:1.5;}
  .ch{display:flex;flex-direction:column;justify-content:center;height:100%;}
  .ch-num{font-size:72px;font-weight:800;color:var(--bg3);line-height:1;margin-bottom:8px;}
  .ch-title{font-size:30px;font-weight:700;margin-bottom:8px;}
  .ch-sub{font-size:18px;color:var(--muted);max-width:540px;line-height:1.4;}
  .img-cap{font-size:11px;color:var(--muted);text-align:center;margin-top:3px;font-weight:600;}
  .refs{font-size:13px;color:var(--muted);line-height:1.7;}
  .refs li{margin-bottom:7px;}
  #nav{position:fixed;bottom:0;left:0;right:0;height:44px;background:var(--bg);
    border-top:1px solid var(--border);display:flex;align-items:center;
    justify-content:space-between;padding:0 16px;z-index:200;user-select:none;}
  .nav-btn{background:none;border:1px solid var(--border);border-radius:6px;
    padding:5px 14px;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;}
  .nav-btn:hover{background:var(--bg2);}
  .nav-btn:disabled{opacity:.3;cursor:default;}
  #slide-counter{font-size:14px;color:var(--muted);font-weight:500;}
  #progress-bar{position:fixed;top:0;left:0;height:3px;background:var(--blue);transition:width .2s;z-index:300;}
  @media(max-width:720px){
    .slide{padding:18px 14px 54px;}
    .slide h1{font-size:26px;} .slide h2{font-size:20px;}
    .grid-2,.grid-3{grid-template-columns:1fr;}
  }
</style>
</head>

<div class="slide-label">Topic 41 &middot; Infectious Disease / Hospital Medicine</div>
<h1>Tick-Borne Illnesses</h1>
<p class="tagline">Five diseases. One treatment for four of them. The exception that causes hemolysis. When to start doxycycline before the test comes back. And the rash you cannot afford to wait for.</p>
<div class="badge-row">
  <span class="badge badge-green">Lyme Disease</span>
  <span class="badge badge-red">RMSF</span>
  <span class="badge badge-yellow">Ehrlichiosis / Anaplasmosis</span>
  <span class="badge badge-purple">Babesiosis</span>
  <span class="badge badge-blue">MKSAP 20 &middot; IDSA 2020</span>
</div>
<div style="margin-top:26px;font-size:14px;color:var(--muted);">Morning Report &middot; Internal Medicine &middot; David Comstock, MD</div>

// 2. CASE
{cls:'slide-content',html:`
<h2>Case Presentation</h2>
<div class="slide-body">
<ul class="tl">
  <li><div class="tl-label">History</div>58M, previously healthy. Presents mid-July with 5 days of fever to 39.8, severe frontal headache, diffuse myalgias, and anorexia. Spent two weekends hiking in the Catskills (New York). Denies known tick bite. No rash noted at home.</li>
  <li><div class="tl-label">Exam</div>T 39.6 &middot; HR 104 &middot; BP 106/68 &middot; RR 18. Flushed, diaphoretic. No rash. Mild hepatomegaly. No meningismus.</li>
  <li><div class="tl-label">Labs</div>WBC 2,800 (leukopenia) &middot; Plt 74K &middot; AST 88 / ALT 64 &middot; Na 129 &middot; Cr 1.4</li>
  <li><div class="tl-label">Smear</div>Peripheral blood smear ordered. Morulae visible in monocytes.</li>
</ul>
<div class="callout c-red">
  <span class="callout-label">Teaching Frame</span>
  Summer fever + leukopenia + thrombocytopenia + elevated transaminases + outdoor exposure in a Lyme-endemic area. Do not wait for serology. This pattern = doxycycline now. Morulae in monocytes confirm ehrlichiosis, but treatment must precede the result.
</div>
<div class="callout c-blue">
  <span class="callout-label">The Framework</span>
  Apply four questions: What tick? What geography? Is there a rash? Is there hemolysis? Answers define the disease and determine whether doxycycline alone is enough.
</div>
</div>
`},

// 4. BEDSIDE FRAMEWORK
{cls:'slide-content',html:`
<h2>Bedside Diagnostic Framework</h2>
<div class="slide-body">
<div class="callout c-blue">
  <span class="callout-label">Four Questions That Define the Disease</span>
  What tick? &rarr; What geography/season? &rarr; Is there a rash (what kind)? &rarr; Is there hemolysis?
</div>
<div class="grid-2" style="margin-top:8px;">
  <div>
    <div class="card-green" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--green);">Expanding erythema migrans rash</div>
      Lyme disease. Clinical diagnosis &mdash; no lab confirmation needed. Treat with doxycycline.
    </div>
    <div class="card-yellow" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--yellow);">Fever + leukopenia + thrombocytopenia + transaminitis</div>
      Ehrlichiosis or anaplasmosis until proven otherwise. Send PCR + blood smear. Start doxycycline now.
    </div>
    <div class="card-red" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--red);">Toxic fever + severe headache + evolving rash</div>
      RMSF. Start doxycycline immediately &mdash; do not wait for rash or serology. Delay kills.
    </div>
    <div class="card-purple">
      <div class="card-title" style="color:var(--purple);">Fever + hemolytic anemia</div>
      Babesiosis. Send smear + PCR. Treat with atovaquone + azithromycin. Doxycycline is NOT adequate.
    </div>
  </div>
  <div>
    <h3>Initial Workup &mdash; Syndrome-Directed</h3>
    <ul>
      <li>CBC with differential (leukopenia, thrombocytopenia, eosinopenia)</li>
      <li>CMP including AST/ALT and bilirubin</li>
      <li>Peripheral blood smear: morulae (ehrlichia/anaplasma) or intraerythrocytic parasites (babesia)</li>
      <li>Hemolysis labs if hemolysis suspected: LDH, haptoglobin, reticulocyte count, direct Coombs</li>
      <li>PCR/NAAT on whole blood: preferred for ehrlichiosis, anaplasmosis, babesiosis in acute illness</li>
      <li>Lyme two-tier serology: only when disseminated disease is a concern &mdash; not for EM rash, not for asymptomatic tick bites</li>
    </ul>
    <div class="callout c-red" style="margin-top:8px;">
      <span class="callout-label">Common Workup Pitfalls</span>
      Ordering Lyme serology for a classic EM rash &middot; Testing asymptomatic patients after a tick bite &middot; Waiting for serology before starting doxycycline in suspected RMSF/ehrlichiosis &middot; Sending Lyme serology for nonspecific symptoms without exposure context
    </div>
  </div>
</div>
</div>
`},

// 6. LYME — STAGES + EM IMAGES
{cls:'slide-content',html:`
<h2>Lyme Disease by Stage</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <div class="table-wrap" style="margin-top:0;">
    <table>
      <thead><tr><th>Stage</th><th>Timing</th><th>Key Features</th></tr></thead>
      <tbody>
        <tr>
          <td><strong>Early localized</strong></td>
          <td>&le;4 wk</td>
          <td>Erythema migrans at bite site &middot; variably: fever, lymphadenopathy, myalgia</td>
        </tr>
        <tr>
          <td><strong>Early disseminated</strong></td>
          <td>2 wk &ndash; 6 mo</td>
          <td>Multiple EM lesions &middot; Lyme carditis (AV block) &middot; neurologic: facial palsy, meningitis, radiculopathy</td>
        </tr>
        <tr>
          <td><strong>Late disseminated</strong></td>
          <td>&ge;6 mo</td>
          <td>Monoarticular/oligoarticular arthritis (large joints &mdash; knee) &middot; peripheral neuropathy</td>
        </tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-green" style="margin-top:8px;">
      <span class="callout-label">EM Rash &mdash; Clinical Diagnosis</span>
      Classic EM + compatible history = treat. No lab confirmation needed or recommended. Serology is insensitive in early localized disease (seroconversion takes weeks). Testing early gives false negatives and delays treatment.
    </div>
    <ul style="margin-top:6px;">
      <li>Rash: painless, nonpruritic, circumferentially enlarging</li>
      <li>70&ndash;80% of infected patients develop EM</li>
      <li>Central clearing: classic but not universal</li>
      <li>Atypical: confluent erythroderma, vesiculation, ulceration</li>
      <li>Distinguishing from tick-bite hypersensitivity: hypersensitivity is pruritic, appears immediately, does not enlarge</li>
    </ul>

      <span class="callout-label">Lyme Carditis &mdash; Hospitalization Threshold</span>
      Hospitalize if: symptomatic cardiac involvement <strong>OR</strong> first-degree AV block with PR interval &ge;300 ms (or higher-degree block). Start IV ceftriaxone &rarr; transition to oral for total 14&ndash;21 days. Heart block is reversible &mdash; permanent pacemaker not needed.
    </div>

      <span class="callout-label">Neurologic Lyme</span>
      Facial palsy (unilateral or bilateral) &middot; aseptic meningitis &middot; radiculopathy. Facial palsy alone: oral doxycycline 14&ndash;21 days. Meningitis/radiculoneuropathy: IV ceftriaxone or oral doxycycline &times;14&ndash;21 days (IV preferred for CNS parenchymal involvement).

// 7. LYME DIAGNOSIS + TREATMENT + PROPHYLAXIS
{cls:'slide-accent',html:`
<h2>Lyme: Diagnosis, Treatment &amp; Prophylaxis</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Two-Tier Serologic Testing</h3>
    <ul>
      <li>Step 1: EIA/ELISA &mdash; highly sensitive, lacks specificity</li>
      <li>Step 2: if positive or equivocal &rarr; confirm with second sequential EIA (FDA-approved) or Western blot</li>
      <li>IgM and IgG both tested if &le;30 days of symptoms; IgG only after 30 days (isolated IgM after 30 days = likely false positive)</li>
      <li>Antibodies remain positive for years after treatment &mdash; serial titers are not useful for monitoring</li>
    </ul>
    <div class="callout c-red" style="margin-top:6px;">
      <span class="callout-label">Do Not Serology-Test These Patients</span>
      Classic EM rash with compatible history &middot; Asymptomatic patients after tick bite &middot; Nonspecific symptoms without geographic/exposure context (high false-positive rate in low-prevalence populations)
    </div>
    <h3 style="margin-top:12px;">Prophylaxis Criteria &mdash; All Must Be True</h3>
    <div class="card-blue">
      <ul style="font-size:15px;">
        <li>Tick reliably identified as <em>Ixodes</em> species</li>
        <li>Attachment &ge;36 hours</li>
        <li>Endemic area with B. burgdorferi prevalence &gt;20% in ticks</li>
        <li>Doxycycline can be started within 72h of tick removal</li>
        <li>No contraindication to doxycycline</li>
      </ul>
      <p style="font-size:13px;color:var(--muted);margin-top:6px;">Regimen: single dose doxycycline 200 mg PO. If any criterion not met: observe; treat if symptoms develop.</p>
    </div>
    <div class="callout c-yellow" style="margin-top:6px;">
      <span class="callout-label">Prophylaxis Does Not Prevent Coinfections</span>
      Single-dose doxycycline does not prevent babesiosis or Powassan virus encephalitis transmitted by the same tick.
    </div>
  </div>
  <div>
    <h3>Treatment by Stage</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Stage / Manifestation</th><th>Regimen</th><th>Duration</th></tr></thead>
      <tbody>
        <tr><td>Early localized (EM)</td><td>Doxycycline 100 mg BID (first-line) or amoxicillin 500 mg TID or cefuroxime axetil 500 mg BID</td><td>10d (doxy) / 14d (others)</td></tr>
        <tr><td>Facial palsy; other non-cardiac, non-meningeal</td><td>Same as early localized</td><td>14&ndash;21d</td></tr>
        <tr><td>Carditis &mdash; outpatient (PR &lt;300 ms)</td><td>Oral, same as early localized</td><td>14&ndash;21d</td></tr>
        <tr><td>Carditis &mdash; hospitalized (PR &ge;300 ms or higher-degree block)</td><td>IV ceftriaxone &rarr; transition to oral</td><td>14&ndash;21d total</td></tr>
        <tr><td>Meningitis / radiculoneuropathy</td><td>IV ceftriaxone or oral doxycycline</td><td>14&ndash;21d</td></tr>
        <tr><td>Lyme arthritis (initial)</td><td>Same as early localized</td><td>28d</td></tr>
        <tr><td>Lyme arthritis (refractory)</td><td>IV ceftriaxone</td><td>2&ndash;4 wk</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-red" style="margin-top:8px;">
      <span class="callout-label">Post-Lyme Disease Syndrome</span>
      Fatigue, arthralgia, myalgia, cognitive impairment persisting after appropriate treatment. Not chronic infection &mdash; no microbiologic evidence of persistence. Clinical trials show <strong>no benefit from prolonged antibiotics</strong>. Evaluate for coinfection or noninfectious cause.
    </div>
  </div>
</div>
</div>
`},

  <div class="ch-title">Rocky Mountain Spotted Fever</div>
  <div class="ch-sub">The one not to miss. Early serology is negative. Rash may be absent. Delay kills. Start doxycycline on clinical suspicion.</div>
  <div class="badge-row" style="margin-top:16px;">
    <span class="badge badge-red">Empiric Doxycycline Now</span>
    <span class="badge badge-orange">Wrists to Trunk</span>
    <span class="badge badge-yellow">Palms and Soles</span>
  </div>
</div>

// 9. RMSF
{cls:'slide-content',html:`
<h2>Rocky Mountain Spotted Fever</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Clinical Presentation</h3>
    <ul>
      <li>Incubation 3&ndash;12 days after tick bite</li>
      <li>Nonspecific onset: fever, severe headache, chills, myalgia, abdominal pain</li>
      <li>GI symptoms can mimic an acute abdomen</li>
      <li>Rash typically delayed 3&ndash;5 days after fever &mdash; <strong>may be absent at initial presentation</strong></li>
    </ul>
    <h3 style="margin-top:10px;">The Rash</h3>
    <ul>
      <li>Begins as maculopapular eruption at wrists and ankles</li>
      <li>Spreads centripetally toward trunk</li>
      <li>Progresses to petechiae and purpura</li>
      <li>Involves palms and soles in up to 50%</li>
      <li>Face generally spared</li>
    </ul>
    <div class="callout c-red" style="margin-top:8px;">
      <span class="callout-label">Purpura Fulminans</span>
      Can occur with late/severe RMSF. Causes necrosis, loss of digits or limbs. Up to 30% develop meningoencephalitis. DIC and multiorgan failure in severe cases.
    </div>
    <h3 style="margin-top:10px;">Diagnosis</h3>
    <ul>
      <li>Serology: <strong>insensitive during acute illness</strong>. Paired convalescent sera (4-fold rise) confirms diagnosis retrospectively.</li>
      <li>Skin biopsy with immunohistochemical analysis: may be diagnostic acutely</li>
      <li>Lab clues: thrombocytopenia, elevated transaminases, <strong>hyponatremia</strong></li>
    </ul>
  </div>

    <div class="callout c-red">
      <span class="callout-label">Treatment Is a Clinical Decision &mdash; Not a Lab Decision</span>
      Doxycycline must be started on clinical suspicion. Do not wait for serology (insensitive acutely), rash appearance, or confirmatory testing. Delay in therapy is associated with increased morbidity and mortality. Fatality rate 5&ndash;10%.
    </div>
    <div class="card-red" style="margin-top:6px;">
      <div class="card-title" style="color:var(--red);">Treatment</div>
      Doxycycline 100 mg BID &times; minimum 5&ndash;7 days <strong>AND</strong> at least 3 days after defervescence (both criteria apply; whichever is longer). Doxycycline is first-line in all ages including children and pregnant patients with suspected severe rickettsial disease &mdash; risk of delay outweighs tetracycline risks in this context.
    </div>

// 11. EHRLICHIOSIS / ANAPLASMOSIS
{cls:'slide-accent',html:`
<h2>Ehrlichiosis &amp; Anaplasmosis</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Comparison</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Feature</th><th>Ehrlichiosis</th><th>Anaplasmosis</th></tr></thead>
      <tbody>
        <tr><td>Pathogen</td><td><em>E. chaffeensis</em></td><td><em>A. phagocytophilum</em></td></tr>
        <tr><td>Vector</td><td>Lone Star tick</td><td>Blacklegged deer tick (Ixodes)</td></tr>
        <tr><td>Geography</td><td>SE, South-central, Mid-Atlantic</td><td>NE, Upper Midwest (Lyme endemic)</td></tr>
        <tr><td>Morulae</td><td>In <strong>monocytes</strong> (&lt;30% sensitivity)</td><td>In <strong>neutrophils</strong> (~50% sensitivity)</td></tr>
        <tr><td>Rash</td><td>&lt;30% of adults</td><td>Rare (&lt;10%)</td></tr>
        <tr><td>Coinfection</td><td>STARI, Heartland virus</td><td>Lyme, babesiosis, Powassan</td></tr>
        <tr><td>Mortality</td><td>3%</td><td>&lt;1%</td></tr>
        <tr><td>Treatment</td><td colspan="2">Doxycycline (both)</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Lab Pattern</span>
      Leukopenia &middot; Thrombocytopenia &middot; Elevated AST/ALT. This triad in a summer febrile patient with outdoor exposure = send PCR and start doxycycline. (Hyponatremia is a feature of RMSF, not ehrlichiosis/anaplasmosis.)
    </div>
    <h3 style="margin-top:10px;">Treatment</h3>
    <ul>
      <li>Doxycycline 100 mg BID &times; 5&ndash;10 days (first-line for both)</li>
      <li>Start empirically &mdash; delay increases mortality</li>
      <li>Early serology is often negative; convalescent titers 2&ndash;4 weeks later confirm diagnosis</li>
      <li>PCR of whole blood at time of acute illness: highly sensitive, especially before therapy</li>
    </ul>
  </div>

// 13. BABESIOSIS
{cls:'slide-content',html:`
<h2>Babesiosis</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Key Features</h3>
    <ul>
      <li>Caused by <em>Babesia microti</em> &mdash; intraerythrocytic protozoan</li>
      <li>Spread by <em>Ixodes scapularis</em> (same tick as Lyme/anaplasmosis) &mdash; and by transfusion of infected blood products</li>
      <li>~20% of infections asymptomatic</li>
      <li>Symptoms: fever (89%), fatigue (82%), chills (67%), headache (47%), myalgia (43%)</li>
      <li><strong>Hallmark: hemolytic anemia</strong> with jaundice, elevated LDH, low haptoglobin, indirect hyperbilirubinemia</li>
      <li>Thrombocytopenia and elevated transaminases also common</li>
    </ul>
    <div class="callout c-red" style="margin-top:8px;">
      <span class="callout-label">Severe Disease Risk Factors</span>
      Age &gt;50 &middot; Asplenia (highest risk &mdash; can be overwhelming) &middot; Immunocompromise (prolonged treatment required) &middot; Can cause ARDS, multiorgan failure, splenic rupture
    </div>
    <h3 style="margin-top:10px;">Diagnosis</h3>
    <ul>
      <li>Peripheral blood smear: intraerythrocytic ring forms; merozoites in <strong>tetrad (Maltese cross)</strong> pattern pathognomonic when present</li>
      <li>PCR: preferred when parasitemia is low or smear inconclusive</li>
      <li>Serology: does not differentiate acute from prior infection &mdash; not recommended for acute diagnosis</li>
    </ul>
  </div>

    <h3>Treatment</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Severity</th><th>Regimen</th><th>Duration</th></tr></thead>
      <tbody>
        <tr><td>Mild to moderate</td><td>Atovaquone + oral azithromycin</td><td>7&ndash;10 days</td></tr>
        <tr><td>Severe (ICU)</td><td>Atovaquone + IV azithromycin &rarr; step down to oral</td><td>7&ndash;10 days</td></tr>
        <tr><td>Highly immunocompromised</td><td>Atovaquone + high-dose azithromycin (500&ndash;1000 mg)</td><td>&ge;6 weeks including 2 wk after smear clearance</td></tr>
        <tr><td>Alternative (any severity)</td><td><strong>Clindamycin + quinine</strong> &mdash; if azithromycin not tolerated; higher adverse-effect rate</td><td>7&ndash;10 days</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-purple" style="margin-top:6px;">
      <span class="callout-label">Exchange Transfusion</span>
      Consider when: parasitemia &gt;10% &middot; severe hemolytic anemia &middot; marked pulmonary, renal, or hepatic involvement.
    </div>
    <div class="callout c-red" style="margin-top:6px;">
      <span class="callout-label">Doxycycline Does Not Treat Babesiosis</span>
      This is the key board distinction. Babesiosis is a protozoal infection &mdash; doxycycline monotherapy is not adequate. If Ixodes coinfection is suspected, treat both: atovaquone + azithromycin for babesiosis, doxycycline for anaplasmosis/Lyme.
    </div>
  </div>
</div>
</div>
`},

{cls:'slide-accent',html:`

<div class="slide-body">
<div class="table-wrap">

  <thead><tr><th>Feature</th><th>Lyme</th><th>RMSF</th><th>Ehrlichiosis</th><th>Anaplasmosis</th><th>Babesiosis</th></tr></thead>

    <tr><td>Vector</td><td>Ixodes</td><td>Dermacentor</td><td>Lone Star</td><td>Ixodes</td><td>Ixodes</td></tr>

// 15. CLINICAL PEARLS
{cls:'slide-content',html:`
<h2>Clinical Pearls</h2>
<div class="slide-body">
<div class="pearl"><strong>Do not wait for RMSF serology before starting doxycycline.</strong> Early serology is insensitive &mdash; a negative IgG does not exclude RMSF in the first week of illness. Suspected RMSF in a toxic patient = doxycycline now. Delay is associated with DIC, limb loss, and death.</div>
<div class="pearl"><strong>Erythema migrans is a clinical diagnosis.</strong> Classic expanding annular rash + compatible history in an endemic area = treat. No serology needed or recommended. Testing in early Lyme disease gives false negatives and delays treatment.</div>
<div class="pearl"><strong>Isolated IgM after 30 days of symptoms is likely a false positive.</strong> After the first month, only IgG testing is recommended. An isolated positive IgM after 30 days should not drive Lyme treatment decisions.</div>
<div class="pearl"><strong>Babesiosis is the exception to "everything gets doxycycline."</strong> Treat with atovaquone + azithromycin. Doxycycline monotherapy is not adequate. The smear shows intraerythrocytic parasites (not morulae in leukocytes). The Maltese cross is pathognomonic when present.</div>
<div class="pearl"><strong>Ixodes co-infection is real and clinically important.</strong> Doxycycline treats Lyme and anaplasmosis but not babesiosis. A patient with unexplained hemolysis despite doxycycline for presumed anaplasmosis should have babesiosis actively excluded with smear and PCR.</div>
<div class="pearl"><strong>Lyme carditis heart block is reversible.</strong> Do not place a permanent pacemaker. Hospitalize for monitoring if PR &ge;300 ms or higher-degree block. IV ceftriaxone with transition to oral therapy &mdash; conduction normalizes with treatment.</div>
<div class="pearl"><strong>Prolonged antibiotics do not benefit post-Lyme syndrome.</strong> Fatigue, arthralgia, myalgia, and cognitive symptoms after appropriate Lyme treatment do not reflect persistent infection. Clinical trials show no benefit from extended courses. Evaluate for coinfection or noninfectious cause.</div>
</div>
`},

const deck=document.getElementById('deck'),counter=document.getElementById('slide-counter'),
  btnPrev=document.getElementById('btn-prev'),btnNext=document.getElementById('btn-next'),
  bar=document.getElementById('progress-bar');
let cur=0;
SLIDES.forEach((s,i)=>{
  const el=document.createElement('div');
  el.className='slide '+s.cls; el.innerHTML=s.html;
  if(i===0)el.classList.add('active');
  deck.appendChild(el);
});
const slides=deck.querySelectorAll('.slide');
function goTo(n){
  if(n<0||n>=slides.length)return;
  slides[cur].classList.remove('active'); cur=n;
  slides[cur].classList.add('active');
  const b=slides[cur].querySelector('.slide-body'); if(b)b.scrollTop=0;
  counter.textContent=(cur+1)+' / '+slides.length;
  btnPrev.disabled=cur===0; btnNext.disabled=cur===slides.length-1;
  bar.style.width=((cur+1)/slides.length*100)+'%';
}
btnPrev.addEventListener('click',()=>goTo(cur-1));
btnNext.addEventListener('click',()=>goTo(cur+1));
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();goTo(cur+1);}
  if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();goTo(cur-1);}
});
let tx=0;
deck.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
deck.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50)dx<0?goTo(cur+1):goTo(cur-1);
},{passive:true});
goTo(0);
</script>
