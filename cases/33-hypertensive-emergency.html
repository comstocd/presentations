<title>Case 20 — Hypertensive Emergency vs. Urgency | Morning Report</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f6f8fa;
    --bg3: #eaeef2;
    --border: #d0d7de;
    --text: #1f2328;
    --muted: #656d76;
    --blue: #0969da;
    --blue-bg: #ddf4ff;
    --blue-border: #54aeff;
    --green: #1a7f37;
    --green-bg: #dafbe1;
    --green-border: #4ac26b;
    --yellow: #9a6700;
    --yellow-bg: #fff8c5;
    --yellow-border: #d4a72c;
    --red: #cf222e;
    --red-bg: #ffebe9;
    --red-border: #ff8182;
    --purple: #8250df;
    --purple-bg: #fbefff;
    --purple-border: #c297ff;
    --orange: #bc4c00;
    --orange-bg: #fff1e5;
    --orange-border: #fb8f44;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.6; }
  a { color: var(--blue); text-decoration: none; }

  /* DECK */
  #deck { width: 100%; height: 100%; position: relative; overflow: hidden; }
  .slide {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: 40px 52px 60px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
    overflow: hidden;
  }
  .slide.active { opacity: 1; pointer-events: all; }
  .slide-accent { background: var(--bg2); }
  .slide-content { background: var(--bg); }
  .slide-title { background: var(--bg); justify-content: center; }
  .slide-danger { background: #fff5f5; }

  /* SLIDE BODY — scrollable */
  .slide-body {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding-right: 4px;
  }
  .slide-body::-webkit-scrollbar { width: 3px; }
  .slide-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* TYPE */
  .slide-label { font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; }
  .slide h1 { font-size: 36px; font-weight: 700; line-height: 1.15; color: var(--text); margin-bottom: 14px; }
  .slide h2 { font-size: 24px; font-weight: 700; color: var(--text);
    padding-bottom: 10px; border-bottom: 2px solid var(--border); margin-bottom: 18px; }
  .slide h3 { font-size: 17px; font-weight: 600; color: var(--text); margin: 18px 0 8px; }
  .slide p { color: var(--text); margin-bottom: 12px; font-size: 15px; }
  .slide ul, .slide ol { padding-left: 20px; margin-bottom: 12px; }
  .slide li { margin-bottom: 6px; font-size: 15px; color: var(--text); line-height: 1.5; }
  .slide strong { font-weight: 600; }
  .tagline { font-size: 18px; color: var(--muted); max-width: 620px; line-height: 1.55; margin-bottom: 22px; }

  /* BADGES */
  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; border: 1px solid; }
  .badge-blue  { background: var(--blue-bg);   color: var(--blue);   border-color: var(--blue-border); }
  .badge-green { background: var(--green-bg);  color: var(--green);  border-color: var(--green-border); }
  .badge-red   { background: var(--red-bg);    color: var(--red);    border-color: var(--red-border); }
  .badge-yellow{ background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-border); }
  .badge-purple{ background: var(--purple-bg); color: var(--purple); border-color: var(--purple-border); }
  .badge-orange{ background: var(--orange-bg); color: var(--orange); border-color: var(--orange-border); }

  /* CALLOUTS */
  .callout { border-radius: 8px; padding: 12px 16px; margin: 12px 0;
    border-left: 4px solid; font-size: 14px; line-height: 1.6; }
  .callout-label { font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; display: block; margin-bottom: 4px; }
  .callout-blue   { background: var(--blue-bg);   border-color: var(--blue);   color: #0550ae; }
  .callout-blue   .callout-label { color: var(--blue); }
  .callout-yellow { background: var(--yellow-bg); border-color: var(--yellow-border); color: var(--yellow); }
  .callout-yellow .callout-label { color: var(--yellow); }
  .callout-red    { background: var(--red-bg);    border-color: var(--red);    color: #82071e; }
  .callout-red    .callout-label { color: var(--red); }
  .callout-green  { background: var(--green-bg);  border-color: var(--green);  color: #116329; }
  .callout-green  .callout-label { color: var(--green); }
  .callout-orange { background: var(--orange-bg); border-color: var(--orange-border); color: var(--orange); }
  .callout-orange .callout-label { color: var(--orange); }

  /* TABLES */
  .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); margin: 12px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--bg3); color: var(--muted); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 13px; color: var(--text); }
  tr:last-child td { border-bottom: none; }
  tr:nth-child(even) td { background: var(--bg2); }

  /* GRIDS */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 12px 0; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 12px 0; }

  /* CARDS */
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card-accent { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card-red    { background: var(--red-bg);    border: 1px solid var(--red-border);    border-radius: 10px; padding: 14px 16px; }
  .card-green  { background: var(--green-bg);  border: 1px solid var(--green-border);  border-radius: 10px; padding: 14px 16px; }
  .card-yellow { background: var(--yellow-bg); border: 1px solid var(--yellow-border); border-radius: 10px; padding: 14px 16px; }
  .card-blue   { background: var(--blue-bg);   border: 1px solid var(--blue-border);   border-radius: 10px; padding: 14px 16px; }
  .card-orange { background: var(--orange-bg); border: 1px solid var(--orange-border); border-radius: 10px; padding: 14px 16px; }
  .card-title { font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }

  /* DRUG CARD */
  .drug-card { border-radius: 10px; border: 1px solid var(--border); padding: 14px 16px; margin-bottom: 10px; }
  .drug-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .drug-class { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin-bottom: 10px; }
  .drug-row { display: grid; grid-template-columns: 80px 1fr; gap: 4px 12px; font-size: 13px; margin-bottom: 3px; }
  .drug-key { font-weight: 600; color: var(--muted); }

  /* PEARLS */
  .pearl { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin: 10px 0; font-size: 14px; line-height: 1.6; }

  /* TIMELINE */
  .timeline { list-style: none; padding: 0; position: relative; }
  .timeline::before { content: ''; position: absolute; left: 13px; top: 0; bottom: 0;
    width: 2px; background: var(--border); }
  .timeline li { padding: 0 0 16px 36px; position: relative; }
  .timeline li::before { content: ''; position: absolute; left: 7px; top: 5px;
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--blue); }
  .tl-label { font-size: 11px; font-weight: 700; color: var(--blue);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }

  /* REFS */
  .refs { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .refs li { margin-bottom: 8px; }

  /* NAV */
  #nav { position: fixed; bottom: 0; left: 0; right: 0; height: 44px;
    background: var(--bg); border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; z-index: 200; user-select: none; }
  .nav-btn { background: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 14px; font-size: 13px; font-weight: 500; color: var(--text);
    cursor: pointer; transition: background 0.1s; }
  .nav-btn:hover { background: var(--bg2); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  #slide-counter { font-size: 13px; color: var(--muted); font-weight: 500; }
  #progress-bar { position: fixed; top: 0; left: 0; height: 3px;
    background: var(--blue); transition: width 0.2s ease; z-index: 300; }

  /* SEPARATOR */
  hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

  /* STAT CHIPS */
  .stat-chip { display: inline-block; background: var(--blue-bg); color: var(--blue);
    border: 1px solid var(--blue-border); border-radius: 99px;
    font-size: 13px; font-weight: 700; padding: 2px 10px; margin-right: 6px; }

  @media (max-width: 720px) {
    .slide { padding: 24px 16px 60px; }
    .slide h1 { font-size: 26px; }
    .slide h2 { font-size: 20px; }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }
</style>
</head>

{ cls: 'slide-content', html: `
<h2>Case Presentation</h2>
<div class="slide-body">
<ul class="timeline">
  <li>
    <div class="tl-label">History</div>
    <p style="font-size:14px;margin:0;">58M with poorly controlled HTN (lost to follow-up &times;3 years), DM2, 30 pack-year smoking history presents via EMS with severe occipital headache, onset 90 minutes ago, 10/10, "worst of my life." No chest pain, no focal weakness, no vision change. Wife reports he ran out of amlodipine six weeks ago.</p>

    <div class="tl-label">Vitals</div>

    <div class="tl-label">Exam</div>
    <p style="font-size:14px;margin:0;">Alert, anxious, diaphoretic. Fundoscopy: flame hemorrhages and papilledema bilaterally. No focal neuro deficits. Regular rate and rhythm, no murmur. No pulse differential between arms. Lungs clear. No peripheral edema.</p>

    <div class="tl-label">Initial workup</div>
    <p style="font-size:14px;margin:0;">ECG: LVH with strain pattern. BMP: Cr 2.4 (unknown baseline), K 3.8, BUN 38. UA: 3+ protein, RBC casts. Troponin: pending. CXR: cardiomegaly, no pulmonary edema. CT head without contrast: ordered.</p>
  </li>
</ul>
<div class="callout callout-red">
  <span class="callout-label">The question before you reach for any medication</span>
  Is there end-organ damage? If yes: hypertensive <strong>emergency</strong> &mdash; IV therapy, ICU, controlled reduction over hours. If no: hypertensive <strong>urgency</strong> &mdash; oral therapy, observation, reduction over 24&ndash;48 hours. The BP number alone does not make this distinction.

// ── 3. DEFINITIONS ────────────────────────────────────────────────────────────
{ cls: 'slide-accent', html: `
<h2>Definitions &mdash; The Only Distinction That Matters</h2>
<div class="slide-body">
<div class="grid-2">
  <div class="card-red">
    <div class="card-title" style="color:var(--red);"> Hypertensive Emergency</div>
    <p style="font-size:14px;"><strong>Severely elevated BP + acute end-organ damage.</strong></p>
    <ul style="font-size:13px;">
      <li>No absolute BP threshold &mdash; damage defines it</li>
      <li>Can occur at BP as low as 160/100 in previously normotensive patients (e.g., eclampsia, acute glomerulonephritis)</li>
      <li>Requires IV therapy and ICU-level monitoring</li>
      <li>Target: controlled reduction over minutes to hours</li>
    </ul>
  </div>
  <div class="card-yellow">
    <div class="card-title" style="color:var(--yellow);"> Hypertensive Urgency</div>
    <p style="font-size:14px;"><strong>Severely elevated BP without acute end-organ damage.</strong></p>
    <ul style="font-size:13px;">
      <li>BP often &gt;180/120 by convention but not a hard cutoff</li>
      <li>Symptoms (headache, dyspnea) from BP itself &mdash; not organ injury</li>
      <li>Oral therapy appropriate; outpatient management often adequate</li>
      <li>Target: reduction over 24&ndash;48 hours</li>
    </ul>
  </div>
</div>
<div class="callout callout-blue">
  <span class="callout-label">2025 AHA/ACC Guideline Update (Jones et al., JACC 2025)</span>
  The 2025 guideline (and the 2024 AHA Scientific Statement on acute inpatient BP management) sharpens this framework: "hypertensive urgency" as a clinical entity is now formally de-emphasized. The preferred terminology is <strong>asymptomatic markedly elevated BP</strong>. The guideline explicitly states that patients without acute end-organ damage do not require aggressive short-term IV or oral lowering and should be managed with medication adjustment and follow-up &mdash; not treated as an emergency based on the number alone.
</div>
<div class="callout callout-yellow">
  <span class="callout-label">Teaching Point</span>
  Patients with chronic hypertension tolerate much higher BPs before developing end-organ damage because their cerebral autoregulation curve shifts rightward over time. A BP of 220/120 in a chronic hypertensive may cause fewer immediate symptoms than 170/110 in someone who is normally normotensive.
</div>
</div>

// ── 4. END-ORGAN DAMAGE WORKUP ───────────────────────────────────────────────
{ cls: 'slide-content', html: `
<h2>End-Organ Damage: The Systematic Workup</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Organ System</th><th>Manifestation</th><th>Workup</th><th>Key Finding</th></tr></thead>

    <tr>
      <td><strong>Brain</strong></td>
      <td>Hypertensive encephalopathy, ischemic stroke, hemorrhagic stroke, PRES</td>
      <td>CT head non-contrast; MRI/DWI if stroke suspected; neuro exam</td>
      <td>Altered mentation + HTN + diffuse neuro sx = encephalopathy until proven otherwise</td>

      <td>Grade III (flame hemorrhages, cotton-wool spots) or Grade IV (papilledema) retinopathy</td>
      <td>Fundoscopy &mdash; must be performed; often skipped</td>
      <td>Papilledema = emergency regardless of other findings</td>
    </tr>
    <tr>
      <td><strong>Heart</strong></td>
      <td>Acute MI (demand or plaque rupture), acute pulmonary edema, aortic dissection</td>
      <td>ECG, troponin, BNP, CXR; echo if AHF suspected</td>
      <td>ST changes, new LVH strain, pulmonary edema on CXR</td>
    </tr>
    <tr>
      <td><strong>Aorta</strong></td>
      <td>Type A or Type B aortic dissection &mdash; must be excluded before IV antihypertensives</td>

      <td>Microangiopathic hemolytic anemia (MAHA) &mdash; malignant hypertension syndrome</td>

// ── 5. AORTIC DISSECTION TRAP ────────────────────────────────────────────────
{ cls: 'slide-danger', html: `
<h2 style="color:var(--red);border-color:var(--red-border);"> The Trap: Aortic Dissection</h2>
<div class="slide-body">
<div class="callout callout-red">
  <span class="callout-label">Do Not Miss This Before Initiating IV Antihypertensives</span>
  Aortic dissection presents with severe hypertension and chest or back pain &mdash; and is the most dangerous mimic of hypertensive emergency. Starting IV antihypertensives without first excluding dissection is appropriate only if the clinical picture is inconsistent with dissection. The trap is assuming chest pain + high BP = hypertensive emergency. It may be dissection requiring emergent surgery.
</div>
<h3>Red Flags for Dissection</h3>
<div class="grid-2">
  <div>
    <ul style="font-size:14px;">
      <li><strong>Tearing or ripping pain</strong> radiating to the back</li>
      <li><strong>Abrupt maximal onset</strong> at symptom start (not crescendo)</li>
      <li><strong>Pulse differential &gt;20 mmHg</strong> between arms &mdash; always check both arms</li>
      <li><strong>New aortic regurgitation murmur</strong> (Type A dissection)</li>
      <li><strong>Neurologic deficit</strong> from carotid/subclavian involvement</li>
      <li><strong>Widened mediastinum</strong> on CXR (&gt;8 cm)</li>
      <li><strong>Syncope at onset</strong> (suggests tamponade or aortic rupture)</li>
    </ul>
  </div>
  <div>
    <div class="card-red" style="margin-bottom:10px;">
      <div class="card-title" style="color:var(--red);">Type A (ascending) &mdash; Surgical Emergency</div>
      <p style="font-size:13px;">Involves ascending aorta. Risk of tamponade, AR, coronary ostium involvement. <strong>Do not anticoagulate.</strong> Emergent cardiothoracic surgery. Mortality ~1%/hour untreated.</p>
    </div>
    <div class="card-orange">
      <div class="card-title" style="color:var(--orange);">Type B (descending) &mdash; Medical Management</div>
      <p style="font-size:13px;">Distal to left subclavian. Medical management with IV beta-blocker + vasodilator to target SBP 100&ndash;120 and HR &lt;60. TEVAR for complicated cases (malperfusion, rupture, refractory pain).</p>
    </div>
  </div>
</div>
<div class="callout callout-orange">
  <span class="callout-label">The Specific Danger of Nitroprusside in Suspected Dissection</span>
  Nitroprusside is a pure vasodilator &mdash; it reduces BP but causes reflex tachycardia, increasing dp/dt (the force of ventricular ejection against the aortic wall). In dissection, dp/dt is the primary driver of propagation. Nitroprusside without a concurrent beta-blocker to blunt the reflex tachycardia can worsen dissection. <strong>Always give IV beta-blocker first.</strong>
</div>
</div>
`},

// ── 6. BP TARGETS — THE EVIDENCE (OR LACK THEREOF) ──────────────────────────
{ cls: 'slide-content', html: `
<h2>BP Targets: The Evidence &mdash; and the Absence of It</h2>
<div class="slide-body">
<div class="callout callout-yellow">
  <span class="callout-label">Honest Appraisal</span>
  Specific numeric BP targets for hypertensive emergency are largely derived from <strong>pathophysiology, expert consensus, and observational data</strong> &mdash; not from RCTs. There is no large randomized trial demonstrating that targeting SBP 140&ndash;160 at hour 1 produces better outcomes than targeting 150&ndash;170. The targets below are guideline recommendations; the evidence base is weak.
</div>
<div class="table-wrap">
<table>
  <thead><tr><th>Clinical Scenario</th><th>Initial Target</th><th>Timeframe</th><th>Rationale / Caveat</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>Hypertensive emergency (general)</strong></td>
      <td>Reduce MAP by no more than 25%</td>
      <td>First hour</td>
      <td>AHA/ACC 2017. Avoids precipitating ischemia in autoregulation-shifted vessels. The 25% figure is expert consensus, not RCT-derived.</td>
    </tr>
    <tr>
      <td><strong>Hypertensive encephalopathy</strong></td>
      <td>MAP reduction 20&ndash;25%</td>
      <td>First hour</td>
      <td>Gradual reduction restores autoregulation. Overshoot causes watershed ischemia.</td>
    </tr>
    <tr>
      <td><strong>Ischemic stroke</strong></td>
      <td>&lt;185/110 if tPA candidate; otherwise &lt;220/120 and do not treat unless BP extremely high</td>
      <td>Per AHA/ASA 2019 stroke guidelines</td>
      <td>BP often reflexively elevated after stroke &mdash; may be protective. Aggressive lowering worsens penumbra perfusion. Permissive hypertension is the rule.</td>
    </tr>
    <tr>
      <td><strong>Hemorrhagic stroke (ICH)</strong></td>
      <td>SBP &lt;140 mmHg</td>
      <td>Rapidly; maintain for 24h</td>
      <td>INTERACT2 and ATACH-2: SBP &lt;140 is safe and may reduce hematoma expansion. ATACH-2: aggressive target (&lt;120) associated with more renal adverse events without additional benefit.</td>
    </tr>
    <tr>
      <td><strong>Aortic dissection</strong></td>
      <td>SBP 100&ndash;120, HR &lt;60</td>
      <td>As rapidly as tolerated</td>
      <td>Reduce dp/dt. IV beta-blocker (esmolol, labetalol) <em>first</em>, then add vasodilator if needed. Most aggressive target of any hypertensive emergency.</td>
    </tr>
    <tr>
      <td><strong>Acute pulmonary edema / ADHF</strong></td>
      <td>Afterload reduction; SBP target individualized</td>
      <td>Symptom-guided</td>
      <td>IV nitroglycerin or nitroprusside preferred for afterload reduction. Loop diuretics address volume. Target symptom relief, not a specific number.</td>
    </tr>
    <tr>
      <td><strong>Eclampsia / severe preeclampsia</strong></td>
      <td>SBP &lt;160, DBP &lt;110</td>
      <td>Urgently</td>
      <td>IV labetalol, IV hydralazine, or oral nifedipine. IV magnesium for seizure prevention regardless of BP. ACEi/ARBs contraindicated.</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout callout-blue">
  <span class="callout-label">The 25% Rule &mdash; Where Does It Come From?</span>
  The recommendation to reduce MAP by no more than 25% in the first hour is cited in virtually every guideline and textbook. It derives from early studies of cerebral autoregulation demonstrating that in chronic hypertension the autoregulatory curve is rightward-shifted, and rapid normalization can cause ischemia at BP levels that would be normal in other patients. There is no RCT comparing 20%, 25%, and 30% reductions with clinical outcomes. This is important to acknowledge explicitly when teaching.
</div>
</div>
`},

// ── 12. HYPERTENSIVE URGENCY — THE EVIDENCE PROBLEM ─────────────────────────
{ cls: 'slide-content', html: `
<h2>Hypertensive Urgency: Do We Even Need to Treat It?</h2>
<div class="slide-body">
<div class="callout callout-yellow">
  <span class="callout-label">The Uncomfortable Evidence</span>
  Multiple studies have shown that patients with hypertensive urgency (severe BP elevation without end-organ damage) who are <strong>not</strong> treated acutely in the ED have similar short-term outcomes to those who receive immediate medication. The practice of giving oral antihypertensives in the ED to achieve a BP reduction before discharge may not improve outcomes and may cause harm through over-treatment.
</div>
<h3>What the Evidence Shows</h3>
<ul>
  <li><strong>Patel et al. (JAMA Intern Med 2016):</strong> Retrospective study of 59,000 patients with severe asymptomatic hypertension presenting to primary care or ED. Short-term rates of MACE were very low and not significantly different between treated and untreated groups. ED treatment was not associated with improved outcomes.</li>
  <li><strong>Observation:</strong> Many patients with BP &gt;180/120 in the ED have falsely elevated readings from pain, anxiety, or white-coat effect. Repeat measurement after 30 min in a quiet environment resolves "crisis" BP in a substantial minority.</li>
  <li><strong>The real risk of acute oral treatment:</strong> Rapid BP reduction can cause reflex tachycardia, orthostatic hypotension, stroke, and MI in patients whose autoregulation is adapted to chronic hypertension.</li>
</ul>
<h3>Appropriate Management of Urgency</h3>
<ul>
  <li>Confirm the BP is real: repeat after rest; check both arms; use appropriate cuff size</li>
  <li>Address identifiable precipitants: pain, anxiety, missed medications, urinary retention</li>
  <li>Oral antihypertensive intensification: restart held medications, up-titrate existing regimen, or add a new agent (amlodipine, lisinopril, chlorthalidone)</li>
  <li>Target BP reduction over 24&ndash;48 hours, not hours</li>
  <li>Arrange prompt outpatient follow-up within 1&ndash;7 days (not discharge without a plan)</li>
  <li>Patient education: medication adherence, sodium restriction, BP self-monitoring</li>
</ul>
<div class="callout callout-green">
  <span class="callout-label">Teaching Point</span>
  The goal of an ED visit for hypertensive urgency is not to normalize the BP before discharge. It is to confirm the absence of end-organ damage, initiate or optimize outpatient therapy, and ensure safe follow-up. Normalizing the BP in 4 hours is not a clinical achievement &mdash; it may be harm.
</div>
</div>
`},

// ── 13. MALIGNANT HYPERTENSION ───────────────────────────────────────────────
{ cls: 'slide-accent', html: `
<h2>Malignant Hypertension &mdash; A Specific Syndrome</h2>
<div class="slide-body">
<p>Malignant hypertension is not simply "very high BP." It is a <strong>specific end-organ syndrome</strong> characterized by the triad of severe hypertension, Grade III&ndash;IV retinopathy, and evidence of target organ injury (particularly renal and hematologic). Recognition matters because the hematologic component changes the workup.</p>
<div class="grid-2">
  <div>
    <h3>Classic Triad</h3>
    <ul style="font-size:14px;">
      <li><strong>Severely elevated BP</strong> (typically &gt;180/120, often much higher)</li>
      <li><strong>Grade III retinopathy:</strong> Flame hemorrhages, cotton-wool spots, arteriovenous nicking</li>
      <li><strong>Grade IV retinopathy:</strong> Papilledema (the sine qua non of malignant hypertension)</li>
    </ul>
    <h3 style="margin-top:16px;">Hematologic Component</h3>
    <ul style="font-size:14px;">
      <li>Microangiopathic hemolytic anemia (MAHA): schistocytes on smear, elevated LDH, low haptoglobin</li>
      <li>Thrombocytopenia (TMA physiology)</li>
      <li>Elevated Cr (thrombotic microangiopathy in renal vasculature)</li>
      <li>Can mimic TTP/HUS &mdash; check ADAMTS13 if uncertain</li>
    </ul>
  </div>
  <div>
    <h3>Key Management Points</h3>
    <ul style="font-size:14px;">
      <li>Confirm with peripheral blood smear &mdash; schistocytes are diagnostic</li>
      <li>Do not confuse with primary TTP: in malignant hypertension, HTN precedes the MAHA; in TTP, MAHA and thrombocytopenia precede or occur without extreme HTN</li>
      <li>IV antihypertensive therapy; ICU admission</li>
      <li>Renal recovery with BP control: renal function often improves dramatically over days to weeks with adequate BP reduction &mdash; do not assume permanent renal failure</li>
      <li>Fundoscopy is mandatory: papilledema in this context is pathognomonic</li>

<div class="slide-body">
<div class="pearl"> <strong>The BP number does not make the diagnosis.</strong> A patient with BP 200/120 and no end-organ damage has urgency. A patient with BP 170/105 and papilledema has an emergency. The distinction is always clinical, never numeric.</div>

<div class="pearl"> <strong>Nicardipine in the neuro patient; labetalol in dissection and pregnancy; nitroprusside when you need minute-to-minute control and have an arterial line.</strong> These are not arbitrary choices. Each agent's mechanism maps directly to the pathophysiology of the target scenario.</div>

// ── ENGINE ────────────────────────────────────────────────────────────────────
const deck = document.getElementById('deck');
const counter = document.getElementById('slide-counter');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const bar = document.getElementById('progress-bar');
let cur = 0;

SLIDES.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide ' + s.cls;
  el.innerHTML = s.html;
  if (i === 0) el.classList.add('active');
  deck.appendChild(el);
});

const slides = deck.querySelectorAll('.slide');

function goTo(n) {
  if (n < 0 || n >= slides.length) return;
  slides[cur].classList.remove('active');
  cur = n;
  slides[cur].classList.add('active');
  const body = slides[cur].querySelector('.slide-body');
  if (body) body.scrollTop = 0;
  counter.textContent = (cur + 1) + ' / ' + slides.length;
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === slides.length - 1;
  bar.style.width = ((cur + 1) / slides.length * 100) + '%';
}

btnPrev.addEventListener('click', () => goTo(cur - 1));
btnNext.addEventListener('click', () => goTo(cur + 1));

document.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown',' '].includes(e.key)) { e.preventDefault(); goTo(cur + 1); }
  if (['ArrowLeft','ArrowUp'].includes(e.key)) { e.preventDefault(); goTo(cur - 1); }
});

let tx = 0;
deck.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
deck.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) dx < 0 ? goTo(cur + 1) : goTo(cur - 1);
}, { passive: true });

goTo(0);
</script>
