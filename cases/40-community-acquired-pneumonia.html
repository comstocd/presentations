// 2. CASE
{cls:'slide-content',html:`
<h2>Case Presentation</h2>
<div class="slide-body">
<ul class="tl">
  <li><div class="tl-label">History</div>68M, former smoker (40 pack-years), COPD on tiotropium, DM2. Three days of productive cough, fever to 39.2, and progressive dyspnea. Lives alone in an apartment building; no recent travel; no sick contacts. Had influenza two weeks prior.</li>
  <li><div class="tl-label">Exam</div>T 39.4 &middot; HR 108 &middot; <strong>RR 32</strong> &middot; BP 118/72 &middot; SpO2 88% RA. Dull to percussion and bronchial breath sounds right base. Mildly confused. No rigors.</li>
  <li><div class="tl-label">Labs</div>WBC 18.2 &middot; BUN 28 &middot; Cr 1.3 &middot; Na 131 &middot; <strong>Plt 88K</strong> &middot; <strong>PaO2/FiO2 210</strong> &middot; Procalcitonin 3.8</li>
  <li><div class="tl-label">Imaging</div>CXR: right lower lobe consolidation. CT chest: dense RLL lobar consolidation + <strong>bilateral patchy infiltrates</strong>.</li>
</ul>
<div class="callout c-red">
  <span class="callout-label">Teaching Frame</span>
  Post-influenza CAP in a COPD/DM2 patient with hyponatremia. Five IDSA/ATS minor criteria present: RR &ge;30 &middot; confusion &middot; BUN &ge;20 &middot; Plt &lt;100K &middot; P/F &le;250 &middot; multilobar infiltrates &rarr; <strong>ICU-level care indicated.</strong> Post-influenza timing raises an additional question: is this MRSA superinfection?
</div>
</div>
`},

// 3. PATHOPHYSIOLOGY — NEW
{cls:'slide-accent',html:`
<h2>Pathophysiology: Why Mechanism Drives Management</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Alveolar vs. Atypical Infection</h3>
    <ul>
      <li><strong>Typical bacteria</strong> (S. pneumoniae, H. influenzae): infect the alveolar space directly &rarr; lobar consolidation, productive cough, purulent sputum, leukocytosis. Cell wall present &rarr; respond to beta-lactams.</li>
      <li><strong>Atypical organisms</strong> (Legionella, Mycoplasma, Chlamydia): obligate or facultative intracellular pathogens. No peptidoglycan cell wall &rarr; <strong>beta-lactams are ineffective</strong>. Reside inside macrophages or epithelial cells &rarr; require agents that penetrate intracellularly: macrolides, fluoroquinolones, doxycycline.</li>
      <li>This mechanistic distinction is why ICU CAP regimens combine a beta-lactam (for typical bacteria) with a macrolide (for Legionella and other atypicals) &mdash; not for spectrum overlap, but because they target structurally distinct pathogens.</li>
    </ul>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">Why Macrolide Beats Fluoroquinolone in ICU CAP</span>
      Both cover atypicals. The survival advantage of macrolide combination therapy in severe CAP likely reflects immunomodulatory effects of macrolides (reduce cytokine-mediated lung injury) beyond antimicrobial activity alone.
    </div>
  </div>
  <div>
    <h3>Post-Influenza Bacterial Superinfection</h3>
    <div class="callout c-red">
      <span class="callout-label">Mechanism</span>
      Influenza virus disrupts: (1) mucociliary clearance &mdash; ciliary paralysis allows bacteria to adhere to denuded epithelium; (2) neutrophil recruitment and function &mdash; impaired phagocytic killing; (3) epithelial barrier integrity &mdash; viral cytopathic effect exposes basement membrane. Result: window of maximal susceptibility to bacterial invasion 5&ndash;14 days post-influenza.
    </div>
    <ul>
      <li>S. aureus (MRSA) is the most feared post-influenza pathogen &mdash; necrotizing, cavitary, rapidly fatal</li>
      <li>S. pneumoniae and S. pyogenes also classically associated</li>
      <li>Aspiration pneumonia microbiome shift: <strong>anaerobes are less important than historically taught</strong>. Revised data show S. pneumoniae and H. influenzae far more commonly isolated than oral anaerobes in community-acquired aspiration. Anaerobes remain important in lung abscess and empyema specifically.</li>
    </ul>
    <h3 style="margin-top:10px;">HCAP Reclassification &mdash; Clinical Implication</h3>
    <div class="callout c-yellow">
      <span class="callout-label">No Longer a Distinct Entity</span>
      Nursing home residents and patients hospitalized in the past 3 months are now classified as CAP. Pathogens do not differ substantially from community-dwelling patients with similar comorbidities. Do not automatically broaden to anti-Pseudomonal gram-negative coverage based solely on care setting &mdash; use comorbidities and clinical risk factors instead.
    </div>
  </div>
</div>
</div>
`},

// 4. EPIDEMIOLOGY & MICROBIOLOGY
{cls:'slide-content',html:`
<h2>Epidemiology &amp; Microbiology</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Epidemiology</h3>
    <ul>
      <li>Leading cause of infection-related hospitalization in the US</li>
      <li>Hospitalization incidence in adults &ge;80y is <strong>25x higher</strong> than those &lt;50y</li>
      <li>Mortality 10&ndash;12% among hospitalized patients; readmission ~20%</li>
      <li>Common comorbidities: COPD, DM, heart failure</li>
    </ul>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">CDC-EPIC Trial (NEJM 2015)</span>
      Viral pathogens detected more often than bacterial in hospitalized CAP. No causative organism identified in <strong>62% of patients</strong> despite extensive investigation. S. pneumoniae now accounts for only 5&ndash;15% of hospitalized CAP &mdash; vaccine success is the primary driver.
    </div>
    <div class="callout c-yellow" style="margin-top:6px;">
      <span class="callout-label">Macrolide Resistance</span>
      US pneumococcal macrolide resistance exceeds 30%. Azithromycin/clarithromycin monotherapy only acceptable if local resistance &lt;25%.
    </div>
  </div>
  <div>
    <h3>Common Pathogens by Setting</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Setting</th><th>Key Organisms</th></tr></thead>
      <tbody>
        <tr><td>Outpatient (healthy)</td><td>S. pneumoniae, Mycoplasma, Chlamydia, H. influenzae, viruses</td></tr>
        <tr><td>Inpatient non-ICU</td><td>Above + Legionella, respiratory viruses</td></tr>
        <tr><td>ICU</td><td>S. pneumoniae, S. aureus, H. influenzae, Legionella, GNB</td></tr>
        <tr><td>COPD</td><td>H. influenzae, S. pneumoniae, Moraxella, Legionella, Pseudomonas</td></tr>
        <tr><td>Post-influenza</td><td><strong>S. aureus (incl. MRSA)</strong>, S. pneumoniae, S. pyogenes</td></tr>
        <tr><td>Aspiration</td><td>S. pneumoniae, H. influenzae, Enterobacterales (anaerobes less common than taught)</td></tr>
        <tr><td>Structural lung disease</td><td>Pseudomonas, Burkholderia, S. aureus, atypical mycobacteria</td></tr>
        <tr><td>Age &ge;65</td><td>Influenza, S. pneumoniae, RSV, SARS-CoV-2</td></tr>
      </tbody>
    </table>
    </div>
  </div>
</div>
</div>
`},

// 5. EXPOSURE-BASED PATHOGEN TABLE
{cls:'slide-accent',html:`
<h2>Exposure-Based Pathogen Recognition</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Exposure / Risk Factor</th><th>Pathogen to Consider</th></tr></thead>
  <tbody>
    <tr><td>Hot tub / water tower / air conditioning unit</td><td><strong>Legionella pneumophila</strong> &mdash; GI symptoms, hyponatremia, elevated LFTs. No person-to-person spread.</td></tr>
    <tr><td>Birds (parrots, pigeons)</td><td>Chlamydia psittaci, Histoplasma, Cryptococcus</td></tr>
    <tr><td>Farm animals / pregnant animals</td><td>Coxiella burnetii (Q fever)</td></tr>
    <tr><td>Rabbits</td><td>Francisella tularensis</td></tr>
    <tr><td>Rodent droppings</td><td>Hantavirus</td></tr>
    <tr><td>Horses</td><td>Rhodococcus equi (especially immunocompromised)</td></tr>
    <tr><td>Midwest / Central / Eastern US</td><td>Histoplasma capsulatum, Blastomyces dermatitidis</td></tr>
    <tr><td>Southwest US (Arizona / San Joaquin Valley, CA)</td><td>Coccidioides spp.</td></tr>
    <tr><td>IVDU / preceding influenza / prior MRSA culture</td><td><strong>MRSA</strong> &mdash; cavitary lesions, pleural-based nodules, gram-positive clusters on Gram stain</td></tr>
    <tr><td>Heavy alcohol use</td><td>S. pneumoniae, Klebsiella pneumoniae, H. influenzae, Enterobacterales</td></tr>
    <tr><td>Immunocompromised / subacute / no response to antibiotics</td><td>Mycobacteria, fungi (Aspergillus, PCP, Cryptococcus, endemic fungi)</td></tr>
  </tbody>
</table>
</div>
<div class="callout c-orange">
  <span class="callout-label">Legionella Triad</span>
  GI symptoms (diarrhea, nausea) + hyponatremia + elevated aminotransferases in a patient with pneumonia = Legionella until proven otherwise. Urinary antigen detects serotype 1 (most common) only; results can remain positive for prolonged periods after infection. Beta-lactams do not cover Legionella &mdash; use fluoroquinolone or macrolide.
</div>
</div>
`},

// 7. DIAGNOSTIC EVALUATION
{cls:'slide-content',html:`
<h2>Diagnostic Evaluation</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Imaging</h3>
    <ul>
      <li>CXR (PA + lateral) recommended first &mdash; sensitivity &lt;50% vs. CT</li>
      <li>CXR normal but high suspicion: repeat at 24h; CT for high-risk patients (febrile neutropenia, suspected ARDS)</li>
      <li><strong>Lobar consolidation</strong> &rarr; S. pneumoniae; Legionella (multilobar)</li>
      <li><strong>Interstitial infiltrate</strong> &rarr; atypicals (Mycoplasma, Chlamydia, Legionella), viruses</li>
      <li><strong>Cavitary / abscess</strong> &rarr; anaerobes, S. aureus, Klebsiella, Nocardia, fungi, mycobacteria</li>
      <li><strong>Pleural effusion</strong> &rarr; S. aureus, S. pneumoniae, anaerobes, S. anginosus group</li>
    </ul>
    <div class="callout c-red" style="margin-top:8px;">
      <span class="callout-label">Procalcitonin Rule</span>
      Insufficiently sensitive and specific to guide the decision to <em>start or withhold</em> antibiotics in CAP. Do not use PCT alone to defer treatment in a patient who clinically has CAP.
    </div>
    <div class="callout c-blue" style="margin-top:6px;">
      <span class="callout-label">HIV Testing</span>
      Perform when clinically indicated. A positive result substantially expands the differential: PCP, Cryptococcus, Histoplasma, Aspergillus, MAC, CMV pneumonitis, Kaposi sarcoma.
    </div>
  </div>
  <div>
    <h3>Cultures &amp; Microbiologic Testing</h3>
    <p style="font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px;">Sputum Gram stain + culture: obtain in</p>
    <ul>
      <li>ICU admission (endotracheal aspirate if intubated)</li>
      <li>No response to outpatient antibiotics</li>
      <li>Cavitary lesion or structural lung disease</li>
      <li>Good-quality sputum before antibiotics = diagnostic in up to <strong>80% of pneumococcal infections</strong>; yield drops substantially after antibiotics started</li>
    </ul>
    <p style="font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px;margin-top:8px;">Blood cultures: obtain in</p>
    <ul>
      <li>Severe CAP; empiric MRSA or Pseudomonas coverage</li>
      <li>Positive in 20&ndash;25% of pneumococcal pneumonia</li>
      <li>Negative result allows de-escalation</li>
    </ul>
    <p style="font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px;margin-top:8px;">Urinary antigens</p>
    <ul>
      <li>Pneumococcal UAT: &gt;70% sensitive; unaffected by prior antibiotics</li>
      <li>Legionella UAT: serotype 1 only; can remain positive long after infection</li>
      <li>Reserve for: moderate-severe CAP requiring hospitalization, immunocompromised, or Legionella exposure</li>
    </ul>
    <p style="font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px;margin-top:8px;">Respiratory viral panels</p>
    <ul>
      <li>Nucleic acid amplification (NAAT) preferred over antigen tests for influenza and COVID-19</li>
      <li>Positive in up to 40% of hospitalized CAP by NAAT</li>
      <li>Positive result may reflect coinfection or predisposing infection, not necessarily current cause</li>
      <li>Does not guide antibiotic de-escalation reliably, but has <strong>significant infection control implications</strong> (isolation precautions)</li>
    </ul>
  </div>
</div>
</div>
`},

// 8. PSI vs CURB-65 — SITE OF CARE
{cls:'slide-accent',html:`
<h2>Site-of-Care Decision: PSI vs. CURB-65</h2>
<div class="slide-body">
<div class="callout c-blue">
  <span class="callout-label">IDSA/ATS Recommendation</span>
  PSI is <strong>preferred over CURB-65</strong>. PSI identifies a larger proportion of low-risk patients and has greater discriminative power for predicting 30-day mortality. Both tools supplement, but do not replace, clinical judgment.
</div>
<div class="grid-2" style="margin-top:8px;">
  <div>
    <h3>PSI Classes &mdash; Disposition</h3>
    <p style="font-size:14px;color:var(--muted);margin-bottom:6px;">Step 1: if no risk factors below &rarr; Class I (outpatient). Any risk factor &rarr; proceed to Step 2 point-based scoring.</p>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Class</th><th>Mortality Risk</th><th>Disposition</th></tr></thead>
      <tbody>
        <tr><td><strong>I</strong></td><td>&lt;0.1%</td><td>Outpatient</td></tr>
        <tr><td><strong>II</strong></td><td>&lt;0.7%</td><td>Outpatient</td></tr>
        <tr><td><strong>III</strong></td><td>0.9&ndash;2.8%</td><td>Outpatient or brief observation</td></tr>
        <tr><td><strong>IV</strong></td><td>8.2&ndash;9.3%</td><td>Inpatient</td></tr>
        <tr><td><strong>V</strong></td><td>27&ndash;29%</td><td>Inpatient &mdash; consider ICU</td></tr>
      </tbody>
    </table>
    </div>
    <p style="font-size:13px;color:var(--muted);margin-top:6px;">Step 1 screen factors: age &gt;50 &middot; malignancy &middot; CHF &middot; cerebrovascular disease &middot; kidney or liver disease &middot; HR &ge;125 &middot; RR &ge;30 &middot; SBP &lt;90 &middot; T &lt;35&deg;C or &ge;40&deg;C &middot; altered mentation</p>
  </div>
  <div>
    <h3>CURB-65</h3>
    <div class="card" style="margin-bottom:8px;">
      <div class="card-title">One point each</div>
      <ul style="font-size:15px;">
        <li><strong>C</strong>onfusion (new disorientation)</li>
        <li><strong>U</strong>rea &gt;7 mmol/L (BUN &gt;19 mg/dL)</li>
        <li><strong>R</strong>espiratory rate &ge;30/min</li>
        <li><strong>B</strong>lood pressure: SBP &lt;90 or DBP &le;60 mmHg</li>
        <li>Age <strong>65</strong> years or older</li>
      </ul>
    </div>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Score</th><th>Disposition</th></tr></thead>
      <tbody>
        <tr><td>0&ndash;1</td><td>Outpatient</td></tr>
        <tr><td>2</td><td>Inpatient (short stay / observation)</td></tr>
        <tr><td>&ge;3</td><td>Inpatient &mdash; consider ICU</td></tr>
      </tbody>
    </table>
    </div>
    <h3 style="margin-top:10px;">IDSA/ATS Severe CAP &rarr; ICU</h3>
    <div class="callout c-red" style="margin-top:4px;">
      <span class="callout-label">Major (either one = ICU)</span>
      Mechanical ventilation required &middot; Septic shock requiring vasopressors
    </div>
    <div class="callout c-yellow" style="margin-top:4px;">
      <span class="callout-label">Minor (&ge;3 = consider ICU)</span>
      RR &ge;30 &middot; confusion &middot; BUN &ge;20 &middot; WBC &lt;4K &middot; Plt &lt;100K &middot; P/F &le;250 &middot; multilobar infiltrates &middot; T &lt;36&deg;C &middot; hypotension requiring aggressive fluids
    </div>
  </div>
</div>
</div>
`},

// 10. EMPIRIC ANTIBIOTIC TABLE
{cls:'slide-content',html:`
<h2>Empiric Antibiotics &mdash; IDSA/ATS 2019</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Setting</th><th>Patient</th><th>Regimen</th></tr></thead>
  <tbody>
    <tr>
      <td rowspan="2"><strong>Outpatient</strong></td>
      <td>Healthy, no comorbidities</td>
      <td>Amoxicillin 1g TID &middot; OR &middot; Doxycycline &middot; OR &middot; Macrolide (only if local resistance &lt;25%)</td>
    </tr>
    <tr>
      <td>Comorbidities&sup1;</td>
      <td>Respiratory FQ&sup2; &middot; OR &middot; Oral &beta;-lactam&sup3; + macrolide or doxycycline</td>
    </tr>
    <tr>
      <td><strong>Inpatient non-ICU</strong></td>
      <td>Standard</td>
      <td>IV &beta;-lactam&sup4; + macrolide &middot; OR &middot; Respiratory FQ monotherapy</td>
    </tr>
    <tr>
      <td><strong>ICU</strong></td>
      <td>Standard</td>
      <td>IV &beta;-lactam&sup4; + macrolide (preferred &mdash; survival benefit vs. FQ combination) &middot; OR &middot; &beta;-lactam + respiratory FQ if macrolide contraindicated</td>
    </tr>
    <tr>
      <td><strong>Any</strong></td>
      <td>Pseudomonas risk&sup5;</td>
      <td>Antipseudomonal &beta;-lactam + macrolide or antipseudomonal FQ</td>
    </tr>
    <tr>
      <td><strong>Any</strong></td>
      <td>CA-MRSA risk&sup6;</td>
      <td>Standard therapy + vancomycin or linezolid</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-green" style="margin-top:6px;">
  <span class="callout-label">The Ward Prototype</span>
  <strong>Ceftriaxone + azithromycin</strong> is the classic default for non-ICU hospitalized CAP. Covers S. pneumoniae, H. influenzae, and atypicals (Legionella, Mycoplasma, Chlamydia). This is what residents should order first and what boards test as the paradigm regimen.
</div>
<div class="callout c-yellow" style="margin-top:6px;">
  <span class="callout-label">Fluoroquinolone Monotherapy &mdash; Stewardship Caveat</span>
  Respiratory fluoroquinolone monotherapy (levofloxacin, moxifloxacin) is an acceptable alternative but <strong>not preferred</strong> when beta-lactam/macrolide is feasible. Adverse effects (QTc prolongation, tendinopathy, C. difficile, CNS effects) and stewardship concerns favor reserving fluoroquinolones for patients who cannot tolerate the standard regimen.
</div>
<div class="callout c-orange" style="margin-top:6px;">
  <span class="callout-label">QTc Prolongation Risk &mdash; Macrolides and Fluoroquinolones</span>
  Both prolong QTc. Use <strong>beta-lactam + doxycycline</strong> as the alternative in patients with: prior long QT interval &middot; concurrent QT-prolonging medications &middot; electrolyte abnormalities (hypokalemia, hypomagnesemia).
</div>
<p style="font-size:13px;color:var(--muted);margin-top:6px;">
  &sup1;CHF, COPD, liver/kidney disease, DM, alcoholism, asplenia, malignancy, immunosuppression &middot;
  &sup2;Levofloxacin or moxifloxacin only. <strong>Ciprofloxacin is NOT a respiratory fluoroquinolone</strong> &mdash; inadequate streptococcal activity &middot;
  &sup3;Amoxicillin-clavulanate, cefuroxime, or cefpodoxime &middot;
  &sup4;3rd-gen cephalosporin or ampicillin-sulbactam &middot;
  &sup5;Structural lung disease, prior Pseudomonas, immunocompromised, hospitalization or IV antibiotics in past 90 days &middot;
  &sup6;Prior MRSA respiratory culture, post-influenza, cavitary lesions, pleural-based nodules, Gram stain with clusters
</p>
</div>
`},

// 11. MRSA & PSEUDOMONAS
{cls:'slide-accent',html:`
<h2>When to Expand Coverage: MRSA &amp; Pseudomonas</h2>
<div class="slide-body">
<div class="grid-2">
  <div class="card-red">
    <div class="card-title" style="color:var(--red);">MRSA CAP &mdash; Coverage Triggers</div>
    <ul style="font-size:15px;">
      <li>Prior MRSA growth on respiratory culture</li>
      <li>Preceding influenza illness</li>
      <li>Hospitalization or IV antibiotics in past 90 days</li>
      <li>IVDU</li>
      <li>Gram stain: gram-positive cocci in clusters</li>
      <li>Cavitary lesions or pleural-based nodules on CT</li>
      <li>Failure of conventional therapy</li>
    </ul>
    <div class="callout c-red" style="margin-top:8px;">
      <span class="callout-label">Daptomycin Is Contraindicated for Pneumonia</span>
      Binds pulmonary surfactant &rarr; negligible alveolar levels. Use vancomycin (AUC/MIC-guided) or linezolid. This is a high-yield board distinction.
    </div>
    <div class="callout c-yellow" style="margin-top:6px;">
      <span class="callout-label">Ceftaroline</span>
      FDA-approved for CAP with MRSA activity. <strong>Not specifically approved for MRSA CAP.</strong> Can be considered but evidence is limited for this specific indication.
    </div>
    <div class="callout c-green" style="margin-top:6px;">
      <span class="callout-label">Nasal MRSA PCR for De-Escalation</span>
      High negative predictive value for MRSA pneumonia. Negative nasal MRSA PCR + negative blood/respiratory cultures at 48h &rarr; de-escalate vancomycin/linezolid with confidence. The nasal PCR detects colonization; absence of colonization makes MRSA pneumonia unlikely.
    </div>
  </div>
  <div class="card-purple">
    <div class="card-title" style="color:var(--purple);">Pseudomonas CAP &mdash; Coverage Triggers</div>
    <ul style="font-size:15px;">
      <li>Prior Pseudomonas on respiratory culture in past year</li>
      <li>Underlying structural lung disease (bronchiectasis, CF)</li>
      <li>Severe immunocompromise</li>
      <li>Hospitalization or IV antibiotics in past 90 days</li>
      <li>Repeated antibiotic courses</li>
    </ul>
    <div class="callout c-purple" style="margin-top:8px;">
      <span class="callout-label">Antipseudomonal Options</span>
      Pip-tazo &middot; Cefepime &middot; Ceftazidime &middot; Aztreonam &middot; Imipenem &middot; Meropenem &mdash; paired with macrolide or antipseudomonal fluoroquinolone (ciprofloxacin acceptable here for gram-negative activity).
    </div>
    <div class="callout c-yellow" style="margin-top:6px;">
      <span class="callout-label">Prior Quinolone Failure</span>
      Empiric quinolone relatively contraindicated if patient failed a prior course of a quinolone.
    </div>
    <h3 style="margin-top:10px;">De-Escalation at 48 Hours (ICU)</h3>
    <ul style="font-size:15px;">
      <li>Improving without MRSA/Pseudomonas evidence &rarr; de-escalate to standard non-ICU regimen</li>
      <li>Negative MRSA PCR + cultures &rarr; stop vancomycin/linezolid</li>
    </ul>
  </div>
</div>
</div>
`},

// 12. DURATION, STEROIDS, INFLUENZA
{cls:'slide-content',html:`
<h2>Duration, De-Escalation &amp; Steroids</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Duration</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Situation</th><th>Duration</th></tr></thead>
      <tbody>
        <tr><td>Uncomplicated CAP, improvement by day 3</td><td><strong>5 days</strong></td></tr>
        <tr><td>S. aureus or Pseudomonas pneumonia</td><td>7&ndash;14 days (longer recommended)</td></tr>
        <tr><td>Cavitary lesion / lung abscess</td><td>3&ndash;6 weeks</td></tr>
        <tr><td>Empyema</td><td>Until drained + clinical resolution</td></tr>
        <tr><td>Concomitant bacteremia or extrapulmonary infection</td><td>Pathogen-directed, extended</td></tr>
        <tr><td>Fungal or mycobacterial</td><td>Months (pathogen-specific)</td></tr>
      </tbody>
    </table>
    </div>
    <h3 style="margin-top:12px;">Influenza + CAP</h3>
    <ul>
      <li>Treat with oseltamivir regardless of symptom duration at time of diagnosis</li>
      <li>Antiviral unlikely to benefit uncomplicated illness that began &gt;48h before testing</li>
      <li>Positive influenza does <strong>not</strong> exclude bacterial coinfection &mdash; antibiotics still indicated per IDSA/ATS</li>
      <li>Post-influenza: empirically cover S. aureus (add MRSA coverage if risk factors present), S. pneumoniae, S. pyogenes</li>
    </ul>
  </div>
  <div>
    <h3>Steroids in CAP (2024 Focused Update)</h3>
    <div class="callout c-green">
      <span class="callout-label">Severe Bacterial CAP</span>
      Steroids may provide a survival benefit for patients with severe bacterial CAP: PSI class IV&ndash;V, CURB-65 &ge;3, or ICU-level care required. Mechanism: suppress excessive host cytokine-mediated lung injury (cytokine storm) that drives ARDS progression. Typical regimen: methylprednisolone or dexamethasone for 3&ndash;5 days.
    </div>
    <div class="callout c-red" style="margin-top:8px;">
      <span class="callout-label">Absolute Contraindication</span>
      Do NOT use steroids when fungal or mycobacterial infection is being considered. Steroids suppress antifungal T-cell immunity and worsen outcomes in endemic mycoses and PCP. If clinical suspicion exists, defer steroids until the diagnosis is clarified.
    </div>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">COVID-19 Pneumonia</span>
      Combination of antiviral (remdesivir, nirmatrelvir-ritonavir) + dexamethasone or IL-6 inhibitor has shown improved outcomes for severe SARS-CoV-2 pneumonia. This is a distinct evidence base from bacterial CAP steroid data.
    </div>
  </div>
</div>
</div>
`},

// 13. ATYPICALS — LEGIONELLA DEEP DIVE
{cls:'slide-accent',html:`
<h2>Atypical Pneumonia: Legionella, Mycoplasma, Chlamydia</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Legionella pneumophila</h3>
    <div class="callout c-orange">
      <span class="callout-label">Classic Presentation</span>
      Severe pneumonia + GI symptoms + hyponatremia + elevated aminotransferases. Water-source exposure. No person-to-person transmission. Travel in ~10% of US cases.
    </div>
    <ul>
      <li>Sources: hot tubs, water towers, air conditioning units, hospital water systems</li>
      <li>UAT: detects serotype 1 only; remains positive long after infection</li>
      <li>Beta-lactams: <strong>not effective</strong> (intracellular pathogen, no cell wall target)</li>
      <li>Treatment: fluoroquinolone or azithromycin</li>
    </ul>
    <h3 style="margin-top:12px;">Mycoplasma pneumoniae</h3>
    <ul>
      <li>Person-to-person spread via respiratory droplets</li>
      <li>Upper respiratory prodrome &rarr; pneumonia in ~10%</li>
      <li><strong>Extrapulmonary:</strong> erythema multiforme, Stevens-Johnson syndrome</li>
      <li><strong>Cold agglutinin hemolytic anemia:</strong> IgM antibodies against the I antigen on RBCs cause hemolysis at low temperatures. Positive cold agglutinins + atypical pneumonia = Mycoplasma until proven otherwise. Can cause severe hemolysis requiring transfusion.</li>
    </ul>
    <h3 style="margin-top:10px;">Chlamydia pneumoniae</h3>
    <ul>
      <li>Mild atypical pneumonia; no specific clinical clues</li>
      <li>Treated same as Mycoplasma: macrolide, doxycycline, or fluoroquinolone</li>
    </ul>
  </div>
  <div>
    <h3>Radiographic Pattern vs. Pathogen</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Pattern</th><th>Pathogens</th></tr></thead>
      <tbody>
        <tr><td>Lobar consolidation</td><td>S. pneumoniae &middot; Legionella (multilobar)</td></tr>
        <tr><td>Interstitial infiltrate</td><td>Atypicals (Legionella, Mycoplasma, Chlamydia) &middot; viruses</td></tr>
        <tr><td>Cavitary / abscess</td><td>Anaerobes &middot; S. aureus &middot; Klebsiella &middot; Nocardia &middot; TB &middot; fungi</td></tr>
        <tr><td>Pleural effusion</td><td>Anaerobes &middot; S. aureus &middot; S. pneumoniae &middot; S. anginosus group</td></tr>
        <tr><td>Bilateral / diffuse</td><td>PCP (immunocompromised) &middot; viruses &middot; Histoplasma</td></tr>
      </tbody>
    </table>
    </div>
    <h3 style="margin-top:10px;">Non-Response to Antibiotics &rarr; Reconsider</h3>
    <ul style="font-size:15px;">
      <li>Resistant organism not covered (MRSA, Pseudomonas, atypical)</li>
      <li>Loculated infection: empyema &rarr; thoracentesis</li>
      <li>Infection mimic: malignancy, vasculitis, CHF, PE, COP, eosinophilic pneumonia</li>
      <li>Fungal or mycobacterial pathogen</li>
      <li>Consider bronchoscopy with transbronchial biopsy in non-responders</li>
    </ul>
  </div>
</div>
</div>
`},

// 14. ASPIRATION & ENDEMIC FUNGI
{cls:'slide-content',html:`
<h2>Aspiration Pneumonia &amp; Endemic Fungal CAP</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Aspiration Pneumonia</h3>
    <div class="callout c-yellow">
      <span class="callout-label">Key Conceptual Update</span>
      Anaerobes are less important in community-acquired aspiration than historically taught. S. pneumoniae and H. influenzae are isolated far more commonly than anaerobes. Anaerobes remain important specifically in lung abscess and empyema.
    </div>
    <p style="font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px;">Risk factors</p>
    <ul style="font-size:15px;">
      <li>Dysphagia (stroke, Parkinson, myopathy)</li>
      <li>Decreased consciousness: alcohol, sedatives, seizures</li>
      <li>Poor dentition &middot; GERD &middot; vomiting</li>
    </ul>
    <h3 style="margin-top:10px;">Anaerobic Coverage &mdash; When to Add</h3>
    <div class="card-green" style="margin-top:6px;font-size:15px;">
      <div class="card-title" style="color:var(--green);">Outpatient</div>
      Amoxicillin or amoxicillin-clavulanate active against most oral anaerobes. Add only if clinical concern for anaerobic source.
    </div>
    <div class="card-blue" style="margin-top:6px;font-size:15px;">
      <div class="card-title" style="color:var(--blue);">Inpatient</div>
      Add anaerobic coverage ONLY if lung abscess or empyema is suspected. Not for routine aspiration pneumonia.
    </div>
    <div class="callout c-red" style="margin-top:6px;">
      <span class="callout-label">Why Withholding Matters</span>
      Unnecessary anaerobic agents (metronidazole, clindamycin, pip-tazo) increase <strong>C. difficile risk</strong> without clinical benefit in routine aspiration CAP. Broad anaerobic coverage is reflexively started and often unnecessary &mdash; a high-yield stewardship point.
    </div>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">Lung Abscess Treatment</span>
      Ampicillin-sulbactam or carbapenem (first-line). Beta-lactam allergy: clindamycin monotherapy, or levofloxacin + metronidazole. Duration: 3&ndash;6 weeks.
    </div>
  </div>
  <div>
    <h3>Endemic Fungal CAP &mdash; When to Consider</h3>
    <div class="callout c-purple">
      <span class="callout-label">Triggers</span>
      Immunocompromised &middot; epidemiologic exposure &middot; subacute presentation (&gt;1 week) &middot; failure of standard antibiotics &middot; non-resolving infiltrate
    </div>
    <div class="table-wrap" style="margin-top:6px;">
    <table>
      <thead><tr><th>Fungus</th><th>Geography</th><th>Test</th></tr></thead>
      <tbody>
        <tr><td><strong>Histoplasma capsulatum</strong></td><td>Midwest / Ohio-Mississippi Valley</td><td>Urine or blood antigen</td></tr>
        <tr><td><strong>Blastomyces dermatitidis</strong></td><td>Midwest / Great Lakes</td><td>Urine or blood antigen</td></tr>
        <tr><td><strong>Coccidioides spp.</strong></td><td>Southwest US / San Joaquin Valley CA</td><td>EIA &rarr; confirm with complement fixation and immunodiffusion</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">Serology Timing Rule</span>
      Acute and convalescent sera for Coxiella, Francisella, Legionella, Mycoplasma, Chlamydia can confirm seroconversion but are not useful acutely. Do not delay antibiotic therapy while waiting for convalescent titers.
    </div>
    <div class="callout c-orange" style="margin-top:6px;">
      <span class="callout-label">Steroids + Fungal CAP</span>
      Never start steroids when endemic fungal or mycobacterial CAP is in the differential. Steroids suppress the T-cell-mediated immunity required to contain these pathogens. If diagnostic uncertainty exists, defer steroids and obtain bronchoscopy.
    </div>
  </div>
</div>
</div>
`},

// 15. COMPLICATIONS & FOLLOW-UP
{cls:'slide-accent',html:`
<h2>Complications &amp; Follow-up</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Complications of CAP</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>System</th><th>Complication</th></tr></thead>
      <tbody>
        <tr><td>Pulmonary</td><td>Lung abscess &middot; empyema &middot; ARDS &middot; nonresolving pneumonia</td></tr>
        <tr><td>Cardiac</td><td>ACS (5&ndash;10% of hospitalized patients) &middot; atrial fibrillation</td></tr>
        <tr><td>Neurologic</td><td>Delirium (hypoxemia, hypercarbia, ICU)</td></tr>
        <tr><td>Hematologic</td><td>Leukopenia &middot; thrombocytopenia (sepsis or medication)</td></tr>
        <tr><td>Renal</td><td>AKI (hypoperfusion or nephrotoxins)</td></tr>
        <tr><td>Endocrine</td><td>Adrenal insufficiency (adrenal hemorrhage in septic shock)</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-red" style="margin-top:8px;">
      <span class="callout-label">ACS in CAP</span>
      Occurs in 5&ndash;10% of hospitalized patients. Hypoxemia, tachycardia, and systemic inflammation all increase myocardial demand. Low threshold for troponin and ECG in high-risk patients.
    </div>
    <div class="callout c-blue" style="margin-top:6px;">
      <span class="callout-label">Vaccination</span>
      Pneumococcal vaccination is the primary driver of reduced S. pneumoniae incidence in hospitalized CAP. Influenza vaccination reduces post-influenza secondary bacterial pneumonia risk.
    </div>
  </div>
  <div>
    <h3>Nonresolving Pneumonia &mdash; Differential</h3>
    <ul>
      <li>Resistant organism not covered</li>
      <li>Loculated infection: empyema &rarr; diagnostic thoracentesis</li>
      <li>Malignancy (post-obstructive pneumonia or primary lung cancer)</li>
      <li>Cryptogenic organizing pneumonia or eosinophilic pneumonia</li>
      <li>Pulmonary embolism &middot; CHF</li>
      <li>Vasculitis (GPA, EGPA)</li>
    </ul>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">Bronchoscopy</span>
      Bronchoscopy with transbronchial biopsy should be considered in patients who do not respond to empiric therapy. Permits BAL for culture, cytology, and special stains (fungi, AFB, PCP).
    </div>
    <h3 style="margin-top:12px;">Follow-up</h3>
    <ul>
      <li>Symptoms resolved at 5&ndash;7 days: <strong>no routine follow-up imaging required</strong></li>
      <li>Readmission rate ~20% &rarr; close outpatient follow-up after discharge</li>
      <li>Hospitalized patients: significant morbidity and protracted convalescence are common</li>
    </ul>
  </div>
</div>
</div>
`},

// 16. CLINICAL PEARLS
{cls:'slide-content',html:`
<h2>Clinical Pearls</h2>
<div class="slide-body">
<div class="pearl"><strong>Macrolide monotherapy is no longer recommended for most US outpatients with CAP.</strong> Pneumococcal macrolide resistance exceeds 30% nationally. First-line for healthy patients without comorbidities is amoxicillin 1g TID or doxycycline &mdash; not azithromycin.</div>
<div class="pearl"><strong>Ciprofloxacin is not a respiratory fluoroquinolone.</strong> Inadequate streptococcal activity. Levofloxacin and moxifloxacin are the respiratory fluoroquinolones. Prescribing ciprofloxacin for CAP is a common and consequential error.</div>
<div class="pearl"><strong>Procalcitonin does not rule out bacterial CAP.</strong> Insufficiently sensitive and specific to guide starting or withholding antibiotics. Never use procalcitonin alone to defer treatment in a patient who clinically has CAP.</div>
<div class="pearl"><strong>Post-influenza CAP is a different disease.</strong> S. aureus (including MRSA), S. pneumoniae, and S. pyogenes cause necrotizing, rapidly progressive pneumonia after influenza. A positive influenza test does not exclude bacterial coinfection &mdash; antibiotics are still indicated.</div>
<div class="pearl"><strong>Daptomycin is contraindicated for pneumonia.</strong> Binds pulmonary surfactant &rarr; negligible alveolar concentrations. Use vancomycin (AUC/MIC-guided) or linezolid for MRSA pneumonia. This appears on boards repeatedly.</div>
<div class="pearl"><strong>Mycoplasma causes cold agglutinin hemolytic anemia.</strong> IgM antibodies against the I antigen on RBCs cause hemolysis at low temperatures. Positive cold agglutinins + atypical pneumonia = Mycoplasma until proven otherwise. Can be severe enough to require transfusion.</div>
<div class="pearl"><strong>ICU macrolide combination outperforms fluoroquinolone combination.</strong> In severe CAP requiring ICU care, beta-lactam + macrolide has a survival benefit over beta-lactam + respiratory fluoroquinolone. The advantage likely reflects macrolide immunomodulatory effects beyond antimicrobial coverage. Macrolide is preferred unless contraindicated (QTc prolongation, drug interaction).</div>
</div>
`},

// 17. ALGORITHM / TAKE-HOME SUMMARY
{cls:'slide-content',html:`
<h2>Take-Home Algorithm &mdash; CAP at the Bedside</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <div class="card-blue" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--blue);">Step 1 &mdash; Confirm the Diagnosis</div>
      Compatible symptoms (cough, fever, dyspnea, pleuritic pain, hypoxemia) <strong>plus new infiltrate on imaging</strong>. Symptoms alone are insufficient. CXR first; CT if high suspicion with normal CXR.
    </div>
    <div class="card-yellow" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--yellow);">Step 2 &mdash; Disposition (PSI preferred)</div>
      <strong>PSI Class I&ndash;II:</strong> Outpatient &middot; <strong>III:</strong> Observation &middot; <strong>IV&ndash;V:</strong> Inpatient<br>
      <strong>CURB-65 &ge;3:</strong> Inpatient, consider ICU<br>
      <strong>1 major or &ge;3 minor IDSA/ATS criteria:</strong> ICU
    </div>
    <div class="card-green" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--green);">Step 3 &mdash; Start Empiric Antibiotics Promptly</div>
      <strong>Outpatient (healthy):</strong> Amoxicillin 1g TID or doxycycline<br>
      <strong>Non-ICU inpatient:</strong> Ceftriaxone + azithromycin (prototype)<br>
      <strong>ICU:</strong> IV &beta;-lactam + macrolide (preferred over FQ combination)
    </div>
  </div>
  <div>
    <div class="card-red" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--red);">Step 4 &mdash; Ask Before Broadening</div>
      <strong>MRSA risk?</strong> Prior culture &middot; post-influenza &middot; cavitary lesion &middot; IVDU &rarr; add vancomycin or linezolid<br>
      <strong>Pseudomonas risk?</strong> Structural lung disease &middot; prior culture &middot; IV abx in past 90d &rarr; antipseudomonal &beta;-lactam<br>
      <strong>Default: do not broaden empirically without a reason</strong>
    </div>
    <div class="card-orange" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--orange);">Step 5 &mdash; Test Smart; Treat Influenza</div>
      Influenza NAAT in season &rarr; if positive: oseltamivir regardless of symptom duration. Positive influenza does not exclude bacterial coinfection &mdash; continue antibiotics.
    </div>
    <div class="card" style="margin-bottom:8px;border-color:var(--purple-border);background:var(--purple-bg);">
      <div class="card-title" style="color:var(--purple);">Step 6 &mdash; Avoid the Pitfalls</div>
      No routine anaerobic coverage for aspiration (C. diff risk, no benefit) &middot; Ciprofloxacin is not a respiratory FQ &middot; Procalcitonin alone does not rule out CAP &middot; Daptomycin cannot treat pneumonia &middot; Do not use azithromycin monotherapy (US resistance &gt;30%)
    </div>
  </div>
</div>
</div>
`},

const deck=document.getElementById('deck'),counter=document.getElementById('slide-counter'),
  btnPrev=document.getElementById('btn-prev'),btnNext=document.getElementById('btn-next'),
  bar=document.getElementById('progress-bar');
let cur=0;
SLIDES.forEach((s,i)=>{
  const el=document.createElement('div');
  el.className='slide '+s.cls; el.innerHTML=s.html;
  if(i===0)el.classList.add('active');
  deck.appendChild(el);
});
const slides=deck.querySelectorAll('.slide');
function goTo(n){
  if(n<0||n>=slides.length)return;
  slides[cur].classList.remove('active'); cur=n;
  slides[cur].classList.add('active');
  const b=slides[cur].querySelector('.slide-body'); if(b)b.scrollTop=0;
  counter.textContent=(cur+1)+' / '+slides.length;
  btnPrev.disabled=cur===0; btnNext.disabled=cur===slides.length-1;
  bar.style.width=((cur+1)/slides.length*100)+'%';
}
btnPrev.addEventListener('click',()=>goTo(cur-1));
btnNext.addEventListener('click',()=>goTo(cur+1));
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();goTo(cur+1);}
  if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();goTo(cur-1);}
});
let tx=0;
deck.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
deck.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50)dx<0?goTo(cur+1):goTo(cur-1);
},{passive:true});
goTo(0);
</script>
