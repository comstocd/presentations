<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Case 31 — Acute Decompensated Heart Failure | Morning Report</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f6f8fa;
    --bg3: #eaeef2;
    --border: #d0d7de;
    --text: #1f2328;
    --muted: #656d76;
    --blue: #0969da;
    --blue-bg: #ddf4ff;
    --blue-border: #54aeff;
    --green: #1a7f37;
    --green-bg: #dafbe1;
    --green-border: #4ac26b;
    --yellow: #9a6700;
    --yellow-bg: #fff8c5;
    --yellow-border: #d4a72c;
    --red: #cf222e;
    --red-bg: #ffebe9;
    --red-border: #ff8182;
    --purple: #8250df;
    --purple-bg: #fbefff;
    --purple-border: #c297ff;
    --orange: #bc4c00;
    --orange-bg: #fff1e5;
    --orange-border: #fb8f44;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.6;
  }
  a { color: var(--blue); text-decoration: none; }

  #deck { width: 100%; height: 100%; position: relative; overflow: hidden; }
  .slide {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: 38px 52px 58px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease; overflow: hidden;
  }
  .slide.active { opacity: 1; pointer-events: all; }
  .slide-content { background: var(--bg); }
  .slide-accent  { background: var(--bg2); }
  .slide-title   { background: var(--bg); justify-content: center; }
  .slide-danger  { background: #fff5f5; }

  .slide-body {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; padding-right: 4px;
  }
  .slide-body::-webkit-scrollbar { width: 3px; }
  .slide-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .slide-label { font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; }
  .slide h1 { font-size: 36px; font-weight: 700; line-height: 1.15; color: var(--text); margin-bottom: 14px; }
  .slide h2 { font-size: 24px; font-weight: 700; color: var(--text);
    padding-bottom: 10px; border-bottom: 2px solid var(--border); margin-bottom: 18px; }
  .slide h3 { font-size: 17px; font-weight: 600; color: var(--text); margin: 18px 0 8px; }
  .slide p  { color: var(--text); margin-bottom: 12px; font-size: 15px; }
  .slide ul, .slide ol { padding-left: 20px; margin-bottom: 12px; }
  .slide li { margin-bottom: 6px; font-size: 15px; color: var(--text); line-height: 1.5; }
  .slide strong { font-weight: 600; }
  .tagline { font-size: 18px; color: var(--muted); max-width: 640px; line-height: 1.55; margin-bottom: 22px; }

  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; border: 1px solid; }
  .badge-blue   { background: var(--blue-bg);   color: var(--blue);   border-color: var(--blue-border); }
  .badge-green  { background: var(--green-bg);  color: var(--green);  border-color: var(--green-border); }
  .badge-red    { background: var(--red-bg);    color: var(--red);    border-color: var(--red-border); }
  .badge-yellow { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-border); }
  .badge-purple { background: var(--purple-bg); color: var(--purple); border-color: var(--purple-border); }
  .badge-orange { background: var(--orange-bg); color: var(--orange); border-color: var(--orange-border); }

  .callout { border-radius: 8px; padding: 12px 16px; margin: 12px 0;
    border-left: 4px solid; font-size: 14px; line-height: 1.6; }
  .callout-label { font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; display: block; margin-bottom: 4px; }
  .callout-blue   { background: var(--blue-bg);   border-color: var(--blue);         color: #0550ae; }
  .callout-blue   .callout-label { color: var(--blue); }
  .callout-yellow { background: var(--yellow-bg); border-color: var(--yellow-border); color: var(--yellow); }
  .callout-yellow .callout-label { color: var(--yellow); }
  .callout-red    { background: var(--red-bg);    border-color: var(--red);           color: #82071e; }
  .callout-red    .callout-label { color: var(--red); }
  .callout-green  { background: var(--green-bg);  border-color: var(--green);         color: #116329; }
  .callout-green  .callout-label { color: var(--green); }
  .callout-orange { background: var(--orange-bg); border-color: var(--orange-border); color: var(--orange); }
  .callout-orange .callout-label { color: var(--orange); }

  .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); margin: 12px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--bg3); color: var(--muted); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 13px; color: var(--text); }
  tr:last-child td { border-bottom: none; }
  tr:nth-child(even) td { background: var(--bg2); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 12px 0; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 12px 0; }
  .grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin: 12px 0; }

  .card        { background: var(--bg);         border: 1px solid var(--border);        border-radius: 10px; padding: 14px 16px; }
  .card-accent { background: var(--bg2);         border: 1px solid var(--border);        border-radius: 10px; padding: 14px 16px; }
  .card-red    { background: var(--red-bg);      border: 1px solid var(--red-border);    border-radius: 10px; padding: 14px 16px; }
  .card-green  { background: var(--green-bg);    border: 1px solid var(--green-border);  border-radius: 10px; padding: 14px 16px; }
  .card-yellow { background: var(--yellow-bg);   border: 1px solid var(--yellow-border); border-radius: 10px; padding: 14px 16px; }
  .card-blue   { background: var(--blue-bg);     border: 1px solid var(--blue-border);   border-radius: 10px; padding: 14px 16px; }
  .card-orange { background: var(--orange-bg);   border: 1px solid var(--orange-border); border-radius: 10px; padding: 14px 16px; }
  .card-title  { font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }

  /* FORRESTER */
  .forrester { display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .f-cell { padding: 16px 18px; }
  .f-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .f-body  { font-size: 13px; line-height: 1.5; }
  .f-a { background: var(--green-bg); } .f-a .f-label { color: var(--green); }
  .f-b { background: var(--blue-bg);  } .f-b .f-label { color: var(--blue);  }
  .f-l { background: var(--yellow-bg);} .f-l .f-label { color: var(--yellow);}
  .f-c { background: var(--red-bg);   } .f-c .f-label { color: var(--red);   }
  .forrester-wrap { display: flex; gap: 8px; align-items: stretch; margin: 12px 0; }
  .forrester-y { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); writing-mode: vertical-rl; transform: rotate(180deg);
    display: flex; align-items: center; padding: 0 4px; }
  .forrester-right { flex: 1; }
  .forrester-x { display: flex; justify-content: space-between; margin-top: 5px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

  /* TIMELINE */
  .timeline { list-style: none; padding: 0; position: relative; }
  .timeline::before { content: ''; position: absolute; left: 13px; top: 0; bottom: 0; width: 2px; background: var(--border); }
  .timeline li { padding: 0 0 16px 36px; position: relative; }
  .timeline li::before { content: ''; position: absolute; left: 7px; top: 5px;
    width: 13px; height: 13px; border-radius: 50%; background: var(--bg); border: 2px solid var(--blue); }
  .tl-label { font-size: 11px; font-weight: 700; color: var(--blue);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }

  .pearl { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    padding: 13px 16px; margin: 9px 0; font-size: 14px; line-height: 1.6; }

  hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

  .refs { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .refs li { margin-bottom: 8px; }

  #nav { position: fixed; bottom: 0; left: 0; right: 0; height: 44px;
    background: var(--bg); border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; z-index: 200; user-select: none; }
  .nav-btn { background: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 14px; font-size: 13px; font-weight: 500; color: var(--text);
    cursor: pointer; transition: background 0.1s; }
  .nav-btn:hover { background: var(--bg2); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  #slide-counter { font-size: 13px; color: var(--muted); font-weight: 500; }
  #progress-bar  { position: fixed; top: 0; left: 0; height: 3px;
    background: var(--blue); transition: width 0.2s ease; z-index: 300; }

  @media (max-width: 720px) {
    .slide { padding: 22px 16px 58px; }
    .slide h1 { font-size: 26px; }
    .slide h2 { font-size: 20px; }
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="deck"></div>

<div id="nav">
  <button class="nav-btn" id="btn-prev">&#8592; Prev</button>
  <span id="slide-counter">1 / 1</span>
  <button class="nav-btn" id="btn-next">Next &#8594;</button>
</div>

<script>
const SLIDES = [

// ── 1. TITLE ──────────────────────────────────────────────────────────────────
{ cls: 'slide-title', html: `
<div class="slide-label">Case 31 &middot; Cardiology / Critical Care / Nephrology</div>
<h1>Acute Decompensated<br>Heart Failure</h1>
<p class="tagline">A 71-year-old man with known HFrEF presents with three days of worsening dyspnea, orthopnea, and 12-pound weight gain. He cannot complete a sentence. The team must classify his hemodynamic profile before reaching for any medication &mdash; because the wrong first move in the wrong profile can be fatal.</p>
<div class="badge-row">
  <span class="badge badge-red">Cardiology</span>
  <span class="badge badge-purple">Critical Care</span>

`},

// ── 2. CASE VIGNETTE ──────────────────────────────────────────────────────────
{ cls: 'slide-content', html: `
<h2>Case Presentation</h2>
<div class="slide-body">
<ul class="timeline">
  <li>
    <div class="tl-label">Days 1&ndash;3 (home)</div>
    <p style="font-size:14px;margin:0;">71M with HFrEF (EF 25%, ischemic), HTN, DM2, CKD3. Three days of progressive dyspnea on exertion then at rest. Weight up 12 lb from dry weight. Bilateral ankle swelling to mid-shin. Unable to lie flat. Wife calls EMS at 3 AM.</p>
  </li>
  <li>
    <div class="tl-label">ED Arrival</div>
    <p style="font-size:14px;margin:0;">HR 108, BP 162/94, RR 28, SpO2 86% RA &rarr; 92% on 4L NC. Diaphoretic, mid-sentence dyspnea. JVP 16 cm H2O. Bilateral crackles to mid-lung. S3 gallop. 3+ pitting edema bilateral LE.</p>
  </li>
  <li>
    <div class="tl-label">Workup</div>
    <p style="font-size:14px;margin:0;">BNP 3,840 pg/mL. Creatinine 2.1 (baseline 1.6). Troponin 0.08 (likely demand). CXR: cardiomegaly, bilateral pulmonary edema, Kerley B lines. ECG: LVH with strain, no ST changes.</p>
  </li>
  <li>
    <div class="tl-label">ED Management</div>
    <p style="font-size:14px;margin:0;">BiPAP initiated &rarr; SpO2 97%. IV furosemide 80 mg given. BP 148/86. Transferred to cardiac step-down. UO 2.4L in first 12h. Echo: EF 22%, no new WMA, moderate MR.</p>
  </li>
</ul>
<div class="callout callout-yellow">
  <span class="callout-label">Teaching Point</span>
  This patient is <strong>wet and warm</strong> (Stevenson Profile B) &mdash; the most common ADHF presentation (50&ndash;70%). Adequate cardiac output is maintained; the problem is elevated filling pressures. IV diuresis is first-line. Classifying the profile before prescribing prevents the most dangerous management errors.
</div>
</div>
`},

// ── 3. PATHOPHYSIOLOGY ────────────────────────────────────────────────────────
{ cls: 'slide-accent', html: `
<h2>Pathophysiology &mdash; The Vicious Cycle</h2>
<div class="slide-body">
<p>ADHF is a syndrome of acutely inadequate cardiac output and/or elevated filling pressures sufficient to cause symptoms at rest or minimal exertion. Understanding the mechanism drives rational therapy.</p>
<div class="callout callout-blue">
  <span class="callout-label">The Central Loop</span>
  Reduced cardiac output &rarr; RAAS + SNS activation &rarr; vasoconstriction (increased afterload) + salt/water retention (increased preload) &rarr; elevated LVEDP &rarr; pulmonary venous hypertension &rarr; pulmonary edema &rarr; hypoxia &rarr; further myocardial depression.
</div>
<h3>Common Precipitants &mdash; "I FAILURE"</h3>
<div class="table-wrap">
<table>
  <thead><tr><th></th><th>Precipitant</th><th>Key Clue</th></tr></thead>
  <tbody>
    <tr><td><strong>I</strong></td><td>Ischemia / Infarction</td><td>New WMA on echo; troponin; rule out ACS first in every presentation</td></tr>
    <tr><td><strong>F</strong></td><td>Forgot medications / dietary non-adherence</td><td>Most common community hospital precipitant; ask about sodium intake</td></tr>
    <tr><td><strong>A</strong></td><td>Atrial fibrillation / arrhythmia</td><td>Loss of atrial kick; rapid rate limits diastolic filling</td></tr>
    <tr><td><strong>I</strong></td><td>Infection (pneumonia, sepsis, endocarditis)</td><td>Increased demand; direct myocardial depression in sepsis</td></tr>
    <tr><td><strong>L</strong></td><td>Lifestyle (dietary Na, alcohol)</td><td>High-sodium meal; alcohol is a direct myocardial toxin</td></tr>
    <tr><td><strong>U</strong></td><td>Uncontrolled hypertension</td><td>Increased afterload; hypertensive crisis can precipitate acute pulmonary edema</td></tr>
    <tr><td><strong>R</strong></td><td>Renal failure / cardiorenal syndrome</td><td>Volume overload from inadequate clearance; diuretic resistance</td></tr>
    <tr><td><strong>E</strong></td><td>Embolism / valvular emergency</td><td>Acute severe MR or AR; aortic stenosis decompensation; massive PE</td></tr>
  </tbody>
</table>
</div>
<div class="grid-2">
  <div class="card-blue">
    <div class="card-title" style="color:var(--blue);">HFrEF (EF &lt; 40%)</div>
    <p style="font-size:13px;">Systolic dysfunction. RAAS/SNS activation is the driver. GDMT (ACEi/ARB/ARNi, beta-blocker, MRA, SGLT2i) modifies prognosis. Acute Rx: IV diuresis + afterload reduction. May need inotropes if low-output state.</p>
  </div>
  <div class="card-accent">
    <div class="card-title">HFpEF (EF &ge; 50%)</div>
    <p style="font-size:13px;">Diastolic dysfunction; stiff, noncompliant LV. Exquisitely preload-sensitive. SGLT2i (EMPEROR-Preserved, DELIVER) reduce HF hospitalization. Avoid aggressive diuresis causing hypotension.</p>
  </div>
</div>
</div>
`},

// ── 4. STEVENSON CLASSIFICATION ───────────────────────────────────────────────
{ cls: 'slide-content', html: `
<h2>Hemodynamic Classification (Stevenson)</h2>
<div style="display:flex;flex-direction:column;height:calc(100% - 72px);">
  <div class="forrester-wrap" style="flex:1;margin-bottom:0;">
    <div class="forrester-y">Perfusion &uarr; Warm / &darr; Cold</div>
    <div class="forrester-right">
      <div class="forrester" style="height:calc(100% - 28px);">
        <div class="f-cell f-a">
          <div class="f-label">Profile A &mdash; Dry &amp; Warm</div>
          <div class="f-body"><strong>Compensated.</strong> No congestion, adequate CO. No IV diuresis. Optimize GDMT. ~25% of ADHF admissions.</div>
        </div>
        <div class="f-cell f-b">
          <div class="f-label">Profile B &mdash; Wet &amp; Warm </div>
          <div class="f-body"><strong>Most common (50&ndash;70%).</strong> Elevated filling pressures, preserved CO. IV loop diuretics first-line. Add vasodilator if SBP &gt;110. Target euvolemia.</div>
        </div>
        <div class="f-cell f-l">
          <div class="f-label">Profile L &mdash; Dry &amp; Cold</div>
          <div class="f-body">Over-diuresed or low output without congestion. Cautious fluid challenge. Inotrope if MAP &lt;55. Do not diurese further.</div>
        </div>
        <div class="f-cell f-c">
          <div class="f-label">Profile C &mdash; Wet &amp; Cold</div>
          <div class="f-body"><strong>Cardiogenic shock territory.</strong> Low CO + high filling pressures. Inotropes, vasopressors, early MCS. ICU. PA catheter often warranted.</div>
        </div>
      </div>
      <div class="forrester-x">
        <span>Dry (no congestion)</span>
        <span>Congestion &rarr;</span>
        <span>Wet (congested)</span>
      </div>
    </div>
  </div>
</div>
`},

// ── 5. BEDSIDE ASSESSMENT ─────────────────────────────────────────────────────
{ cls: 'slide-accent', html: `
<h2>Bedside Assessment of Profile</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Signs of Congestion (Wet)</h3>
    <ul style="font-size:14px;">
      <li>JVD / elevated JVP (&gt;8 cm)</li>
      <li>Orthopnea, paroxysmal nocturnal dyspnea</li>
      <li>S3 gallop (volume-overloaded LV)</li>
      <li>Hepatojugular reflux (elevated RAP)</li>
      <li>Bilateral crackles, dullness to percussion</li>
      <li>Peripheral edema (right-sided congestion)</li>
      <li>Ascites (chronic right HF)</li>
    </ul>
    <h3 style="margin-top:14px;">POCUS &mdash; Lung Ultrasound</h3>
    <ul style="font-size:14px;">
      <li><strong>B-lines &gt;3 per field bilaterally</strong> = pulmonary edema; highly sensitive; bedside in &lt;5 min</li>
      <li>IVC &gt;2.1 cm with &lt;50% inspiratory collapse = RAP &gt;15 mmHg</li>
    </ul>
  </div>
  <div>
    <h3>Signs of Low Output (Cold)</h3>
    <ul style="font-size:14px;">
      <li>Cool, mottled extremities</li>
      <li>Narrow pulse pressure (&lt;25% of SBP)</li>
      <li>Pulsus alternans (severely reduced LV function)</li>
      <li>Altered mental status (cerebral hypoperfusion)</li>
      <li>Rising lactate despite adequate volume</li>
      <li>Oliguria unresponsive to diuresis</li>
    </ul>
    <h3 style="margin-top:14px;">Biomarkers</h3>
    <div class="table-wrap" style="margin-top:8px;">
    <table>
      <thead><tr><th>Marker</th><th>Cutoffs</th><th>Pitfall</th></tr></thead>
      <tbody>
        <tr><td><strong>BNP</strong></td><td>&lt;100 unlikely; &gt;400 likely ADHF</td><td>Falsely low in obesity (BMI &gt;35) &mdash; use POCUS + exam</td></tr>
        <tr><td><strong>NT-proBNP</strong></td><td>Age-stratified: &gt;450 (&lt;50y), &gt;900 (50&ndash;75y), &gt;1800 (&gt;75y) pg/mL</td><td>Longer half-life than BNP; less useful for rapid serial monitoring</td></tr>
      </tbody>
    </table>
    </div>
  </div>
</div>
<div class="callout callout-blue">
  <span class="callout-label">ACC/AHA 2022 &mdash; Class I, LOE A</span>
  BNP or NT-proBNP recommended to support diagnosis and establish prognosis. Serial in-hospital measurement guides adequacy of decongestion.
</div>
</div>
`},

// ── 6. IV DIURESIS ────────────────────────────────────────────────────────────
{ cls: 'slide-content', html: `
<h2>Decongestion: IV Loop Diuretics (Profile B)</h2>
<div class="slide-body">
<div class="callout callout-red">
  <span class="callout-label">Core Principle</span>
  Do NOT give IV fluids to a wet patient. Do NOT aggressively diurese a cold patient before addressing low output. Gut edema in ADHF reduces oral furosemide bioavailability up to 50% &mdash; always convert to IV.
</div>
<div class="table-wrap">
<table>
  <thead><tr><th>Decision</th><th>Recommendation</th><th>Evidence</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>Starting dose</strong></td>
      <td>IV furosemide at 2.5&times; the patient's total daily oral dose</td>
      <td>DOSE trial (NEJM 2011): high-dose achieved greater diuresis without worse renal outcomes at 72h vs. low-dose</td>
    </tr>
    <tr>
      <td><strong>Bolus vs. infusion</strong></td>
      <td>No significant outcome difference. Bolus is simpler; infusion for resistant diuresis.</td>
      <td>DOSE trial: equivalent net fluid loss and dyspnea relief at 72h</td>
    </tr>
    <tr>
      <td><strong>Response assessment</strong></td>
      <td>Spot urine Na at 1&ndash;2h post-dose. Urine Na &gt;50&ndash;70 mEq/L = adequate. Target UO &gt;0.5&ndash;1 mL/kg/h.</td>
      <td>Natriuresis-guided strategy (Felker et al., JACC 2020)</td>
    </tr>
    <tr>
      <td><strong>Diuretic resistance</strong></td>
      <td>Add metolazone 2.5&ndash;5 mg PO 30 min before loop diuretic (sequential nephron blockade)</td>
      <td>ACC/AHA 2022 Class IIa</td>
    </tr>
    <tr>
      <td><strong>Adjunct: acetazolamide</strong></td>
      <td>Acetazolamide 500 mg IV daily added to loop diuretic in selected patients with diuretic resistance or inadequate natriuresis</td>
      <td><strong>ADVOR trial (NEJM 2022):</strong> improved successful decongestion vs. loop diuretic alone. Monitor: bicarbonate, K, renal function. Short-term inpatient strategy; not a chronic agent.</td>
    </tr>
    <tr>
      <td><strong>Monitoring</strong></td>
      <td>BMP q12&ndash;24h; daily weights; strict I&amp;Os; replete K &gt;4.0 and Mg &gt;2.0</td>
      <td>Hypokalemia increases arrhythmia risk; hypomagnesemia impairs K repletion</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout callout-green">
  <span class="callout-label">Pearl &mdash; Urine Na at 2 Hours</span>
  Urine Na &lt;50 mEq/L at 1&ndash;2h should prompt dose doubling or adding metolazone immediately &mdash; do not wait 6 hours to discover the first dose failed. Urine Na &gt;70 mEq/L = adequate response; continue current regimen.
</div>
</div>
`},

{ cls: 'slide-accent', html: `
<h2>Vasodilators &amp; Inotropes</h2>
<div class="slide-body">
<h3>Vasodilators (Profile B, SBP &gt;110 mmHg)</h3>
<div class="grid-2">
  <div class="card-blue">
    <div class="card-title" style="color:var(--blue);">IV Nitroglycerin</div>
    <p style="font-size:13px;">Venodilator at low doses; arterial at high doses. First-line for hypertensive ADHF (SBP &gt;140). Start 5&ndash;10 mcg/min, titrate q3&ndash;5 min. Tolerance within 24h. Absolute CI with PDE5 inhibitors.</p>

    <p style="font-size:13px;">Potent balanced vasodilator. Preferred for hypertensive emergency + ADHF or significant MR/AR. Requires arterial line. Cyanide toxicity risk with &gt;72h use or renal failure. Reflex tachycardia &mdash; give beta-blocker first if dissection concern.</p>
  </div>
</div>

<div class="callout callout-red">

</div>
<div class="table-wrap">

<h2>ICU Triage &mdash; When Step-Down Is Not Enough</h2>
<div class="slide-body">
<div class="callout callout-red">

      <li><strong>Intubation or impending airway compromise</strong></li>

// ── 9. GDMT ───────────────────────────────────────────────────────────────────
{ cls: 'slide-content', html: `
<h2>GDMT During Hospitalization</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Drug Class</th><th>During ADHF</th><th>Rationale</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>ACEi / ARB / ARNi (sacubitril-valsartan)</strong></td>
      <td>Hold if SBP &lt;90, K &gt;5.5, or Cr rising rapidly. Continue if stable.</td>
      <td>Restart before discharge &mdash; reduces 30-day readmission. Do not discharge without a resumption plan.</td>
    </tr>
    <tr>
      <td><strong>Beta-blocker</strong></td>
      <td><strong style="color:var(--red);">Continue if already prescribed.</strong> Hold only in cardiogenic shock or HR &lt;50.</td>
      <td>Abrupt cessation causes rebound sympathetic activation, worsening tachycardia and ischemia. Do NOT start a new beta-blocker during active ADHF.</td>
    </tr>
    <tr>
      <td><strong>MRA (spironolactone / eplerenone)</strong></td>
      <td>Hold if K &gt;5.0 or eGFR &lt;30</td>
      <td>Hyperkalemia risk amplified with active diuresis and concurrent RAAS blockade</td>
    </tr>
    <tr>
      <td><strong>SGLT2 inhibitor (empagliflozin / dapagliflozin)</strong></td>
      <td><strong style="color:var(--green);">Continue if on; consider starting before discharge</strong></td>
      <td>EMPULSE trial (NEJM 2022): in-hospital initiation improved composite outcome vs. placebo. Do not defer to outpatient visit.</td>
    </tr>
    <tr>
      <td><strong>Oral diuretics</strong></td>
      <td>Hold; convert to IV</td>
      <td>Gut edema reduces oral furosemide bioavailability up to 50% in active ADHF</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout callout-yellow">
  <span class="callout-label">The Beta-Blocker Rule &mdash; Most Common ADHF Medication Error</span>
  The most consequential and most common ADHF medication error is abruptly discontinuing a patient's home beta-blocker at admission. Continue it in all but cardiogenic shock or severe symptomatic bradycardia. Rebound sympathetic activation from abrupt withdrawal worsens tachycardia, ischemia, and arrhythmia risk.
</div>
</div>
`},

// ── 9. CARDIORENAL SYNDROME ───────────────────────────────────────────────────
{ cls: 'slide-accent', html: `
<h2>Cardiorenal Syndrome</h2>
<div class="slide-body">
<p>Worsening renal function (WRF) occurs in <strong>25&ndash;40% of ADHF admissions</strong>. The instinct to hold diuretics when creatinine rises is frequently the wrong response.</p>
<div class="callout callout-blue">
  <span class="callout-label">Key Concept (Mullens et al., JACC 2009)</span>
  Elevated CVP transmitted to renal veins reduces GFR. Venous congestion AKI is treated by <strong>reducing CVP via diuresis</strong>, not by giving IV fluids. Hemoconcentration (rising hematocrit during decongestion) correlates with improved 180-day survival.
</div>
<div class="grid-2">
  <div class="card-green">
    <div class="card-title" style="color:var(--green);">Acceptable &mdash; Continue Diuresis</div>
    <ul style="font-size:13px;">
      <li>Good urine output maintained</li>
      <li>Patient clinically improving (dyspnea, exam)</li>
      <li>Still wet on exam; weight above dry weight</li>
      <li>Rising hematocrit (hemoconcentration)</li>
      <li>Cr rise &lt;0.3&ndash;0.5 mg/dL above baseline</li>
    </ul>
  </div>
  <div class="card-red">
    <div class="card-title" style="color:var(--red);">Concerning &mdash; Reassess Profile</div>
    <ul style="font-size:13px;">
      <li>Falling urine output despite ongoing diuresis</li>
      <li>Weight below dry weight</li>
      <li>BUN/Cr ratio &gt;20 (prerenal pattern)</li>
      <li>Orthostatic hypotension developing</li>
      <li>Signs of low output emerging (Profile L or C)</li>
    </ul>
  </div>
</div>
<h3>Iron Deficiency &mdash; Do Not Miss</h3>
<p style="font-size:14px;">Iron deficiency (ferritin &lt;100 ng/mL <em>or</em> ferritin 100&ndash;299 + TSAT &lt;20%) is present in ~50% of ADHF admissions and worsens outcomes independent of anemia. <strong>AFFIRM-AHF (Lancet 2020):</strong> IV ferric carboxymaltose reduced recurrent HF hospitalizations. Check iron studies on every ADHF admission. Oral iron is poorly absorbed in HF &mdash; IV is preferred.</p>
</div>
`},

// ── 10. DISCHARGE CRITERIA ────────────────────────────────────────────────────
{ cls: 'slide-content', html: `
<h2>Discharge Criteria &amp; Transition of Care</h2>
<div class="slide-body">
<p>30-day HF readmission rates remain <strong>~20&ndash;25% nationally</strong>. Premature discharge before adequate decongestion is the single most preventable driver.</p>
<div class="callout callout-red">
  <span class="callout-label">Core Principle</span>
  The strongest predictor of 30-day readmission is <strong>persistent congestion at discharge</strong> &mdash; not creatinine elevation. Patients discharged with residual JVD or edema have 3&ndash;5&times; higher 30-day readmission risk. Do not discharge a patient who is not yet dry.
</div>
<h3>Safe Discharge Checklist (ACC/AHA 2022)</h3>
<div class="grid-2">
  <div>
    <ul style="font-size:14px;">
      <li>At or near dry weight; JVP normalized; edema resolved or at stable baseline</li>
      <li>Euvolemic for &ge;24h on the <em>oral</em> discharge diuretic regimen</li>
      <li>Stable renal function and electrolytes on discharge doses</li>
      <li>Ambulatory SpO2 &ge;92% on room air</li>
    </ul>
  </div>
  <div>
    <ul style="font-size:14px;">
      <li>GDMT optimized or explicit up-titration plan documented</li>
      <li>Patient education: daily weights, low-Na diet (&lt;2g/day), when to call or return</li>
      <li>Follow-up scheduled <strong>ideally within 7 days</strong> (2024 ACC Expert Consensus; 7-day window tied to CMS quality metrics and post-discharge vulnerable period data)</li>
      <li>BNP/NT-proBNP at discharge documented (both absolute value and trajectory are prognostically meaningful)</li>
    </ul>
  </div>
</div>
<h3 style="margin-top:8px;">Key Trials at a Glance</h3>
<div class="table-wrap">
<table>
  <thead><tr><th>Trial</th><th>Question</th><th>Finding</th></tr></thead>
  <tbody>
    <tr><td><strong>DOSE</strong> (NEJM 2011)</td><td>High- vs. low-dose furosemide; bolus vs. infusion</td><td>High-dose: greater diuresis, no worse renal outcomes. Bolus = infusion.</td></tr>
    <tr><td><strong>EMPULSE</strong> (NEJM 2022)</td><td>Empagliflozin started during ADHF admission</td><td>Improved composite of death, HF events, symptom burden vs. placebo. In-hospital initiation is safe.</td></tr>
    <tr><td><strong>EMPEROR-Preserved</strong> (NEJM 2021)</td><td>Empagliflozin in HFpEF</td><td>21% RRR in CV death or HF hospitalization &mdash; first GDMT proven in HFpEF.</td></tr>
    <tr><td><strong>AFFIRM-AHF</strong> (Lancet 2020)</td><td>IV ferric carboxymaltose post-ADHF</td><td>Reduced recurrent HF hospitalizations in iron-deficient HFrEF patients.</td></tr>
    <tr><td><strong>3CPO</strong> (NEJM 2008)</td><td>CPAP/BiPAP in acute cardiogenic pulmonary edema</td><td>NIV reduces intubation rate; CPAP preferred for acute pulmonary edema.</td></tr>
  </tbody>
</table>
</div>
</div>
`},

// ── 11. CLINICAL PEARLS ───────────────────────────────────────────────────────
{ cls: 'slide-accent', html: `
<h2>Clinical Pearls</h2>
<div class="slide-body">
<div class="pearl"> <strong>The wet patient needs diuresis, not IV fluids.</strong> The most common ADHF error is giving maintenance IV fluids to a patient with 10&ndash;20 L of excess volume. Dyspnea is from elevated pulmonary venous pressure, not dehydration. A mildly rising creatinine during aggressive diuresis is acceptable if the patient is improving clinically.</div>
<div class="pearl"> <strong>Do not stop the beta-blocker.</strong> Abrupt withdrawal causes rebound sympathetic activation. Continue the home beta-blocker in all but cardiogenic shock. Do NOT start a new beta-blocker during active ADHF. This is the most common and most consequential ADHF medication error.</div>
<div class="pearl"> <strong>Urine Na at 2 hours predicts diuretic response.</strong> Urine Na &gt;50&ndash;70 mEq/L = adequate natriuresis; continue current dose. Urine Na &lt;50 mEq/L = double the dose or add metolazone. Do not wait 6 hours to discover the first dose failed.</div>
<div class="pearl"> <strong>Start the SGLT2 inhibitor in-hospital.</strong> EMPULSE (NEJM 2022): empagliflozin initiated during ADHF admission improved composite outcomes vs. placebo. Do not defer to outpatient follow-up &mdash; the in-hospital start is now guideline-supported.</div>
<div class="pearl"> <strong>Normal BNP does not exclude ADHF in obese patients.</strong> Adipose tissue clears natriuretic peptides via NPR-C receptors. BMI &gt;35 can produce a falsely normal BNP in a patient with frank pulmonary edema. Use POCUS lung ultrasound (B-lines) and clinical exam to supplement biomarkers in this population.</div>
<div class="pearl"> <strong>Check iron studies on every ADHF admission.</strong> Iron deficiency worsens HF outcomes independent of anemia. IV ferric carboxymaltose reduces recurrent HF hospitalizations (AFFIRM-AHF). Oral iron is poorly absorbed in HF &mdash; always use IV in this context.</div>
</div>
`},

// ENGINE
const deck = document.getElementById('deck');
const counter = document.getElementById('slide-counter');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const bar = document.getElementById('progress-bar');
let cur = 0;

SLIDES.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide ' + s.cls;
  el.innerHTML = s.html;
  if (i === 0) el.classList.add('active');
  deck.appendChild(el);
});

const slides = deck.querySelectorAll('.slide');

function goTo(n) {
  if (n < 0 || n >= slides.length) return;
  slides[cur].classList.remove('active');
  cur = n;
  slides[cur].classList.add('active');
  const body = slides[cur].querySelector('.slide-body');
  if (body) body.scrollTop = 0;
  counter.textContent = (cur + 1) + ' / ' + slides.length;
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === slides.length - 1;
  bar.style.width = ((cur + 1) / slides.length * 100) + '%';
}

btnPrev.addEventListener('click', () => goTo(cur - 1));
btnNext.addEventListener('click', () => goTo(cur + 1));
document.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown',' '].includes(e.key)) { e.preventDefault(); goTo(cur + 1); }
  if (['ArrowLeft','ArrowUp'].includes(e.key))        { e.preventDefault(); goTo(cur - 1); }
});
let tx = 0;
deck.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
deck.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) dx < 0 ? goTo(cur + 1) : goTo(cur - 1);
}, { passive: true });

goTo(0);
</script>
