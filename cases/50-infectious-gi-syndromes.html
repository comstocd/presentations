<head>

<title>Topic 50 — Infectious GI Syndromes | Morning Report</title>
<style>
  :root{
    --bg:#ffffff;--bg2:#f6f8fa;--bg3:#eaeef2;--border:#d0d7de;--text:#1f2328;--muted:#656d76;
    --blue:#0969da;--blue-bg:#ddf4ff;--blue-border:#54aeff;
    --green:#1a7f37;--green-bg:#dafbe1;--green-border:#4ac26b;
    --yellow:#9a6700;--yellow-bg:#fff8c5;--yellow-border:#d4a72c;
    --red:#cf222e;--red-bg:#ffebe9;--red-border:#ff8182;
    --purple:#8250df;--purple-bg:#fbefff;--purple-border:#c297ff;
    --orange:#bc4c00;--orange-bg:#fff1e5;--orange-border:#fb8f44;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:18px;line-height:1.5;}
  #deck{width:100%;height:100%;position:relative;overflow:hidden;}
  .slide{position:absolute;top:0;left:0;width:100%;height:100%;
    display:flex;flex-direction:column;padding:34px 52px 54px;
    opacity:0;pointer-events:none;transition:opacity .2s;overflow:hidden;}
  .slide.active{opacity:1;pointer-events:all;}
  .slide-body{flex:1;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;padding-right:4px;}
  .slide-body::-webkit-scrollbar{width:3px;}
  .slide-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  .slide-label{font-size:13px;font-weight:600;text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted);margin-bottom:10px;}
  .slide h1{font-size:38px;font-weight:700;line-height:1.1;margin-bottom:14px;}
  .slide h2{font-size:26px;font-weight:700;padding-bottom:9px;
    border-bottom:2px solid var(--border);margin-bottom:14px;}
  .slide h3{font-size:19px;font-weight:600;margin:12px 0 6px;}
  .slide p{font-size:16px;margin-bottom:8px;}
  .slide ul,.slide ol{padding-left:20px;margin-bottom:8px;}
  .slide li{font-size:16px;margin-bottom:5px;line-height:1.4;}
  .slide strong{font-weight:600;}
  .tagline{font-size:19px;color:var(--muted);max-width:660px;line-height:1.5;margin-bottom:20px;}
  .badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .badge{font-size:13px;font-weight:600;padding:3px 11px;border-radius:99px;border:1px solid;}
  .badge-blue  {background:var(--blue-bg);  color:var(--blue);  border-color:var(--blue-border);}
  .badge-green {background:var(--green-bg); color:var(--green); border-color:var(--green-border);}
  .badge-red   {background:var(--red-bg);   color:var(--red);   border-color:var(--red-border);}
  .badge-yellow{background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow-border);}
  .badge-purple{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-border);}
  .badge-orange{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-border);}
  .callout{border-radius:8px;padding:11px 15px;margin:9px 0;border-left:4px solid;font-size:15px;line-height:1.5;}
  .callout-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:3px;}
  .c-blue  {background:var(--blue-bg);  border-color:var(--blue);  color:#0550ae;} .c-blue   .callout-label{color:var(--blue);}
  .c-yellow{background:var(--yellow-bg);border-color:var(--yellow-border);color:var(--yellow);} .c-yellow .callout-label{color:var(--yellow);}
  .c-red   {background:var(--red-bg);   border-color:var(--red);   color:#82071e;} .c-red    .callout-label{color:var(--red);}
  .c-green {background:var(--green-bg); border-color:var(--green); color:#116329;} .c-green  .callout-label{color:var(--green);}
  .c-orange{background:var(--orange-bg);border-color:var(--orange-border);color:var(--orange);} .c-orange .callout-label{color:var(--orange);}
  .c-purple{background:var(--purple-bg);border-color:var(--purple);color:#5a32a3;} .c-purple .callout-label{color:var(--purple);}
  .table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border);margin:9px 0;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{background:var(--bg3);color:var(--muted);font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);}
  td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top;font-size:14px;}
  tr:last-child td{border-bottom:none;}
  tr:nth-child(even) td{background:var(--bg2);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:9px 0;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:9px 0;}
  .card      {background:var(--bg);        border:1px solid var(--border);       border-radius:10px;padding:13px 15px;}
  .card-red  {background:var(--red-bg);    border:1px solid var(--red-border);   border-radius:10px;padding:13px 15px;}
  .card-green{background:var(--green-bg);  border:1px solid var(--green-border); border-radius:10px;padding:13px 15px;}
  .card-blue {background:var(--blue-bg);   border:1px solid var(--blue-border);  border-radius:10px;padding:13px 15px;}
  .card-yellow{background:var(--yellow-bg);border:1px solid var(--yellow-border);border-radius:10px;padding:13px 15px;}
  .card-orange{background:var(--orange-bg);border:1px solid var(--orange-border);border-radius:10px;padding:13px 15px;}
  .card-purple{background:var(--purple-bg);border:1px solid var(--purple-border);border-radius:10px;padding:13px 15px;}
  .card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;}
  .img-frame{text-align:center;margin:10px 0;}
  .img-frame img{max-height:340px;max-width:100%;border-radius:6px;border:1px solid var(--border);}
  .img-cap{font-size:11px;color:var(--muted);text-align:center;margin-top:4px;font-weight:600;font-style:italic;}
  .refs{font-size:13px;color:var(--muted);line-height:1.7;}
  .refs li{margin-bottom:7px;}
  #nav{position:fixed;bottom:0;left:0;right:0;height:44px;background:var(--bg);
    border-top:1px solid var(--border);display:flex;align-items:center;
    justify-content:space-between;padding:0 16px;z-index:200;user-select:none;}
  .nav-btn{background:none;border:1px solid var(--border);border-radius:6px;
    padding:5px 14px;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;}
  .nav-btn:hover{background:var(--bg2);}
  .nav-btn:disabled{opacity:.3;cursor:default;}
  #slide-counter{font-size:14px;color:var(--muted);font-weight:500;}
  #progress-bar{position:fixed;top:0;left:0;height:3px;background:var(--blue);transition:width .2s;z-index:300;}
  @media(max-width:720px){
    .slide{padding:18px 14px 54px;}
    .slide h1{font-size:26px;} .slide h2{font-size:20px;}
    .grid-2,.grid-3{grid-template-columns:1fr;}
  }
</style>

  <span class="callout-label">MKSAP 20 — Indications for Stool Testing</span>
  Dysentery or suspected sepsis; immunocompromised host; requires hospitalization; prolonged symptoms (&gt;1 week); outbreak setting (food handlers, healthcare workers, daycare). Most immunocompetent adults with mild acute watery diarrhea &lt;3 days do <strong>not</strong> need stool testing or antibiotics.
</div>
<div class="callout c-blue">
  <span class="callout-label">C. difficile Testing Rule</span>
  Test <strong>only</strong> unformed stool in patients with &ge;3 new-onset unexplained loose stools/24 h (not on laxatives). Never test formed stool. Never use as test of cure.
</div>
<div class="callout c-red">
  <span class="callout-label">The "3-Day Rule" (Inpatient) — IDSA 2017</span>
  For patients hospitalized &gt;3 days, routine stool pathogen testing other than C. difficile has very low yield and is generally not indicated (IDSA Infectious Diarrhea Guidelines, 2017). Test for C. difficile if clinically appropriate.
</div>
</div>
`},

// 4. BACTERIAL PATHOGENS TABLE
{html:`
<h2>Bacterial Diarrhea — Pathogen-Specific Management</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Pathogen</th><th>Source / Incubation</th><th>Key Features</th><th>Treat?</th><th>Drug of Choice</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>Campylobacter</strong></td>
      <td>Undercooked poultry; unpasteurized milk. Incubation ~3 days</td>
      <td>Usually watery; occasionally bloody. Among the most common bacterial causes of diarrhea globally. Trigger of Guillain-Barr&eacute; syndrome (GBS)</td>
      <td>Only if severe, prolonged (&gt;1 wk), or immunocompromised</td>
      <td><strong>Azithromycin preferred</strong> (high fluoroquinolone resistance, esp. SE Asia)</td>
    </tr>
    <tr>
      <td><strong>Shigella</strong></td>
      <td>Fecal-oral, person-to-person. Incubation ~3 days. Inoculum as low as 10–100 organisms</td>
      <td>Dysentery (fever, bloody/mucoid stools, tenesmus). <em>S. dysenteriae</em> type 1 produces Shiga toxin</td>
      <td>Recommended for severe illness, immunocompromised, or outbreak setting; generally recommended given low inoculum and transmissibility</td>
      <td>Azithromycin or fluoroquinolone; ceftriaxone. Get susceptibilities — increasing resistance to TMP-SMX and ampicillin</td>
    </tr>
    <tr>
      <td><strong>Salmonella</strong> (nontyphoidal)</td>
      <td>Poultry, eggs, reptiles/amphibians. Incubation &lt;3 days</td>
      <td>Watery diarrhea (not usually bloody), fever, cramps. Bacteremia in &lt;5%. Sickle cell disease: osteomyelitis risk</td>
      <td>Most uncomplicated cases in immunocompetent adults: <strong>supportive care only</strong>. Antibiotics prolong carriage and do not shorten illness in mild disease</td>
      <td>Fluoroquinolone (ciprofloxacin) or ceftriaxone when indicated: bacteremia or severe illness; infants; adults &ge;65; adults &ge;50 <strong>with</strong> significant joint disease or valvular/endovascular/cardiac abnormalities; immunocompromised; sickle cell disease; prosthetic hardware</td>
    </tr>
    <tr>
      <td><strong>ETEC</strong></td>
      <td>Travelers' diarrhea; contaminated food/water. Incubation 1–3 days</td>
      <td>Watery, nonbloody; low-grade or no fever. Self-limited (~4 days)</td>
      <td>If symptoms restrict activity</td>
      <td>Fluoroquinolone, azithromycin, or rifaximin. Azithromycin preferred in SE Asia</td>
    </tr>
    <tr>
      <td><strong>STEC / EHEC</strong> (O157:H7)</td>
      <td>Undercooked ground beef, contaminated produce. Incubation ~3 days</td>
      <td><strong>Bloody diarrhea WITHOUT fever</strong> (distinguishing feature). HUS in &lt;10% of O157:H7 cases</td>
      <td><strong>NO antibiotics</strong> (may increase HUS risk). <strong>NO loperamide</strong></td>
      <td>Supportive care only</td>
    </tr>
    <tr>
      <td><strong>Yersinia enterocolitica</strong></td>
      <td>Undercooked pork; iron overload states at high risk. Incubation ~5 days</td>
      <td>RLQ pain mimicking appendicitis; pharyngitis; mesenteric adenitis. Reactive arthritis</td>
      <td>Uncomplicated in immunocompetent: none</td>
      <td>Fluoroquinolone (ciprofloxacin); ceftriaxone + gentamicin for bacteremia/sepsis</td>
    </tr>
    <tr>
      <td><strong>Vibrio parahaemolyticus</strong></td>
      <td>Undercooked shellfish (oysters). Incubation ~2 days</td>
      <td>Bloody diarrhea, fever, vomiting. Wound infections from estuarine water. Septicemia in liver disease, iron overload, diabetes</td>
      <td>Severe noninvasive GI illness or invasive disease</td>
      <td>Doxycycline (noninvasive severe); doxycycline + ceftriaxone (septicemia)</td>
    </tr>
  </tbody>
</table>
</div>
</div>
`},

// 5. STEC / HUS
{html:`
<h2>STEC and Hemolytic Uremic Syndrome (HUS)</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>STEC Infection</h3>
    <ul>
      <li><em>E. coli</em> O157:H7 is the classic serotype; non-O157 STEC increasingly recognized</li>
      <li>Produces Shiga toxin (Stx); <strong>Stx2</strong> is the primary driver of HUS (higher risk than Stx1)</li>
      <li>Incubation ~3 days; <strong>bloody diarrhea WITHOUT fever</strong></li>
      <li>HUS develops in &lt;10% of O157:H7 infections, approximately 7 days after diarrhea onset</li>
      <li>Alert the laboratory: requires specialized media and Shiga toxin immunoassay or NAAT for toxin genes</li>
    </ul>
    <div class="callout c-red">
      <span class="callout-label">Critical Management — Do NOT</span>
      <strong>No antibiotics</strong> — evidence of harm; may increase Shiga toxin release and HUS risk (IDSA guidelines, NEJM 2023 review)<br>
      <strong>No antimotility agents</strong> (loperamide) — increases toxin contact time with colonic mucosa
    </div>
  </div>
  <div>
    <h3>HUS Triad</h3>
    <div class="card-red" style="margin-bottom:10px;">
      <div class="card-title">Microangiopathic Hemolytic Anemia (MAHA)</div>
      Schistocytes on smear, elevated LDH, low haptoglobin, indirect hyperbilirubinemia
    </div>
    <div class="card-red" style="margin-bottom:10px;">
      <div class="card-title">Thrombocytopenia</div>
      Platelet consumption in microvascular thrombi
    </div>
    <div class="card-red">
      <div class="card-title">Acute Kidney Injury</div>
      Direct Shiga toxin injury to glomerular endothelium
    </div>
    <div class="callout c-yellow" style="margin-top:10px;">
      <span class="callout-label">HUS vs. TTP — Board Distinction</span>
      TTP: prominent neurologic findings, ADAMTS13 activity &lt;10%, responds to plasma exchange. STEC-HUS does <strong>not</strong> respond to plasma exchange. Platelet transfusion in HUS only for active life-threatening bleeding.
    </div>
  </div>
</div>
<div class="callout c-green">
  <span class="callout-label">Supportive Management of HUS</span>
  Aggressive IV fluid resuscitation (volume depletion worsens AKI). Monitor CBC, BMP, LDH daily. Dialysis if needed. Avoid nephrotoxins.
</div>
</div>
`},

// 6. C. DIFFICILE — DIAGNOSIS
{html:`
<h2>C. difficile Infection — Epidemiology and Diagnosis</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Risk Factors</h3>
    <ul>
      <li>Antibiotics — especially fluoroquinolones, clindamycin, cephalosporins (any antibiotic can trigger)</li>
      <li>Hospitalization; age &ge;65</li>
      <li>Severe underlying comorbidities; IBD</li>
      <li>Solid organ transplant; chemotherapy</li>
      <li>Gastric acid suppression (PPI — association reported; causality uncertain)</li>
      <li>GI surgery</li>
    </ul>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">Infection Control</span>
      Handwashing with <strong>soap and water</strong> is essential — C. difficile spores are <strong>not</strong> killed by alcohol-based hand gels. Antibiotic stewardship is the primary prevention strategy.
    </div>
  </div>
  <div>
    <h3>Diagnosis</h3>
    <p style="font-size:14px;"><strong>Test only unformed stool</strong> from patients with unexplained new-onset diarrhea &ge;3 times/24 h (not on laxatives).</p>
    <div class="table-wrap" style="margin-top:6px;">
    <table>
      <thead><tr><th>Test</th><th>Sensitivity</th><th>Specificity</th><th>Role</th></tr></thead>
      <tbody>
        <tr><td>EIA for toxin A/B</td><td>Low</td><td>High</td><td>Not recommended as standalone</td></tr>
        <tr><td>GDH EIA</td><td>High</td><td>Low</td><td>Screening component of multistep algorithm</td></tr>
        <tr><td><strong>NAAT (PCR)</strong></td><td>High</td><td>High</td><td>Preferred if strict stool submission criteria met</td></tr>
        <tr><td>NAAT + toxin EIA</td><td>High</td><td>High</td><td>Preferred multistep approach when criteria not strictly met</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Key Diagnostic Rules</span>
      NAAT alone is sufficient <em>only</em> when strict submission criteria are met. In other settings, use multistep: GDH + toxin EIA (with NAAT when discordant), or NAAT + toxin EIA. <strong>Never test formed stool. Never retest for cure.</strong>
    </div>
  </div>
</div>
</div>
`},

  <div class="img-cap">CDI management algorithm including recurrent disease. Source: ACG Clinical Guidelines 2021; Kelly et al.</div>

<div class="table-wrap" style="margin-top:8px;">
<table>
  <thead><tr><th>Severity</th><th>Criteria</th><th>Treatment (IDSA/SHEA 2021)</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>Nonsevere</strong></td>
      <td>WBC &lt;15,000/&micro;L <em>AND</em> Cr &lt;1.5 mg/dL</td>
      <td>Fidaxomicin 200 mg BID &times; 10 d (preferred) <br>OR Vancomycin 125 mg QID &times; 10 d (alternative)<br>If neither available: metronidazole 500 mg TID &times; 10–14 d</td>
    </tr>
    <tr>
      <td><strong>Severe</strong></td>
      <td>WBC &ge;15,000/&micro;L <em>OR</em> Cr &ge;1.5 mg/dL</td>
      <td>Fidaxomicin 200 mg BID &times; 10 d (preferred)<br>OR Vancomycin 125 mg QID &times; 10 d (alternative)</td>
    </tr>
    <tr>
      <td><strong>Fulminant</strong></td>
      <td>Hypotension, ileus, megacolon, shock (regardless of WBC/Cr)</td>
      <td>Vancomycin 500 mg QID PO or via NGT<br><em>PLUS</em> Metronidazole 500 mg IV q8h<br>If ileus: add vancomycin 500 mg PR q6h<br>Surgical evaluation for all fulminant cases</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-red">
  <span class="callout-label">Board Pearls</span>
  Fidaxomicin preferred over vancomycin for initial and first recurrence — lower recurrence rates in Phase 3 trials (approximately 13% vs 27% with vancomycin per OPTion trial data; IDSA/SHEA 2021 endorses fidaxomicin as preferred based on this evidence). Metronidazole is <strong>no longer first-line</strong> (inferior cure rates vs. fidaxomicin and vancomycin). IV metronidazole is used <strong>only in fulminant disease</strong> — secreted into inflamed colon. Fidaxomicin has not been studied in fulminant CDI.
</div>
</div>
`},

// 8. RECURRENT CDI
{html:`
<h2>Recurrent C. difficile Infection</h2>
<div class="slide-body">
<p>Recurrence occurs in approximately 25% of patients after initial treatment. After a second recurrence, the risk of further recurrence climbs substantially.</p>
<div class="table-wrap">
<table>
  <thead><tr><th>Episode</th><th>Preferred Treatment</th><th>Alternatives</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>First recurrence</strong> (2nd episode)</td>
      <td>Fidaxomicin 200 mg BID &times; 10 d<br>OR fidaxomicin extended-pulsed: BID &times; 5 d, then every other day &times; 20 d</td>
      <td>Vancomycin tapered/pulsed regimen (e.g., 125 mg QID &times; 10–14 d, then BID &times; 7 d, then QD &times; 7 d, then q2–3 d &times; 2–8 wk)<br>Vancomycin 125 mg QID &times; 10 d if metronidazole was used for first episode</td>
    </tr>
    <tr>
      <td><strong>Second and subsequent recurrences</strong> (&ge;3rd episode)</td>
      <td>Fidaxomicin (standard or extended-pulsed)<br>OR Vancomycin taper/pulse<br>OR Vancomycin &times; 10 d then rifaximin 400 mg TID &times; 20 d ("chaser")<br>OR Fecal microbiota products / FMT</td>
      <td>FDA-approved biotherapeutics:<br>&bull; Fecal microbiota live-jslm (Rebyota) — rectal suspension<br>&bull; Fecal microbiota spores live-brpk (Vowst) — oral capsule</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-blue">
  <span class="callout-label">Bezlotoxumab</span>
  Anti-toxin B monoclonal antibody (Zinplava). Single infusion given concurrently with antibiotic treatment. Reduces recurrence in high-risk patients (age &ge;65, severe/fulminant disease, prior CDI, immunocompromised). Not a treatment for active CDI — recurrence prevention only.
</div>
<div class="callout c-yellow">
  <span class="callout-label">Board Pearl</span>
  Retesting stool for C. difficile after treatment in patients who have no symptoms is <strong>not recommended</strong>. Discontinue the inciting antibiotic whenever possible — continuing it increases recurrence risk.
</div>
</div>
`},

// 9. VIRAL AND TOXIN-MEDIATED
{html:`
<h2>Viral Gastroenteritis and Toxin-Mediated Food Poisoning</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Viral Gastroenteritis</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Pathogen</th><th>Key Features</th><th>Treatment</th></tr></thead>
      <tbody>
        <tr>
          <td><strong>Norovirus</strong></td>
          <td>Most common cause of gastroenteritis in the US. All ages. Classic settings: cruise ships, nursing homes, hospitals. Incubation 12–48 h. Illness 1–3 days. Viral shedding up to 2 weeks after resolution.</td>
          <td>Supportive. <strong>Soap and water handwashing</strong> — not killed by alcohol. No antiviral available.</td>
        </tr>
        <tr>
          <td><strong>Rotavirus</strong></td>
          <td>Primarily children &lt;5 years; declining with childhood vaccination.</td>
          <td>Supportive.</td>
        </tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">Immunocompromised Pearl</span>
      In transplant recipients, norovirus can cause <strong>chronic diarrhea lasting months to years</strong>. Management includes reduction of immunosuppression; nitazoxanide sometimes used off-label.
    </div>
  </div>
  <div>
    <h3>Toxin-Mediated Food Poisoning</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Pathogen</th><th>Onset</th><th>Source</th><th>Syndrome</th></tr></thead>
      <tbody>
        <tr><td><strong>S. aureus</strong></td><td>1–6 h</td><td>Salads, dairy, meats (preformed heat-stable enterotoxin)</td><td>Vomiting predominant; cramping; diarrhea; <strong>no fever</strong>. Resolves in ~24 h. Supportive only.</td></tr>
        <tr><td><strong>B. cereus (emetic)</strong></td><td>1–6 h</td><td>Reheated rice (preformed heat-stable toxin)</td><td>Vomiting predominant; no fever. Supportive.</td></tr>
        <tr><td><strong>B. cereus (diarrheal)</strong></td><td>8–16 h</td><td>Meats, vegetables (enterotoxin produced in gut)</td><td>Watery diarrhea + cramping; supportive.</td></tr>
        <tr><td><strong>C. perfringens</strong></td><td>8–16 h</td><td>Reheated meats ("cafeteria germ")</td><td>Watery diarrhea + cramping; <strong>no vomiting, no fever</strong>. Supportive.</td></tr>
      </tbody>
    </table>
    </div>
  </div>
</div>
</div>
`},

// 10. PARASITIC INFECTIONS
{html:`
<h2>Parasitic Gastrointestinal Infections</h2>
<div class="slide-body">
<p>Consider parasites in <strong>persistent diarrhea (&gt;14 days)</strong> and in immunocompromised or returned travelers. Multiplex PCR and antigen assays are preferred over traditional O&amp;P microscopy alone.</p>
<div class="table-wrap">
<table>
  <thead><tr><th>Pathogen</th><th>Epidemiology</th><th>Clinical Features</th><th>Diagnosis</th><th>Treatment</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>Giardia duodenalis</strong></td>
      <td>Most common parasitic pathogen in the US. Contaminated freshwater (camping, daycare). &lt;10 cysts infectious. Person-to-person possible.</td>
      <td>Watery, foul-smelling, greasy/floating stools; bloating, flatulence, steatorrhea, weight loss; fever uncommon. Often asymptomatic. Postinfection: lactose intolerance or IBS</td>
      <td>Stool antigen EIA or NAAT preferred (more sensitive than O&amp;P)</td>
      <td>Tinidazole, nitazoxanide, or metronidazole</td>
    </tr>
    <tr>
      <td><strong>Cryptosporidium</strong></td>
      <td>Municipal water, swimming pools. Chlorine-resistant oocysts. &lt;50 oocysts infectious. Incubation ~7 days.</td>
      <td>Watery diarrhea, cramping, malaise. Self-limited (&lt;2 weeks) in immunocompetent. Severe/chronic in HIV (especially CD4 &lt;100)</td>
      <td>Modified acid-fast stain; EIA; direct fluorescent antibody; NAAT</td>
      <td>Supportive in immunocompetent. Nitazoxanide for severe/prolonged. In HIV: <strong>ART with immune reconstitution is primary treatment</strong></td>
    </tr>
    <tr>
      <td><strong>Entamoeba histolytica</strong></td>
      <td>Travel to tropics (Mexico, India, C/S America); institutionalized settings; oral-anal sex. Incubation 2–4 weeks.</td>
      <td>Most asymptomatic. Amebic dysentery (bloody diarrhea, fever, weight loss); amebic liver abscess (RUQ pain, fever)</td>
      <td>Stool antigen immunoassay or NAAT preferred (O&amp;P microscopy cannot distinguish from nonpathogenic <em>E. dispar</em>). Serology for liver abscess.</td>
      <td>Symptomatic: metronidazole or tinidazole <strong>followed by</strong> paromomycin (luminal cyst eradication). Asymptomatic: intraluminal agent only (paromomycin).</td>
    </tr>
    <tr>
      <td><strong>Cyclospora cayetanensis</strong></td>
      <td>Imported fresh produce (berries, herbs); travel to tropics. Incubation ~1 week.</td>
      <td>Watery diarrhea, bloating, weight loss, fatigue; symptoms can last weeks; relapsing course possible</td>
      <td>Modified acid-fast stain; UV fluorescence microscopy; NAAT</td>
      <td>TMP-SMX (only recommended treatment; no established alternatives)</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-red">
  <span class="callout-label">Board Pearl — Amebiasis</span>
  <strong>Always follow metronidazole (or tinidazole) with a luminal agent</strong> (paromomycin, diloxanide furoate, or iodoquinol). Metronidazole alone does not eliminate intraluminal cysts and leads to relapse. This applies to all symptomatic infections. Asymptomatic carriers: luminal agent only.
</div>
</div>
`},

// 11. H. PYLORI
{html:`
<h2>Helicobacter pylori — Diagnosis and Treatment (ACG 2024)</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Who to Test</h3>
    <ul>
      <li>Active or history of peptic ulcer disease</li>
      <li>Gastric MALT lymphoma</li>
      <li>Uninvestigated dyspepsia in patients &lt;60 years (test-and-treat strategy)</li>
      <li>Long-term NSAID or aspirin use</li>
      <li>Unexplained iron deficiency anemia or ITP</li>
    </ul>
    <h3 style="margin-top:12px;">Diagnostic Tests</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Test</th><th>Notes</th></tr></thead>
      <tbody>
        <tr><td>Urea breath test (UBT)</td><td>Noninvasive; sensitive and specific. Stop PPI &ge;2 weeks and antibiotics &ge;4 weeks before testing.</td></tr>
        <tr><td>Stool antigen</td><td>Noninvasive; sensitivity comparable to UBT. Same pre-test cessation requirements.</td></tr>
        <tr><td>Serology (IgG)</td><td>Cannot distinguish active from prior infection. Not recommended for primary diagnosis.</td></tr>
        <tr><td>Rapid urease test (CLO test)</td><td>Endoscopy-based; highly specific. PPI cessation required.</td></tr>
        <tr><td>Histology / Culture</td><td>Gold standard; allows susceptibility testing. Used when cultures needed.</td></tr>
      </tbody>
    </table>
    </div>
  </div>
  <div>
    <h3>First-Line Treatment (ACG 2024)</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Regimen</th><th>Components</th><th>Duration</th></tr></thead>
      <tbody>
        <tr>
          <td><strong>Bismuth quadruple</strong> (preferred in most US regions)</td>
          <td>PPI BID + bismuth QID + tetracycline 500 mg QID + metronidazole 500 mg TID–QID</td>
          <td>14 days</td>
        </tr>
        <tr>
          <td><strong>Concomitant quadruple</strong></td>
          <td>PPI BID + clarithromycin 500 mg BID + amoxicillin 1 g BID + metronidazole 500 mg BID</td>
          <td>14 days (only if local clarithromycin resistance &lt;15%)</td>
        </tr>
        <tr>
          <td><strong>Vonoprazan-based triple</strong></td>
          <td>Vonoprazan 20 mg BID + amoxicillin 1 g TID + clarithromycin 500 mg BID (Voquezna Triple Pak)</td>
          <td>14 days (FDA-approved; high eradication even with clarithromycin resistance)</td>
        </tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-red" style="margin-top:6px;">
      <span class="callout-label">Board Pearls</span>
      Clarithromycin triple therapy (PPI + clarithromycin + amoxicillin) is <strong>no longer recommended</strong> first-line in most US populations (resistance &gt;15%). <strong>Do NOT substitute doxycycline for tetracycline</strong> in bismuth quadruple therapy — lower eradication rates. Always confirm eradication with UBT or stool antigen &ge;4 weeks after therapy (&ge;2 weeks off PPI).
    </div>
  </div>
</div>
</div>
`},

// 12. ANTIBIOTIC DECISION FRAMEWORK
{html:`
<h2>The Antibiotic Decision — When to Treat and When NOT To</h2>
<div class="slide-body">
<div class="grid-2">
  <div class="card-green">
    <div class="card-title">Treat Empirically</div>
    <ul>
      <li>Moderate-to-severe traveler's diarrhea (restricts activities)</li>
      <li>Bloody diarrhea + fever (after sending stool studies, <em>only if STEC excluded</em>)</li>
      <li>Sepsis or systemic toxicity</li>
      <li>Immunocompromised host</li>
      <li>Shigellosis (severe illness, immunocompromised, or outbreak; generally recommended)</li>
      <li>Dysentery with fever &ge;38.3&deg;C (&ge;101&deg;F): empiric azithromycin</li>
    </ul>
    <div style="margin-top:8px;font-size:13px;color:var(--muted);">
      Empiric choice: azithromycin 500 mg daily &times; 3 days (preferred for SE Asia, Campylobacter risk); fluoroquinolone (ciprofloxacin 500 mg BID &times; 3 days) if fluoroquinolone-susceptible area
    </div>
  </div>
  <div class="card-red">
    <div class="card-title">Do NOT Treat with Antibiotics</div>
    <ul>
      <li><strong>Suspected STEC infection</strong> — risk of precipitating HUS</li>
      <li><strong>Uncomplicated nontyphoidal Salmonella gastroenteritis</strong> — prolongs carriage, does not shorten illness</li>
      <li>Acute watery diarrhea in immunocompetent adults (&lt;3 days, mild)</li>
      <li>Most viral gastroenteritis</li>
    </ul>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Loperamide Rule</span>
      Loperamide is acceptable as adjunctive therapy WITH antibiotics for bacterial diarrhea. <strong>Do NOT use as monotherapy</strong> when fever or bloody stools are present (risk of toxic megacolon and prolonged infection).
    </div>
  </div>
</div>
<div class="callout c-blue" style="margin-top:10px;">
  <span class="callout-label">Multiplex PCR Caveat</span>
  A positive PCR result does not always equate to clinical disease. Asymptomatic C. difficile colonization occurs in approximately 5–15% of hospitalized patients. Interpret results in clinical context. Reflex stool cultures (when available) are recommended by CDC to obtain susceptibilities for outbreak investigation.
</div>
</div>
`},

// 13. BOARD RAPID-FIRE
{html:`
<h2>Rapid-Fire Board Pearls</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <div class="callout c-blue"><span class="callout-label">Epidemiology</span>
    Norovirus: #1 cause of gastroenteritis in the US (all ages)<br>
    Salmonella: #1 cause of foodborne illness hospitalizations and deaths<br>
    C. difficile: leading cause of hospital-acquired infectious diarrhea<br>
    ETEC: most common cause of travelers' diarrhea<br>
    Giardia: most common parasitic pathogen in the US
    </div>
    <div class="callout c-red"><span class="callout-label">Never Do These</span>
    Antibiotics in STEC &rarr; HUS risk<br>
    Loperamide monotherapy with fever or bloody stool<br>
    Test formed stool for C. difficile<br>
    Retest C. difficile after treatment if asymptomatic<br>
    Clarithromycin triple therapy for H. pylori (resistance &gt;15% in US)<br>
    Doxycycline substituted for tetracycline in bismuth quadruple therapy
    </div>
    <div class="callout c-orange"><span class="callout-label">Toxin Timing</span>
    1–6 h onset: S. aureus or B. cereus emetic (preformed toxin)<br>
    8–16 h onset: C. perfringens or B. cereus diarrheal<br>
    Key: preformed vs. in-vivo toxin production determines timing
    </div>
  </div>
  <div>
    <div class="callout c-green"><span class="callout-label">Treatment Pearls</span>
    Campylobacter: azithromycin (not fluoroquinolones)<br>
    Amebiasis: metronidazole/tinidazole THEN paromomycin (must treat luminal cysts)<br>
    Cryptosporidium + HIV: ART is primary treatment (immune reconstitution)<br>
    Cyclospora: TMP-SMX only<br>
    Vibrio septicemia: doxycycline + ceftriaxone<br>
    Yersinia bacteremia: ceftriaxone + gentamicin
    </div>
    <div class="callout c-purple"><span class="callout-label">Special Associations</span>
    Campylobacter &rarr; Guillain-Barr&eacute; syndrome (most common infectious trigger)<br>
    Salmonella + sickle cell disease &rarr; osteomyelitis<br>
    Yersinia + iron overload (hemochromatosis) &rarr; bacteremia risk<br>
    <em>V. vulnificus</em> (not <em>V. parahaemolyticus</em>) + liver disease &rarr; septicemia with hemorrhagic bullae; treat with doxycycline + ceftriaxone<br>
    Giardia + hypogammaglobulinemia &rarr; chronic infection<br>
    Whipple disease (Tropheryma whipplei): PAS+ macrophages, diarrhea + arthralgias + CNS
    </div>
    <div class="callout c-yellow"><span class="callout-label">Post-Infectious Sequelae</span>
    Campylobacter, Shigella, Salmonella, Yersinia &rarr; reactive arthritis<br>
    Campylobacter &rarr; GBS<br>
    Giardia, ETEC, Campylobacter &rarr; post-infectious IBS (3–17% of cases)<br>
    Giardia &rarr; lactose intolerance
    </div>
  </div>
</div>
</div>
`},

let cur = 0;
function render() {
  document.getElementById('deck').innerHTML = '';
  SLIDES.forEach((s,i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i===cur?' active':'');
    div.innerHTML = s.html;
    document.getElementById('deck').appendChild(div);
  });
  document.getElementById('slide-counter').textContent = (cur+1)+' / '+SLIDES.length;
  document.getElementById('btn-prev').disabled = cur===0;
  document.getElementById('btn-next').disabled = cur===SLIDES.length-1;
  document.getElementById('progress-bar').style.width = ((cur+1)/SLIDES.length*100)+'%';
}
document.getElementById('btn-prev').addEventListener('click',()=>{if(cur>0){cur--;render();}});
document.getElementById('btn-next').addEventListener('click',()=>{if(cur<SLIDES.length-1){cur++;render();}});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){if(cur<SLIDES.length-1){cur++;render();}}
  else if(e.key==='ArrowLeft'){if(cur>0){cur--;render();}}
});
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>40){if(dx<0&&cur<SLIDES.length-1){cur++;render();}else if(dx>0&&cur>0){cur--;render();}}
});
render();
</script>
</body>
