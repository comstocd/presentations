<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Topic 36 — Skin and Soft Tissue Infections | Morning Report</title>
<style>
  :root {
    --bg: #ffffff; --bg2: #f6f8fa; --bg3: #eaeef2;
    --border: #d0d7de; --text: #1f2328; --muted: #656d76;
    --blue: #0969da; --blue-bg: #ddf4ff; --blue-border: #54aeff;
    --green: #1a7f37; --green-bg: #dafbe1; --green-border: #4ac26b;
    --yellow: #9a6700; --yellow-bg: #fff8c5; --yellow-border: #d4a72c;
    --red: #cf222e; --red-bg: #ffebe9; --red-border: #ff8182;
    --purple: #8250df; --purple-bg: #fbefff; --purple-border: #c297ff;
    --orange: #bc4c00; --orange-bg: #fff1e5; --orange-border: #fb8f44;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 18px; line-height: 1.6;
  }

  #deck { width: 100%; height: 100%; position: relative; overflow: hidden; }
  .slide {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: 36px 52px 56px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease; overflow: hidden;
  }
  .slide.active { opacity: 1; pointer-events: all; }
  .slide-content { background: var(--bg); }
  .slide-accent  { background: var(--bg2); }
  .slide-title   { background: var(--bg); justify-content: center; }
  .slide-danger  { background: #fff5f5; }

  .slide-body {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; padding-right: 4px;
  }
  .slide-body::-webkit-scrollbar { width: 3px; }
  .slide-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .slide-label { font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; }
  .slide h1 { font-size: 36px; font-weight: 700; line-height: 1.15; color: var(--text); margin-bottom: 14px; }
  .slide h2 { font-size: 26px; font-weight: 700; color: var(--text);
    padding-bottom: 10px; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
  .slide h3 { font-size: 18px; font-weight: 600; color: var(--text); margin: 14px 0 7px; }
  .slide p  { color: var(--text); margin-bottom: 10px; font-size: 16px; }
  .slide ul, .slide ol { padding-left: 20px; margin-bottom: 10px; }
  .slide li { margin-bottom: 5px; font-size: 16px; color: var(--text); line-height: 1.5; }
  .slide strong { font-weight: 600; }
  .tagline { font-size: 19px; color: var(--muted); max-width: 640px; line-height: 1.55; margin-bottom: 22px; }

  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .badge { font-size: 13px; font-weight: 600; padding: 3px 11px; border-radius: 99px; border: 1px solid; }
  .badge-blue   { background: var(--blue-bg);   color: var(--blue);   border-color: var(--blue-border); }
  .badge-green  { background: var(--green-bg);  color: var(--green);  border-color: var(--green-border); }
  .badge-red    { background: var(--red-bg);    color: var(--red);    border-color: var(--red-border); }
  .badge-yellow { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-border); }
  .badge-purple { background: var(--purple-bg); color: var(--purple); border-color: var(--purple-border); }
  .badge-orange { background: var(--orange-bg); color: var(--orange); border-color: var(--orange-border); }

  .callout { border-radius: 8px; padding: 12px 16px; margin: 10px 0;
    border-left: 4px solid; font-size: 15px; line-height: 1.6; }
  .callout-label { font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; display: block; margin-bottom: 4px; }
  .callout-blue   { background: var(--blue-bg);   border-color: var(--blue);         color: #0550ae; }
  .callout-blue   .callout-label { color: var(--blue); }
  .callout-yellow { background: var(--yellow-bg); border-color: var(--yellow-border); color: var(--yellow); }
  .callout-yellow .callout-label { color: var(--yellow); }
  .callout-red    { background: var(--red-bg);    border-color: var(--red);           color: #82071e; }
  .callout-red    .callout-label { color: var(--red); }
  .callout-green  { background: var(--green-bg);  border-color: var(--green);         color: #116329; }
  .callout-green  .callout-label { color: var(--green); }
  .callout-orange { background: var(--orange-bg); border-color: var(--orange-border); color: var(--orange); }
  .callout-orange .callout-label { color: var(--orange); }
  .callout-purple { background: var(--purple-bg); border-color: var(--purple);        color: #5a32a3; }
  .callout-purple .callout-label { color: var(--purple); }

  .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); margin: 10px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { background: var(--bg3); color: var(--muted); font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 14px; color: var(--text); }
  tr:last-child td { border-bottom: none; }
  tr:nth-child(even) td { background: var(--bg2); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 10px 0; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 10px 0; }

  .card        { background: var(--bg);         border: 1px solid var(--border);        border-radius: 10px; padding: 14px 16px; }
  .card-accent { background: var(--bg2);         border: 1px solid var(--border);        border-radius: 10px; padding: 14px 16px; }
  .card-red    { background: var(--red-bg);      border: 1px solid var(--red-border);    border-radius: 10px; padding: 14px 16px; }
  .card-green  { background: var(--green-bg);    border: 1px solid var(--green-border);  border-radius: 10px; padding: 14px 16px; }
  .card-yellow { background: var(--yellow-bg);   border: 1px solid var(--yellow-border); border-radius: 10px; padding: 14px 16px; }
  .card-blue   { background: var(--blue-bg);     border: 1px solid var(--blue-border);   border-radius: 10px; padding: 14px 16px; }
  .card-purple { background: var(--purple-bg);   border: 1px solid var(--purple-border); border-radius: 10px; padding: 14px 16px; }
  .card-orange { background: var(--orange-bg);   border: 1px solid var(--orange-border); border-radius: 10px; padding: 14px 16px; }
  .card-title  { font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); margin-bottom: 7px; }

  /* DEPTH LADDER */
  .depth-ladder { display: flex; flex-direction: column; gap: 4px; }
  .depth-row { display: grid; grid-template-columns: 140px 1fr; gap: 10px; align-items: center; }
  .depth-label { font-size: 13px; font-weight: 700; text-align: right; padding-right: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .depth-bar { border-radius: 6px; padding: 9px 14px; font-size: 15px; font-weight: 500; }
  .depth-epi   { background: var(--blue-bg);   color: #0550ae; border: 1px solid var(--blue-border); }
  .depth-cell  { background: var(--green-bg);  color: #116329; border: 1px solid var(--green-border); }
  .depth-fasc  { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
  .depth-musc  { background: var(--red-bg);    color: #82071e; border: 1px solid var(--red-border); }
  .depth-abs   { background: var(--purple-bg); color: #5a32a3; border: 1px solid var(--purple-border); }

  /* DECISION FLOW */
  .flow-step { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 9px; }
  .flow-num  { width: 26px; height: 26px; border-radius: 50%; background: var(--blue);
    color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; margin-top: 2px; }
  .flow-body { flex: 1; font-size: 15px; line-height: 1.55; }
  .flow-title { font-weight: 600; }

  /* TIMELINE */
  .timeline { list-style: none; padding: 0; position: relative; }
  .timeline::before { content: ''; position: absolute; left: 13px; top: 0; bottom: 0; width: 2px; background: var(--border); }
  .timeline li { padding: 0 0 14px 34px; position: relative; }
  .timeline li::before { content: ''; position: absolute; left: 7px; top: 5px;
    width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--blue); }
  .tl-label { font-size: 12px; font-weight: 700; color: var(--blue);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }

  /* LRINEC */
  .lrinec-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 0;
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin: 10px 0; }
  .lrinec-row { display: contents; }
  .lrinec-row > div { padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .lrinec-row:last-child > div { border-bottom: none; }
  .lrinec-head > div { background: var(--bg3); font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .lrinec-pts { background: var(--blue-bg); color: var(--blue); font-weight: 700;
    text-align: center; display: flex; align-items: center; justify-content: center; }

  .pearl { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    padding: 13px 16px; margin: 9px 0; font-size: 15px; line-height: 1.6; }

  .chapter-header { display: flex; flex-direction: column; justify-content: center; height: 100%; }
  .chapter-num { font-size: 72px; font-weight: 800; color: var(--bg3); line-height: 1; margin-bottom: 8px; }
  .chapter-title { font-size: 30px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
  .chapter-sub { font-size: 18px; color: var(--muted); max-width: 560px; line-height: 1.5; }

  hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

  .refs { font-size: 13px; color: var(--muted); line-height: 1.7; }
  .refs li { margin-bottom: 8px; }

  #nav { position: fixed; bottom: 0; left: 0; right: 0; height: 44px;
    background: var(--bg); border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; z-index: 200; user-select: none; }
  .nav-btn { background: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 14px; font-size: 14px; font-weight: 500; color: var(--text);
    cursor: pointer; transition: background 0.1s; }
  .nav-btn:hover { background: var(--bg2); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  #slide-counter { font-size: 14px; color: var(--muted); font-weight: 500; }
  #progress-bar  { position: fixed; top: 0; left: 0; height: 3px;
    background: var(--blue); transition: width 0.2s ease; z-index: 300; }

  @media (max-width: 720px) {
    .slide { padding: 20px 14px 56px; }
    .slide h1 { font-size: 26px; } .slide h2 { font-size: 20px; }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .depth-row { grid-template-columns: 90px 1fr; }
  }
</style>
</head>
<body>
<div id="progress-bar"></div>
<div id="deck"></div>
<div id="nav">
  <button class="nav-btn" id="btn-prev">&#8592; Prev</button>

  <button class="nav-btn" id="btn-next">Next &#8594;</button>

<script>
const SLIDES = [

// ── 1. TITLE ──────────────────────────────────────────────────────────────────
{ cls: 'slide-title', html: `
<div class="slide-label">Topic 36 &middot; Infectious Disease / Hospital Medicine / Surgery</div>
<h1>Skin &amp; Soft Tissue<br>Infections</h1>
<p class="tagline">Cellulitis vs. its mimics. When the infection is deeper than it looks. The LRINEC score and its limits. Necrotizing fasciitis, diabetic foot, toxic shock, and the bites that change the regimen entirely.</p>
<div class="badge-row">
  <span class="badge badge-red">IDSA Guidelines</span>
  <span class="badge badge-blue">Hospital Medicine</span>
  <span class="badge badge-orange">Surgical Emergency</span>
  <span class="badge badge-yellow">MKSAP 2025</span>
</div>
<div style="margin-top:28px;font-size:14px;color:var(--muted);">Morning Report &middot; Internal Medicine &middot; David Comstock, MD</div>
`},

// ── 2. CASE VIGNETTE ──────────────────────────────────────────────────────────
{ cls: 'slide-content', html: `
<h2>Case Presentation</h2>
<div class="slide-body">
<ul class="timeline">
  <li>
    <div class="tl-label">History</div>
    <p style="margin:0;">58M with T2DM, obesity, chronic venous insufficiency presents with 3-day history of left lower extremity redness, warmth, and swelling. He reports a small cut on his shin 1 week ago after bumping into a coffee table. No fever at home. Taking no antibiotics.</p>
  </li>
  <li>
    <div class="tl-label">Vitals &amp; Exam</div>
    <p style="margin:0;">T 38.4&deg;C, HR 102, BP 128/78, RR 18. Left shin: 8&times;12 cm area of erythema with indistinct borders, warmth, and pitting edema extending to the ankle. No fluctuance. No crepitus. No anesthesia over the affected area. Skin intact; no bullae; no purpura.</p>
  </li>
  <li>
    <div class="tl-label">Labs</div>
    <p style="margin:0;">WBC 14,800 (84% PMN). CRP 18.4 mg/dL. Na 133 mEq/L. Cr 1.4 mg/dL (baseline 1.1). Glucose 214 mg/dL. Hgb 11.8 g/dL. Lactate 1.9 mmol/L. Blood cultures &times;2 sent.</p>
  </li>
  <li>
    <div class="tl-label">Initial Management</div>
    <p style="margin:0;">Patient admitted. Leg elevated and marked. Cefazolin IV started. Urgent surgery consulted given diabetes, LRINEC score of 7, and proximity of the case to the clinical description of necrotizing fasciitis &mdash; despite the absence of crepitus or anesthesia at this stage.</p>
  </li>
</ul>
<div class="callout callout-red">
  <span class="callout-label">The Teaching Frame</span>
  Cellulitis and necrotizing fasciitis can look identical in the first 12&ndash;24 hours. The clinical findings that favor NF &mdash; crepitus, anesthesia, woody induration, hemorrhagic bullae, rapid progression &mdash; often appear only after the window for limb-saving intervention has narrowed. This session is about developing the clinical eye and the decision discipline to call surgery early.
</div>
</div>
`},

// ── 3. ANATOMIC FRAMEWORK ─────────────────────────────────────────────────────
{ cls: 'slide-accent', html: `
<h2>Anatomic Framework: Depth Determines Diagnosis</h2>
<div class="slide-body">
<p>Classification by anatomic depth directs pathogen prediction, antibiotic selection, and surgical decision-making. Depth also determines urgency.</p>
<div class="depth-ladder">
  <div class="depth-row">
    <div class="depth-label">Epidermis / superficial dermis</div>
    <div class="depth-bar depth-epi"><strong>Erysipelas</strong> &mdash; sharp raised border, bright erythema, lymphangitis. Strep pyogenes. Penicillin/cephalosporin PO or IV.</div>
  </div>
  <div class="depth-row">
    <div class="depth-label">Deep dermis / subcutaneous fat</div>
    <div class="depth-bar depth-cell"><strong>Cellulitis</strong> &mdash; indistinct borders, warmth, edema. Beta-hemolytic strep (most common); consider MSSA. IV if systemic signs.</div>
  </div>
  <div class="depth-row">
    <div class="depth-label">Dermis (follicle-centered)</div>
    <div class="depth-bar depth-abs"><strong>Abscess / Furuncle / Carbuncle</strong> &mdash; purulent, fluctuant. S. aureus (often MRSA). Incision and drainage is the primary treatment.</div>
  </div>
  <div class="depth-row">
    <div class="depth-label">Superficial fascia</div>
    <div class="depth-bar depth-fasc"><strong>Necrotizing fasciitis</strong> &mdash; spreads along fascia; may appear benign early. Polymicrobial or Strep pyogenes. Surgical emergency.</div>
  </div>
  <div class="depth-row">
    <div class="depth-label">Muscle</div>
    <div class="depth-bar depth-musc"><strong>Clostridial myonecrosis (gas gangrene)</strong> &mdash; rapid progression, crepitus, bronze-to-violaceous discoloration. Clostridium perfringens or septicum. Surgical + high-dose PCN + clindamycin.</div>
  </div>
</div>
<div class="callout callout-blue" style="margin-top:10px;">
  <span class="callout-label">Purulent vs. Nonpurulent &mdash; The Key First Branch</span>
  <strong>Nonpurulent</strong> (erysipelas, cellulitis, NF): caused primarily by beta-hemolytic streptococci. Start with strep-directed therapy; escalate if no response or NF suspected.<br>
  <strong>Purulent</strong> (abscess, furuncle, carbuncle): caused primarily by S. aureus, including MRSA. Incision and drainage is the primary intervention; antibiotics adjunctive.
</div>
</div>
`},

// ── 4. CELLULITIS: DIAGNOSIS & MIMICS ────────────────────────────────────────
{ cls: 'slide-content', html: `
<h2>Cellulitis: Diagnosis and Mimics</h2>
<div class="slide-body">
<div class="callout callout-yellow">
  <span class="callout-label">One-Third Are Misdiagnosed</span>
  Approximately one-third of patients diagnosed with cellulitis have an alternative diagnosis. Most misdiagnosed patients receive unnecessary antibiotics. Identifying the mimic changes management completely.
</div>
<div class="grid-2">
  <div>
    <h3>Clinical Features of True Cellulitis</h3>
    <ul style="font-size:15px;">
      <li>Erythema, warmth, tenderness, edema</li>
      <li><strong>Indistinct borders</strong> (vs. erysipelas: sharp raised border)</li>
      <li>Usually <strong>unilateral</strong> &mdash; bilateral lower extremity redness is almost never cellulitis</li>
      <li>Associated fever, lymphangitis, regional lymphadenopathy</li>
      <li>Blood cultures positive in only ~5%: not routinely indicated</li>
      <li>Blood cultures indicated: malignancy, immunocompromise, severe systemic features, immersion injury, animal bite</li>
    </ul>
    <h3 style="margin-top:12px;">Risk Factors</h3>
    <ul style="font-size:15px;">
      <li>Skin barrier breach: trauma, ulcers, tinea pedis</li>
      <li>Lymphedema, chronic venous insufficiency</li>
      <li>Diabetes, obesity, cirrhosis, HIV, transplant</li>
      <li>Prior episode of cellulitis (strongest risk for recurrence)</li>
    </ul>
  </div>
  <div>
    <h3>Common Mimics &mdash; Rule These Out First</h3>
    <div class="card-yellow" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--yellow);">Venous stasis dermatitis</div>
      <p style="font-size:14px;margin:0;">Bilateral, chronic, scaly, eczematous. Associated with chronic venous insufficiency. No fever. Does not respond to antibiotics.</p>
    </div>
    <div class="card-blue" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--blue);">Contact / hypersensitivity dermatitis</div>
      <p style="font-size:14px;margin:0;">Pruritic, vesicular, often with identifiable exposure. Responds to steroids, not antibiotics.</p>
    </div>
    <div class="card-accent" style="margin-bottom:8px;">
      <div class="card-title">Lipodermatosclerosis / erythema nodosum</div>
      <p style="font-size:14px;margin:0;">Tender nodules on extensor surfaces. Chronic, bilateral, not warm to the same degree. Biopsy if uncertain.</p>
    </div>
    <div class="card-red">
      <div class="card-title" style="color:var(--red);">Deep vein thrombosis</div>
      <p style="font-size:14px;margin:0;">Unilateral calf swelling with or without erythema. Duplex ultrasound, not empiric antibiotics. DVT and cellulitis can coexist.</p>
    </div>
  </div>
</div>
</div>
`},

// ── 5. CELLULITIS: CLINICAL IMAGE ─────────────────────────────────────────────
{ cls: 'slide-content', html: `
<h2>Cellulitis &amp; Erysipelas: What They Look Like</h2>
<div class="slide-body">

    <div class="card-blue" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--blue);">(a) Cellulitis of the lower leg</div>
      <p style="font-size:14px;margin:0;">Diffuse, poorly demarcated erythema with edema. Indistinct borders extending below the knee. Underlying CVI or trauma is the usual portal.</p>
    </div>
    <div class="card-red" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--red);">(b) Bullous cellulitis</div>
      <p style="font-size:14px;margin:0;">Tense, fluid-filled bullae overlying erythema. Signals deeper skin involvement. Requires admission for IV therapy; prompt surgical evaluation if progression is rapid.</p>
    </div>
    <div class="card-green" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--green);">(c) Erysipelas of the auricle</div>
      <p style="font-size:14px;margin:0;"><strong>Sharply demarcated</strong>, raised, bright-red plaque &mdash; the hallmark of erysipelas. Superficial lymphatic involvement; borders are distinct, not blurred.</p>
    </div>
    <div class="card-yellow">
      <div class="card-title" style="color:var(--yellow);">(d) Facial erysipelas</div>
      <p style="font-size:14px;margin:0;">Classic butterfly distribution. Group A Streptococcus. Responds well to penicillin. Distinguish from rosacea (no fever) and SLE (malar rash, photosensitive, not warm).</p>
    </div>
  </div>
</div>
<div class="callout callout-blue">
  <span class="callout-label">The Board Distinction</span>
  <strong>Erysipelas:</strong> superficial, raised, sharply demarcated border, bright red &mdash; almost always Group A Strep &mdash; penicillin is adequate.<br>
  <strong>Cellulitis:</strong> deeper, indistinct borders, less sharply raised &mdash; Strep + MSSA &mdash; cephalexin or dicloxacillin adds MSSA coverage.
</div>
</div>
`},

// ── 6. CELLULITIS: TREATMENT ──────────────────────────────────────────────────
{ cls: 'slide-accent', html: `
<h2>Cellulitis &amp; Erysipelas: Treatment by Severity</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Severity</th><th>Definition</th><th>Antibiotic Choice</th><th>Notes</th></tr></thead>
  <tbody>
    <tr>
      <td><strong style="color:var(--green);">Mild</strong></td>
      <td>No systemic signs or symptoms; intact skin, no purulence</td>
      <td>PO penicillin V, cephalexin, dicloxacillin, or clindamycin</td>
      <td><strong>5 days if improving</strong> (AFP 2026; IDSA 2014) &mdash; extend to 14 days if not clearly improving. Cephalexin/dicloxacillin adds MSSA coverage over penicillin alone.</td>
    </tr>
    <tr>
      <td><strong style="color:var(--yellow);">Moderate</strong></td>
      <td>Systemic signs (fever, tachycardia); no evidence of deeper infection</td>
      <td>IV penicillin, ceftriaxone, cefazolin, or clindamycin</td>
      <td>Admit for IV therapy. Mark borders at presentation &mdash; failure to improve or progression in 48&ndash;72h should prompt surgical evaluation.</td>
    </tr>
    <tr>
      <td><strong style="color:var(--red);">Severe</strong></td>
      <td>Bullae, desquamation, crepitus, skin necrosis, hypotension, or immunocompromised</td>
      <td>IV vancomycin + piperacillin-tazobactam or imipenem/meropenem</td>
      <td><strong>Urgent surgical evaluation before antibiotics define the extent of debridement needed.</strong> Do not wait for cultures to return.</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout callout-blue">
  <span class="callout-label">Add MRSA Coverage When</span>
  Penetrating trauma &middot; nasal MRSA colonization or prior MRSA infection &middot; injection drug use &middot; failure to respond to standard strep/MSSA therapy after 48&ndash;72h. Use vancomycin IV or TMP-SMX/doxycycline PO depending on severity.
</div>
<div class="callout callout-green">
  <span class="callout-label">Recurrence Prevention</span>
  Treat predisposing factors: tinea pedis (topical antifungal), edema (compression, elevation), venous insufficiency, lymphedema. Prophylactic penicillin or erythromycin in patients with &ge;3 episodes/year after ID consultation.
</div>
<div class="callout callout-yellow">
  <span class="callout-label">Mark the Borders</span>
  Draw a skin marker line at the advancing erythema edge at time of assessment. Progression beyond the mark within 24&ndash;48h on antibiotics is a red flag for NF or inadequate coverage &mdash; not simply "slow response."
</div>
</div>
`},

// ── 7. NECROTIZING FASCIITIS: RECOGNITION ────────────────────────────────────
{ cls: 'slide-danger', html: `
<h2 style="color:var(--red);border-color:var(--red-border);">Necrotizing Fasciitis: Recognition</h2>
<div class="slide-body">
<p>NF spreads along the superficial fascia. The skin overlying it can appear deceivingly normal or merely erythematous in the first 12&ndash;24 hours. The window for limb and life salvage is narrow.</p>
<div class="grid-2">
  <div>
    <h3>Early Features (may look like cellulitis)</h3>
    <ul style="font-size:15px;">
      <li>Erythema, warmth, edema out of proportion to skin appearance</li>
      <li><strong>Pain disproportionate to physical findings</strong> &mdash; the earliest and most reliable sign</li>
      <li>Rapid progression despite antibiotics</li>
      <li>Fever, tachycardia, hypotension</li>
    </ul>
    <h3 style="margin-top:12px;">Late / Pathognomonic Features</h3>
    <ul style="font-size:15px;">
      <li><strong>"Woody" induration</strong> on palpation &mdash; deep tissue involvement beyond what is visible</li>
      <li><strong>Anesthesia</strong> over the affected skin &mdash; necrosis of local sensory nerves</li>
      <li>Hemorrhagic bullae and skin necrosis</li>
      <li>Crepitus (gas in soft tissues) &mdash; felt or heard on exam; seen on imaging</li>
      <li>Dishwater or gray fluid from wound (intraoperative finding)</li>
    </ul>
  </div>
  <div>
    <h3>Risk Factors</h3>
    <ul style="font-size:15px;">
      <li>Diabetes mellitus (most important)</li>
      <li>Injection drug use</li>
      <li>Obesity, alcohol use disorder</li>
      <li>Malignancy, immunosuppression, liver disease</li>
      <li>Peripheral arterial disease</li>
    </ul>
    <div class="callout callout-orange" style="margin-top:10px;">
      <span class="callout-label">Fournier Gangrene</span>
      Polymicrobial NF of the perineum in patients with diabetes. Results from antecedent genitourinary or anorectal infection or perineal trauma. Mortality 20&ndash;40%. Surgical debridement is the only definitive treatment &mdash; the extent of debridement required is invariably larger than preoperative imaging suggests.
    </div>
    <div class="callout callout-red" style="margin-top:8px;">
      <span class="callout-label">Type I vs. Type II</span>
      Type I (polymicrobial): mixed aerobes + anaerobes. Older patients, comorbidities, trunk and perineum. Type II (monomicrobial): S. pyogenes most common. Younger, healthier patients, extremities. Often associated with streptococcal TSS.
    </div>
  </div>
</div>
</div>
`},

// ── 8. LRINEC SCORE ──────────────────────────────────────────────────────────
{ cls: 'slide-content', html: `
<h2>LRINEC Score &mdash; Use With Caution</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <div class="lrinec-grid">
      <div class="lrinec-row lrinec-head"><div>Variable</div><div class="lrinec-pts">Points</div></div>
      <div class="lrinec-row"><div>CRP &ge;15 mg/dL</div><div class="lrinec-pts">4</div></div>
      <div class="lrinec-row"><div>WBC 15,000&ndash;25,000/&micro;L</div><div class="lrinec-pts">1</div></div>
      <div class="lrinec-row"><div>WBC &gt;25,000/&micro;L</div><div class="lrinec-pts">2</div></div>
      <div class="lrinec-row"><div>Hemoglobin 11&ndash;13.5 g/dL</div><div class="lrinec-pts">1</div></div>
      <div class="lrinec-row"><div>Hemoglobin &lt;11 g/dL</div><div class="lrinec-pts">2</div></div>
      <div class="lrinec-row"><div>Sodium &lt;135 mEq/L</div><div class="lrinec-pts">2</div></div>
      <div class="lrinec-row"><div>Creatinine &gt;1.6 mg/dL</div><div class="lrinec-pts">2</div></div>
      <div class="lrinec-row"><div>Glucose &gt;180 mg/dL</div><div class="lrinec-pts">1</div></div>
    </div>
    <div class="callout callout-blue" style="margin-top:8px;">
      <span class="callout-label">Interpretation</span>
      Score &lt;6: low risk (original NPV 96%). Score 6&ndash;7: intermediate. Score &ge;8: high risk (PPV 92%). Cut-off of 6 in the original derivation study.
    </div>
    <div class="callout callout-yellow" style="margin-top:6px;">
      <span class="callout-label">This patient's LRINEC</span>
      CRP 18.4 (+4) &middot; WBC 14,800 (0) &middot; Hgb 11.8 (+1) &middot; Na 133 (+2) &middot; Cr 1.4 (0) &middot; Glucose 214 (+1) = <strong>Score 8</strong>. High risk.
    </div>
  </div>
  <div>
    <h3>Critical Limitations</h3>
    <div class="callout callout-red">
      <span class="callout-label">Do Not Use LRINEC to Rule Out NF</span>
      Subsequent prospective validation studies demonstrated that the LRINEC score has unacceptably low sensitivity for ruling out NF. A score &lt;6 does not exclude the diagnosis. Multiple confirmed NF cases have LRINEC scores of 0&ndash;5.
    </div>
    <p style="font-size:15px;margin-top:10px;">The LRINEC score is a useful adjunct to support the decision to call surgery. It is not a safe screening tool to defer surgical evaluation.</p>
    <h3 style="margin-top:10px;">When to Call Surgery Regardless of Score</h3>
    <ul style="font-size:15px;">
      <li>Pain disproportionate to skin findings</li>
      <li>Failure to improve on IV antibiotics at 48&ndash;72h</li>
      <li>Any crepitus, anesthesia, or woody induration</li>
      <li>Hemorrhagic bullae or skin necrosis</li>
      <li>High clinical suspicion in a diabetic or immunocompromised patient</li>
    </ul>
    <div class="callout callout-orange">
      <span class="callout-label">Imaging Note</span>
      Plain radiograph, CT, and MRI can show gas and fascial thickening. CT is most practical. However, imaging should not delay surgical exploration when the clinical suspicion is high &mdash; the operating room is the definitive diagnostic test.
    </div>
  </div>
</div>
</div>
`},

// ── 9. NF: TREATMENT ─────────────────────────────────────────────────────────
{ cls: 'slide-accent', html: `
<h2>Necrotizing Fasciitis: Treatment</h2>
<div class="slide-body">
<div class="callout callout-red">
  <span class="callout-label">Surgery First &mdash; Always</span>
  Antibiotics cannot penetrate ischemic, necrotic fascial tissue. Repeated surgical debridement is required. The first debridement is rarely the last. Antimicrobial discontinuation can be considered only when the patient is afebrile, clinically stable, and no further debridement is needed.
</div>
<div class="table-wrap">
<table>
  <thead><tr><th>Pathogen / Type</th><th>Empiric Antibiotic Regimen</th><th>Notes</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>Unknown / Polymicrobial (Type I)</strong></td>
      <td>IV <strong>Vancomycin</strong> + IV <strong>Piperacillin-tazobactam</strong><br><em>or</em> vancomycin + imipenem/meropenem</td>
      <td>Covers MRSA, gram-negative aerobes, and anaerobes. Add clindamycin or linezolid for toxin suppression in severely ill patients.</td>
    </tr>
    <tr>
      <td><strong>S. pyogenes (Type II) or Clostridial</strong></td>
      <td>IV <strong>Penicillin G</strong> + IV <strong>Clindamycin</strong></td>
      <td>Clindamycin added specifically for <strong>toxin suppression</strong> &mdash; reduces exotoxin production at the ribosomal level. Critical in streptococcal TSS.</td>
    </tr>
    <tr>
      <td><strong>Aeromonas hydrophila</strong></td>
      <td>IV <strong>Ciprofloxacin</strong> <em>or</em> IV <strong>Ceftriaxone</strong> + doxycycline</td>
      <td>Freshwater exposure. Can cause NF. Minor skin trauma at inoculation site.</td>
    </tr>
    <tr>
      <td><strong>Vibrio vulnificus</strong></td>
      <td>IV <strong>Ceftriaxone</strong> (or ceftazidime/cefotaxime) + <strong>doxycycline</strong></td>
      <td>Saltwater/brackish water exposure or raw oyster ingestion. Hallmark: <strong>hemorrhagic bullae</strong>. Chronic liver disease is a major risk factor for sepsis and death.</td>
    </tr>
    <tr>
      <td><strong>Clostridial myonecrosis (gas gangrene)</strong></td>
      <td>IV <strong>Penicillin G</strong> (high dose) + IV <strong>Clindamycin</strong></td>
      <td>C. perfringens (traumatic) or C. septicum (atraumatic, from GI source &mdash; consider colonic neoplasm). Hyperbaric O2 is adjunctive at select centers; evidence is limited.</td>
    </tr>
  </tbody>
</table>
</div>
</div>
`},

// ── 11. PURULENT INFECTIONS ───────────────────────────────────────────────────
{ cls: 'slide-content', html: `
<h2>Folliculitis, Furuncles, Carbuncles &amp; Abscesses</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Folliculitis</h3>
    <ul style="font-size:15px;">
      <li>Superficial inflammation/infection of hair follicle</li>
      <li>Pruritic perifollicular papules and pustules</li>
      <li><strong>S. aureus</strong>: most common; usually self-limited. Topical mupirocin, clindamycin, or retapamulin. Systemic antibiotics only for extensive, recurrent, or refractory cases.</li>
      <li><strong>Pseudomonas (hot tub folliculitis)</strong>: truncal distribution, under bathing suit. Usually self-limited; ciprofloxacin PO for immunosuppressed or severe/persistent cases.</li>
      <li>Gram-negative folliculitis: from prolonged acne antibiotic use (Klebsiella, Enterobacter). Isotretinoin often the definitive treatment.</li>
    </ul>
    <h3 style="margin-top:12px;">Furuncles and Carbuncles</h3>
    <ul style="font-size:15px;">
      <li>Furuncle: hair follicle abscess extending into dermis and subcutaneous tissue</li>
      <li>Carbuncle: coalescence of multiple furuncles; can cause systemic signs</li>
      <li>Common sites: face, neck, axilla, groin, buttocks</li>
    </ul>
  </div>
  <div>
    <h3>Abscess Management by Severity</h3>
    <div class="card-green" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--green);">Mild &mdash; No systemic signs</div>
      <p style="font-size:14px;margin:0;"><strong>Incision and drainage (I&amp;D) is primary treatment.</strong> Adjunctive antibiotics are controversial for mild uncomplicated abscess but recent RCTs (NEJM 2017) show improved cure rates with TMP-SMX or doxycycline after I&amp;D. Consider especially if &gt;2 cm, immunocompromised, or recurrent.</p>
    </div>
    <div class="card-yellow" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--yellow);">Moderate &mdash; Systemic signs present</div>
      <p style="font-size:14px;margin:0;">I&amp;D + empiric oral anti-MRSA therapy: <strong>TMP-SMX</strong> (1&ndash;2 DS tabs BID) or <strong>doxycycline</strong> 100 mg BID. Culture purulent drainage first. Tailor when susceptibilities return.</p>
    </div>
    <div class="card-red">
      <div class="card-title" style="color:var(--red);">Severe &mdash; Systemic toxicity or immunocompromise</div>
      <p style="font-size:14px;margin:0;">I&amp;D + IV anti-MRSA therapy: <strong>vancomycin</strong> (first-line), daptomycin, linezolid, telavancin, or ceftaroline. Add cefepime or carbapenem for broader gram-negative coverage pending cultures.</p>
    </div>
    <div class="callout callout-purple" style="margin-top:8px;">
      <span class="callout-label">MRSA Decolonization (Recurrent Infections)</span>
      Intranasal mupirocin BID &times;5 days &middot; chlorhexidine washes &middot; bleach baths &middot; decontaminate personal items (clothes, towels, sheets, razors). All household contacts should be considered.
    </div>
  </div>
</div>
</div>
`},

// ── 13. ANIMAL BITES ──────────────────────────────────────────────────────────
{ cls: 'slide-content', html: `
<h2>Animal &amp; Human Bites</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Animal Bites</h3>
    <ul style="font-size:15px;">
      <li>~1% of US ED visits; ~80% will not become infected</li>
      <li>Cat bites more likely to become infected than dog bites (deeper puncture, slender teeth)</li>
      <li>Microbiology: mixed aerobes and anaerobes &mdash; Staphylococci, Streptococci, Bacteroides, Pasteurella, Fusobacterium</li>
      <li><strong>Capnocytophaga canimorsus</strong> (dog/cat): causes fulminant sepsis in asplenia, alcohol use disorder, immunocompromise &mdash; even from minor contact</li>
    </ul>
    <h3 style="margin-top:10px;">Wound Management</h3>
    <div class="flow-step"><div class="flow-num">1</div><div class="flow-body"><span class="flow-title">Irrigate thoroughly with sterile saline.</span> Assess depth and neurovascular involvement.</div></div>
    <div class="flow-step"><div class="flow-num">2</div><div class="flow-body"><span class="flow-title">Assess tetanus and rabies status</span> &mdash; mandatory in every bite wound. Rabies PEP: human rabies Ig + rabies vaccine series if unvaccinated.</div></div>
    <div class="flow-step"><div class="flow-num">3</div><div class="flow-body"><span class="flow-title">Primary closure:</span> avoid except for facial wounds (rich blood supply, cosmetically important).</div></div>
    <div class="flow-step"><div class="flow-num">4</div><div class="flow-body"><span class="flow-title">Prophylactic antibiotics</span> (3&ndash;5 days): amoxicillin-clavulanate for high-risk wounds: immunosuppressed, asplenic, liver disease; crush injury; joint/bone/tendon involvement; deep punctures; face, genitalia, or hand.</div></div>
    <div class="flow-step"><div class="flow-num">5</div><div class="flow-body"><span class="flow-title">Infected wounds:</span> amoxicillin-clavulanate PO (mild) or IV beta-lactam/BLI, carbapenem, or ceftriaxone + clindamycin/metronidazole (severe). Add empiric MRSA coverage if risk factors present.</div></div>
  </div>
  <div>
    <h3>Human Bites</h3>
    <ul style="font-size:15px;">
      <li>Intentional bites, fingernail biting, clenched-fist injuries (most dangerous &mdash; violates MCP joint)</li>
      <li>Organisms: Staphylococci, Streptococci, <strong>Eikenella corrodens</strong>, Prevotella, Fusobacterium</li>
      <li>Prophylaxis: amoxicillin-clavulanate 3&ndash;5 days for any bite that perforates the skin</li>
      <li><strong>Hand involvement</strong>: surgical evaluation always warranted</li>
      <li>Blood-borne pathogen exposure: assess for Hep B, Hep C, and HIV; initiate PEP if indicated</li>
    </ul>
    <div class="callout callout-orange" style="margin-top:10px;">
      <span class="callout-label">Clenched-Fist Injury (Fight Bite)</span>
      Most dangerous human bite. Skin laceration over MCP joint after punching someone in the teeth. Violates joint capsule. Hand surgeon consulted urgently. IV antibiotics; do not close primarily. Eikenella corrodens is resistant to clindamycin &mdash; amoxicillin-clavulanate covers it; clindamycin alone does not.
    </div>
    <div class="callout callout-yellow" style="margin-top:8px;">
      <span class="callout-label">Penicillin-Allergic Patients (Bites)</span>
      TMP-SMX or fluoroquinolone + clindamycin or metronidazole. Confirm allergy history: true penicillin anaphylaxis is uncommon; cross-reactivity with amoxicillin-clavulanate is the same as with any penicillin.
    </div>
  </div>
</div>
</div>
`},

// ── 14. DIABETIC FOOT INFECTIONS ─────────────────────────────────────────────
{ cls: 'slide-accent', html: `
<h2>Diabetic Foot Infections</h2>
<div class="slide-body">
<div class="callout callout-blue">
  <span class="callout-label">Diagnosis Requires Active Infection &mdash; Not Just a Wound</span>
  Infection is defined by: <strong>pus</strong> OR <strong>two or more</strong> inflammatory signs (warmth, induration, erythema &gt;0.5 cm from wound edge, tenderness, purulent discharge). Uninfected wounds must not be cultured or treated with antibiotics &mdash; this drives resistance and is one of the most common antibiotic overuse scenarios in diabetes care.
</div>
<div class="table-wrap">
<table>
  <thead><tr><th>IWGDF/IDSA Grade</th><th>Clinical Features</th><th>Antibiotic Approach</th></tr></thead>
  <tbody>
    <tr>
      <td><strong style="color:var(--muted);">1 &mdash; Uninfected</strong></td>
      <td>No signs of infection</td>
      <td>No antibiotics. Wound care only.</td>
    </tr>
    <tr>
      <td><strong style="color:var(--green);">2 &mdash; Mild</strong></td>
      <td>Erythema &lt;2 cm from wound edge; superficial; no systemic signs</td>
      <td>PO 7&ndash;14 days: cephalexin, dicloxacillin, clindamycin, levofloxacin, TMP-SMX, or doxycycline. Add MRSA coverage if pus or risk factors present.</td>
    </tr>
    <tr>
      <td><strong style="color:var(--yellow);">3 &mdash; Moderate</strong></td>
      <td>Erythema &ge;2 cm; deeper tissue (tendon, joint, bone); no SIRS</td>
      <td>Polymicrobial coverage: Staph + Strep + gram-negative aerobes. Add MRSA if risk factors. Antipseudomonal if macerated wound or prior antibiotics. Duration 10 days after debridement; 6 weeks if osteomyelitis without surgery.</td>
    </tr>
    <tr>
      <td><strong style="color:var(--red);">4 &mdash; Severe</strong></td>
      <td>Systemic inflammatory response (SIRS criteria)</td>
      <td>IV broad-spectrum: anaerobic coverage if ischemia or necrosis. Surgical consultation urgently. Blood cultures. Mark borders.</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout callout-yellow">
  <span class="callout-label">Probe-to-Bone Test</span>
  A positive probe-to-bone test (metal probe contacts bone or joint through the wound) is consistent with osteomyelitis. Positive predictive value ~89% in high-prevalence populations. Plain radiography is the first imaging step but has low sensitivity early; MRI is the gold standard for bone involvement.
</div>
<div class="callout callout-green">
  <span class="callout-label">Non-Antibiotic Essentials</span>
  Wound care &middot; glycemic control (hyperglycemia impairs neutrophil function) &middot; off-loading biomechanical stress (total contact casting) &middot; assess for arterial ischemia (ABI) &middot; vascular surgery consultation if critical ischemia. These are not adjuncts &mdash; they are co-equal primary interventions.
</div>
</div>
`},

// ── 15. TOXIC SHOCK SYNDROME ─────────────────────────────────────────────────
{ cls: 'slide-content', html: `
<h2>Toxic Shock Syndrome</h2>
<div class="slide-body">
<p>TSS is driven by superantigen exotoxins from S. aureus or S. pyogenes that cause massive cytokine release, diffuse capillary leak, and multiorgan failure. It is not just a skin disease &mdash; it is septic shock with a toxin mechanism.</p>
<div class="grid-2">
  <div>
    <h3>Staphylococcal TSS</h3>
    <div class="callout callout-blue" style="margin-top:4px;">
      <span class="callout-label">Classic Diagnostic Criteria</span>
      Fever &gt;38.9&deg;C + systolic BP &le;90 + <strong>diffuse macular rash with subsequent desquamation</strong> (especially palms/soles) + involvement of &ge;3 organ systems (GI, muscular, mucous membranes, renal, hepatic, hematologic, CNS).
    </div>
    <ul style="font-size:15px;margin-top:6px;">
      <li>Associated with: tampon use, nasal packings, surgical wounds, burns, catheters, injection drug use</li>
      <li>Treatment: <strong>Nafcillin or cefazolin + clindamycin</strong> (MSSA); <strong>vancomycin + clindamycin</strong> (MRSA)</li>
      <li>Source control: remove offending device, debride wound</li>
      <li>Clindamycin adds toxin suppression regardless of MSSA vs. MRSA status</li>
      <li>IVIG: not routinely recommended in staphylococcal TSS by IDSA 2014 guidelines</li>
    </ul>
  </div>
  <div>
    <h3>Streptococcal TSS</h3>
    <div class="callout callout-red" style="margin-top:4px;">
      <span class="callout-label">Higher Mortality Than Staph TSS</span>
      Bacteremia present in the majority. Mortality 30&ndash;70% vs. &lt;5% for staphylococcal TSS. Strongly associated with necrotizing fasciitis. Diagnosis: isolation of GABHS from a sterile site (definite) or non-sterile site + hypotension + &ge;2 organ system findings.
    </div>
    <ul style="font-size:15px;margin-top:6px;">
      <li>Treatment: <strong>Penicillin G + clindamycin</strong></li>
      <li>Clindamycin is essential: suppresses exotoxin production at the ribosomal level; maintains activity at high bacterial inocula where beta-lactams may not</li>
      <li>Linezolid if clindamycin resistance present (also inhibits toxin production)</li>
      <li>IVIG: some experts favor adjunctive use in streptococcal TSS based on reported mortality reduction; not universally recommended</li>
      <li>Source control: surgical debridement typically required</li>
    </ul>
    <div class="callout callout-purple" style="margin-top:8px;">
      <span class="callout-label">Paeniclostridium sordellii TSS</span>
      Post-partum, post-abortion, or post-gynecologic procedure. Distinctive: <strong>no fever</strong>, profound edema, marked leukocytosis. High mortality. Penicillin + clindamycin.
    </div>
  </div>
</div>
</div>
`},

// ── 17. CLINICAL PEARLS ───────────────────────────────────────────────────────
{ cls: 'slide-content', html: `
<h2>Clinical Pearls</h2>
<div class="slide-body">
<div class="pearl"><strong>Bilateral lower extremity erythema is almost never cellulitis.</strong> True cellulitis is nearly always unilateral. Bilateral involvement should immediately raise suspicion for venous stasis dermatitis, lymphedema, or lipodermatosclerosis. Giving IV antibiotics to a patient with bilateral stasis dermatitis is one of the most common errors in hospital medicine.</div>
<div class="pearl"><strong>Mark the borders.</strong> At admission, draw a skin-marker line at the advancing edge of erythema and document the time. This is the single most useful clinical tool for monitoring response to therapy. Progression beyond the mark at 48&ndash;72h on appropriate antibiotics is an indication for surgical consultation, not a dose increase.</div>
<div class="pearl"><strong>Pain disproportionate to appearance is the earliest reliable sign of NF.</strong> Before bullae, anesthesia, or crepitus appear, the patient with NF will tell you the pain is far worse than the skin looks. This mismatch should trigger surgical consultation. Do not wait for the LRINEC score to hit 6 &mdash; it will miss cases.</div>
<div class="pearl"><strong>Incision and drainage, not antibiotics, is the primary treatment for abscess.</strong> A drained abscess that is not responding to antibiotics usually failed because drainage was incomplete. An undrained abscess will not respond to any antibiotic. Antibiotics are adjunctive, not primary.</div>
<div class="pearl"><strong>Add clindamycin for toxin suppression in streptococcal TSS and NF.</strong> Clindamycin's value in Group A Strep NF and TSS is not antimicrobial &mdash; it is mechanistic. It inhibits ribosomal protein synthesis, blocking exotoxin production even at very high bacterial inocula, where beta-lactam bactericidal activity may be impaired (Eagle effect). Penicillin alone is insufficient.</div>
<div class="pearl"><strong>Never culture or antibiose an uninfected diabetic foot wound.</strong> The absence of pus and of two or more inflammatory signs means no infection. Swabbing a chronic ulcer without active infection grows colonizers, drives inappropriate antibiotic prescribing, and does not predict the pathogen causing any future infection. This is one of the highest-yield antibiotic stewardship interventions in diabetes care.</div>
<div class="pearl"><strong>The exposure history is the antibiotic prescription.</strong> Saltwater exposure + hemorrhagic bullae = Vibrio + ceftriaxone/doxycycline. Fish tank + nodular lymphangitis = M. marinum + clarithromycin/ethambutol. Rose thorn + ascending nodules = Sporothrix + itraconazole. Asplenic patient + dog lick = Capnocytophaga + beta-lactam. Get the exposure history before choosing the drug.</div>
</div>
`},

  <li>Lipsky BA, et al. "2019 IWGDF Guidelines on the Diagnosis and Treatment of Foot Infection in Persons with Diabetes." <em>Diabetes Metab Res Rev.</em> 2020;36(S1):e3280.</li>
  <li>Miller JM, Binnicker MJ, Campbell S, et al. "Guide to Utilization of the Microbiology Laboratory for Diagnosis of Infectious Diseases: 2024 Update." IDSA/ASM. <em>Clin Infect Dis.</em> 2024;78(9):e88&ndash;e265.</li>
  <li>MKSAP 19. "Skin and Soft Tissue Infections." <em>Infectious Disease.</em> American College of Physicians, 2025.</li>
</ol>
</div>
`},

]; // END SLIDES

// ENGINE
const deck = document.getElementById('deck');
const counter = document.getElementById('slide-counter');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const bar = document.getElementById('progress-bar');
let cur = 0;

SLIDES.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide ' + s.cls;
  el.innerHTML = s.html;
  if (i === 0) el.classList.add('active');
  deck.appendChild(el);
});

const slides = deck.querySelectorAll('.slide');

function goTo(n) {
  if (n < 0 || n >= slides.length) return;
  slides[cur].classList.remove('active');
  cur = n;
  slides[cur].classList.add('active');
  const body = slides[cur].querySelector('.slide-body');
  if (body) body.scrollTop = 0;
  counter.textContent = (cur + 1) + ' / ' + slides.length;
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === slides.length - 1;
  bar.style.width = ((cur + 1) / slides.length * 100) + '%';
}

btnPrev.addEventListener('click', () => goTo(cur - 1));
btnNext.addEventListener('click', () => goTo(cur + 1));
document.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown',' '].includes(e.key)) { e.preventDefault(); goTo(cur + 1); }
  if (['ArrowLeft','ArrowUp'].includes(e.key))        { e.preventDefault(); goTo(cur - 1); }
});
let tx = 0;
deck.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
deck.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) dx < 0 ? goTo(cur + 1) : goTo(cur - 1);
}, { passive: true });

goTo(0);
</script>
</body>
</html>
