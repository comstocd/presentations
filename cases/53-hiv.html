// 2. SCREENING AND DIAGNOSIS
{html:`
<h2>HIV Screening and Diagnosis</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Screening Recommendations</h3>
    <ul>
      <li><strong>CDC / ACP:</strong> All persons aged 13–64 at least once</li>
      <li><strong>USPSTF (Grade A):</strong> All persons aged 15–65 at least once</li>
      <li><strong>Higher-risk populations:</strong> Repeat testing at least annually (every 3 months for very high risk)</li>
      <li>Routine testing also in all pregnant persons and anyone diagnosed with an STI</li>
    </ul>
    <h3 style="margin-top:10px;">4th-Generation HIV Testing Algorithm (CDC 2018)</h3>
    <div class="card-blue" style="margin-bottom:6px;">
      <div class="card-title">Step 1 — HIV-1/2 Ag/Ab Combination Immunoassay</div>
      Detects p24 antigen + HIV-1 and HIV-2 antibodies. If <strong>nonreactive</strong> → no HIV infection (repeat if acute HIV suspected). If <strong>reactive</strong> → proceed to Step 2.
    </div>
    <div class="card-yellow" style="margin-bottom:6px;">
      <div class="card-title">Step 2 — HIV-1/HIV-2 Antibody Differentiation Immunoassay</div>
      HIV-1+ → confirmed HIV-1. HIV-2+ → confirmed HIV-2. Negative or indeterminate → proceed to Step 3.
    </div>
    <div class="card-green">
      <div class="card-title">Step 3 — HIV-1 RNA (NAAT)</div>
      Detectable → <strong>acute HIV-1 infection</strong> (antibodies not yet developed). Undetectable → false-positive initial immunoassay.
    </div>
    <div class="callout c-red" style="margin-top:8px;">
      <span class="callout-label">Board Pearl — Western Blot</span>
      Western blot is <strong>no longer part</strong> of the recommended HIV testing algorithm. Replaced by antibody differentiation immunoassay + HIV RNA.
    </div>
  </div>
  <div>
    <h3>Timeline of Marker Detectability</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Test</th><th>Detectable After Infection</th></tr></thead>
      <tbody>
        <tr><td>HIV RNA (NAAT)</td><td><strong>Days 6–8</strong> (earliest detectable marker)</td></tr>
        <tr><td>p24 antigen</td><td>Days 13–20</td></tr>
        <tr><td>IgM antibodies</td><td>~Day 20</td></tr>
        <tr><td>IgG antibodies</td><td>~Day 30</td></tr>
        <tr><td>4th-gen Ag/Ab assay</td><td>As early as day 14 (MKSAP 20)</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Acute HIV — Classic Board Setup</span>
      Reactive Ag/Ab assay + <strong>negative or indeterminate</strong> differentiation assay + <strong>positive HIV RNA</strong> = acute HIV-1 infection. Antibodies have not yet developed. Rapid antibody-only tests will be <strong>negative</strong> in this window — they cannot diagnose acute HIV.
    </div>
    <div class="callout c-blue" style="margin-top:6px;">
      <span class="callout-label">Acute Retroviral Syndrome — Clinical Clues</span>
      Occurs in 40%–90% of newly infected individuals, 2–4 weeks after exposure. Mononucleosis-like illness: fever (75%), fatigue (68%), myalgia (49%), rash (48%), pharyngitis (40%), lymphadenopathy (39%). Heterophile antibody test <strong>negative</strong>. Viral load often &gt;100,000 copies/mL.
    </div>
  </div>
</div>
</div>
`},

// 3. INITIAL EVALUATION
{html:`
<h2>Initial Evaluation at HIV Diagnosis</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Test</th><th>Purpose / Key Note</th></tr></thead>
  <tbody>
    <tr><td><strong>CD4 count and percentage</strong></td><td>Assess immunosuppression; guide OI prophylaxis and vaccination</td></tr>
    <tr><td><strong>HIV viral load (RNA)</strong></td><td>Baseline; monitor treatment response</td></tr>
    <tr><td><strong>HIV genotype (RT + protease)</strong></td><td>Detect transmitted drug resistance; should not delay ART initiation</td></tr>
    <tr><td><strong>INSTI genotype</strong></td><td>Only if prior CAB-LA PrEP exposure or INSTI resistance suspected</td></tr>
    <tr><td><strong>HLA-B*5701</strong></td><td>Required before abacavir — positive = absolute contraindication (fatal hypersensitivity risk)</td></tr>
    <tr><td><strong>HBV serologies</strong> (HBsAg, HBsAb, HBcAb)</td><td>Coinfection affects ART selection; tenofovir + emtricitabine or lamivudine required if HBV+</td></tr>
    <tr><td><strong>HCV antibody</strong></td><td>High coinfection rates; curative DAA therapy available</td></tr>
    <tr><td><strong>CBC, CMP, lipid panel, UA</strong></td><td>Baseline organ function; lipid panel after ART initiation</td></tr>
    <tr><td><strong>STI screening</strong> (syphilis, gonorrhea/chlamydia NAAT)</td><td>High co-prevalence; three-site NAAT preferred</td></tr>
    <tr><td><strong>Toxoplasma IgG</strong></td><td>Determines need for prophylaxis if CD4 &lt;100</td></tr>
    <tr><td><strong>Cryptococcal antigen (CrAg)</strong></td><td>Screen if CD4 &lt;100; if positive, LP required to rule out meningitis before starting fluconazole prophylaxis</td></tr>
    <tr><td><strong>TB screening</strong> (IGRA preferred; TST if IGRA unavailable)</td><td>IGRA preferred if prior BCG vaccination; LTBI threshold: TST &ge;5 mm or positive IGRA</td></tr>
    <tr><td><strong>Pregnancy test</strong></td><td>Affects ART selection; some agents have teratogenic concerns</td></tr>
    <tr><td><strong>HbA1c</strong></td><td>Measure before ART initiation; <strong>do NOT use HbA1c to diagnose diabetes in patients taking ART</strong> — may underestimate glycemia</td></tr>
  </tbody>
</table>
</div>
<div class="callout c-red">
  <span class="callout-label">MKSAP 20 — HbA1c Caveat</span>
  Hemoglobin A1c should not be used for the <strong>diagnosis</strong> of diabetes mellitus in patients taking ART — it may underestimate glycemia. Use fasting glucose or glucose tolerance testing instead.
</div>
</div>
`},

// 4. ANTIRETROVIRAL THERAPY
{html:`
<h2>Antiretroviral Therapy — Initial Regimens (DHHS 2024 / IAS-USA 2024)</h2>
<div class="slide-body">
<div class="callout c-green">
  <span class="callout-label">Core Principle — MKSAP 20</span>
  ART is recommended for <strong>all persons with HIV</strong> regardless of CD4 count. Start as soon as possible — <strong>ideally within 1 week of diagnosis</strong>, including same-day initiation. Preferred regimens include 2–3 drugs from 2 different classes, preferably including an integrase strand transfer inhibitor (INSTI).
</div>
<div class="table-wrap">
<table>
  <thead><tr><th>Regimen</th><th>Components</th><th>Key Considerations</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>Biktarvy</strong> (preferred for most)</td>
      <td>Bictegravir / TAF / emtricitabine — single tablet, once daily</td>
      <td>High barrier to resistance; minimal drug interactions; preferred in pregnancy; safe to start same-day</td>
    </tr>
    <tr>
      <td><strong>DTG + TAF/FTC</strong> or <strong>DTG + TDF/FTC</strong> or <strong>DTG + TDF/3TC</strong></td>
      <td>Dolutegravir + tenofovir backbone + emtricitabine or lamivudine</td>
      <td>Equally preferred; flexible backbone; TDF if HBV coinfection</td>
    </tr>
    <tr>
      <td><strong>Dovato</strong> (2-drug regimen)</td>
      <td>Dolutegravir / lamivudine — single tablet, once daily</td>
      <td>Only if: HIV RNA &lt;500,000 copies/mL, no HBV coinfection, genotype available. <strong>NOT for same-day/rapid start.</strong></td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-red">
  <span class="callout-label">No Longer Recommended for Initial Therapy (2024)</span>
  Elvitegravir/cobicistat-based regimens (lower resistance barrier); raltegravir-based regimens (higher pill burden); boosted atazanavir; efavirenz-based regimens; DTG/abacavir/3TC (Triumeq — moved to "certain clinical scenarios" due to HLA-B*5701 testing requirement and cardiovascular concerns).
</div>
<div class="grid-2" style="margin-top:8px;">
  <div class="callout c-blue">
    <span class="callout-label">Monitoring on ART</span>
    HIV RNA: baseline → 2–4 weeks after start → every 3 months until suppressed → every 6 months if stable. Goal: undetectable (&lt;50 copies/mL) within 8–24 weeks. <strong>Virologic failure:</strong> unable to achieve or maintain &lt;200 copies/mL. Most common cause: nonadherence. A single "blip" (50–200 copies/mL) is not failure — recheck in 4 weeks.
  </div>
  <div class="callout c-yellow">
    <span class="callout-label">Long-Acting Injectable ART</span>
    Cabotegravir + rilpivirine (Cabenuva): IM injection monthly or every 2 months. Approved to replace daily oral ART in virally suppressed patients. Avoid if rilpivirine or cabotegravir resistance, or chronic HBV (without additional HBV coverage). Individuals who become pregnant on this regimen should switch to preferred oral triple-drug regimen.
  </div>
</div>
</div>
`},

// 5. OI PROPHYLAXIS BY CD4 COUNT
{html:`
<h2>Opportunistic Infection Prophylaxis — CD4 Count Thresholds</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>CD4 Threshold</th><th>Infection</th><th>Preferred Prophylaxis</th><th>Discontinue When</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>&lt;200/&micro;L</strong> (MKSAP 20: also at &lt;100 with detectable VL; DHHS OI guidelines also list thrush at any CD4 as an indication)</td>
      <td>Pneumocystis jirovecii (PJP)</td>
      <td>TMP-SMX DS once daily or 3&times;/week (first-line)<br>Alternatives: dapsone, atovaquone, aerosolized pentamidine</td>
      <td>CD4 &ge;200/&micro;L for &ge;3 months on ART</td>
    </tr>
    <tr>
      <td><strong>&lt;100/&micro;L</strong> + Toxoplasma IgG positive</td>
      <td>Toxoplasmosis (<em>T. gondii</em> encephalitis)</td>
      <td>TMP-SMX DS once daily (same agent covers PJP and Toxo)</td>
      <td>CD4 &ge;200/&micro;L for &ge;3 months on ART</td>
    </tr>
    <tr>
      <td><strong>&lt;100/&micro;L</strong> + positive serum CrAg</td>
      <td>Cryptococcal meningitis</td>
      <td>Fluconazole 200 mg daily — only after LP rules out active meningitis</td>
      <td>After ART-mediated immune reconstitution</td>
    </tr>
    <tr>
      <td><strong>&lt;50/&micro;L</strong> — only if not initiating ART</td>
      <td>Mycobacterium avium complex (MAC)</td>
      <td>Azithromycin 1,200 mg once weekly or 600 mg twice weekly; or clarithromycin 500 mg BID</td>
      <td><strong>MAC prophylaxis no longer recommended</strong> if effective ART is initiated promptly (MKSAP 20 / NIH-CDC-IDSA OI guidelines)</td>
    </tr>
    <tr>
      <td>Any CD4 + LTBI positive (TST &ge;5 mm or positive IGRA)</td>
      <td>Latent tuberculosis</td>
      <td>INH + rifapentine &times; 3 months weekly (preferred); or INH + rifampin daily &times; 3 months; or INH alone &times; 9 months<br>Watch rifamycin interactions with ART</td>
      <td>After completion of course</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-red">
  <span class="callout-label">Board Pearls — OI Prophylaxis</span>
  TMP-SMX for PJP <strong>also covers Toxoplasmosis</strong> — no additional agent needed if CD4 &lt;100 and Toxo IgG+. If using dapsone or atovaquone for PJP instead, add pyrimethamine + leucovorin for Toxoplasma coverage.<br>
  Primary MAC prophylaxis (azithromycin) is <strong>no longer recommended</strong> when effective ART is initiated promptly — this is a major guideline change; older resources may still list it.<br>
  Before beginning any prophylaxis, rule out active infection to avoid undertreatment and resistance selection.
</div>
<div class="callout c-yellow">
  <span class="callout-label">MKSAP 20 — PJP Prophylaxis Threshold</span>
  CD4 &lt;100/&micro;L OR CD4 &lt;200/&micro;L with <strong>detectable viral load</strong> warrants PJP prophylaxis. This is a more nuanced threshold than the simplified &lt;200 often cited.
</div>
</div>
`},

// 6. OPPORTUNISTIC INFECTIONS — WITH IMAGES
{html:`
<h2>Opportunistic Infections — Visual Diagnosis</h2>
<div class="slide-body">
<div class="grid-2">

      <div class="card-title">Oral / Esophageal Candidiasis</div>
      <strong>Thrush:</strong> 1–2 weeks oral fluconazole (or topical clotrimazole troche).<br>
      <strong>Retrosternal burning or odynophagia</strong> → esophageal candidiasis → 2–3 weeks systemic fluconazole. Lack of improvement → endoscopy.

      <div class="card-title">Pneumocystis jirovecii Pneumonia (PJP)</div>
      CD4 &lt;200. Subacute: fever, dyspnea, dry cough. Bilateral GGOs on CXR/CT. <strong>Normal CXR does NOT exclude PJP</strong>. Elevated LDH and serum &beta;-D-glucan support diagnosis. Diagnose with BAL + DFA or methenamine silver stain. First-line: high-dose TMP-SMX. If PaO&sub2; &lt;70 mmHg or A-a gradient &ge;35 mmHg → add adjunctive glucocorticoids.

// 8. CD4 HIERARCHY OF OIs
{html:`
<h2>AIDS-Defining Illnesses — CD4 Count Hierarchy</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>CD4 Count</th><th>Key Infections and Conditions</th><th>Board-Critical Features</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>Any CD4</strong></td>
      <td>Pulmonary TB, bacterial pneumonia (<em>S. pneumoniae</em>), herpes zoster, Kaposi sarcoma (early), oral hairy leukoplakia</td>
      <td>TB can reactivate at any CD4; risk increases with immunodeficiency. Oral hairy leukoplakia (EBV): corrugated white lesions on lateral tongue; does NOT scrape off</td>
    </tr>
    <tr>
      <td><strong>&lt;200</strong></td>
      <td>PJP, oral candidiasis (thrush), esophageal candidiasis, wasting syndrome, Kaposi sarcoma (more severe), progressive HIV encephalopathy</td>
      <td>PJP = most common AIDS-defining OI. TMP-SMX prophylaxis threshold. Normal CXR does not exclude PJP. Mucocutaneous candidiasis generally occurs at CD4 &lt;200 (MKSAP 20).</td>
    </tr>
    <tr>
      <td><strong>&lt;100</strong></td>
      <td>Toxoplasmosis (ring-enhancing brain lesions), cryptococcal meningitis, disseminated histoplasmosis and coccidioidomycosis, Bartonella (bacillary angiomatosis)</td>
      <td>Toxo: multiple ring-enhancing lesions, Toxo IgG+; treat empirically. Crypto: subacute meningitis, markedly elevated ICP; India ink + CrAg; amphotericin B + flucytosine induction</td>
    </tr>
    <tr>
      <td><strong>&lt;50</strong></td>
      <td>CMV retinitis/colitis, disseminated MAC, PML (JC virus), primary CNS lymphoma</td>
      <td>CMV retinitis = most common CMV end-organ disease in HIV (MKSAP 20). MAC: fever, night sweats, weight loss, hepatosplenomegaly, cytopenias; diagnose with blood cultures for AFB. PML: multifocal white matter lesions, no enhancement, no mass effect.</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-yellow">
  <span class="callout-label">Cryptococcal Meningitis (MKSAP 20)</span>
  Serum CrAg is often diagnostic. Treat: amphotericin B + flucytosine induction (2 weeks) &rarr; fluconazole consolidation &rarr; maintenance. <strong>Attention to elevated ICP is critical</strong> — therapeutic lumbar punctures for elevated opening pressure. Delay ART initiation until 4–6 weeks after starting antifungal therapy to reduce IRIS risk.
</div>
</div>
`},

// 9. IRIS
{html:`
<h2>Immune Reconstitution Inflammatory Syndrome (IRIS)</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Definition and Forms</h3>
    <p style="font-size:15px;">MKSAP 20: inflammatory response to a <strong>pre-existing infectious process</strong>, usually occurring within <strong>1 week to a few months</strong> of initiating effective ART in patients with low pretreatment CD4 counts (&lt;100/&micro;L).</p>
    <div class="card-yellow" style="margin-bottom:8px;">
      <div class="card-title">Paradoxical IRIS</div>
      Worsening of a <em>known, previously treated</em> OI after ART initiation. The immune system attacks the treated infection as immunity recovers.
    </div>
    <div class="card-blue">
      <div class="card-title">Unmasking IRIS</div>
      New presentation of a <em>previously undiagnosed subclinical</em> OI after ART initiation.
    </div>
    <h3 style="margin-top:10px;">Risk Factors</h3>
    <ul>
      <li>Low baseline CD4 count (&lt;50/&micro;L — strongest predictor)</li>
      <li>High baseline viral load</li>
      <li>Short interval between OI treatment and ART initiation</li>
      <li>Rapid virologic response to ART</li>
    </ul>
  </div>
  <div>
    <h3>Common Pathogens and Management</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Pathogen</th><th>IRIS Features</th></tr></thead>
      <tbody>
        <tr><td><strong>TB</strong></td><td>Most common globally; worsening pulmonary or lymph node disease</td></tr>
        <tr><td><strong>Cryptococcus</strong></td><td>Highest mortality (~21%); meningitis flare with markedly elevated ICP; IRIS risk is why ART is delayed 4–6 weeks after antifungal initiation</td></tr>
        <tr><td><strong>MAC</strong></td><td>Focal inflammatory lymphadenitis, ~4 weeks after ART start</td></tr>
        <tr><td><strong>CMV</strong></td><td>Vitritis, retinitis flare</td></tr>
        <tr><td><strong>Kaposi sarcoma</strong></td><td>Paradoxical worsening of KS lesions</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-green" style="margin-top:8px;">
      <span class="callout-label">Management (MKSAP 20)</span>
      <strong>Continue ART</strong> — do NOT stop. Treat the underlying OI. NSAIDs for mild-moderate symptoms. Corticosteroids (prednisone 20–40 mg/day &times;4–8 weeks) for moderate-severe IRIS not responding to NSAIDs. Temporary ART interruption only for life-threatening CNS IRIS (e.g., cryptococcal with severe elevated ICP) in consultation with ID.
    </div>
    <div class="callout c-blue" style="margin-top:6px;">
      <span class="callout-label">ART Timing with OIs (MKSAP 20)</span>
      Most OIs: start ART within <strong>2 weeks</strong>. Exceptions: TB meningitis (delay 2–4 weeks); cryptococcal meningitis (delay 4–6 weeks after antifungal induction — some experts allow 2 weeks with close monitoring).
    </div>
  </div>
</div>
</div>
`},

// 10. PrEP
{html:`
<h2>Pre-Exposure Prophylaxis (PrEP) — 2024–2025 Landscape</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Agent</th><th>Route / Frequency</th><th>Key Populations</th><th>Key Considerations</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>TDF/FTC (Truvada)</strong></td>
      <td>Oral, daily</td>
      <td>All populations; effective for IDU; also approved for on-demand "2-1-1" in MSM</td>
      <td>CrCl &gt;60 required. Bone/renal monitoring. Effective for receptive vaginal sex and IDU.</td>
    </tr>
    <tr>
      <td><strong>TAF/FTC (Descovy)</strong></td>
      <td>Oral, daily</td>
      <td>Cisgender men and transgender women (receptive anal sex)</td>
      <td><strong>NOT approved for receptive vaginal sex or IDU</strong>. CrCl &gt;30 OK. Less bone/renal toxicity; more weight gain than TDF/FTC.</td>
    </tr>
    <tr>
      <td><strong>Cabotegravir (Apretude)</strong></td>
      <td>IM injection, every 2 months</td>
      <td>All sexual exposures; approved with kidney impairment</td>
      <td>Superior to TDF/FTC in HPTN 083/084. Long drug tail after discontinuation (implications for resistance if HIV acquired). Insufficient data for IDU.</td>
    </tr>
    <tr>
      <td><strong>Lenacapavir (Yeztugo)</strong></td>
      <td>SC injection, every 6 months</td>
      <td>All sexual exposures; FDA approved June 2025</td>
      <td>PURPOSE 1: 100% efficacy in cisgender women (0 infections vs. background 2.41/100 PY). PURPOSE 2: 96% reduction in men/gender-diverse persons; superior to TDF/FTC. CDC strong recommendation September 2025. Insufficient data for IDU.</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-blue" style="margin-top:6px;">
  <span class="callout-label">On-Demand "2-1-1" PrEP (TDF/FTC only)</span>
  2 pills 2–24 hours before sex; 1 pill 24 hours after; 1 pill 48 hours after. Approved for MSM only — insufficient data for vaginal exposures.
</div>
<div class="callout c-green" style="margin-top:6px;">
  <span class="callout-label">U = U — Undetectable = Untransmittable (MKSAP 20)</span>
  Reducing viral load to an undetectable level reduces the rate of HIV transmission from a sexual partner to <strong>close to zero</strong>. This applies to persons on ART with sustained viral suppression.
</div>
<div class="callout c-yellow" style="margin-top:6px;">
  <span class="callout-label">PrEP Monitoring (Oral Regimens)</span>
  HIV Ag/Ab + HIV RNA at initiation; creatinine (TDF/FTC: <strong>annually</strong> if age &lt;50 and CrCl &ge;90; <strong>every 6 months</strong> if age &ge;50 or CrCl &lt;90 — per MKSAP 20 PrEP lab table); STI screening every 3–6 months; HCV annually.
</div>
</div>
`},

// 11. PEP
{html:`
<h2>Post-Exposure Prophylaxis (PEP)</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Indications and Timing</h3>
    <p>Exposure to blood or genital secretions from a person known or suspected HIV-positive. Start <strong>within 72 hours</strong> (ideally within 2 hours). Efficacy decreases with delay. Not recommended if &gt;72 hours have passed.</p>
    <div class="callout c-red">
      <span class="callout-label">MKSAP 20 — PEP Regimen</span>
      Three-drug regimen &times; 28 days: TDF or TAF plus emtricitabine or lamivudine <strong>plus</strong> bictegravir or dolutegravir (integrase inhibitor). Updated 2025 CDC recommendations cite bictegravir/TAF/emtricitabine (Biktarvy) as preferred single-tablet option.
    </div>
    <h3 style="margin-top:10px;">Baseline Testing at PEP Initiation</h3>
    <ul>
      <li>HIV Ag/Ab (confirm recipient is HIV-negative; assess source if possible)</li>
      <li>HBV and HCV serologies</li>
      <li>CBC, CMP</li>
      <li>Pregnancy test</li>
      <li>STI screening</li>
    </ul>
    <h3 style="margin-top:10px;">Follow-Up</h3>
    <ul>
      <li>HIV Ag/Ab at 4–6 weeks and 3 months post-exposure</li>
      <li>If negative at 3 months post-exposure → HIV-negative</li>
      <li>Transition seamlessly to PrEP if ongoing risk exists</li>
    </ul>
  </div>
  <div>
    <h3>HIV Transmission Risk per Single Exposure (MKSAP 20)</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Exposure Type</th><th>Risk (%)</th></tr></thead>
      <tbody>
        <tr><td>Receptive anal intercourse</td><td><strong>1.4</strong> (highest sexual risk)</td></tr>
        <tr><td>Needle-sharing (IDU)</td><td>0.63</td></tr>
        <tr><td>Occupational needlestick</td><td>0.23</td></tr>
        <tr><td>Insertive anal intercourse</td><td>0.11</td></tr>
        <tr><td>Occupational mucous membrane</td><td>0.09</td></tr>
        <tr><td>Receptive vaginal intercourse</td><td>0.08</td></tr>
        <tr><td>Insertive vaginal intercourse</td><td>0.04</td></tr>
        <tr><td>Oral sex</td><td>0.01</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Occupational Needlestick</span>
      Do NOT wait for source testing results before starting PEP if source is HIV-positive or unknown status. Start immediately. HIV PEP reduces transmission risk by approximately 81% (case-control data; zidovudine era).
    </div>
  </div>
</div>
</div>
`},

// 12. KEY DRUG INTERACTIONS
{html:`
<h2>Key ART Drug Interactions and Adverse Effects</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Drug / Class</th><th>Key Interaction or Adverse Effect</th><th>Clinical Action</th></tr></thead>
  <tbody>
    <tr><td><strong>Abacavir</strong></td><td>Fatal hypersensitivity reaction in HLA-B*5701+ individuals</td><td><strong>Test HLA-B*5701 BEFORE prescribing</strong>. Positive = absolute contraindication. Never rechallenge.</td></tr>
    <tr><td><strong>TDF</strong></td><td>Nephrotoxicity, Fanconi syndrome, decreased bone mineral density</td><td>Monitor CrCl; avoid if CrCl &lt;60 mL/min; prefer TAF if renal or bone concerns</td></tr>
    <tr><td><strong>TAF</strong></td><td>More weight gain and dyslipidemia than TDF; less renal/bone toxicity</td><td>Monitor lipids; preferred over TDF in renal/bone disease. Active against HBV — HBV flare if discontinued without alternative HBV coverage.</td></tr>
    <tr><td><strong>Dolutegravir / Bictegravir</strong></td><td>Inhibit tubular secretion of creatinine → apparent Cr rise (not true nephrotoxicity); insomnia; weight gain; DTG raises metformin levels</td><td>Benign Cr rise; does not reflect GFR decline. Reduce metformin dose (max 1,000 mg/day) with DTG.</td></tr>
    <tr><td><strong>Cobicistat</strong></td><td>CYP3A4 inhibitor (pharmacokinetic booster); raises Cr by inhibiting tubular secretion</td><td>Not true nephrotoxicity. Avoid if CrCl &lt;70 mL/min. Major drug interactions — check before prescribing any new drug.</td></tr>
    <tr><td><strong>Efavirenz</strong></td><td>Neuropsychiatric effects (vivid dreams, depression, dizziness); CYP3A4 inducer; dyslipidemia</td><td>No longer first-line. Avoid in psychiatric disorders and pregnancy (historically; data now more nuanced).</td></tr>
    <tr><td><strong>Boosted PIs</strong> (DRV/r, DRV/c)</td><td>CYP3A4 inhibition &rarr; markedly increased statin levels (simvastatin/lovastatin rhabdomyolysis risk)</td><td><strong>Simvastatin and lovastatin contraindicated</strong> with boosted PIs. Use atorvastatin or rosuvastatin at low doses.</td></tr>
    <tr><td><strong>Rilpivirine</strong></td><td>Requires acidic environment for absorption</td><td>Avoid PPIs. H2RAs must be separated by 12 hours. Take with food.</td></tr>
    <tr><td><strong>Rifampin + INSTIs</strong></td><td>Potent CYP3A4 induction &rarr; reduced INSTI levels</td><td>DTG: increase to 50 mg BID. Bictegravir: avoid with rifampin — use rifabutin instead. TDF/FTC/DTG preferred if rifampin required.</td></tr>
    <tr><td><strong>TDF or TAF + HBV coinfection</strong></td><td>Discontinuation without alternative HBV coverage &rarr; HBV flare</td><td>Never discontinue tenofovir/emtricitabine (or lamivudine) without ensuring HBV coverage. If ART is changed, maintain HBV-active agent.</td></tr>
  </tbody>
</table>
</div>
</div>
`},

// 13. HIV COMPLICATIONS
{html:`
<h2>HIV Complications in the ART Era</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <div class="card" style="margin-bottom:8px;">
      <div class="card-title">Cardiovascular Disease</div>
      Rates of MI and stroke are higher in persons with HIV even with viral suppression — due to chronic inflammation, traditional risk factors, and some ART effects. MKSAP 20: initiate at least moderate-intensity statin therapy in adults aged <strong>40–75 years with 10-year ASCVD risk &ge;5%</strong>; consider even at &lt;5% risk if additional risk factors. High-intensity statin for 10-year risk &ge;20%.
    </div>
    <div class="card" style="margin-bottom:8px;">
      <div class="card-title">Neurocognitive Disorders (HAND)</div>
      Impaired memory, attention, executive function, and information processing speed. Neurocognitive decline with aging is accelerated in HIV. ART is the main treatment. Refer to neuropsychologist/neurologist for formal evaluation.
    </div>
    <div class="card">
      <div class="card-title">Metabolic Disorders</div>
      Weight gain common in first year of ART, especially with INSTI + TAF. HbA1c unreliable for DM diagnosis on ART — use fasting glucose. HIV infection and some ARVs worsen hyperlipidemia and insulin resistance. TDF associated with accelerated bone loss — avoid with osteoporosis; prefer TAF. Baseline DEXA: men &ge;50 and postmenopausal women with HIV.
    </div>
  </div>
  <div>
    <div class="card" style="margin-bottom:8px;">
      <div class="card-title">Hematologic Disorders</div>
      Lymphopenia, neutropenia, anemia, thrombocytopenia. Causes: immune-mediated (ITP, TTP, HLH), associated malignancy, secondary infection, or HIV itself. MKSAP 20: in stable patients with hematologic abnormality as presenting sign, ART often reverses the cytopenia.
    </div>
    <div class="card" style="margin-bottom:8px;">
      <div class="card-title">AIDS-Associated Malignancies (MKSAP 20)</div>
      <ul style="font-size:14px;">
        <li>Non-Hodgkin lymphoma — EBV-associated</li>
        <li>Kaposi sarcoma — HHV-8 (human herpesvirus 8)</li>
        <li>Invasive cervical carcinoma — HPV</li>
        <li>Primary CNS lymphoma — EBV</li>
        <li>Anal cancer — HPV; significantly increased in HIV</li>
      </ul>
    </div>
    <div class="card">
      <div class="card-title">HIV-Associated Nephropathy (HIVAN)</div>
      Collapsing FSGS; more common in Black patients; nephrotic-range proteinuria; large echogenic kidneys on ultrasound. Treatment: ART + ACE inhibitor or ARB.
    </div>
  </div>
</div>
</div>
`},

// 14. BOARD SUMMARY TABLE
{html:`
<h2>High-Yield Board Summary</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Topic</th><th>The Answer</th></tr></thead>
  <tbody>
    <tr><td>HIV screening — all adults</td><td>At least once; USPSTF recommends ages 15–65 (Grade A)</td></tr>
    <tr><td>4th-gen assay — earliest detection</td><td>Day 14 (p24 antigen detection)</td></tr>
    <tr><td>HIV RNA earliest detection</td><td>Days 6–8 post-infection</td></tr>
    <tr><td>Acute HIV diagnosis</td><td>Reactive Ag/Ab + negative/indeterminate differentiation assay + positive HIV RNA</td></tr>
    <tr><td>Western blot</td><td>No longer recommended — replaced by antibody differentiation + HIV RNA</td></tr>
    <tr><td>When to start ART</td><td>All persons with HIV, as soon as possible, ideally within 1 week</td></tr>
    <tr><td>Preferred initial ART</td><td>BIC/TAF/FTC (Biktarvy) or DTG + tenofovir/emtricitabine</td></tr>
    <tr><td>Only recommended 2-drug initial regimen</td><td>DTG/3TC (Dovato) — requires VL &lt;500K, no HBV, genotype available; not for same-day start</td></tr>
    <tr><td>HLA-B*5701</td><td>Must test before abacavir; positive = absolute contraindication</td></tr>
    <tr><td>HbA1c in HIV patients on ART</td><td>Do NOT use to diagnose diabetes — may underestimate glycemia</td></tr>
    <tr><td>PJP prophylaxis threshold</td><td>CD4 &lt;200/&micro;L (or &lt;100 with detectable VL per MKSAP 20); DHHS OI guidelines also list thrush at any CD4</td></tr>
    <tr><td>Toxo prophylaxis threshold</td><td>CD4 &lt;100/&micro;L + Toxo IgG positive</td></tr>
    <tr><td>MAC prophylaxis</td><td>No longer recommended when effective ART is initiated promptly</td></tr>
    <tr><td>TMP-SMX coverage</td><td>PJP + Toxoplasmosis (single agent covers both if Toxo IgG+)</td></tr>
    <tr><td>Most common AIDS-defining OI</td><td>PJP — subacute dyspnea, dry cough, bilateral GGOs, elevated LDH</td></tr>
    <tr><td>Most common CMV end-organ disease in HIV</td><td>Retinitis (MKSAP 20)</td></tr>
    <tr><td>Ring-enhancing brain lesions, CD4 &lt;100, Toxo IgG+</td><td>Treat empirically for toxoplasmosis; if no response in 2 weeks → biopsy for CNS lymphoma</td></tr>
    <tr><td>Cryptococcal meningitis — key management step</td><td>Attention to ICP — therapeutic LPs; delay ART 4–6 weeks after antifungal initiation</td></tr>
    <tr><td>IRIS management</td><td>Continue ART; NSAIDs; corticosteroids for severe; temporary interruption only for life-threatening CNS IRIS</td></tr>
    <tr><td>Newest PrEP option</td><td>Lenacapavir SC q6 months (FDA approved June 2025; CDC strong recommendation Sept 2025)</td></tr>
    <tr><td>PrEP not approved for receptive vaginal sex</td><td>TAF/FTC (Descovy)</td></tr>
    <tr><td>PEP timing</td><td>Within 72 hours; 3-drug regimen &times; 28 days</td></tr>
    <tr><td>U = U</td><td>Undetectable viral load = untransmittable (close to zero sexual transmission risk)</td></tr>
    <tr><td>Simvastatin/lovastatin with boosted PIs</td><td>Contraindicated — rhabdomyolysis risk; use atorvastatin or rosuvastatin</td></tr>
    <tr><td>Kaposi sarcoma — virus</td><td>HHV-8 (not EBV)</td></tr>
    <tr><td>AIDS-associated malignancies</td><td>NHL (EBV), Kaposi sarcoma (HHV-8), invasive cervical cancer (HPV)</td></tr>
  </tbody>
</table>
</div>
</div>
`},

let cur = 0;
function render() {
  document.getElementById('deck').innerHTML = '';
  SLIDES.forEach((s,i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i===cur?' active':'');
    div.innerHTML = s.html;
    document.getElementById('deck').appendChild(div);
  });
  document.getElementById('slide-counter').textContent = (cur+1)+' / '+SLIDES.length;
  document.getElementById('btn-prev').disabled = cur===0;
  document.getElementById('btn-next').disabled = cur===SLIDES.length-1;
  document.getElementById('progress-bar').style.width = ((cur+1)/SLIDES.length*100)+'%';
}
document.getElementById('btn-prev').addEventListener('click',()=>{if(cur>0){cur--;render();}});
document.getElementById('btn-next').addEventListener('click',()=>{if(cur<SLIDES.length-1){cur++;render();}});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){if(cur<SLIDES.length-1){cur++;render();}}
  else if(e.key==='ArrowLeft'){if(cur>0){cur--;render();}}
});
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>40){if(dx<0&&cur<SLIDES.length-1){cur++;render();}else if(dx>0&&cur>0){cur--;render();}}
});
render();
</script>
</body>
