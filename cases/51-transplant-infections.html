// 2. NET STATE OF IMMUNOSUPPRESSION
{html:`
<h2>The "Net State of Immunosuppression" Framework</h2>
<div class="slide-body">
<p>Infection risk in transplant recipients is determined by the <strong>net state of immunosuppression</strong> — a concept integrating all factors that impair host defense — not any single drug or immunosuppressive agent alone.</p>
<div class="grid-2">
  <div>
    <h3>Determinants of Infection Risk</h3>
    <ul>
      <li>Immunosuppressive drug type, dose, and duration</li>
      <li>Underlying disease and pre-existing comorbidities (DM, cirrhosis, neutropenia)</li>
      <li>Mucosal barrier integrity (mucositis, surgical disruption)</li>
      <li>Neutropenia (especially HCT)</li>
      <li>Viral coinfections — CMV and HHV-6 are themselves immunomodulatory, amplifying risk of other opportunistic infections</li>
      <li>Antimicrobial prophylaxis regimens in place</li>
    </ul>
  </div>
  <div>
    <h3>Immunosuppressive Agents — Classes</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Class</th><th>Key Agents</th></tr></thead>
      <tbody>
        <tr><td>Glucocorticoids</td><td>Prednisone</td></tr>
        <tr><td>DNA synthesis inhibitors</td><td>Mycophenolate mofetil/sodium, azathioprine, methotrexate</td></tr>
        <tr><td>Calcineurin inhibitors (CNI)</td><td>Tacrolimus, cyclosporine</td></tr>
        <tr><td>mTOR inhibitors</td><td>Sirolimus, everolimus</td></tr>
        <tr><td>Lymphocyte co-stimulation blocker</td><td>Belatacept</td></tr>
        <tr><td>Lymphocyte-depleting (polyclonal)</td><td>Antithymocyte globulin (ATG)</td></tr>
        <tr><td>Lymphocyte-depleting (monoclonal)</td><td>Alemtuzumab (anti-CD52)</td></tr>
        <tr><td>Nondepleting antibody</td><td>Basiliximab (anti-IL2R)</td></tr>
      </tbody>
    </table>
    </div>
  </div>
</div>
<div class="callout c-yellow">
  <span class="callout-label">MKSAP 20 — Key Principle</span>
  Glucocorticoid-sparing regimens using tacrolimus, cyclosporine, or sirolimus are increasingly preferred. Drug interactions are common — monitoring is essential to balance adequate immunosuppression against toxicity. Immunosuppression is most intensive in the first several months post-transplant and may require intensification during rejection episodes, with associated increased infection risk.
</div>
</div>
`},

// 3. SOT INFECTION TIMELINE
{html:`
<h2>SOT Infection Timeline — The Core Framework</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Period</th><th>Timeframe</th><th>Dominant Risk</th><th>Key Pathogens</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>Early</strong></td>
      <td>&lt;1 month</td>
      <td>Surgical complications, nosocomial exposures, donor-derived infections, recipient/allograft colonization</td>
      <td>Surgical site infections, anastomotic leak, hospital-acquired pneumonia, CLABSI, CAUTI, <em>C. difficile</em>, <em>Candida</em> (esp. intra-abdominal SOT), HSV reactivation, donor-transmitted CMV/WNV/rabies</td>
    </tr>
    <tr>
      <td><strong>Middle</strong></td>
      <td>1–6 months</td>
      <td>Peak immunosuppression; prolonged cellular immune impairment; reactivation of latent infections; prophylaxis modifies risk</td>
      <td>CMV, EBV/PTLD, BK virus, HSV, VZV, HHV-6/7/8, <em>Pneumocystis jirovecii</em>, <em>Aspergillus</em> and molds, <em>Candida</em>, <em>Cryptococcus</em>, <em>Listeria</em>, <em>Nocardia</em>, TB/NTM, <em>Toxoplasma</em>, <em>Strongyloides</em>, endemic fungi (Histo, Blasto)</td>
    </tr>
    <tr>
      <td><strong>Late</strong></td>
      <td>&gt;6–12 months</td>
      <td>Community-acquired infections predominate as immunosuppression reduced; opportunistic infections persist in those with chronic rejection or heavy immunosuppression</td>
      <td>Community respiratory viruses, UTI, <em>S. pneumoniae</em>, late CMV, PTLD (EBV), JC virus (PML), <em>Cryptococcus</em>, <em>Aspergillus</em>, TB/NTM, <em>Strongyloides</em>, <em>Toxoplasma</em>, VZV</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-red">
  <span class="callout-label">Critical Board Pearl — Timeline Reset</span>
  The timeline can be <strong>reset</strong> at any point. Any intensification of immunosuppression — such as pulse-dose steroids or antithymocyte globulin (ATG) for acute rejection — effectively moves the patient back to the middle-period (opportunistic infection) risk profile. Always re-evaluate prophylaxis after rejection treatment.
</div>
<div class="callout c-blue">
  <span class="callout-label">Month 1 vs. 1–6 Months</span>
  Month 1 infections <em>look like any hospitalized postoperative patient</em> — nosocomial pathogens dominate. True opportunistic infections (PJP, CMV disease, invasive mold) in the first month are uncommon unless donor-derived or prophylaxis is absent. If they appear early, consider donor-transmitted infection or unusually intensive immunosuppression.
</div>
</div>
`},

<div class="table-wrap" style="margin-top:8px;">
<table>
  <thead><tr><th>Phase</th><th>Timeframe</th><th>Dominant Risk Factor</th><th>Key Pathogens</th></tr></thead>

    <tr>
      <td><strong>Phase I — Pre-engraftment</strong></td>
      <td>Day 0 to engraftment (~day 15–45)</td>
      <td>Profound neutropenia, mucositis, central venous access</td>
      <td>Gram-negative bacilli, gram-positive organisms, GI streptococci, <em>Candida</em>, <em>Aspergillus</em>, HSV reactivation</td>
    </tr>
    <tr>
      <td><strong>Phase II — Early post-engraftment</strong></td>
      <td>Engraftment to ~day 100</td>

      <td>CMV (most common and dangerous), HHV-6 (encephalitis), adenovirus, respiratory viruses, <em>Aspergillus</em>, <em>Pneumocystis</em>, EBV/PTLD begins</td>
    </tr>
    <tr>
      <td><strong>Phase III — Late phase</strong></td>
      <td>&gt;Day 100</td>
      <td>Chronic GVHD; B-cell and CD4 T-cell recovery slow; restricted T-cell repertoire; impaired humoral immunity</td>
      <td>VZV (reactivation), <em>S. pneumoniae</em> and other encapsulated bacteria, late CMV, EBV/PTLD, <em>Pneumocystis</em>, community respiratory viruses</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-yellow">
  <span class="callout-label">Key HCT Distinctions</span>
  GVHD is the dominant driver of ongoing infection risk in Phases II and III. Encapsulated bacteria (<em>S. pneumoniae</em>) remain a risk late after HCT because of <strong>impaired humoral immunity</strong> — these patients should be revaccinated on a restart schedule. Autologous HCT recipients are primarily at risk during Phase I and early Phase II; the risk trajectory is less severe than for allogeneic recipients.
</div>
</div>

// 5. CMV — RISK STRATIFICATION
{html:`
<h2>CMV — The Most Significant Post-Transplant Viral Infection</h2>
<div class="slide-body">
<p>CMV is the most significant viral infection after transplantation. It causes both <strong>direct effects</strong> (viral syndrome and end-organ disease) and <strong>indirect effects</strong> (increased rejection, opportunistic infections, PTLD, and graft loss) through its immunomodulatory properties.</p>
<h3>Risk Stratification by Donor/Recipient Serostatus</h3>
<div class="table-wrap">
<table>
  <thead><tr><th>Serostatus</th><th>SOT Risk</th><th>HCT Risk</th><th>Strategy</th></tr></thead>
  <tbody>
    <tr><td><strong>D+/R&minus;</strong></td><td>Highest (&gt;50%) — primary infection</td><td>Low risk in HCT (donor immunity transferred)</td><td>SOT: universal prophylaxis (valganciclovir). HCT: monitor or prophylaxis</td></tr>
    <tr><td><strong>D+/R+</strong></td><td>Intermediate (15%–20%)</td><td>High risk — recipient reactivation; donor CMV immunity partially protective</td><td>Prophylaxis or preemptive monitoring</td></tr>
    <tr><td><strong>D&minus;/R+</strong></td><td>Intermediate (15%–20%)</td><td><strong>Highest risk in HCT</strong> — reactivation without donor CMV immunity</td><td>Letermovir prophylaxis in allo-HCT; or preemptive monitoring</td></tr>
    <tr><td><strong>D&minus;/R&minus;</strong></td><td>Lowest risk</td><td>Lowest risk</td><td>No CMV-specific prophylaxis; use CMV-negative or leukoreduced blood products</td></tr>
  </tbody>
</table>
</div>
<div class="callout c-red">
  <span class="callout-label">MKSAP 20 — Critical Distinction</span>
  After <strong>SOT</strong>, highest CMV risk = <strong>D+/R&minus;</strong> (primary infection from donor organ).<br>
  After <strong>allo-HCT</strong>, highest CMV risk = <strong>D&minus;/R+</strong> (recipient seropositive, donor seronegative — reactivation occurs without donor-derived CMV-specific T-cell immunity). D+/R+ is also high risk, but D&minus;/R+ carries the highest risk per MKSAP 20.
</div>
<div class="callout c-blue">
  <span class="callout-label">Letermovir — Board-Testable FDA Approvals</span>
  Approved for CMV prophylaxis in: (1) CMV-seropositive allo-HCT recipients (up to day +100; extended to day +200 in some protocols), and (2) high-risk kidney SOT recipients (D+/R&minus;). <strong>Letermovir does NOT cover HSV or VZV</strong> — continue acyclovir/valacyclovir alongside letermovir.
</div>
<div class="callout c-yellow">
  <span class="callout-label">Risk Further Increased By</span>
  Use of lymphocyte-depleting agents (ATG, alemtuzumab) significantly increases CMV risk regardless of serostatus.
</div>
</div>
`},

// 6. CMV — CLINICAL SPECTRUM AND TREATMENT
{html:`
<h2>CMV — Clinical Spectrum and Treatment</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Clinical Spectrum (MKSAP 20)</h3>
    <div class="card-blue" style="margin-bottom:8px;">
      <div class="card-title">Asymptomatic Viremia</div>
      CMV detected by blood PCR; no symptoms. Trigger for preemptive therapy.
    </div>
    <div class="card-yellow" style="margin-bottom:8px;">
      <div class="card-title">CMV Syndrome</div>
      Nonspecific mononucleosis-like illness: fever, malaise, cytopenias (leukopenia, thrombocytopenia), elevated transaminases. No tissue invasion.
    </div>
    <div class="card-red">
      <div class="card-title">End-Organ Disease (most severe)</div>
      <ul>
        <li><strong>Colitis</strong> — most common manifestation post-transplant; can occur with low or undetectable viremia</li>
        <li>Pneumonitis</li>
        <li>Hepatitis</li>
        <li>Esophagitis</li>
        <li>Encephalitis</li>
        <li>Retinitis (treat same as HIV: IV ganciclovir &plusmn; intravitreal)</li>
        <li>Allograft involvement</li>
      </ul>
      <p style="font-size:13px;margin-top:6px;">Definitive diagnosis: tissue biopsy demonstrating CMV cytopathic effect with CMV-positive immunostaining.</p>
    </div>
  </div>
  <div>
    <h3>Prevention Strategies</h3>
    <div class="card-green" style="margin-bottom:8px;">
      <div class="card-title">Universal Prophylaxis</div>
      Valganciclovir for all at-risk patients for defined period (3–6 months SOT; varies by organ and serostatus). Simple; prevents direct and indirect CMV effects. Disadvantages: drug toxicity (neutropenia), late-onset CMV after discontinuation.
    </div>
    <div class="card-blue">
      <div class="card-title">Preemptive Therapy</div>
      Weekly CMV quantitative PCR monitoring; treat only when significant viremia detected. Advantages: fewer drug side effects, allows natural CMV immunity. Requires reliable monitoring infrastructure.
    </div>
    <h3 style="margin-top:10px;">Treatment</h3>
    <ul>
      <li><strong>First-line:</strong> IV ganciclovir (5 mg/kg q12h) or oral valganciclovir 900 mg BID for mild-moderate disease</li>
      <li>IV ganciclovir preferred for severe disease or if enteral absorption unreliable</li>
      <li>Treat until CMV PCR undetectable on 2 consecutive weekly tests</li>
      <li><strong>Ganciclovir-resistant CMV</strong> (UL97 mutation): foscarnet — monitor for nephrotoxicity, hypocalcemia, hypomagnesemia</li>
    </ul>
  </div>
</div>
</div>
`},

// 7. BK VIRUS
{html:`
<h2>BK Polyomavirus (BKPyV) — Kidney Transplant Complication</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Epidemiology and Screening</h3>
    <ul>
      <li>BK viremia occurs in approximately 10–15% of kidney transplant recipients</li>
      <li>BK-associated nephropathy (BKPyVAN) in approximately 3–5%; typically within first 1–2 years</li>
      <li>BK virus also causes <strong>hemorrhagic cystitis</strong> in HCT recipients</li>
    </ul>
    <div class="callout c-blue">
      <span class="callout-label">Screening (AST-IDCOP Guidelines)</span>
      Monthly plasma BK PCR for first 9 months post-transplant, then every 3 months through 2 years.
    </div>
    <h3 style="margin-top:10px;">When to Intervene</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>BK PCR Level</th><th>Action</th></tr></thead>
      <tbody>
        <tr><td>Sustained &gt;1,000 copies/mL for &ge;3 weeks</td><td>Probable BKPyVAN — reduce immunosuppression</td></tr>
        <tr><td>Any single value &gt;10,000 copies/mL</td><td>Presumptive BKPyVAN — reduce immunosuppression</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Urine Decoy Cells</span>
      BK-infected urothelial cells with intranuclear viral inclusions visible on urine cytology. Sensitive screening tool but <strong>not specific</strong> (false positives). Plasma BK PCR is the preferred diagnostic test.
    </div>
  </div>
  <div>
    <h3>Treatment</h3>
    <div class="card-red">
      <div class="card-title">Mainstay: Reduction of Immunosuppression</div>
      <ul>
        <li>Stepwise approach: reduce CNI by 25–50% &rarr; reduce antiproliferative (mycophenolate) by 50% &rarr; discontinue antiproliferative</li>
        <li>High rates of viral clearance reported with immunosuppression reduction alone (published series vary; many patients clear viremia with stepwise IS reduction)</li>
        <li>Creates inherent tension: risk of rejection vs. viral clearance</li>
      </ul>
    </div>
    <div class="callout c-red" style="margin-top:10px;">
      <span class="callout-label">Board Pearl — No Effective Antiviral</span>
      There is no proven antiviral therapy for BK virus. Cidofovir, leflunomide, IVIG, and fluoroquinolones are <strong>NOT recommended</strong> by AST-IDCOP guidelines. The only treatment is reducing immunosuppression.
    </div>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">Biopsy</span>
      Kidney biopsy is NOT required if creatinine is stable and PCR threshold criteria are met — treat empirically with immunosuppression reduction. Biopsy helps if the diagnosis is uncertain or if concurrent rejection needs to be excluded.
    </div>
  </div>
</div>
</div>
`},

// 8. PTLD
{html:`
<h2>Post-Transplant Lymphoproliferative Disorder (PTLD)</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Pathogenesis and Risk Factors</h3>
    <ul>
      <li>EBV-driven in the majority of cases: immunosuppression impairs EBV-specific T-cell surveillance &rarr; uncontrolled clonal B-cell proliferation</li>
      <li><strong>EBV D+/R&minus;</strong> serostatus: highest risk — primary EBV infection post-transplant in seronegative recipient</li>
      <li>T-cell depleting agents (ATG, alemtuzumab): major risk factor</li>
      <li>Organ type: intestinal/multivisceral &gt; lung &gt; heart &gt; liver &gt; kidney (in decreasing risk)</li>
    </ul>
    <h3 style="margin-top:10px;">When to Suspect</h3>
    <p style="font-size:15px;">Any transplant patient in the <strong>middle or late</strong> posttransplant period with:</p>
    <ul>
      <li>Lymphadenopathy or extranodal mass, often with fever (MKSAP 20)</li>
      <li>GI involvement: bleeding, perforation, obstruction</li>
      <li>CNS mass lesions</li>
      <li>Unexplained allograft dysfunction</li>
    </ul>
    <div class="callout c-yellow">
      <span class="callout-label">EBV PCR Limitation</span>
      EBV viral load monitoring may assist surveillance but <strong>cannot be used for PTLD response assessment</strong>. Tissue biopsy and PET/CT staging are required for diagnosis and monitoring.
    </div>
  </div>
  <div>
    <h3>Classification (WHO)</h3>
    <ul>
      <li>Non-destructive (hyperplastic) — early, polyclonal; often responds to RIS alone</li>
      <li>Polymorphic PTLD — destructive but heterogeneous</li>
      <li>Monomorphic PTLD — resembles aggressive lymphoma (most commonly DLBCL)</li>
      <li>Classic Hodgkin lymphoma-type PTLD</li>
    </ul>
    <h3 style="margin-top:10px;">Treatment (NCCN / MKSAP 20)</h3>
    <div class="card-green" style="margin-bottom:6px;">
      <div class="card-title">Step 1 — ALL subtypes</div>
      <strong>Reduction of immunosuppression (RIS)</strong>: reduce CNI, discontinue antimetabolites. Coordinate with transplant team. High response for non-destructive and polymorphic PTLD.
    </div>
    <div class="card-blue" style="margin-bottom:6px;">
      <div class="card-title">Step 2 — CD20+ B-cell PTLD</div>
      <strong>Rituximab</strong>: for CD20+ disease not responding to RIS, or as part of risk-stratified sequential therapy.
    </div>
    <div class="card-purple">
      <div class="card-title">Step 3 — Monomorphic B-cell PTLD</div>
      <strong>Chemoimmunotherapy</strong>: R-CHOP or sequential approach (rituximab &times;4 &rarr; restage &rarr; R-CHOP if PET-positive).
    </div>
  </div>
</div>
</div>
`},

// 9. DRUG INTERACTIONS
{html:`
<h2>Drug Interactions — The CYP3A4 Danger Zone</h2>
<div class="slide-body">
<p>Calcineurin inhibitors (tacrolimus, cyclosporine) and mTOR inhibitors (sirolimus, everolimus) are metabolized by <strong>CYP3A4</strong>. Anti-infective agents that inhibit or induce CYP3A4 will dramatically alter immunosuppressant levels.</p>
<div class="table-wrap">
<table>
  <thead><tr><th>Anti-Infective</th><th>Effect on CNI/mTOR</th><th>Magnitude</th><th>Clinical Action</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>Azole antifungals</strong> (voriconazole, itraconazole, posaconazole, fluconazole)</td>
      <td>CYP3A4 inhibition &rarr; <span style="color:var(--red)"><strong>&uarr;&uarr;&uarr; Increase</strong></span></td>
      <td>Voriconazole can increase tacrolimus levels 5–10&times;</td>
      <td>Empirically reduce tacrolimus dose by 50–67% when starting azole; check levels within 3–5 days</td>
    </tr>
    <tr>
      <td><strong>Macrolides</strong> (erythromycin, clarithromycin)</td>
      <td>CYP3A4 inhibition &rarr; <span style="color:var(--red)"><strong>&uarr;&uarr; Increase</strong></span></td>
      <td>Moderate</td>
      <td>Monitor levels; consider azithromycin (weaker CYP3A4 interaction)</td>
    </tr>
    <tr>
      <td><strong>Rifampin</strong></td>
      <td>Potent CYP3A4 induction &rarr; <span style="color:var(--blue)"><strong>&darr;&darr;&darr; Decrease</strong></span></td>
      <td>Can reduce tacrolimus levels &gt;80%</td>
      <td><strong>Avoid if possible.</strong> If used, increase CNI dose 3–5&times;; monitor levels daily. Risk of acute rejection is high.</td>
    </tr>
    <tr>
      <td><strong>Isoniazid</strong></td>
      <td>Complex enzyme interactions (primarily CYP2E1 induction; variable CYP3A4 effect) — net clinical impact on CNI levels is mild and variable</td>
      <td>Mild</td>
      <td>Preferred over rifampin for LTBI treatment in transplant recipients — clinically manageable interaction vs. rifampin's dramatic CNI reduction; monitor levels</td>
    </tr>
    <tr>
      <td><strong>Fluoroquinolones</strong></td>
      <td>Variable; additive QTc prolongation with tacrolimus</td>
      <td>Variable</td>
      <td>Monitor QTc and electrolytes (especially K, Mg)</td>
    </tr>
    <tr>
      <td><strong>Ganciclovir / valganciclovir</strong></td>
      <td>Additive myelosuppression with mycophenolate</td>
      <td>Additive</td>
      <td>Monitor CBC weekly; may need to reduce mycophenolate dose</td>
    </tr>
    <tr>
      <td><strong>Aminoglycosides, amphotericin B, foscarnet</strong></td>
      <td>Additive nephrotoxicity with CNI</td>
      <td>Additive — can be severe</td>
      <td>Minimize CNI trough targets; monitor Cr/electrolytes closely; avoid concomitant use when possible</td>
    </tr>
    <tr>
      <td><strong>TMP-SMX</strong> (prophylactic dose)</td>
      <td>Additive nephrotoxicity with CNI (by inhibiting creatinine secretion — serum Cr rises without true GFR drop); myelosuppression at high doses</td>
      <td>Mild at PJP prophylaxis doses</td>
      <td>Low-dose TMP-SMX for PJP prophylaxis is generally safe and does not require dose adjustment of CNI</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-red">
  <span class="callout-label">Most Dangerous Interaction — Rifampin</span>
  Rifampin is the most dangerous anti-infective drug interaction in transplant medicine. It can reduce tacrolimus levels by &gt;80%, precipitating acute rejection. <strong>Isoniazid is preferred for LTBI treatment</strong> — its net effect on CNI levels is mild and clinically manageable, in contrast to rifampin's potent CYP3A4 induction.
</div>
</div>
`},

// 10. ANTIMICROBIAL PROPHYLAXIS
{html:`
<h2>Antimicrobial Prophylaxis — Standard Regimens</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Target</th><th>Agent</th><th>SOT Duration</th><th>HCT Duration</th><th>Notes</th></tr></thead>
  <tbody>
    <tr>
      <td><strong>PJP (<em>Pneumocystis</em>)</strong></td>
      <td>TMP-SMX DS 3&times;/wk (preferred); alternatives: atovaquone, dapsone (if G6PD normal), inhaled pentamidine</td>
      <td>6–12 months post-transplant (lifelong if heavy immunosuppression)</td>
      <td>&ge;6 months; continue while on immunosuppression for GVHD</td>
      <td>TMP-SMX also covers <em>Toxoplasma</em>, <em>Listeria</em>, <em>Nocardia</em>, and reduces UTI in kidney recipients</td>
    </tr>
    <tr>
      <td><strong>CMV</strong></td>
      <td>Valganciclovir (prophylaxis); or serial PCR monitoring (preemptive)</td>
      <td>3–6 months; longer for D+/R&minus; or high-risk organs (lung)</td>
      <td>Letermovir up to day +100–200 for R+ allo-HCT; or weekly PCR monitoring</td>
      <td>Letermovir does NOT cover HSV/VZV</td>
    </tr>
    <tr>
      <td><strong>HSV / VZV</strong></td>
      <td>Acyclovir or valacyclovir</td>
      <td>Lifelong in many centers; at minimum during highest immunosuppression</td>
      <td>&ge;1 year post-HCT; longer if on immunosuppression or chronic GVHD</td>
      <td>If receiving valganciclovir for CMV, separate HSV/VZV prophylaxis is not needed</td>
    </tr>
    <tr>
      <td><strong>Fungal — Candida</strong></td>
      <td>Fluconazole</td>
      <td>Variable; liver and pancreas transplants: 2–4 weeks if high risk</td>
      <td>Through engraftment (Phase I)</td>
      <td>Mold-active prophylaxis (posaconazole) if GVHD on high-dose glucocorticoids</td>
    </tr>
    <tr>
      <td><strong>Fungal — Molds (Aspergillus)</strong></td>
      <td>Posaconazole or voriconazole</td>
      <td>Lung transplant: voriconazole or inhaled amphotericin</td>
      <td>GVHD on high-dose steroids: posaconazole. Note: voriconazole is approved for treatment, not prophylaxis per MKSAP</td>
      <td>Major CYP3A4 interactions with CNI — reduce tacrolimus dose empirically</td>
    </tr>
    <tr>
      <td><strong>LTBI (TB exposure)</strong></td>
      <td>Isoniazid + pyridoxine (preferred over rifampin-based regimens)</td>
      <td>6–9 months; start when graft function stable</td>
      <td>Per guidelines; timing varies</td>
      <td>Rifampin-based regimens avoided due to CYP3A4 induction; if used, requires intensive CNI monitoring</td>
    </tr>
  </tbody>
</table>
</div>
<div class="callout c-green">
  <span class="callout-label">TMP-SMX — Most Valuable Prophylactic Agent</span>
  Single agent coverage: PJP + <em>Toxoplasma</em> + <em>Listeria</em> + <em>Nocardia</em> (breakthrough infections reported) + urinary pathogens. MKSAP 20: "one of the most important prophylactic medications following transplantation."
</div>
<div class="callout c-yellow">
  <span class="callout-label">MKSAP 20 — Antifungal Prophylaxis Note</span>
  Posaconazole is used for Candida + Aspergillus coverage when high-dose glucocorticoids are required. Voriconazole is approved for <strong>treatment</strong> only (not prophylaxis per MKSAP).
</div>
</div>
`},

// 11. VACCINATION
{html:`
<h2>Vaccination in Transplant Recipients</h2>
<div class="slide-body">
<div class="callout c-red">
  <span class="callout-label">Absolute Rule — Live Vaccines</span>
  Live virus vaccines are <strong>contraindicated after SOT</strong> (indefinitely) and must be avoided for <strong>at least 2 years after allo-HCT</strong> (and only if off immunosuppression and no active GVHD). This includes MMR, varicella, yellow fever, live-attenuated influenza (LAIV), and the old live zoster vaccine (Zostavax).
</div>
<div class="table-wrap" style="margin-top:8px;">
<table>
  <thead><tr><th>Vaccine</th><th>SOT</th><th>HCT (Allo)</th><th>Key Notes</th></tr></thead>
  <tbody>
    <tr><td><strong>Influenza (inactivated)</strong></td><td>Annually; can give &ge;1 month post-transplant</td><td>Annually; &ge;6 months post-HCT (&ge;4 months if outbreak)</td><td>Inactivated only — never LAIV in immunocompromised</td></tr>
    <tr><td><strong>Pneumococcal (PCV15/20/21)</strong></td><td>Per schedule; ideally before transplant</td><td>Start 3–6 months post-HCT; 4-dose series</td><td>Encapsulated bacteria remain a risk late after HCT due to humoral impairment</td></tr>
    <tr><td><strong>Hepatitis B</strong></td><td>Ideally pre-transplant; check titers post-transplant</td><td>Restart series 6–12 months post-HCT</td><td>Higher-dose formulations (Heplisav-B, Recombivax HB 40 mcg) may be needed</td></tr>
    <tr><td><strong>Shingrix (recombinant zoster)</strong></td><td>Recommended for adults &ge;19 years if VZV-seropositive; 2-dose series ideally before transplant</td><td>Recommended; 2-dose series starting 6–12 months post-HCT</td><td><strong>NOT a live vaccine</strong> — safe in immunocompromised. Do NOT confuse with old live Zostavax (contraindicated).</td></tr>
    <tr><td><strong>COVID-19</strong></td><td>Per CDC guidance; additional doses recommended</td><td>Restart primary series &ge;3 months post-HCT</td><td>Inactivated/mRNA — safe post-transplant</td></tr>
    <tr><td><strong>MMR, Varicella, Yellow Fever</strong></td><td><strong>CONTRAINDICATED</strong></td><td><strong>CONTRAINDICATED</strong> for &ge;2 years and while on immunosuppression</td><td>Live vaccines — risk of vaccine-derived disease</td></tr>
  </tbody>
</table>
</div>
<div class="callout c-blue">
  <span class="callout-label">HCT Recipients — Vaccine Restart</span>
  Allo-HCT recipients should be considered "<strong>never vaccinated</strong>" regardless of prior immunization history — restart the full vaccination schedule beginning 3–6 months post-HCT (per AST-IDCOP and ECIL 7 guidelines).
</div>
<div class="callout c-green">
  <span class="callout-label">Household Contacts</span>
  Household contacts CAN receive most live vaccines (MMR, varicella). Exception: oral polio vaccine (OPV) — avoid in contacts of immunocompromised patients. OPV is not used in the United States.
</div>
</div>
`},

// 12. SPECIFIC OPPORTUNISTIC INFECTIONS
{html:`
<h2>High-Yield Opportunistic Infections — Transplant-Specific Pearls</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <div class="card" style="margin-bottom:8px;">
      <div class="card-title">Pneumocystis jirovecii (PJP)</div>
      Bilateral ground-glass opacities on CT; elevated LDH; hypoxia. Diagnose with BAL + methenamine silver or DFA staining. Treat with high-dose TMP-SMX. Presents more acutely and severely in transplant recipients vs. HIV patients. TMP-SMX prophylaxis prevents nearly all cases.
    </div>
    <div class="card" style="margin-bottom:8px;">
      <div class="card-title">Nocardia</div>
      Pulmonary nodules &plusmn; brain abscess in transplant recipients; can disseminate widely. Weakly acid-fast, filamentous branching rods. Treat with TMP-SMX &plusmn; imipenem or amikacin (prolonged course, 6–12 months). Breakthrough infections reported despite TMP-SMX prophylaxis.
    </div>
    <div class="card" style="margin-bottom:8px;">
      <div class="card-title">Listeria monocytogenes</div>
      Meningitis or bacteremia. CSF may show lymphocytic predominance mimicking viral meningitis. Treat with ampicillin &plusmn; gentamicin. <strong>Cephalosporins do NOT cover Listeria</strong>.
    </div>
    <div class="card">
      <div class="card-title">Cryptococcus neoformans</div>
      Late infection (&gt;6 months); significant T-cell suppression period. Usually subacute meningitis; check India ink, serum and CSF cryptococcal antigen. Treat: amphotericin B + flucytosine induction (2 weeks) &rarr; fluconazole consolidation/maintenance.
    </div>
  </div>
  <div>
    <div class="card" style="margin-bottom:8px;">
      <div class="card-title">Aspergillus</div>
      Nodular pulmonary infiltrates; halo sign on CT (hemorrhagic infarction). Serum galactomannan and beta-D-glucan for diagnosis. Treat with voriconazole (first-line). <strong>Major CYP3A4 interaction: reduce tacrolimus by 50–67% when starting voriconazole.</strong>
    </div>
    <div class="card" style="margin-bottom:8px;">
      <div class="card-title">Toxoplasma gondii</div>
      In SOT: classically reactivation &rarr; encephalitis with multiple ring-enhancing brain lesions. After <strong>heart transplantation</strong>: often donor-derived (D+/R&minus;) — can manifest as CNS, pulmonary, or disseminated disease (distinct from the typical reactivation pattern). TMP-SMX prophylaxis prevents most cases.
    </div>
    <div class="card" style="margin-bottom:8px;">
      <div class="card-title">Strongyloides</div>
      Screen ALL transplant candidates from endemic areas. Corticosteroids trigger hyperinfection syndrome with gram-negative bacteremia and meningitis (larvae carry gut bacteria across intestinal wall). Historically high mortality. Treat with ivermectin.
    </div>
    <div class="card">
      <div class="card-title">JC Virus (PML)</div>
      Progressive multifocal leukoencephalopathy in late post-transplant period. Demyelinating CNS disease; multifocal white matter lesions on MRI (T2/FLAIR, no enhancement, no mass effect). No effective antiviral — treatment is reduction of immunosuppression.
    </div>
  </div>
</div>
</div>
`},

// 13. BOARD SUMMARY TABLE
{html:`
<h2>High-Yield Board Summary</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Topic</th><th>The Answer</th></tr></thead>
  <tbody>
    <tr><td>SOT timeline — Month 1</td><td>Nosocomial/surgical infections (SSI, CLABSI, CAUTI, C. difficile, Candida)</td></tr>
    <tr><td>SOT timeline — Months 1–6</td><td>Opportunistic infections at peak (CMV, PJP, EBV/PTLD, BK, Aspergillus, Nocardia, Listeria)</td></tr>
    <tr><td>SOT timeline — &gt;6 months</td><td>Community-acquired predominate; opportunistic if over-immunosuppressed</td></tr>
    <tr><td>Timeline reset trigger</td><td>Intensification of immunosuppression (pulse steroids, ATG for rejection)</td></tr>
    <tr><td>CMV highest risk — SOT</td><td>D+/R&minus; (primary infection from donor organ)</td></tr>
    <tr><td>CMV highest risk — allo-HCT</td><td>D&minus;/R+ (recipient seropositive, donor seronegative — highest per MKSAP 20; D+/R+ also high risk)</td></tr>
    <tr><td>CMV — most common end-organ disease post-transplant</td><td>Colitis (can occur with low or undetectable viremia)</td></tr>
    <tr><td>CMV treatment — severe disease</td><td>IV ganciclovir (preferred over oral for severe/malabsorption concern)</td></tr>
    <tr><td>CMV resistant (UL97 mutation)</td><td>Foscarnet (monitor nephrotoxicity, Ca, Mg)</td></tr>
    <tr><td>Letermovir approvals</td><td>CMV R+ allo-HCT recipients; CMV D+/R&minus; kidney SOT. Does NOT cover HSV/VZV.</td></tr>
    <tr><td>BK virus treatment</td><td>Reduce immunosuppression (no proven antiviral)</td></tr>
    <tr><td>PTLD — first-line treatment</td><td>Reduction of immunosuppression (all subtypes)</td></tr>
    <tr><td>PTLD — who is at highest risk</td><td>EBV D+/R&minus;; T-cell depleting agents; intestinal/multivisceral transplant</td></tr>
    <tr><td>Most dangerous drug interaction</td><td>Rifampin + tacrolimus (&gt;80% decrease in CNI levels &rarr; acute rejection)</td></tr>
    <tr><td>Azole antifungals + CNI</td><td>CYP3A4 inhibition &rarr; marked CNI level increase; reduce tacrolimus 50–67%</td></tr>
    <tr><td>LTBI treatment preferred in transplant</td><td>Isoniazid (not rifampin — rifampin causes potent CYP3A4 induction &rarr; &gt;80% drop in tacrolimus levels)</td></tr>
    <tr><td>Most valuable prophylactic agent</td><td>TMP-SMX (covers PJP, Toxoplasma, Listeria, Nocardia, UTI pathogens)</td></tr>
    <tr><td>Live vaccines post-transplant</td><td>Contraindicated indefinitely after SOT; avoid &ge;2 years after allo-HCT</td></tr>
    <tr><td>Shingrix — safe post-transplant?</td><td>Yes — recombinant, not live. Recommended &ge;19 years if VZV-seropositive.</td></tr>
    <tr><td>Listeria — what NOT to use</td><td>Cephalosporins (no activity against Listeria)</td></tr>
    <tr><td>Heart transplant + Toxoplasma</td><td>Donor-derived (D+/R&minus;) — different from other SOT where it is typically reactivation</td></tr>
    <tr><td>Encapsulated bacteria — when high risk in HCT</td><td>Late phase (&gt;day 100) due to persistent impaired humoral immunity; especially with chronic GVHD</td></tr>
  </tbody>
</table>
</div>
</div>
`},

  <li>Cordonnier C, Einarsdottir S, Cesaro S, et al. Vaccination of haemopoietic stem cell transplant recipients — ECIL 7 Guidelines. <em>Lancet Infect Dis.</em> 2019;19:e200–e212.</li>
  <li>Fishman JA. Infection in organ transplantation. <em>Am J Transplant.</em> 2017;17:856–879.</li>
</ol>
</div>
`},

];

let cur = 0;
function render() {
  document.getElementById('deck').innerHTML = '';
  SLIDES.forEach((s,i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i===cur?' active':'');
    div.innerHTML = s.html;
    document.getElementById('deck').appendChild(div);
  });
  document.getElementById('slide-counter').textContent = (cur+1)+' / '+SLIDES.length;
  document.getElementById('btn-prev').disabled = cur===0;
  document.getElementById('btn-next').disabled = cur===SLIDES.length-1;
  document.getElementById('progress-bar').style.width = ((cur+1)/SLIDES.length*100)+'%';
}
document.getElementById('btn-prev').addEventListener('click',()=>{if(cur>0){cur--;render();}});
document.getElementById('btn-next').addEventListener('click',()=>{if(cur<SLIDES.length-1){cur++;render();}});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){if(cur<SLIDES.length-1){cur++;render();}}
  else if(e.key==='ArrowLeft'){if(cur>0){cur--;render();}}
});
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>40){if(dx<0&&cur<SLIDES.length-1){cur++;render();}else if(dx>0&&cur>0){cur--;render();}}
});
render();
</script>
</body>
