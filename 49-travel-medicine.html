<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Topic 49 — Travel Medicine | Morning Report</title>
<style>
  :root{
    --bg:#ffffff;--bg2:#f6f8fa;--bg3:#eaeef2;--border:#d0d7de;--text:#1f2328;--muted:#656d76;
    --blue:#0969da;--blue-bg:#ddf4ff;--blue-border:#54aeff;
    --green:#1a7f37;--green-bg:#dafbe1;--green-border:#4ac26b;
    --yellow:#9a6700;--yellow-bg:#fff8c5;--yellow-border:#d4a72c;
    --red:#cf222e;--red-bg:#ffebe9;--red-border:#ff8182;
    --purple:#8250df;--purple-bg:#fbefff;--purple-border:#c297ff;
    --orange:#bc4c00;--orange-bg:#fff1e5;--orange-border:#fb8f44;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:18px;line-height:1.5;}
  #deck{width:100%;height:100%;position:relative;overflow:hidden;}
  .slide{position:absolute;top:0;left:0;width:100%;height:100%;
    display:flex;flex-direction:column;padding:34px 52px 54px;
    opacity:0;pointer-events:none;transition:opacity .2s;overflow:hidden;}
  .slide.active{opacity:1;pointer-events:all;}
  .slide-content{background:var(--bg);}
  .slide-accent{background:var(--bg2);}
  .slide-title{background:var(--bg);justify-content:center;}
  .slide-body{flex:1;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;padding-right:4px;}
  .slide-body::-webkit-scrollbar{width:3px;}
  .slide-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  .slide-label{font-size:13px;font-weight:600;text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted);margin-bottom:10px;}
  .slide h1{font-size:38px;font-weight:700;line-height:1.1;margin-bottom:14px;}
  .slide h2{font-size:26px;font-weight:700;padding-bottom:9px;
    border-bottom:2px solid var(--border);margin-bottom:14px;}
  .slide h3{font-size:19px;font-weight:600;margin:12px 0 6px;}
  .slide p{font-size:16px;margin-bottom:8px;}
  .slide ul,.slide ol{padding-left:20px;margin-bottom:8px;}
  .slide li{font-size:17px;margin-bottom:5px;line-height:1.4;}
  .slide strong{font-weight:600;}
  .tagline{font-size:19px;color:var(--muted);max-width:620px;line-height:1.5;margin-bottom:20px;}
  .badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .badge{font-size:13px;font-weight:600;padding:3px 11px;border-radius:99px;border:1px solid;}
  .badge-blue  {background:var(--blue-bg);  color:var(--blue);  border-color:var(--blue-border);}
  .badge-green {background:var(--green-bg); color:var(--green); border-color:var(--green-border);}
  .badge-red   {background:var(--red-bg);   color:var(--red);   border-color:var(--red-border);}
  .badge-yellow{background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow-border);}
  .badge-purple{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-border);}
  .badge-orange{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-border);}
  .callout{border-radius:8px;padding:11px 15px;margin:9px 0;border-left:4px solid;font-size:15px;line-height:1.5;}
  .callout-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:3px;}
  .c-blue  {background:var(--blue-bg);  border-color:var(--blue);  color:#0550ae;} .c-blue   .callout-label{color:var(--blue);}
  .c-yellow{background:var(--yellow-bg);border-color:var(--yellow-border);color:var(--yellow);} .c-yellow .callout-label{color:var(--yellow);}
  .c-red   {background:var(--red-bg);   border-color:var(--red);   color:#82071e;} .c-red    .callout-label{color:var(--red);}
  .c-green {background:var(--green-bg); border-color:var(--green); color:#116329;} .c-green  .callout-label{color:var(--green);}
  .c-orange{background:var(--orange-bg);border-color:var(--orange-border);color:var(--orange);} .c-orange .callout-label{color:var(--orange);}
  .c-purple{background:var(--purple-bg);border-color:var(--purple);color:#5a32a3;} .c-purple .callout-label{color:var(--purple);}
  .table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border);margin:9px 0;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{background:var(--bg3);color:var(--muted);font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);}
  td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top;font-size:14px;}
  tr:last-child td{border-bottom:none;}
  tr:nth-child(even) td{background:var(--bg2);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:9px 0;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:9px 0;}
  .card      {background:var(--bg);        border:1px solid var(--border);       border-radius:10px;padding:13px 15px;}
  .card-red  {background:var(--red-bg);    border:1px solid var(--red-border);   border-radius:10px;padding:13px 15px;}
  .card-green{background:var(--green-bg);  border:1px solid var(--green-border); border-radius:10px;padding:13px 15px;}
  .card-blue {background:var(--blue-bg);   border:1px solid var(--blue-border);  border-radius:10px;padding:13px 15px;}
  .card-yellow{background:var(--yellow-bg);border:1px solid var(--yellow-border);border-radius:10px;padding:13px 15px;}
  .card-orange{background:var(--orange-bg);border:1px solid var(--orange-border);border-radius:10px;padding:13px 15px;}
  .card-purple{background:var(--purple-bg);border:1px solid var(--purple-border);border-radius:10px;padding:13px 15px;}
  .card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;}
  .pearl{background:var(--bg2);border:1px solid var(--border);border-radius:10px;
    padding:12px 15px;margin:8px 0;font-size:16px;line-height:1.5;}
  .ch{display:flex;flex-direction:column;justify-content:center;height:100%;}
  .ch-num{font-size:72px;font-weight:800;color:var(--bg3);line-height:1;margin-bottom:8px;}
  .ch-title{font-size:30px;font-weight:700;margin-bottom:8px;}
  .ch-sub{font-size:18px;color:var(--muted);max-width:540px;line-height:1.4;}
  .img-frame{text-align:center;margin:10px 0;}
  .img-frame img{max-height:320px;max-width:100%;border-radius:6px;border:1px solid var(--border);}
  .img-cap{font-size:11px;color:var(--muted);text-align:center;margin-top:4px;font-weight:600;font-style:italic;}
  .refs{font-size:13px;color:var(--muted);line-height:1.7;}
  .refs li{margin-bottom:7px;}
  #nav{position:fixed;bottom:0;left:0;right:0;height:44px;background:var(--bg);
    border-top:1px solid var(--border);display:flex;align-items:center;
    justify-content:space-between;padding:0 16px;z-index:200;user-select:none;}
  .nav-btn{background:none;border:1px solid var(--border);border-radius:6px;
    padding:5px 14px;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;}
  .nav-btn:hover{background:var(--bg2);}
  .nav-btn:disabled{opacity:.3;cursor:default;}
  #slide-counter{font-size:14px;color:var(--muted);font-weight:500;}
  #progress-bar{position:fixed;top:0;left:0;height:3px;background:var(--blue);transition:width .2s;z-index:300;}
  @media(max-width:720px){
    .slide{padding:18px 14px 54px;}
    .slide h1{font-size:26px;} .slide h2{font-size:20px;}
    .grid-2,.grid-3{grid-template-columns:1fr;}
  }
</style>
</head>

  <span class="callout-label">Timing</span>
  Pretravel consultation should occur <strong>at least 4 weeks before departure</strong>. Travel-related illnesses occur in approximately 20%–60% of international travelers; many are vaccine-preventable. Up-to-date destination guidance: CDC Travelers' Health (wwwnc.cdc.gov/travel) and WHO.

<h2>Travel Vaccines — High-Yield Summary</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Vaccine</th><th>Key Indication</th><th>Type / Timing</th><th>Notes</th></tr></thead>
  <tbody>
    <tr><td><strong>Hepatitis A</strong></td><td>Most travelers to developing countries; endemic areas (Africa, Asia, Central/S. America, E. Europe)</td><td>Inactivated; dose before travel, booster 6–18 mo</td><td>&gt;90% seroconversion within 4 weeks of dose 1</td></tr>
    <tr><td><strong>Typhoid</strong></td><td>South Asia, Africa, Latin America; food/water risk</td><td>Oral (Ty21a): days 0,2,4,6; boost q5y. IM (Vi-PS): single dose; boost q2y</td><td>IM preferred if immunocompromised. Approximately 50%–80% efficacy (temporary immunity)</td></tr>
    <tr><td><strong>Yellow Fever</strong></td><td>Sub-Saharan Africa, tropical South America</td><td>Live-attenuated; single dose &ge;10 days before</td><td>Lifelong immunity; no booster. Certificate required for entry to some countries</td></tr>
    <tr><td><strong>Meningococcal (MenACWY)</strong></td><td>Sub-Saharan "meningitis belt" (dry season); required for Hajj</td><td>Conjugate; single dose; revaccinate q5y if risk persists</td><td>Required for Saudi Arabia pilgrimage</td></tr>
    <tr><td><strong>Japanese Encephalitis</strong></td><td>Rural Asia, W. Pacific; stay &gt;1 month or risk activities</td><td>Inactivated; 2-dose series (day 0, days 7–28); booster &ge;12 mo if ongoing risk</td><td>Most infections asymptomatic; encephalitis mortality ~20%–30%</td></tr>
    <tr><td><strong>Rabies (pre-exposure)</strong></td><td>Adventure/rural travelers, animal contact, remote areas</td><td>Inactivated; days 0 and 7</td><td>If exposed: still need 2 post-exposure doses (days 0, 3) — no RIG required</td></tr>
    <tr><td><strong>Cholera</strong></td><td>Active transmission areas</td><td>Live attenuated oral; at least 10 days before</td><td>Not widely available in US</td></tr>
    <tr><td><strong>Chikungunya</strong></td><td>Travel to endemic areas</td><td>Virus-like particle; single dose</td><td>Approved 2023; see contraindications</td></tr>
    <tr><td><strong>Tick-Borne Encephalitis</strong></td><td>Endemic Europe/Asia; Apr–Nov; woodland/camping activities</td><td>Inactivated; 3-dose series; booster q3y</td><td>US-approved 2021; greatest severity in adults &ge;60</td></tr>
  </tbody>
</table>
</div>
<div class="callout c-yellow">
  <span class="callout-label">Board Pearl</span>
  All travelers should also be up to date on <strong>influenza, COVID-19, Tdap, MMR, varicella, zoster, and hepatitis B</strong> per standard adult schedule. Influenza and hepatitis A are among the most commonly vaccine-preventable illnesses encountered in travelers (per CDC Yellow Book).
</div>
</div>
`},

// 4. YELLOW FEVER CONTRAINDICATIONS
{cls:'slide-content',html:`
<h2>Yellow Fever Vaccine — Contraindications and Special Situations</h2>
<div class="slide-body">
<p>Yellow fever is a <strong>live-attenuated vaccine</strong>. Know the contraindications cold — this is a frequently tested board topic.</p>
<div class="grid-2">
  <div class="card-red">
    <div class="card-title">Absolute Contraindications</div>
    <ul>
      <li>Age &lt;6 months</li>
      <li>Allergy to vaccine component (egg, gelatin, chicken protein)</li>
      <li>Symptomatic HIV or CD4 &lt;200 cells/&micro;L</li>
      <li>Primary immunodeficiency</li>
      <li>Immunosuppressive therapy (including biologics, steroids)</li>
      <li><strong>Thymus disorder</strong> (thymoma, myasthenia gravis <em>with</em> thymectomy)</li>
      <li>Solid organ or hematopoietic stem cell transplant</li>
    </ul>
  </div>
  <div class="card-yellow">
    <div class="card-title">Precautions (risk-benefit discussion)</div>
    <ul>
      <li>Age 6–8 months (theoretical ADEM risk)</li>
      <li><strong>Age &ge;60 years</strong> (increased YEL-AVD risk)</li>
      <li>Pregnancy (theoretical fetal risk)</li>
      <li>Breastfeeding</li>
      <li>Asymptomatic HIV with CD4 200–499</li>
    </ul>
  </div>
</div>
<div class="callout c-red">
  <span class="callout-label">Board Pearl — YEL-AVD</span>
  Yellow fever vaccine-associated viscerotropic disease (YEL-AVD): rare, severe, sometimes fatal reaction mimicking wild-type yellow fever with multiorgan failure. Risk is highest in <strong>first-time recipients aged &ge;60 years</strong>. Case fatality is high (exact figures vary by series and are based on small case numbers — consult current CDC Yellow Book for estimates).
</div>
<div class="callout c-blue">
  <span class="callout-label">Clinical Pearl</span>
  Patients with contraindications still need a <strong>medical waiver letter</strong> for entry into countries requiring vaccination, plus strict mosquito avoidance counseling. The certificate is valid for life after a single dose.
</div>
</div>
`},

// 5. MALARIA — EPIDEMIOLOGY AND DIAGNOSIS
{cls:'slide-content',html:`
<h2>Malaria — Epidemiology and Diagnosis</h2>
<div class="slide-body">
<p><strong>Most common cause of febrile illness in returning travelers</strong>, particularly from sub-Saharan Africa and parts of Asia. Transmitted by the bite of infected female <em>Anopheles</em> mosquitoes. Five human <em>Plasmodium</em> species; <em>P. falciparum</em> and <em>P. knowlesi</em> carry the highest risk of severe disease.</p>
<div class="table-wrap">
<table>
  <thead><tr><th>Species</th><th>Incubation</th><th>Distribution</th><th>Severity</th><th>Relapse (Hypnozoites)</th><th>Chloroquine Resistance</th></tr></thead>
  <tbody>
    <tr><td><em>P. falciparum</em></td><td>8–25 d</td><td>Tropical/temperate worldwide</td><td>High</td><td>No</td><td>Yes — widespread</td></tr>
    <tr><td><em>P. vivax</em></td><td>10–30 d</td><td>Tropical and temperate zones</td><td>Low (splenic rupture risk)</td><td>Yes</td><td>Yes (PNG, Indonesia)</td></tr>
    <tr><td><em>P. ovale</em></td><td>10–20 d</td><td>West Africa, SE Asia</td><td>Low</td><td>Yes</td><td>Rare</td></tr>
    <tr><td><em>P. malariae</em></td><td>15–35 d</td><td>Tropical zones</td><td>Very low</td><td>No (no hypnozoites; periodic recrudescence)</td><td>Rare</td></tr>
    <tr><td><em>P. knowlesi</em></td><td>Indeterminate</td><td>South/SE Asia</td><td>High</td><td>No</td><td>No</td></tr>
  </tbody>
</table>
</div>
<div class="callout c-red">
  <span class="callout-label">Diagnosis</span>
  <strong>Thick and thin peripheral blood smears</strong> are the diagnostic standard. Repeat every 12–24 hours &times;3 if initial smear is negative. Rapid antigen tests (RDT) are used in endemic areas. PCR and serology available through reference labs but too slow for acute management.
</div>

// 6. SEVERE MALARIA CRITERIA
{cls:'slide-content',html:`
<h2>Severe Malaria — WHO Criteria (Board-Testable)</h2>
<div class="slide-body">
<p>Severe malaria is defined as <em>P. falciparum</em> (or <em>P. knowlesi</em>) infection with <strong>any one</strong> of the following features. <em>P. falciparum</em> can deteriorate to death within 24–36 hours — this is a medical emergency.</p>
<div class="table-wrap">
<table>
  <thead><tr><th>Feature</th><th>Threshold</th></tr></thead>
  <tbody>
    <tr><td>Hyperparasitemia</td><td><em>P. falciparum</em> parasitemia &gt;10%</td></tr>
    <tr><td>Cerebral malaria</td><td>GCS &lt;11; inability to swallow</td></tr>
    <tr><td>Prostration</td><td>Generalized weakness; unable to sit/stand/walk without assistance</td></tr>
    <tr><td>Seizures</td><td>&gt;2 episodes within 24 hours</td></tr>
    <tr><td>Severe anemia</td><td>Hemoglobin &lt;7 g/dL</td></tr>
    <tr><td>Pulmonary edema</td><td>Radiographic confirmation or SpO&sub2; &lt;92% on room air + RR &gt;30</td></tr>
    <tr><td>Circulatory shock</td><td>Decompensated: SBP &lt;80 mmHg with impaired perfusion</td></tr>
    <tr><td>Jaundice</td><td>Bilirubin &gt;3 mg/dL with parasitemia &gt;100,000/&micro;L (<em>P. falciparum</em>)</td></tr>
    <tr><td>Metabolic acidosis</td><td>Base deficit &gt;8 mEq/L or bicarb &lt;15 mEq/L or lactate &ge;5 mEq/L</td></tr>
    <tr><td>Kidney impairment</td><td>Creatinine &gt;3 mg/dL or BUN &gt;56 mg/dL</td></tr>
    <tr><td>Hypoglycemia</td><td>Glucose &lt;40 mg/dL</td></tr>
    <tr><td>Significant bleeding</td><td>Recurrent/prolonged bleeding, hematemesis, melena</td></tr>
  </tbody>
</table>
</div>
<div class="callout c-red">
  <span class="callout-label">Treatment — Severe Malaria</span>
  <strong>IV artesunate</strong> is the drug of choice (2.4 mg/kg IV at 0, 12, and 24 hours). Follow with oral ACT (artemether-lumefantrine preferred) when able to take oral medications and clinical improvement evident (WHO guidelines suggest transition when parasitemia &le;1%); consult ID or CDC hotline for complex cases. Monitor for <strong>delayed hemolysis</strong> up to 4 weeks post-artesunate.
</div>
<div class="callout c-yellow">
  <span class="callout-label">Board Pearl</span>
  Patients who develop malaria while on prophylaxis should be treated with a <strong>different drug</strong> than the prophylactic agent used.
</div>
</div>
`},

  <thead><tr><th>Drug</th><th>Dosing</th><th>Start / Stop</th><th>Use</th><th>Key Contraindications / Pearls</th></tr></thead>
  <tbody>
    <tr><td><strong>Atovaquone-proguanil</strong></td><td>Daily</td><td>1–2 days before; stop 7 days after</td><td>All endemic areas; best tolerated</td><td>CrCl &lt;30 mL/min; not recommended in pregnancy; take with food</td></tr>
    <tr><td><strong>Doxycycline</strong></td><td>Daily</td><td>1–2 days before; stop 4 weeks after</td><td>All endemic areas; budget-friendly</td><td>Photosensitivity; esophagitis; avoid in pregnancy and children &lt;8</td></tr>
    <tr><td><strong>Mefloquine</strong></td><td>Weekly</td><td>&ge;2 weeks before; stop 4 weeks after</td><td>Mefloquine-sensitive areas; safe in pregnancy</td><td>Contraindicated: active/history of depression, anxiety disorder, psychosis, seizures, cardiac conduction abnormality</td></tr>
    <tr><td><strong>Chloroquine / HCQ</strong></td><td>Weekly</td><td>1–2 weeks before; stop 4 weeks after</td><td>Chloroquine-sensitive areas only (shrinking list)</td><td>Can worsen psoriasis; safe in pregnancy</td></tr>
    <tr><td><strong>Primaquine</strong></td><td>Daily</td><td>1–2 days before; stop 7 days after</td><td>Principally <em>P. vivax</em> areas; also terminal antirelapse therapy</td><td><strong>Requires quantitative G6PD testing first</strong>; contraindicated in pregnancy/breastfeeding</td></tr>
    <tr><td><strong>Tafenoquine</strong></td><td>Loading (3 days), then weekly</td><td>3 days before; stop 1 week after</td><td>All endemic areas; kills hypnozoites</td><td><strong>Requires quantitative G6PD testing first</strong>; age &ge;18 only; psychiatric disorders</td></tr>
  </tbody>
</table>
</div>
<div class="callout c-red">
  <span class="callout-label">Board Pearl — G6PD Testing</span>
  Primaquine and tafenoquine cause <strong>hemolytic anemia in G6PD deficiency</strong>. Quantitative G6PD testing is required before prescribing either agent. This is one of the most reliably tested facts in travel medicine.
</div>
<div class="callout c-blue">
  <span class="callout-label">Board Pearl — Hypnozoites</span>
  <em>P. vivax</em> and <em>P. ovale</em> form dormant liver hypnozoites — can relapse months to years later. Standard prophylaxis does <strong>not</strong> prevent relapse. Only primaquine and tafenoquine eradicate hypnozoites (terminal antirelapse therapy).
</div>
</div>
`},

// 8. MALARIA TREATMENT — UNCOMPLICATED
{cls:'slide-content',html:`
<h2>Malaria Treatment — Uncomplicated Disease</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead><tr><th>Scenario</th><th>Preferred Regimen</th><th>Notes</th></tr></thead>
  <tbody>
    <tr><td><strong>P. falciparum — chloroquine-sensitive area</strong></td><td>Chloroquine phosphate or hydroxychloroquine</td><td>Rarely applicable given resistance prevalence</td></tr>
    <tr><td><strong>P. falciparum — chloroquine-resistant area (most cases)</strong></td><td>Artemether-lumefantrine (Coartem) preferred<br>OR atovaquone-proguanil<br>OR quinine + doxycycline/tetracycline/clindamycin<br>OR mefloquine (if sensitive area)</td><td>Take artemether-lumefantrine with fatty food. 4 tabs at 0, 8, 24, 36, 48, 60 h</td></tr>
    <tr><td><strong>P. vivax / P. ovale</strong></td><td>Chloroquine (if sensitive) + primaquine or tafenoquine for antirelapse therapy</td><td>P. vivax from PNG or Indonesia: treat as chloroquine-resistant. G6PD test before antirelapse agent</td></tr>
    <tr><td><strong>P. malariae</strong></td><td>Chloroquine phosphate</td><td>Generally mild; chloroquine-sensitive</td></tr>
    <tr><td><strong>P. knowlesi</strong></td><td>Chloroquine phosphate (for mild); consider ACT if severe disease criteria present</td><td><strong>P. knowlesi can cause severe disease comparable to P. falciparum.</strong> MKSAP 20 does not specify a separate regimen; treat severity accordingly. Consult ID/CDC hotline for complex cases.</td></tr>
    <tr><td><strong>Pregnancy</strong></td><td>Chloroquine-sensitive: chloroquine. Chloroquine-resistant P. falciparum: artemether-lumefantrine (any trimester). Relapse prevention: chloroquine weekly until delivery (primaquine/tafenoquine contraindicated)</td><td>Mefloquine also acceptable all trimesters</td></tr>
  </tbody>
</table>
</div>
<div class="callout c-blue">
  <span class="callout-label">Clinical Resource</span>
  CDC Malaria Hotline available 24/7: <strong>770-488-7788</strong>. Use it for complex or unusual cases.
</div>
<div class="callout c-yellow">
  <span class="callout-label">Prevention Measures</span>
  DEET 20%–30% insect repellent, insecticide-impregnated bed nets, permethrin-treated clothing, and limiting outdoor exposure between dusk and dawn.
</div>
</div>
`},

// 9. TYPHOID FEVER
{cls:'slide-content',html:`
<h2>Enteric Fever (Typhoid and Paratyphoid)</h2>
<div class="slide-body">
<div class="grid-2" style="align-items:start;">
  <div>
    <h3>Presentation</h3>
    <ul>
      <li>Incubation 1–30 days</li>
      <li>Fever progressive over days; can remain elevated up to 40&deg;C for 4–8 weeks if untreated</li>
      <li><strong>Pulse-temperature dissociation</strong> (relative bradycardia) — classic board finding</li>
      <li>Headache, arthralgia, myalgia, pharyngitis, anorexia</li>
      <li>Diarrhea or constipation; abdominal pain</li>
      <li><strong>Rose spots</strong>: blanching salmon-colored macules 1–4 mm on chest/abdomen, appear in second week</li>
      <li>Moderate hepatosplenomegaly; leukopenia, thrombocytopenia, elevated transaminases</li>
      <li>Complications (2–3 weeks): intestinal hemorrhage, perforation, encephalopathy</li>
    </ul>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">Diagnosis</span>
      Blood culture: highest yield in first week. Bone marrow culture most sensitive overall. Stool culture: later weeks. Serologies (Widal test): poor accuracy, not recommended for acute diagnosis.
    </div>
  </div>

<div class="callout c-red">
  <span class="callout-label">Treatment — Antibiotic Resistance</span>
  <strong>Fluoroquinolones should NOT be used empirically</strong> — &gt;85% resistance in SE Asia. For travelers from Iraq or Pakistan: carbapenem (complicated) or azithromycin (uncomplicated). For other regions: ceftriaxone or azithromycin empirically. After susceptibility results: fluoroquinolones, ceftriaxone, or azithromycin per sensitivity. Adjunctive dexamethasone may reduce mortality in severe disease (shock, encephalopathy).

// 10. FEVER IN THE RETURNING TRAVELER
{cls:'slide-content',html:`
<h2>Fever in the Returning Traveler — Diagnostic Approach</h2>
<div class="slide-body">
<p>Classic board stem: febrile patient returning from a malarious area. <strong>Rule out P. falciparum first.</strong></p>
<div class="callout c-red">
  <span class="callout-label">Step 1 — Immediate</span>
  Is the patient unstable? Resuscitate + admit. <strong>Isolation precautions:</strong> standard precautions for all; contact + droplet if hemorrhagic fever suspected; contact + droplet + airborne (full PPE) if Ebola/Marburg possible. <strong>Thick and thin blood smears immediately</strong> for any febrile traveler from a malarious region. If negative, repeat every 12–24 hours &times;3.
</div>
<h3>Step 2 — Use Incubation Period to Narrow the Differential</h3>
<div class="grid-3">
  <div class="card-red">
    <div class="card-title">&lt;10 days</div>
    <ul>
      <li>Dengue</li>
      <li>Chikungunya</li>
      <li>Zika</li>
      <li>Rickettsial infections</li>
      <li>Bacterial enteritis</li>
      <li>Influenza</li>
    </ul>
  </div>
  <div class="card-yellow">
    <div class="card-title">10–21 days</div>
    <ul>
      <li>Malaria</li>
      <li>Typhoid fever</li>
      <li>Leptospirosis</li>
      <li>Acute schistosomiasis (Katayama)</li>
      <li>Acute HIV</li>
    </ul>
  </div>
  <div class="card-blue">
    <div class="card-title">&gt;21 days</div>
    <ul>
      <li>Malaria (any species)</li>
      <li>Tuberculosis</li>
      <li>Viral hepatitis</li>
      <li>Visceral leishmaniasis</li>
      <li>Amoebic liver abscess</li>
      <li>Brucellosis</li>
    </ul>
  </div>
</div>
<div class="callout c-blue">
  <span class="callout-label">Initial Workup</span>
  CBC with differential, CMP, LFTs, blood cultures &times;2; thick/thin smears + malaria RDT; dengue NS1 antigen + IgM/IgG; urinalysis; CXR. Consider: Zika/chikungunya PCR, rickettsial serologies, stool studies, hepatitis serologies.
</div>
</div>
`},

// 11. DENGUE, CHIKUNGUNYA, ZIKA
{cls:'slide-content',html:`
<h2>Arboviral Infections — Dengue, Chikungunya, Zika</h2>
<div class="slide-body">
<p>All transmitted by daytime-feeding <em>Aedes</em> mosquitoes. Presentations overlap — use the distinguishing features.</p>
<div class="table-wrap">
<table>
  <thead><tr><th>Feature</th><th>Dengue</th><th>Chikungunya</th><th>Zika</th></tr></thead>
  <tbody>
    <tr><td>Fever</td><td>Prominent (+++)</td><td>Prominent (+++)</td><td>Moderate (++)</td></tr>
    <tr><td>Arthralgia/Arthritis</td><td>+</td><td>Severe, bilateral, symmetrical (+++) — <em>hands/feet</em></td><td>++</td></tr>
    <tr><td>Rash</td><td>+ (scarlatiniform, spares palms/soles)</td><td>++ (maculopapular, limbs/trunk)</td><td>+++ (maculopapular)</td></tr>
    <tr><td>Conjunctivitis</td><td>Absent</td><td>Absent</td><td>++ (distinguishing)</td></tr>
    <tr><td>Bleeding / Shock</td><td>++ (hemorrhagic fever / shock syndrome)</td><td>Absent</td><td>Absent</td></tr>
    <tr><td>Key concern</td><td>Severe dengue: hemorrhage, liver failure, encephalopathy</td><td>Chronic arthralgia/arthritis months–years</td><td>Congenital Zika syndrome (microcephaly, anencephaly)</td></tr>
    <tr><td>Diagnosis</td><td>RT-PCR early; NS1 antigen; serology</td><td>RT-PCR or serology</td><td>NAAT &lt;1 week; IgM after first week</td></tr>
    <tr><td>Treatment</td><td>Supportive. <strong>Avoid NSAIDs and aspirin</strong> until dengue excluded</td><td>NSAIDs for arthralgia — but <strong>avoid until dengue excluded</strong> in travelers from dengue-endemic areas</td><td>Supportive. Counsel re: pregnancy risk</td></tr>
  </tbody>
</table>
</div>

// 12. TRAVELERS' DIARRHEA
{cls:'slide-content',html:`
<h2>Travelers' Diarrhea</h2>
<div class="slide-body">
<p><strong>Most common travel-related illness</strong>. Defined as &ge;3 loose/watery stools per day plus at least one of: fever, cramps, nausea, abdominal pain, blood in stool. Usually occurs in the first 2 weeks; usually self-limited. Most common cause: enterotoxigenic <em>E. coli</em> (ETEC).</p>
<div class="callout c-green">
  <span class="callout-label">Prevention</span>
  "Boil it, cook it, peel it, or forget it." Avoid tap water (including ice and toothbrushing), unpasteurized dairy, undercooked meats, unpeeled produce. <strong>Antibiotic prophylaxis not routinely recommended</strong>. Bismuth subsalicylate has moderate efficacy but requires frequent dosing and carries salicylate toxicity risk.
</div>
<div class="table-wrap" style="margin-top:8px;">
<table>
  <thead><tr><th>Severity</th><th>Definition</th><th>Treatment</th></tr></thead>
  <tbody>
    <tr><td><strong>Mild</strong></td><td>Tolerable, does not interfere with activities</td><td>Oral rehydration &plusmn; loperamide &plusmn; bismuth subsalicylate. No antibiotics.</td></tr>
    <tr><td><strong>Moderate</strong></td><td>Distressing or interferes with planned activities</td><td>Antibiotics may be used: azithromycin (preferred SE Asia), rifaximin or rifamycin (noninvasive diarrhea only), or fluoroquinolone. Add loperamide.</td></tr>
    <tr><td><strong>Severe / Dysentery</strong></td><td>Incapacitating, or any bloody diarrhea</td><td>Azithromycin preferred. Rifaximin/rifamycin and fluoroquinolones acceptable for severe nondysenteric. Loperamide adjunctive only — <strong>NOT as monotherapy with fever or bloody stool</strong>.</td></tr>
  </tbody>
</table>
</div>
<div class="callout c-red">
  <span class="callout-label">Board Pearls</span>
  <strong>Southeast Asia and South Asia</strong>: fluoroquinolone-resistant <em>Campylobacter</em> is prevalent — azithromycin is first-line. Rifaximin and rifamycin are <strong>not appropriate when fever or bloody diarrhea is present</strong> (inadequate for invasive pathogens). Antibiotic use for travelers' diarrhea drives ESBL-producing Enterobacteriaceae colonization — inform patients of this tradeoff.
</div>
</div>
`},

// 13. EOSINOPHILIA IN THE RETURNING TRAVELER
{cls:'slide-content',html:`
<h2>Eosinophilia in the Returning Traveler</h2>
<div class="slide-body">
<p><strong>Eosinophilia + travel history = helminthic infection until proven otherwise.</strong> The degree of eosinophilia does not reliably distinguish species.</p>
<div class="grid-2">
  <div>
    <h3>Key Diagnoses</h3>
    <ul>
      <li><strong>Schistosomiasis</strong>: freshwater exposure in Africa; Katayama fever (acute): fever, urticaria, eosinophilia 2–8 weeks after exposure; Chronic: hematuria (<em>S. haematobium</em>), hepatic fibrosis/portal hypertension (<em>S. mansoni, S. japonicum</em>). Treatment: praziquantel.</li>
      <li><strong>Strongyloides</strong>: among the most commonly identified helminths in returning travelers in published series (geography-dependent); can cause life-threatening hyperinfection syndrome in immunosuppressed patients (especially with corticosteroids). Mortality historically high (&gt;70% reported in older series without early treatment). Treatment: ivermectin.</li>
      <li>Hookworm, ascariasis, filariasis, toxocariasis</li>
    </ul>
  </div>
  <div>
    <h3>Workup</h3>
    <ul>
      <li>Stool ova and parasite &times;3 (concentrated)</li>
      <li><strong>Strongyloides serology</strong> (stool microscopy has poor sensitivity)</li>
      <li>Schistosomiasis serology + terminal urine microscopy (Africa exposure)</li>
      <li>Blood smears / skin snips for microfilariae (if appropriate exposure)</li>
      <li>IgE level (nonspecific but often elevated)</li>
    </ul>
    <div class="callout c-red" style="margin-top:8px;">
      <span class="callout-label">Critical Board Pearl</span>
      <strong>Screen for Strongyloides before starting corticosteroids</strong> in anyone with relevant travel or exposure history. Hyperinfection syndrome carries high mortality (historically &gt;70% in untreated/delayed cases). This is a high-frequency, high-stakes board scenario.
    </div>
  </div>
</div>
</div>
`},

// 14. ADDITIONAL HIGH-YIELD INFECTIONS
{cls:'slide-content',html:`
<h2>Additional High-Yield Travel Infections</h2>
<div class="slide-body">
<div class="grid-2">
  <div class="card">
    <div class="card-title">Rickettsial Infections</div>
    <ul>
      <li>African tick-bite fever (<em>Rickettsia africae</em>): second only to malaria as cause of fever in Africa-returnees</li>
      <li>Fever, headache, maculopapular or petechial rash; <strong>eschar</strong> at bite site with regional lymphadenopathy</li>
      <li>Diagnosis: PCR or immunohistochemistry of skin biopsy; serology often negative acutely</li>
      <li><strong>Treatment of choice for all rickettsial infections: doxycycline for at least 5–7 days</strong></li>
      <li>Treat empirically if suspicion is high — do not wait for confirmatory result</li>
    </ul>
  </div>
  <div class="card">
    <div class="card-title">Leptospirosis</div>
    <ul>
      <li>Freshwater or animal urine exposure (flooding, swimming, occupational)</li>
      <li><strong>Conjunctival suffusion</strong> (erythema without exudates) — distinguishing feature</li>
      <li>Calf and lumbar spine muscle tenderness</li>
      <li>Biphasic: initial septicemic phase, then immune phase with aseptic meningitis, jaundice (Weil disease), AKI</li>
      <li>Treatment: doxycycline (mild) or penicillin G / ceftriaxone (severe)</li>
    </ul>
  </div>
  <div class="card">
    <div class="card-title">Brucellosis</div>
    <ul>
      <li>Ingestion of unpasteurized dairy or undercooked meat; direct animal contact; inhalation</li>
      <li><strong>Undulant fever</strong> (waxing and waning), arthralgia, fatigue, night sweats, hepatosplenomegaly</li>
      <li>Diagnosis: blood/bone marrow culture; serum agglutination titer &ge;1:160 or 4-fold rise</li>
      <li>Treatment: doxycycline + rifampin or gentamicin (extended course)</li>
      <li>Neurobrucellosis: ceftriaxone + doxycycline + rifampin for several months</li>
    </ul>
  </div>
  <div class="card">
    <div class="card-title">Japanese Encephalitis</div>
    <ul>
      <li>Most common vaccine-preventable encephalitis in Asia and western Pacific</li>
      <li>Most infections asymptomatic; encephalitis in &lt;1%</li>
      <li>Mortality when encephalitis occurs: approximately 20%–30%</li>
      <li>Diagnosis: virus-specific IgM in CSF</li>
      <li>Treatment: supportive</li>
      <li>Vaccine: 2-dose inactivated series; complete &ge;1 week before potential exposure</li>
    </ul>
  </div>
</div>
</div>
`},

// 15. ALTITUDE ILLNESS AND RABIES PEP
{cls:'slide-content',html:`
<h2>Altitude Illness and Rabies Post-Exposure Prophylaxis</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Altitude Illness</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Syndrome</th><th>Features</th><th>Management</th></tr></thead>
      <tbody>
        <tr><td><strong>Acute Mountain Sickness (AMS)</strong></td><td>Headache + at least one of: nausea, fatigue, dizziness, sleep disturbance. Above ~2500 m</td><td>Descent; acetazolamide prophylaxis (start 1–2 days before ascent); analgesics</td></tr>
        <tr><td><strong>HACE</strong> (High-altitude cerebral edema)</td><td>AMS + ataxia or altered mental status</td><td><strong>Immediate descent</strong>; dexamethasone; supplemental O&sub2;</td></tr>
        <tr><td><strong>HAPE</strong> (High-altitude pulmonary edema)</td><td>Dyspnea at rest, cough, cyanosis; most dangerous altitude illness</td><td><strong>Immediate descent</strong>; nifedipine; supplemental O&sub2;</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">Acetazolamide</span>
      Prophylaxis for AMS: gradual ascent remains the primary strategy. Acetazolamide accelerates acclimatization. Dexamethasone is reserved for treatment of AMS/HACE when descent is not immediately possible.
    </div>
  </div>
  <div>
    <h3>Rabies Post-Exposure Prophylaxis (PEP)</h3>
    <div class="card-red" style="margin-bottom:10px;">
      <div class="card-title">No Prior Vaccination</div>
      <ul>
        <li>Wound cleansing (critical step)</li>
        <li>Rabies immunoglobulin (RIG) — full dose into wound</li>
        <li>Vaccine: 4 doses (days 0, 3, 7, 14)</li>
      </ul>
    </div>
    <div class="card-green">
      <div class="card-title">Prior Pre-Exposure or PEP Series</div>
      <ul>
        <li>Wound cleansing</li>
        <li>No RIG needed</li>
        <li>Vaccine: 2 doses only (days 0 and 3)</li>
      </ul>
    </div>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Board Pearl</span>
      Pre-exposure vaccination does NOT eliminate the need for post-exposure vaccine doses. It eliminates the need for RIG and reduces required doses from 4 to 2.
    </div>
  </div>
</div>
</div>
`},

    <tr><td>Rifaximin/rifamycin — when NOT to use</td><td>Fever or bloody diarrhea present</td></tr>
    <tr><td>Yellow fever vaccine — key contraindication</td><td>Thymus disorder; any significant immunosuppression</td></tr>
    <tr><td>Dengue — avoid this class of medications</td><td>NSAIDs and aspirin (until dengue excluded)</td></tr>
    <tr><td>Chikungunya — chronic complication</td><td>Arthralgia/arthritis months to years</td></tr>

    <tr><td>Before steroids in traveler with eosinophilia</td><td>Screen for Strongyloides (hyperinfection risk)</td></tr>

// Engine
let cur = 0;
function render() {
  document.getElementById('deck').innerHTML = '';
  SLIDES.forEach((s,i) => {
    const div = document.createElement('div');
    div.className = 'slide ' + (s.cls||'slide-content') + (i===cur?' active':'');
    div.innerHTML = s.html;
    document.getElementById('deck').appendChild(div);
  });
  document.getElementById('slide-counter').textContent = (cur+1)+' / '+SLIDES.length;
  document.getElementById('btn-prev').disabled = cur===0;
  document.getElementById('btn-next').disabled = cur===SLIDES.length-1;
  document.getElementById('progress-bar').style.width = ((cur+1)/SLIDES.length*100)+'%';
}
document.getElementById('btn-prev').addEventListener('click',()=>{if(cur>0){cur--;render();}});
document.getElementById('btn-next').addEventListener('click',()=>{if(cur<SLIDES.length-1){cur++;render();}});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){if(cur<SLIDES.length-1){cur++;render();}}
  else if(e.key==='ArrowLeft'){if(cur>0){cur--;render();}}
});
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>40){if(dx<0&&cur<SLIDES.length-1){cur++;render();}else if(dx>0&&cur>0){cur--;render();}}
});
render();
</script>
