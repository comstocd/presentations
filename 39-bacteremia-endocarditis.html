{cls:'slide-content',html:`
<h2>Case Presentation</h2>
<div class="slide-body">

// 3. PATHOPHYSIOLOGY — NEW
{cls:'slide-accent',html:`
<h2>Pathophysiology: Why IE Is Hard to Treat</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>The Vegetation</h3>
    <ul>
      <li>Begins as a sterile fibrin-platelet thrombus on damaged endothelium</li>
      <li>Transient bacteremia seeds the thrombus &rarr; organisms embed in the matrix</li>
      <li>Vegetation = avascular fibrin-platelet scaffold with extremely high bacterial density (10&sup8;&ndash;10&sup1;&sup0; CFU/g)</li>
      <li>No vasculature &rarr; antibiotics penetrate poorly &rarr; very high concentrations needed at the site</li>
    </ul>
    <h3 style="margin-top:12px;">Why Bactericidal Agents Are Required</h3>
    <div class="callout c-red">
      <span class="callout-label">Stationary-Phase Bacteria</span>
      Deep within the vegetation, organisms are in stationary phase &mdash; metabolically slow, not actively dividing. Beta-lactams and vancomycin require active cell wall synthesis to work. Organisms in stationary phase are tolerant. Only high-dose, prolonged bactericidal therapy achieves sterilization.
    </div>
    <ul>
      <li>This is why bacteriostatic agents (linezolid alone) are not adequate for IE</li>
      <li>This is why duration is weeks, not days</li>
      <li>This is why relapse occurs when therapy is shortened</li>
    </ul>
  </div>
  <div>
    <h3>The Inoculum Effect</h3>
    <ul>
      <li>High bacterial density in vegetations can raise the effective MIC for some agents</li>
      <li>Cefazolin: MIC may increase at high S. aureus inocula &mdash; some prefer nafcillin/oxacillin for IE (clinical significance uncertain but biologically plausible)</li>
      <li>Vancomycin: slow bactericidal activity even at standard doses; higher failure rates vs. beta-lactams for MSSA at any inoculum</li>
    </ul>
    <h3 style="margin-top:12px;">Why Hardware Makes Everything Worse</h3>
    <div class="callout c-purple">
      <span class="callout-label">Biofilm on Prosthetic Valves</span>
      Organisms on prosthetic material form biofilm &mdash; same problem as hardware osteomyelitis. Antibiotics penetrate biofilm poorly; organisms in biofilm are metabolically dormant. Cure without hardware removal or rifampin (biofilm-active) is rarely achieved.
    </div>
    <ul>
      <li>PVE requires longer courses + synergistic agents + rifampin for staphylococci</li>
      <li>Explains why PVE mortality exceeds native valve IE</li>
    </ul>
  </div>
</div>
</div>
`},

// 4. BLOOD CULTURE INTERPRETATION
{cls:'slide-content',html:`
<h2>Interpreting a Positive Blood Culture</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Is It Contamination?</h3>
    <div class="callout c-yellow">
      <span class="callout-label">Organisms That May Represent Skin Contamination</span>
      Coagulase-negative staph &middot; Bacillus spp. (not anthracis) &middot; Corynebacterium spp. &middot; Cutibacterium acnes &middot; Micrococcus
    </div>
    <ul>
      <li>Single set positive = likely contamination for these low-virulence organisms</li>
      <li>Multiple sets positive = more likely true infection</li>
      <li>Prosthetic device or implant = even a single set is significant</li>
      <li>Clinical picture is always decisive</li>
    </ul>
    <h3 style="margin-top:14px;">Gram-Negative Bacteremia</h3>
    <ul>
      <li>GNB cannot be attributed to contamination &mdash; always treat</li>
      <li>Suggests GI or GU source &mdash; direct evaluation there</li>
      <li>Endocarditis rare with GNB (except HACEK, Salmonella in elderly)</li>
      <li>Surveillance cultures not needed if rapid clinical improvement</li>
    </ul>
  </div>
  <div>
    <h3>Special Organisms &mdash; Specific Action Required</h3>
    <div class="callout c-orange">
      <span class="callout-label">S. gallolyticus &rarr; Colonoscopy</span>
      Associated with colorectal malignancy. Colonoscopy indicated regardless of whether IE is present.
    </div>
    <div class="callout c-purple">
      <span class="callout-label">S. anginosus Group &rarr; Look for Abscess</span>
      S. anginosus / S. intermedius / S. constellatus = strong association with pyogenic abscess (liver, brain, lung). Endocarditis rare. Investigate for suppurative focus.
    </div>
    <h3 style="margin-top:12px;">Streptococcal IE Risk by Species</h3>
    <ul>
      <li>S. pneumoniae, S. pyogenes: endocarditis uncommon</li>
      <li>Viridans group streptococci in &ge;2 sets: major Duke criterion &rarr; evaluate for IE</li>
      <li>Single viridans positive: may be transient (dental, mucositis) or contamination</li>
      <li>Enterococcal bacteremia: IE in ~25% of community-acquired cases &rarr; use DENOVA score</li>
    </ul>
  </div>
</div>
</div>
`},

// 5. BACTEREMIA vs IE DECISION — NEW
{cls:'slide-accent',html:`
<h2>S. aureus Bacteremia: Does This Patient Have Endocarditis?</h2>
<div class="slide-body">
<div class="callout c-red">
  <span class="callout-label">Every S. aureus Blood Culture Is Significant &mdash; None Is Contamination</span>
  Case fatality rate is 15&ndash;30%. IE develops in approximately 12% of cases. Metastatic infection develops in &gt;1/3. Mandatory evaluation: ID consult &middot; source identification &middot; metastatic workup &middot; echocardiography.
</div>
<div class="grid-2">
  <div>
    <h3>Uncomplicated Bacteremia &mdash; All Must Be True</h3>
    <div class="card-green">
      <div class="card-title" style="color:var(--green);">Criteria for Uncomplicated (14-day course)</div>
      <ul style="font-size:16px;">
        <li>Removable source identified and removed (e.g., line pulled)</li>
        <li>No evidence of endocarditis on echo</li>
        <li>No implanted hardware (prosthetic valve, joint, pacemaker)</li>
        <li>Blood cultures clear within 72h of starting therapy</li>
        <li>No metastatic foci (no osteomyelitis, no septic arthritis)</li>
        <li>Clinical improvement within 72h</li>
      </ul>
    </div>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Persistent Bacteremia &ge;72h</span>
      Endocarditis &middot; undrained focus &middot; subtherapeutic levels. Never "slow responder." Repeat echo, image for metastatic foci, review drug levels.
    </div>
  </div>
  <div>
    <h3>Features That Push Toward Complicated / IE</h3>
    <ul>
      <li>Community-acquired with no obvious source</li>
      <li>IVDU</li>
      <li>Prosthetic valve or intracardiac device</li>
      <li>Prior IE</li>
      <li>New murmur or embolic phenomena (stroke, pulmonary emboli, Osler nodes, Janeway lesions)</li>
      <li>Persistent bacteremia despite antibiotics</li>
      <li>New conduction abnormality &rarr; suspect annular abscess</li>
      <li>Vertebral osteomyelitis (10&ndash;30% have concurrent IE)</li>
    </ul>
    <h3 style="margin-top:12px;">Antibiotic Duration by Classification</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Classification</th><th>Duration</th></tr></thead>
      <tbody>
        <tr><td>Uncomplicated bacteremia</td><td>14 days</td></tr>
        <tr><td>Right-sided IE (uncomplicated, MSSA)</td><td>2 weeks (beta-lactam only)</td></tr>
        <tr><td>Left-sided IE / complicated</td><td>4&ndash;6 weeks minimum</td></tr>
        <tr><td>Prosthetic valve IE</td><td>&ge;6 weeks + synergistic agents</td></tr>
      </tbody>
    </table>
    </div>
  </div>
</div>
</div>
`},

// 6. ANTIBIOTIC SELECTION + VIRSTA/DENOVA
{cls:'slide-content',html:`
<h2>Antibiotic Selection &amp; Echocardiography Risk Scoring</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>The Critical Antibiotic Rule</h3>
    <div class="callout c-red">
      <span class="callout-label">MSSA Must Get a Beta-Lactam</span>
      Vancomycin for MSSA = higher relapse + higher microbiologic failure + slower bacteremia clearance (median 7d vs. 4d). Switch to nafcillin, oxacillin, or cefazolin when MSSA is confirmed. Reserve vancomycin for serious documented beta-lactam allergy.
    </div>
    <div class="table-wrap" style="margin-top:8px;">
    <table>
      <thead><tr><th>Organism</th><th>Preferred</th><th>Notes</th></tr></thead>
      <tbody>
        <tr><td><strong>MSSA</strong></td><td>Nafcillin/oxacillin or cefazolin</td><td>CNS involvement: nafcillin/oxacillin only (cefazolin poor BBB penetration)</td></tr>
        <tr><td><strong>MRSA</strong></td><td>Vancomycin (AUC/MIC) or daptomycin</td><td>Daptomycin if vanco MIC &ge;2; cannot use daptomycin for pneumonia (surfactant binding)</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">Enterococcal Uncomplicated Bacteremia</span>
      Without endocarditis: 2 weeks directed therapy with penicillin or ampicillin. No synergy needed. If resistant or allergic: vancomycin, daptomycin, or linezolid.
    </div>
  </div>
  <div>
    <h3>VIRSTA Score &mdash; S. aureus Bacteremia</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Variable</th><th>Pts</th></tr></thead>
      <tbody>
        <tr><td>Embolic disease or meningitis</td><td>5 each</td></tr>
        <tr><td>Intracardiac device / prior IE / prosthetic valve</td><td>4</td></tr>
        <tr><td>IVDU</td><td>4</td></tr>
        <tr><td>Pre-existing valvular disease</td><td>3</td></tr>
        <tr><td>Persistent bacteremia &ge;48h</td><td>3</td></tr>
        <tr><td>Vertebral osteomyelitis</td><td>2</td></tr>
        <tr><td>Community acquisition</td><td>2</td></tr>
        <tr><td>Severe sepsis / shock</td><td>1</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-blue" style="margin-top:6px;">
      <span class="callout-label">Echocardiography Sequence</span>
      TTE first &rarr; if non-diagnostic + VIRSTA &ge;3: TEE. TEE also indicated: prosthetic valve, intracardiac device, new conduction block, suspected abscess. Repeat echo with any clinical change.
    </div>
    <div class="callout c-green" style="margin-top:6px;">
      <span class="callout-label">DENOVA Score &mdash; Enterococcal Bacteremia</span>
      Embolic disease &middot; valvular disease &middot; symptoms &ge;7d &middot; &ge;2 positive sets &middot; no primary source &middot; murmur (1 point each). Score &le;2: TEE can be deferred.
    </div>
  </div>
</div>
</div>
`},

// 9. DUKE CRITERIA
{cls:'slide-accent',html:`
<h2>Duke Criteria (2023 Update)</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <div class="card-blue">
      <div class="card-title" style="color:var(--blue);">Major Criteria</div>
      <ul style="font-size:16px;">
        <li><strong>Microbiologic:</strong> typical organism in &ge;2 sets; non-typical in &ge;3 sets; positive PCR/serology for Coxiella, Bartonella, or Tropheryma whipplei</li>
        <li><strong>Imaging:</strong> vegetation, perforation, aneurysm, abscess, pseudoaneurysm, intracardiac fistula; new valvular regurgitation; new prosthetic dehiscence; abnormal FDG-PET/CT on native or prosthetic valve / device leads</li>
        <li><strong>Surgical:</strong> direct inspection confirming IE at surgery</li>
      </ul>
    </div>
    <div class="card-yellow" style="margin-top:10px;">
      <div class="card-title" style="color:var(--yellow);">Minor Criteria</div>
      <ul style="font-size:16px;">
        <li>Predisposition: IVDU, prosthetic valve, prior IE, congenital HD, intracardiac device, HOCM</li>
        <li>Fever &gt;38&deg;C</li>
        <li>Vascular phenomena: emboli, Janeway lesions, mycotic aneurysm, ICH, conjunctival petechiae</li>
        <li>Immunologic: Osler nodes, Roth spots, positive RF, immune-complex GN</li>
        <li>Microbiologic: positive culture not meeting major criterion</li>
      </ul>
    </div>
  </div>
  <div>
    <h3>Classification</h3>
    <div class="card-red" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--red);">Definite IE</div>
      2 major &middot; or 1 major + 3 minor &middot; or 5 minor &middot; or pathologic confirmation
    </div>
    <div class="card-yellow" style="margin-bottom:8px;">
      <div class="card-title" style="color:var(--yellow);">Possible IE</div>
      1 major + 1 minor &middot; or 3 minor
    </div>
    <div class="card-green">
      <div class="card-title" style="color:var(--green);">IE Excluded</div>
      Firm alternative diagnosis &middot; or no pathologic evidence at surgery/autopsy after &le;4 days antibiotics &middot; or resolution with &le;4 days antibiotics
    </div>
    <div class="callout c-blue" style="margin-top:10px;">
      <span class="callout-label">Timing Note</span>
      Duration clock starts from the date of the <strong>first negative blood culture</strong>, not the date antibiotics started.
    </div>
    <div class="callout c-yellow" style="margin-top:6px;">
      <span class="callout-label">Typical Organisms (Major Criterion)</span>
      S. aureus &middot; S. lugdunensis &middot; E. faecalis &middot; all streptococci (except S. pneumoniae and S. pyogenes) &middot; HACEK group &middot; Granulicatella &middot; Abiotrophia &middot; Gemella. With prosthetic material: add CoNS, Pseudomonas, Candida, M. chimaera.
    </div>
  </div>
</div>
</div>
`},

// 10. CULTURE-NEGATIVE IE
{cls:'slide-content',html:`
<h2>Culture-Negative Endocarditis</h2>
<div class="slide-body">
<div class="callout c-yellow">
  <span class="callout-label">Most Common Cause: Prior Antibiotics</span>
  Always ask whether antibiotics were given before blood cultures were drawn. This is the leading cause of culture-negative IE.
</div>
<div class="table-wrap">
<table>
  <thead><tr><th>Pathogen</th><th>Exposure / Clue</th><th>Diagnostic Test</th></tr></thead>
  <tbody>
    <tr><td><strong>Coxiella burnetii (Q fever)</strong></td><td>Infected farm animals, unpasteurized dairy</td><td>Phase I IgG serology (&gt;1:800); PCR of valve</td></tr>
    <tr><td><strong>Bartonella henselae</strong></td><td>Cat exposure</td><td>IgG serology (&ge;1:800); PCR of valve</td></tr>
    <tr><td><strong>Bartonella quintana</strong></td><td>Homelessness, body lice</td><td>IgG serology; PCR of valve</td></tr>
    <tr><td><strong>Tropheryma whipplei</strong></td><td>GI symptoms; not clearly defined</td><td>PCR of valve tissue</td></tr>
    <tr><td><strong>Brucella spp.</strong></td><td>Farm animals, unpasteurized dairy, endemic travel (Middle East)</td><td>Serology; blood PCR</td></tr>
    <tr><td><strong>Chlamydia psittaci</strong></td><td>Bird contact</td><td>Serology</td></tr>
    <tr><td><strong>HACEK organisms</strong></td><td>Oropharyngeal flora; subacute course</td><td>Modern automated blood culture systems usually sufficient; prolonged incubation if suspected</td></tr>
    <tr><td><strong>Mycobacterium chimaera</strong></td><td>Cardiac surgery with contaminated heater-cooler units</td><td>Mycobacterial blood culture; histopathology of valve</td></tr>
    <tr><td><strong>Candida / Aspergillus</strong></td><td>IVDU, chronic central lines, post-cardiac surgery, immunosuppressed</td><td>&beta;-D-glucan; Aspergillus galactomannan; fungal blood culture</td></tr>
  </tbody>
</table>
</div>
<div class="callout c-purple">
  <span class="callout-label">Non-Infectious Mimics</span>
  Marantic endocarditis (malignancy-associated) &middot; Libman-Sacks endocarditis (SLE). Sterile vegetations with embolic complications. No fever, no bacteremia.
</div>
</div>
`},

// 12. RIGHT vs LEFT-SIDED IE — NEW
{cls:'slide-content',html:`
<h2>Right-Sided vs. Left-Sided IE</h2>
<div class="slide-body">
<div class="grid-2">
  <div class="card-blue">
    <div class="card-title" style="color:var(--blue);">Right-Sided IE (Tricuspid)</div>
    <ul style="font-size:16px;">
      <li>Predominant setting: IVDU, long-term central venous catheters</li>
      <li>S. aureus most common pathogen by far</li>
      <li>Septic pulmonary emboli: hemoptysis, pleuritic chest pain, pleural-based cavitary nodules on CT</li>
      <li>Better prognosis than left-sided disease</li>
      <li>Surgery less often required</li>
      <li><strong>Uncomplicated MSSA, native tricuspid:</strong> 2-week beta-lactam course adequate</li>
      <li><strong>MRSA right-sided IE:</strong> full 6-week regimen required &mdash; 2-week vancomycin has unacceptably high failure rate</li>
    </ul>
  </div>
  <div class="card-red">
    <div class="card-title" style="color:var(--red);">Left-Sided IE (Mitral / Aortic)</div>
    <ul style="font-size:16px;">
      <li>Higher mortality; more destructive valve injury</li>
      <li>Embolic rate up to <strong>40%</strong> &mdash; most devastating to CNS (stroke)</li>
      <li>Minimum 6 weeks for S. aureus IE</li>
      <li>Heart failure from valve destruction is a common indication for surgery</li>
      <li>Anticoagulation carries significant risk for hemorrhagic transformation of embolic infarcts</li>
      <li>Annular/septal extension &rarr; abscess, fistula, heart block</li>
      <li>Aortic valve IE: higher surgical rate than mitral due to proximity to conduction system and aortic root</li>
    </ul>
  </div>
</div>

// 13. TREATMENT — EMPIRIC + STREP
{cls:'slide-accent',html:`
<h2>Empiric Therapy &amp; Streptococcal IE</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Empiric Regimens (Critically Ill)</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Setting</th><th>Regimen</th></tr></thead>
      <tbody>
        <tr><td>Community-acquired native valve or late PVE (&ge;12 months)</td><td>Vancomycin + cefepime or ceftriaxone</td></tr>
        <tr><td>Early PVE (&lt;12 months) or healthcare-associated</td><td>Vancomycin + gentamicin + rifampin&sup1; + cefepime</td></tr>
      </tbody>
    </table>
    </div>
    <p style="font-size:13px;color:var(--muted);">&sup1; Delay rifampin 3&ndash;5 days to reduce resistance emergence</p>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">Principles</span>
      Blood cultures before antibiotics &middot; ID consultation always &middot; bactericidal agents required &middot; duration clock = first negative blood culture
    </div>
  </div>
  <div>
    <h3>Streptococcal IE</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Penicillin MIC</th><th>Native Valve</th><th>Prosthetic</th></tr></thead>
      <tbody>
        <tr><td>Highly sensitive (&le;0.12)</td><td>PCN G or ceftriaxone 4 weeks</td><td>6 weeks &plusmn; gent &times;2 wk</td></tr>
        <tr><td>Relatively resistant (0.12&ndash;0.5)</td><td>PCN G + gent 2 wk, or ceftriaxone 4 wk</td><td>6 weeks + gent &times;6 wk</td></tr>
        <tr><td>Resistant (&ge;0.5)</td><td>PCN G + gent, or vancomycin 4&ndash;6 wk</td><td>Vancomycin 6 weeks</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Nutritionally Variant Streptococci</span>
      Abiotrophia, Gemella, Granulicatella: MIC testing often inaccurate. Treat as MIC &ge;0.5 regardless of reported susceptibility.
    </div>
    <h3 style="margin-top:10px;">HACEK Organisms</h3>
    <ul>
      <li>Fastidious gram-negative oropharyngeal flora; subacute course</li>
      <li>Modern blood culture systems usually adequate for growth</li>
      <li>Ceftriaxone &times;4 weeks (preferred); ampicillin or ciprofloxacin alternatives</li>
    </ul>
  </div>
</div>
</div>
`},

// 14. TREATMENT — STAPH + ENTEROCOCCAL + CANDIDA
{cls:'slide-content',html:`
<h2>Staphylococcal, Enterococcal &amp; Candida IE</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>S. aureus IE</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Organism</th><th>Native Valve</th><th>Prosthetic: Add</th></tr></thead>
      <tbody>
        <tr><td>MSSA</td><td>Nafcillin/oxacillin or cefazolin &times;6 wk</td><td>+ Rifampin &times;6 wk + Gent &times;2 wk</td></tr>
        <tr><td>MRSA</td><td>Vancomycin or daptomycin &times;6 wk</td><td>+ Rifampin &times;6 wk + Gent &times;2 wk</td></tr>
      </tbody>
    </table>
    </div>
    <ul style="margin-top:8px;">
      <li>Aminoglycoside synergy: <strong>not recommended</strong> for native valve staph IE (no outcome benefit; nephrotoxic)</li>
      <li>CNS involvement: nafcillin/oxacillin only (cefazolin does not cross BBB adequately)</li>
    </ul>
    <h3 style="margin-top:12px;">Candida IE</h3>
    <ul>
      <li>Initial: liposomal amphotericin B &plusmn; flucytosine, or echinocandin</li>
      <li>Fluconazole: <strong>not for initial treatment</strong> &mdash; step-down only after candidemia clears in susceptible isolate</li>
      <li>Valve replacement required for curative intent + &ge;6 weeks postoperative antifungal</li>
      <li>Non-surgical candidates: lifetime azole suppression</li>
    </ul>
  </div>
  <div>
    <h3>Enterococcal IE</h3>
    <div class="callout c-blue">
      <span class="callout-label">Why Synergy Is Required</span>
      Enterococci tolerate beta-lactams and glycopeptides alone. A second agent achieves bactericidal activity. Ceftriaxone preferred over aminoglycosides &mdash; equal efficacy, less nephrotoxicity.
    </div>
    <div class="table-wrap" style="margin-top:8px;">
    <table>
      <thead><tr><th>Susceptibility</th><th>Regimen</th><th>Duration</th></tr></thead>
      <tbody>
        <tr><td>Ampicillin-sensitive</td><td>Ampicillin + ceftriaxone, or + gentamicin</td><td>6 weeks</td></tr>
        <tr><td>Ampicillin-resistant, vanco-sensitive</td><td>Vancomycin + gentamicin</td><td>6 weeks</td></tr>
        <tr><td>VRE</td><td>Daptomycin or linezolid</td><td>&gt;6 weeks</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-green" style="margin-top:8px;">
      <span class="callout-label">Uncomplicated Enterococcal Bacteremia (No IE)</span>
      2 weeks directed therapy with penicillin or ampicillin. No synergy needed for bacteremia without valvular infection.
    </div>
  </div>
</div>
</div>
`},

// 15. SURGICAL INDICATIONS
{cls:'slide-accent',html:`
<h2>Surgical Indications</h2>
<div class="slide-body">
<div class="callout c-red">
  <span class="callout-label">Early Surgery During Hospitalization &mdash; Before Completing Antibiotic Course</span>
  Multidisciplinary decision. Do not wait for culture clearance in these scenarios.
</div>
<div class="grid-2">
  <div>
    <h3>Indications</h3>
    <ul>
      <li><strong>Severe valvular dysfunction</strong> &rarr; symptomatic heart failure</li>
      <li><strong>Fungal IE</strong> or highly resistant organisms</li>
      <li><strong>Annular / aortic abscess</strong> &mdash; suspect if new heart block on ECG</li>
      <li><strong>Destructive penetrating lesion</strong> (fistula, pseudoaneurysm)</li>
      <li><strong>Persistent bacteremia</strong> despite appropriate antibiotics</li>
      <li><strong>Recurrent emboli</strong> after &gt;5 days appropriate therapy</li>
      <li><strong>Large vegetation &gt;10 mm</strong> especially with prior embolic event</li>
    </ul>
    <div class="callout c-orange" style="margin-top:8px;">
      <span class="callout-label">Prosthetic Valve Endocarditis</span>
      Annular and myocardial abscesses &mdash; both are surgical indications. Higher operative risk; earlier threshold for surgery.
    </div>
  </div>
  <div>
    <h3>Post-Surgery Antibiotic Rules</h3>
    <ul>
      <li>Organism grows from surgical specimen &rarr; <strong>restart antibiotic clock from date of surgery</strong>, regardless of preoperative duration</li>
      <li>Native &rarr; prosthetic valve during active IE: whether to transition to prosthetic valve regimen is controversial &mdash; consult ID</li>
    </ul>
    <h3 style="margin-top:14px;">Anticoagulation</h3>
    <div class="callout c-red">
      <span class="callout-label">Left-Sided IE: ICH Risk</span>
      Initiating or continuing anticoagulation carries significant risk for hemorrhagic transformation of embolic cerebral infarcts. No universal recommendation &mdash; multidisciplinary decision required.
    </div>
  </div>
</div>
</div>
`},

// 16. POET TRIAL + ORAL STEP-DOWN — NEW
{cls:'slide-content',html:`
<h2>Oral Step-Down: The POET Trial</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>POET Trial (NEJM 2019; 5-year follow-up NEJM 2022)</h3>
    <div class="callout c-green">
      <span class="callout-label">Design and Result</span>
      400 patients with left-sided IE, clinically stable after &ge;10 days IV antibiotics, randomized to continued IV vs. early switch to oral. Primary endpoint: composite of all-cause mortality, unplanned cardiac surgery, embolic events, and relapse at 6 months. <strong>Oral was non-inferior</strong> (12.1% vs. 12.6%). 5-year follow-up confirmed durable non-inferiority.
    </div>
    <h3 style="margin-top:12px;">Oral Agents Used in POET</h3>
    <ul>
      <li>Streptococci: amoxicillin &plusmn; rifampin, or moxifloxacin</li>
      <li>Enterococci: amoxicillin + rifampin, or moxifloxacin</li>
      <li>S. aureus: dicloxacillin + rifampin (MSSA); linezolid + rifampin (MRSA)</li>
      <li>All agents chosen for high oral bioavailability and appropriate spectrum</li>
    </ul>
  </div>
  <div>
    <h3>Who Was Excluded From POET</h3>
    <div class="callout c-red">
      <span class="callout-label">Do Not Apply POET to These Patients</span>
      S. aureus IE with prosthetic valve &middot; fungi &middot; MRSA right-sided IE &middot; intracardiac device infection &middot; clinical instability &middot; impaired oral absorption (GI disease, reduced consciousness) &middot; ongoing need for IV therapy for another reason
    </div>
    <h3 style="margin-top:14px;">Clinical Application</h3>
    <ul>
      <li>Transition after &ge;10 days stable IV therapy</li>
      <li>Patient must be clinically improving, afebrile, hemodynamically stable</li>
      <li>Source controlled, no indication for surgery</li>
      <li>No embolic complications in the preceding 2 weeks</li>
      <li>Consult ID before transitioning &mdash; this is a select population</li>
    </ul>
    <div class="callout c-blue" style="margin-top:8px;">
      <span class="callout-label">Practical Impact</span>
      POET enables earlier hospital discharge for appropriate patients. PICC-line complications (DVT, CLABSI, line dislodgement) are common over a 6-week course &mdash; avoiding them has real morbidity benefit.
    </div>
  </div>
</div>
</div>
`},

// 17. CLINICAL PEARLS
{cls:'slide-accent',html:`
<h2>Clinical Pearls</h2>
<div class="slide-body">
<div class="pearl"><strong>Every S. aureus blood culture is significant.</strong> No exceptions. No "likely contamination." Mandatory: source identification, metastatic workup, echocardiography, ID consultation. Case fatality is 15&ndash;30%; IE develops in approximately 12% of cases; metastatic infection occurs in &gt;1/3.</div>
<div class="pearl"><strong>MSSA must get a beta-lactam.</strong> Vancomycin for MSSA = slower bacteremia clearance (7d vs. 4d median), higher relapse, higher microbiologic failure. When susceptibilities return MSSA, switch &mdash; even if the patient appears to be improving on vancomycin.</div>
<div class="pearl"><strong>Persistent bacteremia at 72h is a red flag, not a slow responder.</strong> Means endocarditis, undrained metastatic focus, retained foreign body, or subtherapeutic drug levels. Repeat echo. Image for occult collections. Review drug dosing.</div>
<div class="pearl"><strong>New conduction abnormality in IE = perivalvular abscess until proven otherwise.</strong> PR prolongation, new LBBB/RBBB, or complete heart block in the context of IE signals annular or septal extension. TEE and cardiac surgery consultation urgently.</div>
<div class="pearl"><strong>S. gallolyticus bacteremia = colonoscopy.</strong> Associated with colorectal malignancy. Colonoscopy is indicated regardless of whether endocarditis is present. The malignancy may be asymptomatic.</div>
<div class="pearl"><strong>Restart the antibiotic clock after valve surgery.</strong> Growth of organism from the surgical specimen means the full treatment course is counted from the date of surgery. Every preoperative day is forfeited. Failure to apply this rule results in systematically undertreated PVE.</div>
<div class="pearl"><strong>POET applies to a select population &mdash; not all IE.</strong> S. aureus with prosthetic valve, MRSA, fungi, intracardiac device, and clinical instability were excluded. For appropriate patients, early oral step-down after &ge;10 days IV is non-inferior and avoids PICC complications. Always consult ID before transitioning.</div>
</div>
`},

const deck=document.getElementById('deck'),counter=document.getElementById('slide-counter'),
  btnPrev=document.getElementById('btn-prev'),btnNext=document.getElementById('btn-next'),
  bar=document.getElementById('progress-bar');
let cur=0;
SLIDES.forEach((s,i)=>{
  const el=document.createElement('div');
  el.className='slide '+s.cls; el.innerHTML=s.html;
  if(i===0)el.classList.add('active');
  deck.appendChild(el);
});
const slides=deck.querySelectorAll('.slide');
function goTo(n){
  if(n<0||n>=slides.length)return;
  slides[cur].classList.remove('active'); cur=n;
  slides[cur].classList.add('active');
  const b=slides[cur].querySelector('.slide-body'); if(b)b.scrollTop=0;
  counter.textContent=(cur+1)+' / '+slides.length;
  btnPrev.disabled=cur===0; btnNext.disabled=cur===slides.length-1;
  bar.style.width=((cur+1)/slides.length*100)+'%';
}
btnPrev.addEventListener('click',()=>goTo(cur-1));
btnNext.addEventListener('click',()=>goTo(cur+1));
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();goTo(cur+1);}
  if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();goTo(cur-1);}
});
let tx=0;
deck.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
deck.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50)dx<0?goTo(cur+1):goTo(cur-1);
},{passive:true});
goTo(0);
</script>
</body>
