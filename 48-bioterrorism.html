<h1>Bioterrorism &amp;<br>Biologic Weapons</h1>

{cls:'slide-accent',html:`
<h2>Bioterrorism: Framework &amp; Recognition</h2>
<div class="slide-body">
<div class="callout c-red">
  <span class="callout-label">The Recognition Problem</span>
  Bioterrorism agents typically present as undifferentiated febrile illness in the first 24&ndash;72 hours. The clinician at the bedside makes the initial call. Delayed recognition = delayed public health response = more cases.
</div>
<div class="grid-2">
  <div>
    <h3>CDC Category A Agents</h3>
    <p style="font-size:15px;">Highest priority: based on ease of dissemination, high mortality, potential for social disruption, and need for special public health preparedness (MKSAP 20).</p>
    <div class="table-wrap" style="margin-top:6px;">
    <table>
      <thead><tr><th>Agent</th><th>Organism / Pathogen</th><th>Key Clue</th></tr></thead>
      <tbody>
        <tr><td><strong>Anthrax</strong></td><td><em>Bacillus anthracis</em></td><td>Widened mediastinum; ANY inhalational case = bioterrorism until proven otherwise</td></tr>
        <tr><td><strong>Smallpox</strong></td><td>Variola virus</td><td>Synchronous lesions; face + extremities &gt; trunk; eradicated 1980</td></tr>
        <tr><td><strong>Plague</strong></td><td><em>Yersinia pestis</em></td><td>Pneumonic: rapid pneumonia + hemoptysis; bipolar "safety-pin" staining</td></tr>
        <tr><td><strong>Botulism</strong></td><td><em>Clostridium botulinum</em> toxin</td><td>Descending flaccid paralysis; prominent bulbar signs; afebrile</td></tr>
        <tr><td><strong>Tularemia</strong></td><td><em>Francisella tularensis</em></td><td>Abrupt fever + respiratory illness; hilar adenopathy + effusions on CXR</td></tr>
        <tr><td><strong>Viral hemorrhagic fever</strong></td><td>Ebola, Marburg, Lassa, others</td><td>Fever + unexplained bleeding; 2&ndash;21 day incubation; travel or exposure history</td></tr>
      </tbody>
    </table>
    </div>
  </div>
  <div>
    <h3>When to Suspect Bioterrorism</h3>
    <ul style="font-size:15px;">
      <li>Cluster of patients with similar severe illness of unknown etiology</li>
      <li>Unusual or rare pathogen (anthrax, plague, smallpox) in a patient without obvious exposure</li>
      <li>Inhalational anthrax in any form &mdash; <strong>automatic bioterrorism presumption</strong> (MKSAP 20)</li>
      <li>Eradicated disease (smallpox) appearing anywhere</li>
      <li>Outbreak of severe respiratory or hemorrhagic illness without clear epidemiologic explanation</li>
      <li>Pneumonic plague in an urban setting without known zoonotic exposure</li>
    </ul>
    <div class="callout c-yellow" style="margin-top:8px;">
      <span class="callout-label">Immediate Actions for Suspected Bioterrorism</span>
      1. Isolate the patient per pathogen-specific precautions<br>
      2. Notify your hospital infection control and ID team immediately<br>
      3. Contact your state/local public health department<br>
      4. Contact CDC Emergency Operations Center (770-488-7100) if needed<br>
      5. Do NOT delay notification to gather more data
    </div>
  </div>
</div>
</div>

{cls:'slide-content',html:`
<h2>Anthrax (<em>Bacillus anthracis</em>)</h2>
<div class="slide-body">
<div style="display:flex;gap:14px;align-items:flex-start;">
  <div style="flex:1;">
    <div class="callout c-red">
      <span class="callout-label">MKSAP 20 KP: Any Case of Inhalational Anthrax = Potential Bioterrorism</span>
      No exceptions. Even a single case of inhalational anthrax must trigger immediate public health notification.
    </div>
    <h3 style="margin-top:8px;">Three Clinical Forms</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Form</th><th>Exposure</th><th>Key Features</th><th>Mortality</th></tr></thead>
      <tbody>
        <tr><td><strong>Inhalational</strong></td><td>Aerosolized spores (bioterrorism paradigm)</td><td>Prodrome: malaise, myalgia, fever, cough, dyspnea, substernal chest discomfort. CXR: <strong>widened mediastinum</strong> (hemorrhagic mediastinal lymphadenopathy). Rapid progression to septic shock, meningitis, and death without treatment.</td><td>High (&gt;80% untreated)</td></tr>
        <tr><td><strong>Cutaneous</strong></td><td>Skin contact with spores/infected animals</td><td>Painless papule &rarr; vesicle &rarr; <strong>black eschar</strong> with surrounding edema. Usually not life-threatening if treated.</td><td>&lt;1% treated</td></tr>
        <tr><td><strong>Gastrointestinal</strong></td><td>Ingestion of contaminated meat</td><td>Nausea, vomiting, severe abdominal pain; can progress to hemorrhagic ascites, sepsis. Less relevant to bioterrorism.</td><td>Moderate</td></tr>
      </tbody>
    </table>
    </div>
    <h3 style="margin-top:10px;">Treatment (MKSAP 20)</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Setting</th><th>Regimen</th></tr></thead>
      <tbody>
        <tr><td>Systemic disease without meningitis</td><td>Preferred (MKSAP 20): IV meropenem + IV doxycycline or IV ciprofloxacin; add additional agent (clindamycin, linezolid, or rifampin). Duration: &ge;14 days IV, then oral step-down.</td></tr>
        <tr><td>Systemic disease with meningitis</td><td>Preferred (MKSAP 20): IV ciprofloxacin + IV meropenem + IV minocycline; duration &ge;60 days total. Bactericidal regimen required; bacteriostatic agents alone are insufficient.</td></tr>
        <tr><td>Antitoxin (systemic disease)</td><td><strong>Anthrax antitoxins should be considered with antibiotics</strong> for systemic disease (MKSAP 20). FDA-approved: raxibacumab 40 mg/kg IV x1 or obiltoxaximab 16 mg/kg IV x1 (USAMRIID, 2025).</td></tr><tr><td>Postexposure prophylaxis (PEP)</td><td><strong>Fluoroquinolone or doxycycline x60 days + vaccination</strong> (MKSAP 20 KP)</td></tr>
        <tr><td>Cutaneous, uncomplicated</td><td>Ciprofloxacin, levofloxacin, doxycycline, or minocycline PO; 7&ndash;10 days if naturally acquired; <strong>60 days if bioterrorism-related</strong> (MKSAP 20; USAMRIID adds minocycline)</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-blue" style="margin-top:6px;">
      <span class="callout-label">Microbiology</span>
      Large gram-positive "box-car"&ndash;shaped bacilli in chains. Forms terminal and subterminal spores (highly resistant to heat and disinfection). Spores can remain viable in soil for decades.
    </div>
  </div>

<h2>Smallpox (Variola)</h2>
<div class="slide-body">
<div style="display:flex;gap:14px;align-items:flex-start;">
  <div style="flex:1;">
    <div class="callout c-red">
      <span class="callout-label">Eradicated in 1980 &mdash; Any Case Is Bioterrorism Until Proven Otherwise</span>
      Declared eradicated by the WHO in 1980. Natural disease does not occur. A single confirmed case anywhere in the world requires immediate CDC/WHO notification and constitutes a global health emergency.
    </div>
    <h3 style="margin-top:8px;">Clinical Presentation (MKSAP 20 KP)</h3>
    <ul style="font-size:15px;">
      <li><strong>Viremia phase (days 1&ndash;4):</strong> Abrupt onset fever (38.5&ndash;40.5&deg;C), severe headache, backache, malaise, prostration &mdash; often severe enough to be bedridden</li>
      <li><strong>Enanthem:</strong> lesions appear first on oral mucosa and tongue, then face (day 4&ndash;5)</li>
      <li><strong>Rash spreads centrifugally:</strong> face &rarr; arms/legs &rarr; trunk (extremities and face predominate; <strong>trunk-sparing</strong>)</li>
      <li><strong>Synchronous evolution (MKSAP 20 KP):</strong> All lesions in a given area are at the same stage simultaneously (macule &rarr; papule &rarr; vesicle &rarr; pustule &rarr; scab, entire evolution macule &rarr; scab takes approximately 8 days total (MKSAP 20; not 8 days per stage)). This is the defining feature distinguishing smallpox from varicella.</li>
      <li>Lesions are deeply seated, firm, round, well-circumscribed, and feel like ball-bearings under the skin</li>
    </ul>
    <h3 style="margin-top:10px;">Smallpox vs. Varicella (Chickenpox)</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Feature</th><th>Smallpox</th><th>Varicella</th></tr></thead>
      <tbody>
        <tr><td>Lesion evolution</td><td><strong>Synchronous</strong> (all same stage)</td><td>Asynchronous (multiple stages simultaneously)</td></tr>
        <tr><td>Distribution</td><td>Face + extremities &gt; trunk; palms and soles involved</td><td>Trunk &gt; face/extremities; spares palms and soles</td></tr>
        <tr><td>Lesion depth</td><td>Deep, firm, hard (ball-bearing)</td><td>Superficial, easily ruptured vesicles</td></tr>
        <tr><td>Prodrome</td><td>Severe, 2&ndash;4 days before rash</td><td>Mild or absent</td></tr>
        <tr><td>Palms/soles</td><td>Involved</td><td>Spared</td></tr>
      </tbody>
    </table>
    </div>
    <h3 style="margin-top:10px;">Treatment (MKSAP 20 KP)</h3>
    <ul style="font-size:15px;">
      <li><strong>Supportive care + tecovirimat</strong> (antiviral; FDA-approved for smallpox)</li>
      <li><strong>Vaccination of close contacts</strong> within 3&ndash;4 days of exposure (ring vaccination); vaccination can prevent or attenuate disease if given early</li>
      <li>Strict airborne + contact precautions (negative pressure room) &mdash; appropriate for smallpox (confirmed airborne transmission)</li>
    </ul>

<h2>Plague (<em>Yersinia pestis</em>)</h2>
<div class="slide-body">
<div style="display:flex;gap:14px;align-items:flex-start;">
  <div style="flex:1;">
    <h3>Three Clinical Forms</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Form</th><th>Transmission</th><th>Presentation</th></tr></thead>
      <tbody>
        <tr><td><strong>Bubonic</strong></td><td>Flea bite (rodent reservoir)</td><td>Abrupt fever, chills, malaise + <strong>bubo</strong> (acutely swollen, exquisitely tender lymph node, usually inguinal/axillary). Most common natural form.</td></tr>
        <tr><td><strong>Septicemic</strong></td><td>Flea bite or bacteremia from bubonic</td><td>Septic shock, DIC, purpura fulminans ("Black Death"). No bubo may be present (primary septicemic).</td></tr>
        <tr><td><strong>Pneumonic</strong></td><td>Aerosolized droplets or hematogenous spread from bubonic</td><td>Rapidly progressive pneumonia + <strong>hemoptysis</strong> + sepsis. Person-to-person transmission via respiratory droplets. <strong>Bioterrorism scenario = primary pneumonic plague.</strong></td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-red" style="margin-top:8px;">
      <span class="callout-label">MKSAP 20 KP: Primary Pneumonic Plague Is the Bioterrorism Scenario</span>
      Occurs after <em>Y. pestis</em> exposure through infectious aerosols and person-to-person transmission via respiratory droplets. Incubation 1&ndash;6 days. Untreated pneumonic plague is nearly universally fatal within 2&ndash;4 days.
    </div>
    <h3 style="margin-top:10px;">Diagnosis</h3>
    <ul style="font-size:15px;">
      <li>Gram stain: gram-negative coccobacillus; <strong>Wright-Giemsa or Wayson stain shows bipolar "safety-pin" appearance</strong></li>
      <li>Blood cultures, sputum culture, bubo aspirate; alert lab to suspected diagnosis (BSL-3 organism)</li>
      <li>Direct fluorescent antibody (DFA) and PCR available at reference labs and CDC</li>
    </ul>
    <h3 style="margin-top:10px;">Treatment &amp; Prophylaxis (MKSAP 20 KP)</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Setting</th><th>Regimen</th></tr></thead>
      <tbody>
        <tr><td>Severe disease (pneumonic, septicemic)</td><td>Ciprofloxacin, levofloxacin, moxifloxacin, gentamicin, or streptomycin x10&ndash;14 days (MKSAP 20 lists fluoroquinolones first; streptomycin/gentamicin preferred per CDC for severe disease)</td></tr>
        <tr><td>Non-severe or step-down</td><td>Doxycycline or ciprofloxacin x14 days</td></tr>
        <tr><td><strong>PEP: asymptomatic exposed + close contacts</strong></td><td><strong>Ciprofloxacin, levofloxacin, moxifloxacin, or doxycycline</strong> (MKSAP 20 KP)</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout c-blue" style="margin-top:6px;">
      <span class="callout-label">Infection Control: Pneumonic Plague</span>
      Droplet precautions (surgical mask). Close contacts within 2 meters require PEP. Bubonic plague is not transmitted person-to-person. Pneumonic plague is.
    </div>
  </div>

{cls:'slide-accent',html:`
<h2>Botulism (<em>Clostridium botulinum</em> Toxin)</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <div class="callout c-red">
      <span class="callout-label">MKSAP 20 KP: Descending Flaccid Paralysis + Prominent Bulbar Signs</span>
      Diplopia, dysarthria, dysphonia, and dysphagia &mdash; the "4 D&rsquo;s." Cranial nerve palsies appear first, then symmetric descending paralysis. May progress to respiratory failure requiring mechanical ventilation.
    </div>
    <h3 style="margin-top:10px;">Mechanism</h3>
    <ul style="font-size:15px;">
      <li><em>C. botulinum</em> toxin blocks presynaptic acetylcholine release at the neuromuscular junction &rarr; flaccid paralysis</li>
      <li>Toxin is the most lethal substance known by weight. Patients remain afebrile with <strong>normal mental status</strong>; nausea, abdominal pain, and <strong>dry mouth</strong> often accompany the paralysis (MKSAP 20).</li>
      <li>Bioterrorism scenarios: aerosolization or food supply contamination</li>
    </ul>
    <h3 style="margin-top:10px;">Clinical Forms</h3>
    <ul style="font-size:15px;">
      <li><strong>Foodborne:</strong> preformed toxin; onset hours to days after ingestion; GI prodrome (nausea, vomiting, diarrhea) then paralysis</li>
      <li><strong>Wound:</strong> toxin produced in wound; no GI prodrome; associated with injection drug use or traumatic wounds</li>
      <li><strong>Infant:</strong> ingestion of spores (honey); constipation + hypotonia + poor feeding</li>
      <li><strong>Inhalational (bioterrorism):</strong> aerosolized toxin; no natural equivalent</li>
    </ul>
  </div>
  <div>
    <h3>Key Distinguishing Features</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Feature</th><th>Botulism</th><th>Guillain-Barr&eacute;</th><th>Myasthenia Gravis</th></tr></thead>
      <tbody>
        <tr><td>Paralysis direction</td><td><strong>Descending</strong></td><td>Ascending</td><td>Variable; fatigable</td></tr>
        <tr><td>Fever</td><td><strong>Absent</strong> (toxin, not infection)</td><td>Absent</td><td>Absent</td></tr>
        <tr><td>Pupils</td><td><strong>Fixed, dilated</strong> (mydriasis)</td><td>Normal</td><td>Normal</td></tr>
        <tr><td>Reflexes</td><td>Decreased/absent</td><td>Decreased/absent</td><td>Normal</td></tr>
        <tr><td>Autonomic</td><td>Prominent (dry mouth, urinary retention, constipation)</td><td>Variable</td><td>Absent</td></tr>
        <tr><td>CSF</td><td>Normal</td><td>Albuminocytologic dissociation</td><td>Normal</td></tr>
      </tbody>
    </table>
    </div>
    <h3 style="margin-top:10px;">Treatment (MKSAP 20 KP)</h3>
    <ul style="font-size:15px;">
      <li><strong>Supportive care</strong> (ICU; mechanical ventilation if respiratory failure)</li>
      <li><strong>Early antitoxin</strong> &mdash; heptavalent botulinum antitoxin (HBAT) from CDC Strategic National Stockpile; neutralizes unbound toxin. <strong>Will NOT reverse existing paralysis.</strong> (MKSAP 20 KP)</li>
      <li>Antibiotics are NOT indicated for foodborne botulism (toxin-mediated, not infection)</li>
      <li>For wound botulism: debridement + penicillin; avoid aminoglycosides (worsen NMJ blockade)</li>
    </ul>
    <div class="callout c-yellow" style="margin-top:6px;">
      <span class="callout-label">Diagnosis</span>
      Mouse bioassay (gold standard; reference lab). Stool toxin detection. Serum toxin assay. EMG: incremental response with repetitive stimulation (contrast with MG).
    </div>
  </div>
</div>
</div>
`},
{cls:'slide-content',html:`
<h2>Tularemia &amp; Viral Hemorrhagic Fever</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <h3>Tularemia (<em>Francisella tularensis</em>)</h3>
    <div class="callout c-red">
      <span class="callout-label">MKSAP 20 KP: Abrupt Fever + Respiratory Symptoms + CXR Findings</span>
      Infiltrates, hilar lymphadenopathy, and pleural effusions on chest radiograph. No other common pneumonia causes this CXR triad with hilar adenopathy + effusions simultaneously.
    </div>
    <ul style="font-size:15px;margin-top:6px;">
      <li>Natural reservoir: rabbits, hares, rodents, ticks; most common in US south-central and western states</li>
      <li><strong>Pneumonic form (bioterrorism):</strong> aerosolized bacteria; abrupt severe pneumonia; highly infectious (ID50 ~10&ndash;50 organisms)</li>
      <li>Ulceroglandular (most common natural form): skin ulcer at inoculation site + regional lymphadenopathy</li>
      <li><strong>Not transmitted person-to-person</strong> (MKSAP 20) &mdash; standard precautions are sufficient. <em>F. tularensis</em> is extremely hazardous in the laboratory; <strong>notify lab immediately</strong> if tularemia suspected</li>
    </ul>
    <h3 style="margin-top:10px;">Treatment (MKSAP 20 KP)</h3>
    <div class="table-wrap" style="margin-top:4px;">
    <table>
      <thead><tr><th>Severity</th><th>Regimen</th><th>Duration</th></tr></thead>
      <tbody>
        <tr><td><strong>Severe disease</strong></td><td><strong>Streptomycin or gentamicin</strong></td><td>7&ndash;14 days</td></tr>
        <tr><td>Nonsevere disease</td><td>Doxycycline or ciprofloxacin</td><td>14 days</td></tr>
      </tbody>
    </table>
    </div>
  </div>
  <div>
    <h3>Viral Hemorrhagic Fever (VHF)</h3>
    <div class="callout c-orange">
      <span class="callout-label">MKSAP 20 KP: Fever + Unexplained Bleeding + 2&ndash;21 Day Incubation</span>
      Fever, headache, myalgia, abdominal pain, diarrhea, and <strong>unexplained bleeding and bruising</strong> appearing 2 to 21 days after exposure. Progression to hemorrhagic diathesis, shock, and multiorgan failure.
    </div>
    <ul style="font-size:15px;margin-top:6px;">
      <li><strong>Category A VHF pathogens (MKSAP 20):</strong> Ebola &amp; Marburg (Filoviruses) &middot; Lassa &amp; Machupo (Arenaviruses). Note: Crimean-Congo is Category B; Hantavirus is Category C; Yellow fever and Dengue are not Category A agents.</li>
      <li>Hemorrhagic findings: petechiae, ecchymosis, mucosal bleeding, hematemesis, melena</li>
      <li>Lab: thrombocytopenia, elevated LFTs, elevated creatinine, coagulopathy (DIC)</li>
      <li><strong>Travel history and animal/body fluid exposure history are critical</strong></li>
    </ul>
    <h3 style="margin-top:10px;">Management</h3>
    <ul style="font-size:15px;">
      <li><strong>Strict contact + droplet precautions</strong>; some VHFs (Ebola, Marburg) require airborne precautions</li>
      <li>Supportive care: aggressive fluid resuscitation, electrolyte management, coagulopathy support</li>
      <li><strong>Ebola:</strong> atoltivimab/maftivimab/odesivimab (Inmazeb) monoclonal antibody cocktail; also ansuvimab (Ebanga). FDA-approved treatments available.</li>
      <li>Ribavirin has activity against Lassa fever and some bunyaviruses</li>
      <li>Immediately notify CDC Emergency Operations and state public health</li>
    </ul>
    <div class="callout c-yellow" style="margin-top:6px;">
      <span class="callout-label">Bioterrorism Potential</span>
      Ebola, Marburg, and Lassa are CDC Category A agents due to high mortality, potential for aerosol dissemination, and severe public panic. Person-to-person transmission via direct contact with infected blood/body fluids.
    </div>
  </div>
</div>
</div>
`},
{cls:'slide-accent',html:`
<h2>Master Comparison: All Six Category A Agents</h2>
<div class="slide-body">
<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>Agent</th>
      <th>Incubation</th>
      <th>Diagnostic Clue</th>
      <th>Treatment</th>
      <th>PEP</th>
      <th>Isolation</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><strong>Anthrax</strong><br><em>B. anthracis</em></td>
      <td>1&ndash;5 days (inhalational)</td>
      <td>Widened mediastinum on CXR; "box-car" gram+ bacilli; black eschar (cutaneous)</td>
      <td>Ciprofloxacin or doxycycline + protein synthesis inhibitor; bactericidal agents if meningitis; antitoxin (raxibacumab 40 mg/kg or obiltoxaximab 16 mg/kg IV x1)</td>
      <td>Fluoroquinolone or doxycycline x60d + vaccine</td>
      <td>Standard (not person-to-person)</td>
    </tr>
    <tr>
      <td><strong>Smallpox</strong><br>Variola</td>
      <td>10&ndash;14 days (MKSAP 20)</td>
      <td>Synchronous lesions; face/extremities &gt; trunk; palms and soles involved</td>
      <td>Supportive + tecovirimat (primary) or brincidofovir (both FDA-approved)</td>
      <td>Vaccine within 3&ndash;4 days of exposure (ring vaccination)</td>
      <td>Airborne + contact (negative pressure)</td>
    </tr>
    <tr>
      <td><strong>Plague (pneumonic)</strong><br><em>Y. pestis</em></td>
      <td>1&ndash;6 days</td>
      <td>Rapid pneumonia + hemoptysis; "safety-pin" bipolar staining on Wright-Giemsa</td>
      <td>Cipro/levo/moxi/gentamicin/streptomycin x10&ndash;14d (severe); doxycycline or ciprofloxacin x14d (non-severe)</td>
      <td>Ciprofloxacin, levofloxacin, moxifloxacin, or doxycycline</td>
      <td>Droplet (pneumonic); standard (bubonic)</td>
    </tr>
    <tr>
      <td><strong>Botulism</strong><br><em>C. botulinum</em> toxin</td>
      <td>Foodborne: typically 12&ndash;36 hours (up to 10 days); Inhalational: 12h&ndash;3 days (MKSAP 20)</td>
      <td>Descending paralysis + bulbar signs (4 D&rsquo;s); afebrile; dilated pupils; normal CSF</td>
      <td>Supportive (MV) + heptavalent antitoxin (HBAT; will NOT reverse existing paralysis)</td>
      <td>None established; decontamination if aerosolized</td>
      <td>Standard (not person-to-person)</td>
    </tr>
    <tr>
      <td><strong>Tularemia</strong><br><em>F. tularensis</em></td>
      <td>3&ndash;5 days</td>
      <td>Abrupt fever + respiratory illness; hilar adenopathy + pleural effusions on CXR</td>
      <td>Streptomycin or gentamicin (severe, 7&ndash;14d); doxycycline or ciprofloxacin (non-severe, 14d)</td>
      <td>Doxycycline or ciprofloxacin x14d</td>
      <td>Standard (not person-to-person)</td>
    </tr>
    <tr>
      <td><strong>Viral hemorrhagic fever</strong><br>Ebola, Marburg, Lassa</td>
      <td>2&ndash;21 days</td>
      <td>Fever + unexplained bleeding 2&ndash;21d after exposure; thrombocytopenia + DIC; travel/exposure history</td>

{cls:'slide-content',html:`
<h2>Clinical Pearls &amp; References</h2>
<div class="slide-body">
<div class="grid-2">
  <div>
    <div class="pearl"><strong>Any case of inhalational anthrax must be considered potential bioterrorism.</strong> This is not a clinical judgment call &mdash; it is a MKSAP 20 and CDC mandate. A single case triggers immediate public health notification.</div>
    <div class="pearl"><strong>Widened mediastinum on CXR = inhalational anthrax until proven otherwise.</strong> Caused by hemorrhagic mediastinal lymphadenopathy. The prodrome (malaise, myalgia, fever, cough, substernal discomfort) is nonspecific; the CXR is the key differentiating finding.</div>
    <div class="pearl"><strong>Smallpox lesions evolve synchronously; varicella lesions do not.</strong> All lesions in a given area are at the same stage in smallpox. Varicella has multiple stages simultaneously. Smallpox also involves palms and soles; varicella spares them.</div>
    <div class="pearl"><strong>Pneumonic plague is the bioterrorism scenario.</strong> Person-to-person droplet transmission. Virtually universally fatal untreated within 2&ndash;4 days. PEP: ciprofloxacin, levofloxacin, moxifloxacin, or doxycycline for asymptomatic exposed persons and close contacts.</div>
    <div class="pearl"><strong>Botulism produces descending flaccid paralysis, not ascending.</strong> Bulbar signs appear first (the 4 D&rsquo;s: diplopia, dysarthria, dysphonia, dysphagia). Antitoxin must be given early &mdash; it will not reverse existing paralysis. The patient is afebrile (toxin-mediated, not infection).</div>
    <div class="pearl"><strong>Tularemia CXR shows hilar lymphadenopathy + pleural effusions + infiltrates.</strong> This triad in an acutely ill patient with abrupt fever and respiratory symptoms should prompt tularemia consideration, especially in endemic areas or with animal/aerosol exposure. Alert the lab before sending cultures.</div>
    <div class="pearl"><strong>VHF = fever + unexplained bleeding + 2&ndash;21 day incubation after exposure.</strong> Travel history and animal/body fluid exposure history are essential. Strict isolation immediately. Ebola and Marburg require contact + droplet precautions with full PPE (PAPR preferred); dedicated room. Standard airborne precautions are not the primary CDC guidance for Ebola.</div>
  </div>
  <div>
    <ol class="refs">
      <li>MKSAP 20. "Bioterrorism." <em>Infectious Disease.</em> American College of Physicians, 2025. [Primary source for all KPs: anthrax = bioterrorism; inhalational presentation; treatment; PEP; smallpox synchronous lesions; tecovirimat; plague pneumonic transmission; plague PEP; botulism descending paralysis; antitoxin; tularemia CXR; tularemia treatment; VHF bleeding syndrome]</li>
      <li>Adalja AA, Toner E, Inglesby TV. "Clinical Management of Potential Bioterrorism-Related Conditions." <em>N Engl J Med.</em> 2015;372:954&ndash;962. [Comprehensive clinical management framework for Category A agents]</li>
      <li>Stern EJ, Uhde KB, Shadomy SV, Inglesby T. "Conference Report on Public Health and Clinical Guidelines for Anthrax." <em>Emerg Infect Dis.</em> 2008;14(suppl). [Anthrax treatment stratification: systemic with/without meningitis; PEP duration and vaccination]</li>
      <li>Henderson DA, Inglesby TV, Bartlett JG, et al. "Smallpox as a Biological Weapon." <em>JAMA.</em> 1999;281:2127&ndash;2137. [Historical smallpox weaponization; smallpox vs. varicella differential; ring vaccination strategy]</li>
      <li>Inglesby TV, Dennis DT, Henderson DA, et al. "Plague as a Biological Weapon." <em>JAMA.</em> 2000;283:2281&ndash;2290. [Pneumonic plague as the bioterrorism scenario; treatment and PEP regimens]</li>
      <li>Arnon SS, Schechter R, Inglesby TV, et al. "Botulinum Toxin as a Biological Weapon." <em>JAMA.</em> 2001;285:1059&ndash;1070. [Mechanism; descending paralysis; antitoxin efficacy; will not reverse existing paralysis]</li>
      <li>Dennis DT, Inglesby TV, Henderson DA, et al. "Tularemia as a Biological Weapon." <em>JAMA.</em> 2001;285:2763&ndash;2773. [Pneumonic tularemia presentation; CXR findings; streptomycin/gentamicin preferred; PEP]</li>
    </ol>
  </div>
</div>

const deck=document.getElementById('deck'),counter=document.getElementById('slide-counter'),
  btnPrev=document.getElementById('btn-prev'),btnNext=document.getElementById('btn-next'),
  bar=document.getElementById('progress-bar');
let cur=0;
SLIDES.forEach((s,i)=>{
  const el=document.createElement('div');
  el.className='slide '+s.cls; el.innerHTML=s.html;
  if(i===0)el.classList.add('active');
  deck.appendChild(el);
});
const slides=deck.querySelectorAll('.slide');
function goTo(n){
  if(n<0||n>=slides.length)return;
  slides[cur].classList.remove('active'); cur=n;
  slides[cur].classList.add('active');
  const b=slides[cur].querySelector('.slide-body'); if(b)b.scrollTop=0;
  counter.textContent=(cur+1)+' / '+slides.length;
  btnPrev.disabled=cur===0; btnNext.disabled=cur===slides.length-1;
  bar.style.width=((cur+1)/slides.length*100)+'%';
}
btnPrev.addEventListener('click',()=>goTo(cur-1));
btnNext.addEventListener('click',()=>goTo(cur+1));
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();goTo(cur+1);}
  if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();goTo(cur-1);}
});
let tx=0;
deck.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
deck.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50)dx<0?goTo(cur+1):goTo(cur-1);
},{passive:true});
goTo(0);

</script>
</body>
</html>
